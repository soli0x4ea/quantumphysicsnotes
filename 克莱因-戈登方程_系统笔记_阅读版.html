# 克莱因-戈登方程

> **分类归属：第五部分·相对论量子理论与前沿 · 数学程度：L3 · 前置依赖：第 9 篇《量子态与叠加原理》、第 13 篇《薛定谔方程》**

> **验证依据**：Klein (1926) *Z. Phys.*、Gordon (1926) *Z. Phys.*、Fock (1926) *Z. Phys.*、Schrödinger (1926) *Ann. Phys.*、Dirac (1928) *Proc. R. Soc. A*、Feshbach & Villars (1958) *Rev. Mod. Phys.*、Kragh (1984) *Am. J. Phys.*、Klein (1929) *Z. Phys.*、ATLAS Collab. (2012) *Phys. Lett. B*

---

## 一、概念与定位

克莱因-戈登方程（Klein-Gordon equation，简称 KG 方程）是描述**自旋为 0 的自由标量粒子**的相对论性波动方程。在自然单位（ħ = c = 1）下，其标准形式为

$$(\Box + m^2)\,\phi = 0,$$

其中 $\Box$ 为达朗贝尔算符，$\phi$ 为复标量场，$m$ 为粒子静质量。

**词源**：方程英文名取自 Oskar Klein 与 Walter Gordon 两位物理学家姓氏的组合。KG 方程在 1926 年由 Klein、Gordon、Fock 与 Schrödinger 各自独立推导（详见第七、八节），并非由单一作者首创；"Klein-Gordon equation" 这一固定称谓自 1930 年代起在文献中确立。"Klein-Gordon" 在德语文献中也写作 "Klein-Gordon-Gleichung"。

**核心特征**：

1. **相对论协变**：方程直接由相对论能量-动量关系 $E^2 = p^2 c^2 + m^2 c^4$ 导出，满足洛伦兹协变，可纳入四维时空统一表述。
2. **描述自旋 0 的标量（或赝标量）粒子**：如 π 介子、K 介子、Higgs 玻色子等；对自旋非 0 的粒子不适用。
3. **对时间二阶**：方程中出现 $\partial^2\phi/\partial t^2$，与薛定谔方程对时间一阶（$\partial\psi/\partial t$）有本质区别。
4. **存在负能解**：色散关系 $E = \pm\sqrt{p^2 c^2 + m^2 c^4}$ 给出正负两支能量，这是相对论性方程的必然结果。
5. **概率密度非正定**：其守恒概率密度含 $(\partial_t\phi^*)^2$ 型项，可为负值，构成单粒子诠释的"负概率密度困难"。

**体系位置**：本篇属第五部分「相对论量子理论与前沿」，承接第 9 篇《量子态与叠加原理》与第 13 篇《薛定谔方程》建立的非相对论框架。它是把"态随时间的演化"推广到相对论协变要求的第一步尝试；其困难（负密度、负能解）直接催生了第 13 篇之后的狄拉克方程（自旋 1/2）与量子场论（把 $\phi$ 提升为场算符）。后续第 38 篇《狄拉克方程》可视为对 KG 方程"开平方线性化"的修正。

---

## 二、数学结构

### 2.1 符号约定声明

为避免高危符号歧义，本篇统一采用以下约定（全程不切换）：

- **单位制**：主体推导用**自然单位 $\hbar = c = 1$**；恢复国际单位制（SI）时显式写出 $\hbar$、$c$。
- **度规号差**：取 **$+---$**，即 $g^{\mu\nu} = \mathrm{diag}(1,-1,-1,-1)$；四维坐标 $x^\mu = (ct,\,x,y,z)$，自然单位下 $x^\mu = (t,\,\mathbf x)$。
- **达朗贝尔算符**：$\Box \equiv \partial_\mu\partial^\mu$。在 SI 下 $\Box = \frac{1}{c^2}\frac{\partial^2}{\partial t^2} - \nabla^2$；自然单位下 $\Box = \partial_t^2 - \nabla^2$。
- **算符替换**：能量与动量算符化为 $E \to i\hbar\,\partial_t$，${\bf p} \to -i\hbar\nabla$（作用在函数 $\phi$ 上）。

### 2.2 从相对论能量-动量关系到 KG 方程（L3 完整推导，不跳步）

**第一步**，相对论自由粒子的能量-动量关系（经典）：

$$E^2 = p^2 c^2 + m^2 c^4. \tag{1}$$

**第二步**，对自由粒子，把"在壳条件"写成作用于波函数 $\phi$ 的算符等式。令

$$(E^2 - p^2 c^2 - m^2 c^4)\,\phi = 0. \tag{2}$$

**第三步**，按算符替换 $E \to i\hbar\,\partial_t$、$p \to -i\hbar\nabla$ 代入 (2)：

$$\Big[\,(i\hbar\,\partial_t)^2 - (-i\hbar\nabla)^2 c^2 - m^2 c^4\,\Big]\phi = 0. \tag{3}$$

**第四步**，分别展开三个平方项（逐符号、不跳步）：

$$(i\hbar\,\partial_t)^2 = i^2\hbar^2\,\partial_t^2 = -\hbar^2\,\partial_t^2, \tag{4a}$$
$$(-i\hbar\nabla)^2 = (-i\hbar)^2\nabla^2 = (-i)^2\hbar^2\nabla^2 = -\hbar^2\nabla^2. \tag{4b}$$

将 (4a)(4b) 代回 (3)：

$$\big[\,-\hbar^2\,\partial_t^2 - (-\hbar^2\nabla^2)\,c^2 - m^2 c^4\,\big]\phi = 0
\quad\Rightarrow\quad
\big[\,-\hbar^2\,\partial_t^2 + \hbar^2 c^2\nabla^2 - m^2 c^4\,\big]\phi = 0. \tag{5}$$

**第五步**，两边同除以 $-\hbar^2$：

$$\Big(\,\partial_t^2 - c^2\nabla^2 + \frac{m^2 c^4}{\hbar^2}\,\Big)\phi = 0. \tag{6}$$

**第六步**，识别达朗贝尔算符。由 $\Box\phi = \frac{1}{c^2}\partial_t^2\phi - \nabla^2\phi$，可得 $\partial_t^2\phi - c^2\nabla^2\phi = c^2\Box\phi$。代入 (6)：

$$\big(\,c^2\Box + \frac{m^2 c^4}{\hbar^2}\,\big)\phi = 0. \tag{7}$$

两边同除以 $c^2$，得 **SI 下的 KG 方程**：

$$\boxed{\;\Big(\Box + \frac{m^2 c^2}{\hbar^2}\Big)\phi = 0\;} \tag{8}$$

**第七步**，取自然单位 $\hbar = c = 1$，(8) 简化为

$$\boxed{\;(\Box + m^2)\,\phi = 0\;} \tag{9}$$

此即自然单位下的 KG 方程标准形式。

**符号说明表（含 $\Box$ 及主要符号）**

| 符号 | 含义 | 量纲 / 单位 |
|---|---|---|
| $\Box$ | 达朗贝尔算符 $\partial_\mu\partial^\mu = c^{-2}\partial_t^2 - \nabla^2$ | $[时间]^{-2}$（自然单位下无量纲于长度尺度） |
| $\phi$ | 复标量场（波函数） | 场量纲 $[质量]$（自然单位）；SI 下 $[能量\cdot长度]^{-1}$ |
| $m$ | 粒子静质量 | 质量 $[M]$；自然单位下 $[能量]$ |
| $E,\,p$ | 能量、三维动量 | 能量 $[E]$、动量 $[M][L][T]^{-1}$ |
| $\hbar$ | 约化普朗克常数（= $1.054\,571\,817\times10^{-34}\,\mathrm{J\cdot s}$，精确） | $[能量][时间]$ |
| $c$ | 真空光速（= $299\,792\,458\ \mathrm{m/s}$，精确） | $[L][T]^{-1}$ |

### 2.3 概率流与连续性方程（推导不跳步）

在自然单位下 KG 方程为 $(\partial_\mu\partial^\mu + m^2)\phi = 0$，其复共轭方程为 $(\partial_\mu\partial^\mu + m^2)\phi^* = 0$。

**第一步**，第一式乘以 $\phi^*$，第二式乘以 $\phi$：

$$\phi^*\,\partial_\mu\partial^\mu\phi + m^2\phi^*\phi = 0, \tag{10a}$$
$$\phi\,\partial_\mu\partial^\mu\phi^* + m^2\phi\phi^* = 0. \tag{10b}$$

**第二步**，两式相减，消去 $m^2$ 项：

$$\phi^*\,\partial_\mu\partial^\mu\phi - \phi\,\partial_\mu\partial^\mu\phi^* = 0. \tag{11}$$

**第三步**，验证 $\partial_\mu(\phi^*\partial^\mu\phi - \phi\,\partial^\mu\phi^*)$ 恰等于 (11) 左端：

$$\partial_\mu(\phi^*\partial^\mu\phi) = (\partial_\mu\phi^*)\partial^\mu\phi + \phi^*\,\partial_\mu\partial^\mu\phi,$$
$$\partial_\mu(\phi\,\partial^\mu\phi^*) = (\partial_\mu\phi)\partial^\mu\phi^* + \phi\,\partial_\mu\partial^\mu\phi^*,$$

相减得 $(\partial_\mu\phi^*)\partial^\mu\phi - (\partial_\mu\phi)\partial^\mu\phi^* + \phi^*\,\partial_\mu\partial^\mu\phi - \phi\,\partial_\mu\partial^\mu\phi^*$。前两项因指标缩并对称而相消，余下 $\phi^*\,\partial_\mu\partial^\mu\phi - \phi\,\partial_\mu\partial^\mu\phi^*$，即 (11)。故

$$\partial_\mu\big(\phi^*\partial^\mu\phi - \phi\,\partial^\mu\phi^*\big) = 0. \tag{12}$$

**第四步**，定义守恒四维流（选取归一化常数使正频平面波给出正密度、且非相对论极限回到 $|\psi|^2$）：

$$j^\mu \equiv \frac{i}{2m}\big(\phi^*\partial^\mu\phi - \phi\,\partial^\mu\phi^*\big), \qquad \partial_\mu j^\mu = 0. \tag{13}$$

**第五步**，在 $+---$ 度规下 $\partial^0 = \partial_t$、$\partial^k = -\partial_k$。写出分量。时间分量（概率密度）：

$$\rho \equiv j^0 = \frac{i\hbar}{2mc^2}\big(\phi^*\,\partial_t\phi - \phi\,\partial_t\phi^*\big). \tag{14}$$

三维分量（出现在连续性方程 $\partial_t\rho + \nabla\cdot{\bf J} = 0$ 中的空间流）：

$${\bf J} = \frac{i\hbar}{2m}\big(\phi\,\nabla\phi^* - \phi^*\,\nabla\phi\big). \tag{15}$$

可验证对正频平面波 $\phi \propto e^{-iEt/\hbar}e^{i{\bf k}\cdot{\bf x}}$ 有 $\rho = +\frac{E}{mc^2}|\phi|^2 > 0$、$|\bf J|/\rho = |{\bf k}|c^2/E = $ 群速度；对负频解（$E\to -E$）则 $\rho < 0$。**关键点**：$\rho$ 的表达式含 $\partial_t\phi$ 与 $\partial_t\phi^*$ 的双线性组合（即 $(\partial_t\phi^*)(\partial_t\phi)$ 型项），其符号不被束缚为非负；正、负频解的叠加可使 $\rho$ 取负值。这就是 **KG 概率密度非正定** 的根源，亦是单粒子波函数诠释的困难所在（见第五、七节）。

### 2.4 负能解及其处理

由色散关系 $E = \pm\sqrt{p^2 c^2 + m^2 c^4}$ 可知 KG 方程同时容许正能支与负能支。在单粒子理论中，负能支无法给出物理解释（电子会无限跌落至负能海）。在量子场论（二次量子化）框架中，负能解被重新诠释为反粒子，密度困难随之消除——这一"单粒子波函数 → 场算符"的转化由 Feshbach & Villars (1958) 以统一方式呈现 [24ha]，其历史脉络见第七、八节。

### 2.5 适用范围

KG 方程刻画**自旋 0 的标量（或赝标量）场**：复标量场（如带电 π 介子）与实标量场（如 Higgs 场）在量子场论中的二阶运动方程即 KG 方程。它**不**适用于自旋 1/2 的费米子（须用狄拉克方程，见 [24bi]）与自旋 1 的矢量粒子（Proca / Maxwell 方程）。

## 三、物理量与特征尺度

下表数值来源于 CODATA 2018 推荐值（来源：NIST 2018 CODATA adjustment），电子质量尺度作为 KG 方程的典型能量/长度尺度参考（注：电子本身自旋 1/2，不由 KG 描述，此处仅借其质量尺度说明方程的能量量级）。

| 物理量 | 符号 | 数值 / 量级 | 适用条件 |
|---|---|---|---|
| 电子静能 | $m_e c^2$ | $0.510\,998\,950\,00(15)\ \mathrm{MeV}$ | CODATA 2018；质量尺度参考 |
| 电子质量 | $m_e$ | $9.109\,383\,7015(28)\times10^{-31}\ \mathrm{kg}$ | CODATA 2018 |
| 康普顿波长 | $\lambda_C = h/(m_e c)$ | $2.426\,310\,238\,67(73)\times10^{-12}\ \mathrm{m}$ | CODATA 2018；标量粒子空间特征尺度 |
| 约化康普顿波长 | $\bar\lambda_C = \hbar/(m_e c)$ | $3.861\,592\,6796(12)\times10^{-13}\ \mathrm{m}$ | CODATA 2018 |
| Higgs 玻色子质量 | $M_H$ | $125\!-\!126\ \mathrm{GeV}$（ATLAS：$126.0\pm0.4\pm0.4\ \mathrm{GeV}$） | 标量自旋 0 场，KG 型场方程 [24hd] |
| KG 适用判据 | 自旋 $s$ | $s = 0$ | 标量 / 赝标量粒子；自旋 1/2 → 狄拉克 [24bi] |

**量级判据**：当粒子动量满足 $pc \sim m c^2$（即德布罗意/康普顿尺度可比）时，相对论修正不可忽略，必须用 KG（或狄拉克）替代非相对论薛定谔方程。对电子该拐点在 $p c = m_e c^2 \approx 0.511\ \mathrm{MeV}$（对应动量 $p \approx 2.73\times10^{-22}\ \mathrm{kg\cdot m/s}$）；更一般的标量粒子以各自静能 $mc^2$ 为尺度。

## 四、实验基础与观测证据

KG 方程本身作为一个"场方程"的预言效力，由自然界中存在的自旋 0 标量粒子的实验确认得到支撑：

- **π 介子（pion）**：π±、π0 为自旋 0 的标量 / 赝标量粒子，是 KG 方程（复标量 / 实标量场）描述的标准对象；其存在与性质自 1947 年起由宇宙线与加速器实验确立。
- **K 介子（kaon）**：自旋 0，属标量场描述范畴。
- **Higgs 玻色子**：自旋 0 的标量场，2012 年由 ATLAS 与 CMS 在 LHC 发现，测得质量约 $125\!-\!126\ \mathrm{GeV}$（ATLAS 给出 $126.0\pm0.4(\mathrm{stat})\pm0.4(\mathrm{sys})\ \mathrm{GeV}$，显著性 $5.9\sigma$ [24hd]）。Higgs 场作为标量场，其在势能极小点附近微扰展开得到的经典运动方程即为 KG 型（带质量项），是 KG 方程描述真实标量场的直接证据。

**常见误读纠正**（blockquote）：

> "KG 方程描述所有粒子"——错误。KG 方程仅适用于**自旋 0** 的标量 / 赝标量粒子；自旋 1/2 的粒子（电子、夸克等）须用狄拉克方程 [24bi]，自旋 1 的矢量粒子须用 Proca / Maxwell 方程。另一极端"KG 方程是错的"同样片面：在量子场论框架内，KG 方程是自旋 0 场的正确二阶运动方程；其"负概率密度困难"源于把 $\phi$ 当作单粒子波函数，而非源于方程本身错误。

## 五、分类体系与物理机制

### 5.1 三类基本波动方程的分类对比

| 方程 | 时间导数阶数 | 描述对象 | 概率密度 | 负能解 |
|---|---|---|---|---|
| 薛定谔方程 | 一阶 $\partial_t$ | 非相对论（任意自旋） | 正定 $\rho = \psi^*\psi \ge 0$ | 无（束缚态 $E>V$） |
| 克莱因-戈登方程 | 二阶 $\partial_t^2$ | 自旋 0 标量粒子 | 非正定（含 $\partial_t\phi^*$ 项） | 有（正、负两支） |
| 狄拉克方程 | 一阶 $\partial_t$ | 自旋 1/2 费米子 | 四分量正定密度 | 有（经空穴理论解释为反粒子） |

### 5.2 自由 KG 的正频与负频解

自由粒子平面波解为

$$\phi_{\pm}({\bf x},t) \propto \exp\!\big(i{\bf k}\cdot{\bf x} \mp i\omega t\big),\qquad \omega = \frac{1}{\hbar}\sqrt{p^2 c^2 + m^2 c^4},\quad p = \hbar k. \tag{16}$$

正号（$-i\omega t$）对应正能支，负号对应负能支；二者皆满足 (8)。

### 5.3 有外场时的 Klein 佯谬（机制讨论）

在强静电势阶跃下，KG（及狄拉克）方程会出现**透射系数大于 1** 的反直觉结果：当势阶 $V$ 超过 $E + mc^2$ 时，经典禁区变为可通过，且反射波振幅可大于入射波振幅 [24hc]。单粒子诠释下这构成"佯谬"；在量子场论中，此现象被解释为在强场区发生了电子-正电子对产生，粒子数不再守恒，佯谬消失。该机制同时说明了 KG 单粒子诠释的失效边界。

### 5.4 概念辨析：密度非正定 vs 正定

- **薛定谔密度** $\rho=\psi^*\psi$ 由一阶方程保证恒 $\ge 0$，可直接解释为单粒子概率密度。
- **KG 密度** $\rho = (i\hbar/2mc^2)(\phi^*\partial_t\phi - \phi\,\partial_t\phi^*)$ 因对时间二阶而含双线性时间导数项，可正可负；它不是单粒子概率密度，而对应于电荷 / 粒子数流的"密度"（正负对应粒子与反粒子贡献）。

> 辨析目的仅为澄清概念机制，不评价优劣：KG 密度非正定**不是方程缺陷**，而是二阶相对论方程与一阶非相对论方程在数学结构上的必然差异；在量子场论的 Fock 空间正定范数下，该困难被整体消解。

### 5.5 失效边界

KG 描述在以下情形失效或需替换：(1) 粒子自旋非 0（自旋 1/2 → 狄拉克，自旋 1 → Proca）；(2) 坚持单粒子、固定粒子数的波函数诠释（负密度、负能困难）；(3) 超强外场导致 Klein 佯谬（须用语场论处理可变粒子数）。

## 六、典型系统与可解模型

### 6.1 自由 KG 平面波色散（解析可解）

由 (16)，自由 KG 的色散关系为

$$E(p) = \pm\sqrt{p^2 c^2 + m^2 c^4}. \tag{17}$$

取电子质量尺度（$m_e c^2 = 0.510\,998\,950\,00\ \mathrm{MeV}$，CODATA 2018），由脚本 `code/克莱因-戈登方程_色散关系.py` 计算得：

- $p = 0$ 处：$E = \pm\,0.510\,999\ \mathrm{MeV}$（质量阈值 $\pm mc^2$）；
- $pc = mc^2 = 0.510\,999\ \mathrm{MeV}$ 处：$E = 0.722\,662\ \mathrm{MeV}$；同点非相对论近似 $E_{\rm NR} = mc^2 + p^2/(2m) = 0.766\,498\ \mathrm{MeV}$，偏差约 $6.0\%$；
- $pc = 10\ \mathrm{MeV}$ 处：$E = 10.013\,047\ \mathrm{MeV}$；非相对论近似却给出 $98.36\ \mathrm{MeV}$，完全失效，说明高能极限必须相对论处理。

结果见图 `figures/克莱因-戈登方程_色散关系.svg`：正、负两支关于 $E=0$ 对称，在 $p=0$ 处被质量阈值 $\pm mc^2$ 隔开，非相对论抛物线仅在低动量处贴合正能支。

### 6.2 箱归一化 KG 态概率密度的振荡与非正定（数值求解）

为展示 KG 密度非正定，考虑箱内两个动量模式的叠加（自然单位 $\hbar=c=m=1$）；场写作

$$\phi(x,t) = e^{i(k_1 x - \omega_1 t)} + \beta\,e^{-i(k_2 x + \omega_2 t)},\qquad \omega_j = \sqrt{k_j^2 + 1}. \tag{18}$$

其中 $\beta$ 为负能分量相对振幅。按定义 (14) 计算密度 $\rho(x,t) = \frac{i}{2}(\phi^*\partial_t\phi - \phi\,\partial_t\phi^*)$，由脚本 `code/克莱因-戈登方程_概率密度振荡.py` 取 $k_1=1.0,\ k_2=3.0,\ \beta=0.9$ 得：

- 空间周期 $L_x = 2\pi/(k_1+k_2)$，时间周期（拍频）$T = 2\pi/|\omega_2-\omega_1| = 3.594\ (\mathrm{natural\ units})$；
- 密度在网格上取值区间 $\rho \in [-2.72,\ +0.43]$（任意单位，因含 $(\partial_t\phi)^2$ 项而可正可负），**跨越零点**；
- 网格中约 $76\%$ 区域 $\rho < 0$、$24\%$ 区域 $\rho > 0$，即同一状态下密度既有正也有负，直接证明 KG 概率密度非正定。

结果见图 `figures/克莱因-戈登方程_概率密度振荡.svg`：上图为 $t=0$ 与 $t=T/2$ 的空间剖面（均穿越零线），下图为 $x=0$ 处密度随时间在正值与负值之间振荡。该数值实例对应 (14) 与 (15) 的守恒流，不与连续性方程矛盾——$\rho$ 非正定是二阶相对论方程的内禀特征，而非计算误差。

## 七、历史脉络与学术争议

**提出动机**：1926 年薛定谔方程（第 13 篇）虽成功描述非相对论量子系统，却不满足狭义相对论协变要求。把能量-动量关系 $E^2 = p^2 c^2 + m^2 c^4$ 量子化，自然导出对时间二阶的 KG 方程，但立刻带来负能解与负概率密度两大难题，迫使理论向狄拉克方程与量子场论演进。

**历史节点**

| 年份 | 人物 | 贡献 | 文献 |
|---|---|---|---|
| 1926 | O. Klein | 在五维卡鲁扎-克莱因框架导出相对论性波动方程，并给出固定能量下的四维 KG 形式 | [24gv] |
| 1926 | W. Gordon | 将相对论标量波方程用于康普顿散射计算 | [24gw] |
| 1926 | V. Fock | 由变分原理推导 KG 方程的协变形式，并求解相对论开普勒问题 | [24gx] |
| 1926 | E. Schrödinger | 第四篇通信第 6 节详细给出相对论性波动方程及其对氢原子与塞曼效应的应用 | [24gy] |
| 1928 | P. A. M. Dirac | 将 $E^2$ 开平方线性化得狄拉克方程；其平方回退为 KG 方程，确立自旋 1/2 须用狄拉克 | [24bi] |
| 1929 | O. Klein | 提出 Klein 佯谬：强阶跃势下透射系数可超过 1 | [24hc] |
| 1958 | Feshbach & Villars | 统一自旋 0（KG）与自旋 1/2（狄拉克）的单粒子波力学，并联系场论诠释 | [24ha] |
| 1984 | H. Kragh | 考证 KG 方程 1926 年由 Klein、Gordon、Fock、Schrödinger 各自独立发现的史实 | [24hb] |
| 2012 | ATLAS 合作组 | 发现标量 Higgs 玻色子（KG 型场的实例） | [24hd] |

**当前争议与开放问题（并列各方，不站队）**：

- **立场 A（单粒子波函数诠释）**：认为 KG 方程应作为单粒子相对论波函数方程。此诠释下负概率密度与负能解构成真实困难，单粒子框架在强场（Klein 佯谬）与多粒子产生过程里失效。这是 1926–1930 年代的主流认识。
- **立场 B（量子场论诠释）**：把 $\phi$ 视为场算符并作二次量子化，Fock 空间具有正定范数，负能解被重新诠释为反粒子，负密度困难整体消失。这是自 1930 年代起发展、现为标准模型采用的理论。
- **二者关系**：并非"谁正确谁错误"的二选一。立场 A 适用于固定粒子数、低能弱场的近似语境，却无法处理负能与对产生；立场 B 是描述可变粒子数的完整理论。KG 方程作为一个场方程，在两种立场下数学形式一致，差别只在 $\phi$ 的物理解释。
- 关于"KG 方程最早的独立发现者究竟是谁"的史实归属，Kragh (1984) [24hb] 已有详细考证，确认 1926 年存在多位独立贡献者，本节依此并列，不单方面强调某一作者。

本节内容可能随研究进展更新。

// 在 markdown 解析前抽出公式，用占位符保护，避免被 marked 当成强调语法破坏
function protectMath(src){
  var blocks = [];
  // 先抽块级 $$...$$（可跨行）
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, function(m){
    blocks.push(m);
    return '%%MATH' + (blocks.length - 1) + '%%';
  });
  // 再抽行内 $...$（不含换行、内部不含 $）
  src = src.replace(/\$([^\$\n]+?)\$/g, function(m){
    blocks.push(m);
    return '%%MATH' + (blocks.length - 1) + '%%';
  });
  return { src: src, blocks: blocks };
}

function boot(){
  var raw = document.getElementById('src').textContent;
  // 记录标题锚点（在保护公式之前，避免影响）
  var md = raw.replace(/^(#{1,3})\s+(.+)$/gm, function(m, h, t){
    var id = 'h-' + t.replace(/[^\w一-龥]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
    return h + ' <span id="' + id + '"></span>' + t;
  });

  // 保护数学公式
  var prot = protectMath(md);
  md = prot.src;

  document.getElementById('content').innerHTML = marked.parse(md);

  // 还原数学公式占位符
  var content = document.getElementById('content');
  var html = content.innerHTML.replace(/%%MATH(\d+)%%/g, function(m, n){
    return prot.blocks[+n];
  });
  content.innerHTML = html;

  // 生成目录
  var hs = document.querySelectorAll('#content h2, #content h3');
  var toc = document.getElementById('toc'), tocHtml = '';
  hs.forEach(function(h){
    var sp = h.querySelector('span[id]');
    var id = sp ? sp.id : '';
    var cls = h.tagName === 'H3' ? 'sub' : '';
    tocHtml += '<a class="' + cls + '" href="#' + id + '">' + h.textContent.trim() + '</a>';
  });
  toc.innerHTML = tocHtml;

  // 图片路径：正文里写 figures/xxx.svg
  document.querySelectorAll('#content img').forEach(function(im){
    if(/^figures\//.test(im.getAttribute('src')||'')) return;
  });

  if (window.renderMathInElement) {
    renderMathInElement(document.getElementById('content'), {
      delimiters:[

      ],
      ignoredTags:['script','noscript','style','textarea','pre','code'],
      throwOnError:false
    });

  // 滚动高亮
  var links = [].slice.call(toc.querySelectorAll('a'));
  window.addEventListener('scroll', function(){
    var cur = null;
    hs.forEach(function(h){
      if (h.getBoundingClientRect().top < 120) cur = h;

    if (cur){
      var sp = cur.querySelector('span[id]');
      var act = toc.querySelector('a[href="#' + (sp?sp.id:'') + '"]');
      if (act) act.classList.add('active');
    }
  }, {passive:true});
}
if (window.marked) boot();
else window.addEventListener('load', boot);
