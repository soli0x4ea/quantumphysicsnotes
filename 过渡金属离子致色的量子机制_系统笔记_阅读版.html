# 过渡金属离子致色的量子机制（Quantum Mechanisms of Transition-Metal Gem Coloration）系统量子力学笔记

> **第六部分：交叉应用——量子力学与宝石学 · 数学程度 L2 · 前置依赖：第42篇《晶体场与配位场理论》、第17篇《中心力场与氢原子》、第19篇《微扰论与变分法》**

> **验证依据**：Maiman (1960) *Nature* 187, 493、Bethe (1929) *Ann. Phys.* 395, 133、Tanabe & Sugano (1954) *JPSJ* 9, 753/766、Laporte (1924) *Z. Phys.* 23, 135、Jahn & Teller (1937) *Proc. R. Soc. A* 161, 220、McClure (1959) *Solid State Phys.* 9, 399、Burns (1993) *Mineralogical Applications of Crystal Field Theory*、Orgel (1952) *J. Chem. Soc.* 4756、Nassau (1983) *The Physics and Chemistry of Color*、CODATA (2018)。

---

## 一、概念与定位

过渡金属离子致色，指宝石的体色（body color）源于其晶格中作为微量或主量组分的过渡金属离子（3dⁿ，n = 1–9）的 d 电子，在配位阴离子（通常为 O²⁻、F⁻ 等）构成的晶体场 / 配位场作用下发生能级分裂，并对可见光至近红外光子产生选择性吸收或发射的量子现象。它属于第 42 篇「晶体场与配位场理论」在宝石学中的下游应用，也是第 17 篇（中心力场中 d 轨道的角动量量子数 l = 2）与第 19 篇（简并微扰：d 轨道在对称破缺场中的分裂）的直接物理解释对象。

**词源**：「过渡金属（transition metal）」指周期表 d 区元素，其名称源于填充「过渡」于 s 区主族之间的内壳层 d 电子；「致色（coloration）」在此特指产生吸收的 chromophore（色心 / 呈色中心）的量子起源，区别于矿物本征的能带吸收。

**核心特征（辨识度）**：

1. **色源是局域 d 电子的离散能级，而非固体能带**。过渡金属离子的 3d 电子被配体「包裹」，轨道空间局域、能级分立（间距 ~10³–10⁴ cm⁻¹ ≈ 0.1–3 eV），区别于半导体 / 绝缘体本征带隙致色（如钻石的带边吸收）。
2. **两套基本跃迁**：晶体场内部的 d–d 跃迁（宇称禁戒、弱，摩尔消光系数 ε ~ 1–100 L·mol⁻¹·cm⁻¹）与电荷转移跃迁（LMCT / MLCT / 金属间 IVCT，宇称允许、强，ε ~ 10³–10⁴），后者常落在紫外–可见蓝紫区。
3. **吸收波长由晶体场分裂 Δ（或电荷转移能）决定**，满足 λ = hc/Δ；Δ 受配体种类、配位几何、金属–配体距离微调，故同一 Cr³⁺ 在 Al₂O₃（红宝石）呈红、在 Be₃Al₂Si₆O₁₈（祖母绿）呈绿、在 chrysoberyl（变石）呈变色。
4. **「致色」≠「呈色」**。致色是 chromophore 的吸收 / 发射谱；呈色是人眼对「透射或反射谱 × 人眼光谱响应 × 可能的荧光增强」的综合感知。严格表述须区分二者（见第五节概念辨析）。
5. **量子选择定则决定强弱**：Laporte 宇称定则使中心对称配合物中的 d–d 跃迁 g↔g 禁戒；自旋选择定则与 Jahn–Teller 畸变进一步调制谱形。这正是消光系数 ε 量级（弱 vs 强）差异的根源。

**在体系中的位置**：上游为第 17 篇（d 轨道、角动量）、第 19 篇（简并微扰给出分裂）、第 42 篇（晶体场 / 配位场哈密顿量）；下游通向宝石吸收光谱学、遥感反射光谱、激光材料（红宝石）与颜色中心物理。本篇与宝石学正式版「鉴定仪器与量子光学」交叉，但此处从量子力学正统体系重新组织。

## 二、数学结构

### 2.1 符号约定

- **单位制**：全文以 SI 为主，能量同时用波数 cm⁻¹ 与电子伏特 eV 表示，二者换算为 1 eV = 8065.544 cm⁻¹（由 CODATA 2018 的 e 与 h、c 派生）。
- **表象**：采用强场基（t₂g / eg 轨道占据数）描述 dⁿ 组态，与 Tanabe–Sugano 图一致；必要时回到弱场（自由离子项 ²S⁺¹L）相关图（Orgel 图）。
- **约定**：ħ = h / 2π；偶极算符为奇宇称（宇称 −1）；仅具反演中心的配合物（Oh、Oh 畸变、D₄h 等）才区分 g/u 宇称，四面体 Td 无反演中心，故无 Laporte 宇称禁戒。

### 2.2 态空间与晶体场哈密顿量

自由过渡金属离子的 dⁿ 组态按 Russell–Saunders 给出项符号 ²S⁺¹L_J；当离子进入配位场，对称性由球对称 SO(3) 降为点群（如八面体 Oh），由第 19 篇的简并微扰，能级按不可约表示分裂。晶体场势以球谐展开：

$$ V_{\text{CF}}(\mathbf r)=\sum_{l,m} A_l^m\,\langle r^l\rangle\,Y_l^m(\theta,\phi) \tag{1} $$

| 符号 | 含义 | 量纲 / 单位 |
|------|------|-------------|
| $V_{\text{CF}}$ | 晶体场势（配体静电势的球谐展开） | J（能量） |
| $\mathbf r,\theta,\phi$ | d 电子相对核的坐标与球坐标角 | m, rad, rad |
| $A_l^m$ | 与配体电荷排布相关的 Stevens 系数 | 由几何决定（能量量纲） |
| $\langle r^l\rangle$ | d 电子径向期待值（l = 2,4 主导） | mˡ |
| $Y_l^m$ | 球谐函数 | 无量纲 |

精确到八面体的 l = 4 主导项，d 轨道分裂为两组：二重简并的 eg（d_{z²}, d_{x²−y²}）与三重简并的 t₂g（d_{xy}, d_{xz}, d_{yz}）。其能量（相对质心）为：

$$ E(e_g)=+6Dq,\qquad E(t_{2g})=-4Dq \tag{2} $$

| 符号 | 含义 | 量纲 / 单位 |
|------|------|-------------|
| $E(e_g),E(t_{2g})$ | eg、t₂g 轨道相对质心的能量 | J 或 cm⁻¹ |
| $Dq$ | 晶体场强度参数（正比于 $\langle r^4\rangle$ 与配体势） | J 或 cm⁻¹ |

两组之间的能隙即八面体分裂能：

$$ \Delta_o \equiv E(e_g)-E(t_{2g}) = 10Dq \tag{3} $$

质心守恒检验：$2\times(+6Dq)+3\times(-4Dq)=0$，保证 (1) 的球对称部分（l = 0）不贡献分裂，仅 l = 4 项有效。式 (2)(3) 不跳步：由 Oh 群特征标表，d 表示的基（5 维）在 Oh 下分解为 eg ⊕ t₂g；点电荷模型对 eg（直接指向配体）给正能移、对 t₂g（避开配体）给负能移，幅值比由矩阵元确定为 6 : (−4)（详见第 42 篇）。

### 2.3 跃迁矩与选择定则

电偶极跃迁矩（以位置算符 $\hat{\mathbf r}$ 为偶极算符）：

$$ \boldsymbol\mu_{fi}=e\langle f|\hat{\mathbf r}|i\rangle \tag{4} $$

| 符号 | 含义 | 量纲 / 单位 |
|------|------|-------------|
| $\boldsymbol\mu_{fi}$ | 末态 f 与初态 i 间的电偶极跃迁矩 | C·m |
| $e$ | 元电荷（CODATA 2018：$1.602176634\times10^{-19}$ C，精确） | C |
| $\hat{\mathbf r}$ | 位置算符（奇宇称：反演下变号） | m |

**Laporte 宇称定则（Laporte 1924）**：在具反演中心的配合物中，波函数有确定宇称 g/u；因 $\hat{\mathbf r}$ 为奇宇称，$\langle f|r|i\rangle$ 非零要求初末态宇称相反（u↔g）。而 d 轨道全为 g，故 d–d 跃迁 g↔g 被宇称禁戒。

**自旋选择定则**：晶体场本身不耦合自旋（非磁性），故良好自旋量子数 S 守恒；ΔS = 0 为强跃迁条件。

**振动耦合弛豫（vibronic coupling）**：奇宇称分子振动（如 eg、T₁u 模式）使瞬时几何偏离反演中心，把少量 u 成分混入 d 轨道，从而「偷取」强度，使 d–d 带虽弱但可见（ε ~ 1–100）。此机制在 McClure (1959) 的电子光谱综述中被系统讨论。

### 2.4 对称性与守恒量

在 Oh 场中轨道角动量 L 不再守恒（轨道淬灭，orbital quenching）——三维各向同性被打破，只有绕四次轴的 C₄ 分量等子群对称被保留；自旋 S 在纯晶体场一级近似下守恒，自旋–轨道耦合 $\lambda\mathbf L\cdot\mathbf S$ 是微扰（它导致 ²E 的 R 线分裂等精细结构，见第六节）。

## 四、实验基础与观测证据

**关键实验**：紫外–可见–近红外（UV–Vis–NIR）吸收光谱是主证据；荧光 / 磷光光谱用于 R 线等锐线；偏振光谱可区分 eg / t₂g 跃迁的对称性。

**里程碑时间线与结果（与第八节文献对应）**

| 年份 | 体系 / 实验 | 关键结果 | 文献 |
|------|-------------|----------|------|
| 1929 | 理论（群论） | 预言原子能级在晶体中按对称性分裂 | Bethe [24iq] |
| 1960 | 红宝石受激发射 | 实测 R1 = 694.3 nm、R2 = 692.9 nm 锐线（室温、1 atm） | Maiman [24ja] |
| 1979 | 红宝石高压吸收 | 4A₂→4T₂ 在常压 555±1 nm、4A₂→4T₁ 在 405±1 nm（随压强蓝移） | 实验佐证 Δ_o 量级（见 [24jg] 数据汇编） |
| 1982 | 天然红宝石拟合 | 拟合得 B ≈ 732 cm⁻¹、Dq ≈ 1830 cm⁻¹、V（三角场）≈ −1996 cm⁻¹ | 独立拟合（印证 [24jg]） |
| 持续 | 蓝宝石 Fe–Ti | Fe²⁺→Ti⁴⁺ 电荷转移吸收峰 ≈ 560 nm 与 ≈ 700 nm | 见 [24ji] 与光谱学文献 |

**被排除的替代解释**：早期曾以「纯带隙 / 本征吸收」解释宝石色；晶体场理论 [24iq] 与 d–d / 电荷转移光谱 [24jf] 证明颜色来自局域 d 电子与电子转移，而非宿主能带（宿主 Al₂O₃ 带隙 ≈ 8.7 eV，远在紫外）。

**常见误读纠正（严格表述）**

> 「红宝石的红色是它『反射红光』。」—— 不准确。严格表述：红宝石对绿–黄光（4A₂→4T₂ 约 556 nm、4A₂→4T₁ 约 405 nm）强吸收，透 / 反射谱在红区有窗口；同时 Cr³⁺ 的 R 线荧光（692.9 / 694.3 nm）在红区发光，**体色由吸收窗口 + 红荧光共同决定**。

> 「d–d 跃迁被禁戒就看不见。」—— 不准确。Laporte 宇称禁戒使 d–d 带极弱（ε ~ 1–100），但在中心对称体系中仍因振动耦合而可见；强饱和色（如红宝石需 ~1% Cr）来自吸收带叠加与荧光，弱吸收也可致色。

> 「致色 = 呈色。」—— 二者不同（见第五节辨析）。吸收光谱峰位置不直接等于肉眼所见颜色。

**实验局限**：天然样品常多色心共存、吸收带重叠；需低温、偏振与单晶定向分辨 eg/t₂g 与自旋禁戒线；高浓度时离子对（如 Cr–Cr 对）产生新带（N 线 ≈ 704 nm），使谱解释复杂化。

## 五、分类体系与物理机制

**跃迁类型分类表**

| 类型 | 选择定则 | 强度（ε） | 典型实例 | 落点区域 |
|------|----------|-----------|----------|----------|
| d–d（带内） | 宇称禁戒（g↔g，Oh）；自旋允许 | 1–100 | 红宝石、橄榄石、孔雀石、紫晶 | 可见–近红外 |
| 电荷转移 LMCT（配体→金属） | 宇称允许、自旋允许 | 10³–10⁴ | 青金石 S²⁻→S₂⁻、含 Fe³⁺ 的 LMCT | 紫外–可见蓝紫 |
| 电荷转移 MLCT（金属→配体） | 宇称允许 | 10³–10⁴ | 部分 Cu、Fe–Ti 体系 | 可见 |
| 金属间 IVCT（如 Fe²⁺→Ti⁴⁺） | 宇称允许 | 10³–10⁴ | 蓝宝石蓝色 | 可见黄红 |

**机制链条（从数学结构到现象）**

- **d–d 致色**：晶体场把 d 轨道劈为 eg / t₂g，能量差 Δ_o = 10Dq。当入射光子能量 hν ≈ Δ 时，电子在 d 子能级间跃迁而被吸收（如红宝石吸 ~556 nm 绿光、~405 nm 紫光 → 透红光）。因宇称禁戒，强度靠奇宇称振动耦合弛豫获得（McClure 1959 [24jf]）。吸收波长强烈依赖配体场强弱：Δ 越大 → λ 越短（越偏蓝）。这正是 Cr³⁺ 在红宝石（强场，Δ 大，吸绿黄 → 红）与祖母绿（场稍弱，Δ 小，吸紫红 → 绿）颜色不同的根源（Nassau 1983 [24ji] 给出 ruby 2.23 eV vs emerald 2.05 eV 的对比）。

- **电荷转移致色**：电子在金属–配体或金属–金属间整体转移（如蓝宝石中 Fe²⁺ + Ti⁴⁺ → Fe³⁺ + Ti³⁺），轨道空间重叠大、无宇称禁戒，吸收强且带常落在黄–红区，透出蓝紫 → 蓝色（Nassau 1983 [24ji]；电荷转移仅需 ~0.01% Ti/Fe 即可显色，远低于红宝石所需 ~1% Cr）。

**概念辨析**

- **d–d vs 电荷转移**：前者是同一金属离子 d 子能级间的「内部」跃迁（弱、常被禁戒）；后者是电子在不同离子 / 配体间的「转移」（强、允许）。二者可共存（如蓝宝石除 Fe–Ti 电荷转移外还有 Fe³⁺ 的 d–d 弱带）。
- **致色 vs 呈色**：致色 = chromophore 的量子吸收 / 发射；呈色 = 人眼对透 / 反射谱的感知，受荧光（红宝石红荧光增强红色）、散射、人眼光谱灵敏度调制。科普常把「吸收某色即显其补色」当作严格表述，实为高度简化——严格表述须走完整光学传输与人眼响应链。

**适用范围与失效边界**

- 晶体场理论是静电一级近似；共价性（配位场 / 分子轨道）通过 nephelauxetic（云 expand）效应减小 Racah 参数 B、并修正电荷转移能——配位场理论是其自然推广，二者不互斥（见第七节争议）。
- 高浓度或离子对（Cr–Cr、Fe–Fe）产生新带与浓度淬灭；Jahn–Teller 畸变（Cu²⁺ d⁹、Mn³⁺ d⁴）使简并基态分裂、谱带增宽。

## 六、典型系统与可解模型

### 6.1 八面体 d 轨道分裂（解析可解）与 λ = hc/Δ 反算

由式 (2)(3)，八面体 d 轨道分裂为 eg（+6Dq）与 t₂g（−4Dq），能隙 Δ_o = 10Dq。取红宝石 Cr³⁺ 量级 Dq ≈ 1830 cm⁻¹（独立拟合值，见 [24jg] 数据汇编），则 Δ_o ≈ 18300 cm⁻¹，对应吸收波长

$$ \lambda=\frac{10^7}{\Delta_o(\text{cm}^{-1})}=\frac{10^7}{18300}\approx 546\ \text{nm} \tag{5} $$

与红宝石 4A₂→4T₂ 实验带 ~556 nm 一致（差异来自三角场与共价修正，属第 42 篇内容）。式 (5) 来自 $E=h\nu=hc/\lambda$，且波数 $\tilde\nu=1/\lambda=10^7/\lambda(\text{nm})$，故 $\lambda(\text{nm})=10^7/\Delta(\text{cm}^{-1})$。

下表由脚本 `code/43_过渡金属离子致色的量子机制_模型.py` 计算（Δ 取自文献，λ 为计算值）：

| 矿物 / 离子 | Δ (cm⁻¹) | 计算 λ (nm) | E (eV) |
|-------------|----------|-------------|--------|
| 红宝石 Cr³⁺ | 18000 | 555.6 | 2.232 |
| 祖母绿 Cr³⁺ | 16500 | 606.1 | 2.046 |
| 橄榄石 Fe²⁺（近红外主带） | 9524 | 1050.0 | 1.181 |

![Absorption wavelength λ = hc/Δ versus crystal-field splitting Δ for representative gem chromophores](figures/43_过渡金属离子致色的量子机制_图1.svg)

**Figure 1.** Absorption wavelength as a function of crystal-field splitting Δ (inverse relation λ = 10⁷/Δ). Markers show ruby, emerald and peridot chromophores; the shaded band denotes the visible range (≈400–780 nm).

### 6.2 d–d 强度随振动耦合参数 ξ 的变化（数值 / 示意）

宇称禁戒使 d–d 本征偶极矩近零；奇宇称振动耦合使有效跃迁矩 ∝ ξ（ξ 为无量纲振动耦合强度），相对强度随 ξ² 增长并趋于饱和：

$$ I(\xi)=\frac{\xi^2}{\xi^2+\xi_0^2} \tag{6} $$

| 符号 | 含义 | 量纲 / 单位 |
|------|------|-------------|
| $I(\xi)$ | 相对 d–d 跃迁强度（归一化） | 无量纲 |
| $\xi$ | 奇宇称振动耦合强度（示意无量纲） | 无量纲 |
| $\xi_0$ | 半强度耦合常数（示意，取 0.5） | 无量纲 |

脚本 `code/43_过渡金属离子致色的量子机制_振动耦合.py` 取 ξ₀ = 0.5，给出 ξ = 0.1 → I = 0.039、ξ = 0.5 → I = 0.5（半强度）、ξ = 3.0 → I = 0.973（近饱和），并用 numpy 2.x 的 `np.trapezoid` 对曲线积分得 ∫I dξ ≈ 2.30。该曲线示意：弱振动耦合时 d–d 极弱（与 ε~1–100 对应），强耦合则趋近电荷转移量级。

![Schematic relative d-d intensity versus odd-parity vibronic coupling strength ξ](figures/43_过渡金属离子致色的量子机制_图2.svg)

**Figure 2.** Relative d–d transition intensity versus odd-parity vibronic coupling strength ξ (model I(ξ) = ξ²/(ξ²+ξ₀²)). Shaded bands mark the weak d–d and strong charge-transfer regimes.

### 6.3 红宝石 R 线：²E → ⁴A₂ 的宇称 / 自旋双禁戒锐线

Cr³⁺(d³) 在八面体基态为 ⁴A₂；激光上能级 ²E 与基态自旋多重度不同（ΔS = 1），且同为偶宇称，故 ²E→⁴A₂ 是「宇称禁戒 + 自旋禁戒」双禁戒跃迁，本应极弱；但因 ²E 寿命长（~3 ms），在脉冲泵浦下反转可实现受激辐射——这正是 Maiman (1960) [24ja] 红宝石激光的物理基础。R 线双线（R1 = 694.3 nm、R2 = 692.9 nm）来自 ²E 在自旋–轨道 + 三角场下的进一步分裂（²A 与 ²E 子能级），室温下单线宽约 0.5 nm。

## 七、历史脉络与学术争议

**提出动机**：19 世纪末至 20 世纪初，人们已注意到过渡金属盐与矿物颜色随配体剧变（如 [Cu(H₂O)₆]²⁺ 蓝、[Cu(NH₃)₄]²⁺ 深蓝），但缺乏统一量子解释；自由离子光谱理论（第 17、22 篇）在此失效，因为配位环境打破了球对称。

**历史节点**

| 年份 | 人物 | 贡献 | 文献 |
|------|------|------|------|
| 1924 | O. Laporte | 提出宇称选择定则（Laporte 规则），奠定 d–d 禁戒判据 | [24jd] |
| 1929 | H. A. Bethe | 用群论处理晶体中原子能级分裂（晶体场理论之源） | [24iq] |
| 1937 | H. A. Jahn, E. Teller | 证明简并电子态必几何畸变（Jahn–Teller 效应） | [24je] |
| 1952 | L. E. Orgel | 给出弱场相关图（Orgel 图），定性预测跃迁 | [24jh] |
| 1954 | Y. Tanabe, S. Sugano | 给出 dⁿ (n=1–9) 完整能量矩阵与图（Tanabe–Sugano 图） | [24ir], [24is] |
| 1959 | D. S. McClure | 系统综述晶体中离子电子光谱，含振动耦合强度机制 | [24jf] |
| 1960 | T. H. Maiman | 红宝石受激发射，实测 R 线 694.3 / 692.9 nm | [24ja] |
| 1983 | K. Nassau | 归纳「致色十五因」，明确电荷转移机制 | [24ji] |
| 1993 | R. G. Burns | 矿物学晶体场理论数据汇编（宝石 Δ 与谱） | [24jg] |

**当前争议与开放问题（并列各方，不站队）**

1. **晶体场 vs 配位场（分子轨道）框架之争**。晶体场理论把配体当作点电荷 / 偶极，计算简便、对 Δ 与磁性的零级描述成功；配位场 / MO 理论进一步纳入共价重叠（π 成键、nephelauxetic 效应），更准确描述电荷转移与光谱精细结构。两框架并非互斥：配位场是晶体场在共价性下的推广，多数现代处理取「晶体场为一级、共价修正为二级」。

2. **「致色」与「呈色」的边界**。吸收峰位置不等于肉眼颜色（人眼响应、荧光、多重吸收带叠加均参与），科普常简化为「吸某色则显补色」；严格宝石学光谱学要求完整透 / 反射谱 × 人眼明视觉函数积分，此点文献中仍有表述分歧（属科普简化 vs 严格表述之争，见第五节辨析）。

3. **部分矿物的具体致色归属仍有讨论**。例如紫晶（amethyst）的紫色多归因于 Fe³⁺ 相关中心（四面体 [FeO₄]⁻ 或辐照产生的色心），其确切跃迁归属与天然辐照角色仍在文献中讨论；本篇仅确认 Fe³⁺ 为关键杂质，不断言唯一机制（避免未核实的精细数值）。

本节内容可能随研究进展（如第一性原理计算对 Δ 与电荷转移能的精确预测）更新。

function protectMath(src){
  var blocks = [];
  // 先抽块级 $$...$$（可跨行）
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, function(m){
    blocks.push(m);
    return '%%MATH' + (blocks.length - 1) + '%%';
  });

  src = src.replace(/\$([^\$\n]+?)\$/g, function(m){

  });
  return { src: src, blocks: blocks };
}

function boot(){
  var raw = document.getElementById('src').textContent;
