<script type="text/plain" id="src"># 半导体与pn结

> **分类归属：第三部分·多体、对称与凝聚态 · 数学程度：L2 · 前置依赖：第 21 篇《全同粒子与泡利不相容原理》、第 24 篇《晶体中的电子与能带》**
> **验证依据**：Hall (1879) Am. J. Math.、Wilson (1931) Proc. R. Soc. A、Bardeen & Brattain (1948) Phys. Rev.、Shockley (1949) Bell Syst. Tech. J.、Shockley (1950) *Electrons and Holes in Semiconductors*、Esaki (1958) Phys. Rev.、Sze & Ng (2007)

---

## 一、概念与定位

**半导体（semiconductor）** 是带隙较小（$E_g\sim0.1\!-\!1.5\ \mathrm{eV}$）的固体，其价带在 $T=0$ 时全满、导带全空，但室温热激发即可将少量电子跨过带隙送入导带，同时在价带留下空态——**空穴（hole）**。空穴不是真实粒子，而是满带中「缺少一个电子」的集体激发，其运动等效为一个带正电、有效质量 $m_h^*>0$ 的准粒子。半导体区别于绝缘体的关键仅在于带隙大小，区别于金属的关键在于费米能级落入带隙、本征载流子浓度极低。

名称词源：英文 *semi-*（半）+ *conductor*（导体），由古希腊语 *semis*（一半）。「pn 结」指 p 型（空穴多）与 n 型（电子多）半导体接触形成的界面，是整流、发光、光伏与晶体管的核心。

本篇须抓住的核心特征：

1. **本征与掺杂**：纯净半导体为本征（intrinsic），载流子由热激发成对产生 $n=p=n_i$；掺入施主（donor，如 Si 中 P）给出多余电子 → n 型，掺入受主（acceptor，如 Si 中 B）给出多余空穴 → p 型。
2. **质量作用定律**：$np=n_i^2$ 在任何平衡态成立，与掺杂无关——增加一种载流子必压制另一种。
3. **pn 结自建势与耗尽层**：p/n 接触后载流子扩散，在界面留下电离杂质空间电荷区（耗尽层），建立内建电场与内建电势 $V_{bi}$，阻止进一步扩散。
4. **整流**：正向偏压（p 正 n 负）压低势垒，电流指数上升；反向偏压升高势垒，仅存微小饱和电流——这就是二极管的单向导电。
5. **晶体管原理**：一个 pn 结的少数载流子注入受第三个电极（基极/栅极）调控，实现电流放大或开关，是集成电路的物理基础。

本主题在体系中的位置：它是第 24 篇能带论的直接应用，向下衔接第 21 篇的全同性（每个能态两自旋）、向上通向第 26 篇（载流子统计）、第 27 篇（超导是另一种凝聚态），并为第六部分（半导体致色、探测器）提供量子基础。

---

## 二、数学结构

**符号约定声明**：SI 单位制，基本电荷 $e=1.602176634\times10^{-19}\ \mathrm{C}$，玻尔兹曼常数 $k_B=1.380649\times10^{-23}\ \mathrm{J/K}$；费米-狄拉克分布 $f(E)=1/[1+\exp((E-E_F)/k_BT)]$；温度取 300 K 为典型值。

### 2.1 载流子浓度与质量作用

导带电子浓度（单位体积）

$$
n=\int_{E_c}^{\infty}\!g_c(E)\,f(E)\,dE
\approx N_c\,e^{-(E_c-E_F)/k_BT},
\tag{1}
$$

价带空穴浓度

$$
p=N_v\,e^{-(E_F-E_v)/k_BT},
\tag{2}
$$

其中 $N_c,N_v\propto T^{3/2}$ 为有效态密度，$E_c,E_v$ 为导带底、价带顶。两式相乘消去 $E_F$ 得**质量作用定律**

$$
np=N_cN_v\,e^{-E_g/k_BT}=n_i^2,
\tag{3}
$$

本征时 $n=p=n_i$，故 $n_i=\sqrt{N_cN_v}\,e^{-E_g/2k_BT}$。

### 2.2 内建势与耗尽层

突变 pn 结的内建电势

$$
eV_{bi}=E_F^{(n)}-E_F^{(p)}=k_BT\ln\!\frac{N_aN_d}{n_i^2},
\tag{4}
$$

耗尽层宽度（单边突变近似）

$$
W=\sqrt{\frac{2\varepsilon_s}{e}\frac{N_a+N_d}{N_aN_d}(V_{bi}-V)},
\tag{5}
$$

其中 $\varepsilon_s$ 为半导体介电常数，$V$ 为外加偏压（正向取负）。

### 2.3 理想二极管方程

由扩散电流与边界少数载流子浓度导出 Shockley 方程

$$
I=I_s\!\left(e^{eV/k_BT}-1\right),
\tag{6}
$$

饱和电流 $I_s\propto n_i^2$ 强烈依赖温度。室温下 $k_BT/e\approx25.9\ \mathrm{mV}$，故每约 60 mV 电流增十倍，导通电压（Si）约 0.7 V。

### 2.4 霍尔系数

垂直磁场中载流子偏转产生横向电场，霍尔系数

$$
R_H=\frac{E_y}{j_xB_z}=-\frac{1}{ne}\quad(\text{电子}),\qquad R_H=+\frac{1}{pe}\quad(\text{空穴}),
\tag{7}
$$

其中约定 $j_x$ 沿 $+x$、$B_z$ 沿 $+z$。注意一个易错点：同一电流方向下电子与空穴的漂移方向相反（电子沿 $-x$、空穴沿 $+x$），速度反号与电荷反号相消，两者所受洛伦兹力 $\boldsymbol F=q\boldsymbol v\times\boldsymbol B$ 都指向 $-y$、向**同一侧**壁偏转；$R_H$ 符号的差别来自**积累电荷的符号**：电子在 $-y$ 壁积累负电荷，霍尔场 $E_y<0$，故 $R_H<0$；空穴在同一壁积累正电荷，$E_y>0$，故 $R_H>0$。两种载流子并存时 $R_H=(p\mu_p^2-n\mu_n^2)/e(p\mu_p+n\mu_n)^2$，符号由迁移率加权的多数载流子决定。

符号直接给出载流子类型，大小给出浓度——这是判别 n/p 型与测量载流子密度的实验基础（见第 4 节）。

---

## 三、物理量与特征尺度

- **带隙 $E_g$（300 K）**：Si $1.12\ \mathrm{eV}$、Ge $0.66\ \mathrm{eV}$、GaAs $1.42\ \mathrm{eV}$、宽禁带 GaN $3.4\ \mathrm{eV}$。
- **本征载流子浓度 $n_i$（300 K）**：Si $\sim1.0\times10^{10}\ \mathrm{cm}^{-3}$、Ge $\sim2\times10^{13}\ \mathrm{cm}^{-3}$。远小于掺杂浓度（$10^{15}\!-\!10^{18}\ \mathrm{cm}^{-3}$），故掺杂主导导电。
- **迁移率 $\mu$**：Si 电子 $\mu_n\approx1350\ \mathrm{cm^2/Vs}$、空穴 $\mu_p\approx480\ \mathrm{cm^2/Vs}$；GaAs 电子可达 $8500\ \mathrm{cm^2/Vs}$。
- **内建电势 $V_{bi}$**：Si 典型 $0.6\!-\!0.8\ \mathrm{V}$（掺杂 $10^{16}\ \mathrm{cm}^{-3}$ 量级）。
- **耗尽层宽度 $W$**：典型 $0.1\!-\!1\ \mu\mathrm{m}$（依赖于掺杂与偏压）。
- **热尺度**：$k_BT/e\approx25.9\ \mathrm{mV}$（300 K）；导通判据 $eV\gg k_BT$。
- **开关速度**：由少数载流子寿命与结电容决定，典型 ns 量级（现代器件可达 ps）。

---

## 四、实验基础与观测证据

1. **霍尔效应（1879）**：Hall 在薄金箔上观测到横向电势差，首次证明电荷载流子带负电并可被磁场偏转 [24el]。现代霍尔测量直接读出载流子符号（n 型负、p 型正）与浓度，是半导体表征的常规手段。
2. **整流曲线**：pn 结的 $I\text{-}V$ 曲线在正向呈指数、反向呈饱和，与式 (6) 高度吻合（见脚本段 2）。
3. **掺杂可控性**：通过扩散或离子注入改变 $N_d/N_a$，实测电导可在 $10^3$ 倍以上调节，验证施主/受主模型。
4. **晶体管放大**：Bardeen 与 Brattain 1948 点接触晶体管、Shockley 1949 结型晶体管均展示基极电流对集电极电流的增益，奠定微电子学 [24em][24en]。
5. **隧道二极管（Esaki 1958）**：重掺杂 pn 结在反向与部分正向出现负微分电导，是带隙与量子隧穿（第 14 篇）共同的直接证据 [24ep]。

**误读纠正**：空穴不是被「发射」的正电荷粒子，而是价带中缺失电子的等效描述；说「空穴向上运动」等价于「相邻电子向下填充」。其有效质量 $m_h^*$ 来自价带顶的曲率（式 2.5 第 24 篇），并非电子真实质量的简单取反。

---

## 五、分类体系与物理机制

### 5.1 本征 vs 掺杂

本征半导体载流子仅来自热激发，$n=p=n_i$，导电弱且高度依赖温度；掺杂半导体由杂质能级提供多数载流子，$n\approx N_d$（n 型）或 $p\approx N_a$（p 型），导电对温度不敏感、受掺杂主导。

### 5.2 n 型 vs p 型

施主（价电子比基质多一个，如 Si:P）电离能极小（Si 中 P 约 45 meV），室温几乎全电离，贡献导带电子；受主（价电子少一个，如 Si:B）接受价带电子，留下空穴。二者在能带图上分别对应导带底附近的施主能级与价带顶附近的受主能级。

### 5.3 整流机制（pn 结）

零偏时扩散流与内建电场漂移流平衡。加正向偏压削弱内建势垒，多数载流子注入对方形成扩散电流（指数增长）；加反向偏压加高势垒，仅少数载流子被扫过形成微小饱和电流。这是式 (6) 的物理来源。

### 5.4 失效边界

- **本征激发主导**：高温下 $n_i$ 指数上升，掺杂失效，器件失去整流特性（Si 器件上限约 150–200 °C）。
- **雪崩击穿**：强反向偏压下载流子碰撞电离，电流剧增——既是失效也是齐纳/雪崩二极管的利用机制。
- **直接/间接带隙影响光学**：间接带隙（Si、Ge）辐射复合需声子参与，发光效率低；直接带隙（GaAs）适合激光器（见第 24 篇 5.2）。

---

## 六、典型系统与可解模型

### 6.1 本征载流子浓度随温度（脚本数值例）

取 Si：$E_g=1.12\ \mathrm{eV}$，$N_c(300\,\mathrm{K})=2.8\times10^{19}\ \mathrm{cm}^{-3}$，$N_v=1.04\times10^{19}\ \mathrm{cm}^{-3}$，且 $N_{c,v}\propto T^{3/2}$。计算得

$$
n_i(T)=\sqrt{N_c(300)N_v(300)}\left(\frac{T}{300}\right)^{3/2}e^{-E_g/(2k_BT)},
\tag{8}
$$

在 300 K 约 $1.0\times10^{10}\ \mathrm{cm}^{-3}$，并随温度指数上升（见脚本段 1 与图 1）。

### 6.2 理想二极管 $I\text{-}V$（脚本数值例）

取 Si 饱和电流 $I_s=1\times10^{-12}\ \mathrm{A}$，$T=300\ \mathrm{K}$，由式 (6) 得正向导通电压约 0.7 V、反向饱和；电流在 $V>0.6\ \mathrm{V}$ 后每 60 mV 增十倍（见脚本段 2 与图 2）。

---

## 七、历史脉络与学术争议

- **1879 Hall**：Edwin Hall 发现霍尔效应，首次显示电流由可偏转的带电载流子承担 [24el]。
- **1931 Wilson**：用带理论框架首次解释半导体的温度激活电导（见第 24 篇）[24ei]。
- **1947–1948 晶体管**：Bardeen、Brattain 与 Shockley 在贝尔实验室发明点接触与结型晶体管，1948 年公开 [24em]。
- **1949 Shockley**：发表 pn 结与结型晶体管的完整理论，奠定器件物理 [24en]；1950 年专著系统总结 [24eo]。
- **1958 Esaki**：江崎玲于奈发现隧道二极管负微分电导，验证重掺杂结中的量子隧穿 [24ep]。
- **学术争议**：早期「半导体导电是离子还是电子」的争论随霍尔效应与能带论而终结；现代争议转向强场/纳米尺度下经典漂移-扩散模型的失效（需玻尔兹曼方程、量子输运），以及宽禁带与二维材料器件的散粒噪声与热管理。

  var md = raw.replace(/^(#{1,3})\s+(.+)$/gm, function(m, h, t){
    var id = 'h-' + t.replace(/[^\w一-龥]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
    return h + ' <span id="' + id + '"></span>' + t;
  });

  // 保护数学公式
  var prot = protectMath(md);
  md = prot.src;

  document.getElementById('content').innerHTML = marked.parse(md);

  // 还原数学公式占位符
  var content = document.getElementById('content');
  var html = content.innerHTML.replace(/%%MATH(\d+)%%/g, function(m, n){
    return prot.blocks[+n];
  });
  content.innerHTML = html;

  // 生成目录
  var hs = document.querySelectorAll('#content h2, #content h3');
  var toc = document.getElementById('toc'), tocHtml = '';
  hs.forEach(function(h){
    var sp = h.querySelector('span[id]');
    var id = sp ? sp.id : '';
    var cls = h.tagName === 'H3' ? 'sub' : '';
    tocHtml += '<a class="' + cls + '" href="#' + id + '">' + h.textContent.trim() + '</a>';
  });
  toc.innerHTML = tocHtml;

  // 图片路径：正文里写 figures/xxx.svg
  document.querySelectorAll('#content img').forEach(function(im){
    if(/^figures\//.test(im.getAttribute('src')||'')) return;
  });

  if (window.renderMathInElement) {
    renderMathInElement(document.getElementById('content'), {
      delimiters:[
        {left:'$$', right:'$$', display:true},
        {left:'$',  right:'$',  display:false}
      ],
      ignoredTags:['script','noscript','style','textarea','pre','code'],
      throwOnError:false
    });
  }

  // 滚动高亮
  var links = [].slice.call(toc.querySelectorAll('a'));
  window.addEventListener('scroll', function(){
    var cur = null;
    hs.forEach(function(h){
      if (h.getBoundingClientRect().top < 120) cur = h;
    });
    links.forEach(function(a){ a.classList.remove('active'); });
    if (cur){
      var sp = cur.querySelector('span[id]');
      var act = toc.querySelector('a[href="#' + (sp?sp.id:'') + '"]');
      if (act) act.classList.add('active');
    }
  }, {passive:true});
}
if (window.marked) boot();
else window.addEventListener('load', boot);
</script>
</body>
</html>
