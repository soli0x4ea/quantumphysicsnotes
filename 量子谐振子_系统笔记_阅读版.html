## 一、概念与定位

> **一句话结论**：谐振子兼具严格可解与物理普适；零点能 ℏω/2≠0 源自不确定关系，Casimir 效应可测。

量子谐振子是量子力学中**唯一同时具备（1）严格可解、（2）代数结构优雅、（3）物理上无处不在**的一维系统。它在整个理论中的特殊地位来自一个平凡却深刻的事实：

> 任意在极小值 $x_0$ 处光滑的势能 $V(x)$，其泰勒展开到二阶
> $$V(x)=V(x_0)+V'(x_0)(x-x_0)+\tfrac12 V''(x_0)(x-x_0)^2+\cdots$$
> 由于极小值处 $V'(x_0)=0$，主导项就是二次项 $\tfrac12 V''(x_0)(x-x_0)^2$。

因此**一切稳定的相互作用在低能（小振幅）下都退化为谐振子**——这是谐振子成为"微扰论、线性响应、简正模分析"通用范式的根本原因。从双原子分子的振动、晶格的声子、到量子场论中"场 = 无穷多个谐振子的集合"，都建立在它的数学结构之上。

谐振子还携带一个反经典的核心结论：**零点能（zero-point energy）**。基态能量 $E_0=\tfrac12\hbar\omega\neq 0$。经典谐振子可以静止在势能最低点，量子谐振子却因位置-动量不确定关系被迫保有最低限度的动能与势能。零点能不是数学瑕疵，而是波粒二象性的直接后果，并在 Casimir 效应（Casimir 1948）中成为可测的宏观力。

本篇定位：第 14 篇处理了一维方势阱与隧穿，本篇处理一维二次势——即最"平顺"的可解势。它是第 16 篇（角动量）、第 19 篇（微扰论，非谐修正即在此展开）、第 35 篇（光场相干态）的共同上游。

## 二、数学结构

### 2.1 哈密顿与无量纲化

一维谐振子的哈密顿量为

$$\hat H=\frac{\hat p^2}{2m}+\frac12 m\omega^2\hat x^2, \tag{2.1}$$

其中 $m$ 为质量，$\omega=\sqrt{k/m}$ 为经典角频率（$k$ 为等效弹性系数）。坐标与动量算符满足正则对易关系 $[\hat x,\hat p]=i\hbar$（见第 12 篇）。

引入特征长度 $\ell=\sqrt{\hbar/(m\omega)}$（谐振子的"自然宽度"），定义无量纲变量 $\xi=\hat x/\ell$。为构造升降算符，令

$$\hat a=\frac{1}{\sqrt{2\hbar m\omega}}\,(m\omega\hat x+i\hat p),\qquad \hat a^\dagger=\frac{1}{\sqrt{2\hbar m\omega}}\,(m\omega\hat x-i\hat p). \tag{2.2}$$

注意 $\hat a$ 不是厄米算符（$(\hat a)^\dagger=\hat a^\dagger$），它混合了 $\hat x$ 与 $\hat p$，本质是复数化的"振幅算符"。

### 2.2 对易关系 $[\hat a,\hat a^\dagger]=1$ 的推导（不跳步）

由 $\hat a=\alpha(m\omega\hat x+i\hat p)$、$\hat a^\dagger=\alpha(m\omega\hat x-i\hat p)$，其中 $\alpha=1/\sqrt{2\hbar m\omega}$，展开对易子：

$$[\hat a,\hat a^\dagger]=\alpha^2\big[(m\omega\hat x+i\hat p),\,(m\omega\hat x-i\hat p)\big].$$

利用 $[A+B,\,C-D]=[A,C]-[A,D]+[B,C]-[B,D]$ 与 $[x,x]=[p,p]=0$、$[x,p]=[p,x]=i\hbar$：

$$\begin{aligned}
[\hat a,\hat a^\dagger]&=\alpha^2\Big((m\omega\hat x)(m\omega\hat x)-(m\omega\hat x)(-i\hat p)+(i\hat p)(m\omega\hat x)-(i\hat p)(-i\hat p)\Big)\\
&=\alpha^2\Big(\,0\,+\,i m\omega[\hat x,\hat p]\,+\,i m\omega[\hat p,\hat x]\,+\,(-i^2)[\hat p,\hat p]\Big)\\
&=\alpha^2\Big(\,i m\omega(i\hbar)\,+\,i m\omega(-i\hbar)\,+\,0\,\Big)\\
&=\alpha^2\Big(\,i^2 m\omega\hbar\,-\,i^2 m\omega\hbar\,\Big)=\alpha^2\cdot 0+\text{需重算}.
\end{aligned}$$

上式中间项清理：第一项 $i m\omega[\hat x,\hat p]=i m\omega(i\hbar)=-m\omega\hbar$；第二项 $i m\omega[\hat p,\hat x]=i m\omega(-i\hbar)=+m\omega\hbar$。两者相消得 0——说明展开符号有误，改用更紧的方式：

$$[\hat a,\hat a^\dagger]=\alpha^2\big[\,i\hat p,\,-i\hat p\big]\ \text{的}\ x\text{部分}+\cdots$$

直接套用 $[A+iB,\,A-iB]=2i[A,B]$ 形式（其中 $A=m\omega\hat x$，$B=\hat p$）：

$$[\hat a,\hat a^\dagger]=\alpha^2\big((m\omega\hat x+i\hat p),\,(m\omega\hat x-i\hat p)\big)=\alpha^2\big((i\hat p),(-i\hat p)\ \text{交叉项}\big).$$

更稳妥：令 $u=m\omega\hat x,\ v=\hat p$，则 $\hat a=\alpha(u+iv),\ \hat a^\dagger=\alpha(u-iv)$。

$$\begin{aligned}
[\hat a,\hat a^\dagger]&=\alpha^2[u+iv,\,u-iv]\\
&=\alpha^2\Big([u,u]-[u,iv]+[iv,u]-[iv,iv]\Big)\\
&=\alpha^2\Big(0-i[u,v]+i[v,u]-0\Big)\\
&=\alpha^2\Big(-i[u,v]-i[u,v]\Big)\qquad(\text{因 }[v,u]=-[u,v])\\
&=-2i\alpha^2[u,v]=-2i\alpha^2[m\omega\hat x,\hat p]=-2i\alpha^2\,m\omega\,(i\hbar)\\
&=-2i\alpha^2\,i\,m\omega\hbar=2\alpha^2\,m\omega\hbar\\
&=2\cdot\frac{1}{2\hbar m\omega}\cdot m\omega\hbar=1.
\end{aligned}$$

于是 $[\hat a,\hat a^\dagger]=1$ 证毕。

### 2.3 哈密顿的对角化 $\hat H=\hbar\omega(\hat N+\tfrac12)$

将 $\hat x,\hat p$ 反解：

$$\hat x=\sqrt{\frac{\hbar}{2m\omega}}(\hat a+\hat a^\dagger),\qquad \hat p=i\sqrt{\frac{m\hbar\omega}{2}}(\hat a^\dagger-\hat a).$$

代入 $\hat H$（先算 $\hat p^2$ 与 $\hat x^2$）：

$$\hat p^2=-\frac{m\hbar\omega}{2}(\hat a^\dagger-\hat a)^2=-\frac{m\hbar\omega}{2}\big(\hat a^{\dagger 2}-\hat a^\dagger\hat a-\hat a\hat a^\dagger+\hat a^2\big),$$

$$\hat x^2=\frac{\hbar}{2m\omega}(\hat a+\hat a^\dagger)^2=\frac{\hbar}{2m\omega}\big(\hat a^2+\hat a\hat a^\dagger+\hat a^\dagger\hat a+\hat a^{\dagger 2}\big).$$

相加（注意 $\hat p^2/(2m)+\tfrac12 m\omega^2\hat x^2$ 中交叉项与平方项系数设计使 $\hat a^2,\hat a^{\dagger 2}$ 抵消）：

$$\frac{\hat p^2}{2m}=\frac{-\hbar\omega}{4}\big(\hat a^{\dagger 2}-\hat a^\dagger\hat a-\hat a\hat a^\dagger+\hat a^2\big),$$

$$\frac12 m\omega^2\hat x^2=\frac{\hbar\omega}{4}\big(\hat a^2+\hat a\hat a^\dagger+\hat a^\dagger\hat a+\hat a^{\dagger 2}\big).$$

两式相加，二次项 $\hat a^2,\hat a^{\dagger 2}$ 相消，留下

$$\hat H=\frac{\hbar\omega}{4}\Big(2\hat a\hat a^\dagger+2\hat a^\dagger\hat a\Big)=\frac{\hbar\omega}{2}(\hat a\hat a^\dagger+\hat a^\dagger\hat a).$$

用 $[\hat a,\hat a^\dagger]=1$ 即 $\hat a\hat a^\dagger=\hat a^\dagger\hat a+1$，定义粒子数算符 $\hat N=\hat a^\dagger\hat a$：

$$\hat H=\frac{\hbar\omega}{2}\big((\hat N+1)+\hat N\big)=\hbar\omega\Big(\hat N+\frac12\Big). \tag{2.3}$$

### 2.4 谱的代数推导

由于 $\hat N=\hat a^\dagger\hat a$ 为半正定厄米算符，其本征值 $n\ge 0$ 为实数。设 $\hat N|n\rangle=n|n\rangle$。考察 $\hat a|n\rangle$ 与 $\hat a^\dagger|n\rangle$ 的归一化：

$$\hat N(\hat a|n\rangle)=\hat a^\dagger\hat a\hat a|n\rangle=(\hat a^\dagger\hat a-1)\hat a|n\rangle\ \text{（用 }[\hat N,\hat a]=-\hat a\text{）}= (n-1)\hat a|n\rangle,$$

即 $\hat a$ 使粒子数减 1；同理 $\hat N(\hat a^\dagger|n\rangle)=(n+1)\hat a^\dagger|n\rangle$。归一化因子：

$$\|\hat a|n\rangle\|^2=\langle n|\hat a^\dagger\hat a|n\rangle=n,\quad \|\hat a^\dagger|n\rangle\|^2=\langle n|\hat a\hat a^\dagger|n\rangle=n+1.$$

故

$$\hat a|n\rangle=\sqrt{n}\,|n-1\rangle,\qquad \hat a^\dagger|n\rangle=\sqrt{n+1}\,|n+1\rangle, \tag{2.4}$$

且基态由 $\hat a|0\rangle=0$ 定义（最低态不能再降）。能量本征值：

$$\hat H|n\rangle=\hbar\omega\Big(n+\frac12\Big)|n\rangle\quad\Rightarrow\quad E_n=\hbar\omega\Big(n+\frac12\Big),\qquad n=0,1,2,\dots \tag{2.5}$$

能级**等间距** $\Delta E=\hbar\omega$，且含不可消除的零点能 $E_0=\tfrac12\hbar\omega$。这正是谐振子区别于所有其他一维束缚势的标志（方势阱能级随 $n^2$ 增长，见第 14 篇）。

### 2.5 坐标表象波函数与 Hermite 多项式

在 $\hat x$ 表象中，$\hat a\psi_0(x)=0$ 给出

$$\frac{1}{\sqrt{2\hbar m\omega}}(m\omega x+\hbar\partial_x)\psi_0(x)=0\quad\Rightarrow\quad \partial_x\ln\psi_0=-\frac{m\omega}{\hbar}x,$$

积分得 $\psi_0(x)=(\frac{m\omega}{\pi\hbar})^{1/4}e^{-m\omega x^2/(2\hbar)}$（高斯，最小不确定度波包）。递推 $\psi_n\propto (\hat a^\dagger)^n\psi_0$ 给出

$$\psi_n(x)=\frac{1}{\sqrt{2^n n!}}\Big(\frac{m\omega}{\pi\hbar}\Big)^{1/4} H_n(\xi)\,e^{-\xi^2/2},\qquad \xi=\sqrt{\frac{m\omega}{\hbar}}\,x, \tag{2.6}$$

其中 $H_n(\xi)$ 为物理学家约定的 Hermite 多项式（$H_0=1,\ H_1=2\xi,\ H_2=4\xi^2-2,\dots$）。该形式由 Schrödinger (1926b) 用级数法（要求幂级数截断为多项式）独立得到（见第 17 篇 2.5 节同类手法）。

## 三、物理量与特征尺度

| 物理量 | 表达式 | 量级与说明 |
|--------|--------|-----------|
| 特征长度 | $\ell=\sqrt{\hbar/(m\omega)}$ | 谐振子波函数的自然宽度；基态方差 $\langle x^2\rangle_0=\ell^2/2$ |
| 能级间距 | $\Delta E=\hbar\omega$ | 等间距，与 $n$ 无关 |
| 零点能 | $E_0=\tfrac12\hbar\omega$ | 基态不可消除的最小能量 |
| 基态不确定度 | $\Delta x_0=\sqrt{\hbar/(2m\omega)},\ \Delta p_0=\sqrt{m\hbar\omega/2}$ | $\Delta x_0\Delta p_0=\hbar/2$，正好达不确定关系下限 |
| 第 $n$ 态节点数 | $n$ | 波函数有 $n$ 个节点（与第 14 篇节点定理一致） |

**CODATA (2022) 数值举例**（常数取 2019 重新定义后的精确值 $\hbar=1.054\,571\,817\times10^{-34}\ \text{J·s}$，$c=299\,792\,458\ \text{m/s}$）：

- **双原子分子振动**（以 HCl 伸缩模为例，基频约 $2990\ \text{cm}^{-1}$）：能量 $E=hc\tilde\nu\approx 0.37\ \text{eV}$，对应 $\hbar\omega\sim 0.1\text{–}0.4\ \text{eV}$，落在中红外区——这正是红外吸收光谱的物理来源（第 45 篇）。
- **晶格声子**：典型光学支角频率 $\omega\sim 10^{13}\ \text{rad/s}$，故 $\hbar\omega\sim 10\text{–}60\ \text{meV}$（约 $80\text{–}500\ \text{cm}^{-1}$），是红外与 Raman 活性的主要能级标尺。
- **机械谐振子（经典极限检验）**：取 $m=1\ \text{mg}=10^{-6}\ \text{kg}$、$\omega=2\pi\times10^3\ \text{rad/s}$（1 kHz），则 $\hbar\omega\approx 6.6\times10^{-31}\ \text{J}\approx 4\times10^{-12}\ \text{eV}$。相比室温热涨落 $k_B T\approx 0.025\ \text{eV}$（$T=300\ \text{K}$），零点能小约 10 个数量级，完全被淹没——这是为何宏观弹簧振子呈现纯经典行为的根源。

> 数值使用原则：所有能量均标注量级与典型范围（不确定度主要来自实际势的非谐性，将在第 19 篇微扰论中以 $\sim 1\%$ 量级修正）；常数一律回溯 CODATA (2022)，不转引二手数值。

## 四、实验基础与观测证据

1. **分子振动光谱（红外吸收）**。偶极跃迁选择定则要求 $\langle n'|\hat x|n\rangle\neq 0$，由 2.4 节升降算符作用得仅 $\Delta n=\pm 1$ 允许，吸收峰间距恰为 $\hbar\omega$。对 HCl 实测基频 $\sim 2990\ \text{cm}^{-1}$（与第三节理论值吻合至非谐修正量级）。这是谐振子能级最直接的实验证据。

2. **零点能的宏观可测后果——Casimir 效应**（Casimir 1948）。两片完美导体平行板（间距 $a$）改变了电磁场真空零点能的模态密度，产生吸引力

   $$\frac{F}{A}=-\frac{\pi^2\hbar c}{240\,a^4}. \tag{4.1}$$

   代入 $\hbar c=197.3\ \text{eV·nm}$，当 $a=10\ \text{nm}$ 时获得压力约 $1.3\times10^5\ \text{Pa}\approx 1.3\ \text{atm}$（与科普文献"10 nm 间隙产生约 1 个大气压压力"一致）；$a=100\ \text{nm}$ 时降至约 $13\ \text{Pa}$。这是零点能"不是数学虚构"的判决性实验（实验确认见 Decca et al. 2007 等）。

3. **振动 Raman 散射**。斯托克斯线与反斯托克斯线关于瑞利线的对称间距等于谐振子能级间距；实际分子因非谐性略有偏移（提供第 19 篇微扰论的实验舞台）。

4. **囚禁离子与冷原子**。单个 $\,^{9}\text{Be}^+$ 在 Paul 阱中的轴向振动模就是量子谐振子，实验已制备 Fock 态 $|n\rangle$（确定粒子数）与相干态（见第五节），直接验证能级等间距与零点能（Wineland 等，诺贝尔奖 2012）。

5. **超导电路**。LC 振荡器在低温下量子化，其能级为谐振子谱，是超导量子比特的物理载体（第 36 篇）。

## 五、分类体系与物理机制

### 5.1 形态分类

| 类型 | 哈密顿特征 | 简并度 | 典型物理载体 |
|------|-----------|--------|-------------|
| 一维 | $\tfrac12 m\omega^2 x^2$ | 无 | 双原子分子振动、单离子振动模 |
| 各向同性 $d$ 维 | $\sum_i\tfrac12 m\omega^2 x_i^2$ | $n+d-1\choose d-1$ | 三维各向同性陷阱（冷原子） |
| 各向异性 | 频率 $\omega_i$ 不同 | 仅当频率可公约时简并 | 分子弯曲/伸缩不同模 |
| 耦合谐振子 | $\tfrac12\sum m_{ij}\dot q_i\dot q_j+\tfrac12\sum k_{ij}q_i q_j$ | — | 晶格振动（简正模） |

### 5.2 耦合谐振子与声子

对 $N$ 个耦合谐振子，经简正坐标变换 $Q_\alpha=\sum_i U_{\alpha i}q_i$ 可解耦为 $N$ 个独立谐振子，频率 $\Omega_\alpha$。每个独立模的量子即**声子（phonon）**——这是固体物理（第 24 篇）的基石：晶格热容、电声相互作用、超导 BCS 配对均建立在"振动 = 大量谐振子"之上。

### 5.3 相干态：最接近经典的量子态

由位移算符作用于基态定义

$$|\alpha\rangle=e^{-|\alpha|^2/2}\sum_{n=0}^\infty\frac{\alpha^n}{\sqrt{n!}}|n\rangle=D(\alpha)|0\rangle,\qquad D(\alpha)=e^{\alpha\hat a^\dagger-\alpha^*\hat a}. \tag{5.1}$$

它是湮灭算符的本征态：$\hat a|\alpha\rangle=\alpha|\alpha\rangle$（$\alpha$ 为复本征值，体现"过完备"）。关键性质：

- **最小不确定度**：$\Delta x=\Delta x_0,\ \Delta p=\Delta p_0$，与基态相同，故 $\Delta x\Delta p=\hbar/2$ 达下限；
- **不扩散**：在谐振子势中 $|\alpha(t)\rangle=e^{-i\omega t/2}|\alpha e^{-i\omega t}\rangle$，波包中心沿经典椭圆轨道运动，**宽度恒等于基态宽度**（高斯波包不扩散）；
- **经典极限**：大 $|\alpha|$ 时 $\langle n\rangle=|\alpha|^2\gg1$，相对涨落 $\Delta n/\langle n\rangle=1/\sqrt{\langle n\rangle}\to 0$，完全恢复经典振动。

相干态由 Schrödinger (1926a) 为"满足对应原理"最早构造；长期被忽视，直至 Glauber (1963) 在量子光学中重新建立其理论地位（也称 Glauber 相干态），Sudarshan (1963) 给出其对角表示（光学等价定理 / P 表示）。注意 Glauber 获 2005 年诺奖，而 Sudarshan 的贡献长期存在归属争议（见第七节）。

### 5.4 压缩态与数态

- **压缩态** $S(\zeta)|\alpha\rangle$：一个正交方向不确定度低于真空、另一个高于，总乘积仍守 $\Delta x\Delta p\ge\hbar/2$；用于引力波探测（LIGO）压低量子噪声。
- **Fock 态（数态）** $|n\rangle$：粒子数确定，无经典对应；是量子光学与冷原子实验制备的基本资源。

### 5.5 与宝石学的交叉（指向第六部分）

- **晶格振动的红外/拉曼活性**：宝石矿物的分子/晶格振动在谐振子近似下给出特征能级，非谐修正（第 19 篇）决定谱线位置与带宽；方解石、刚玉的晶格模均在此框架。
- **色心的局域振动模**：NV 中心、F 心等点缺陷引入局域谐振子模，其能级出现在红外区，是缺陷鉴定的指纹。
- **零点振动与低温比热**：Debye 模型将低温固体的晶格振动视为声子气体，零点能贡献于绝对零度仍残留的振动能。

## 六、典型系统与可解模型

1. **波动力学级数解**（Schrödinger 1926b, Ann. Phys. 80, 437–490）。令 $\psi(\xi)=u(\xi)e^{-\xi^2/2}$，代入定态方程得 Hermite 方程 $u''-2\xi u'+2nu=0$；要求 $u$ 为多项式（否则波函数不平方可积）迫使 $n$ 为非负整数——与代数法的 $n\in\mathbb N$ 自洽。

2. **代数法（升降算符）**：见第二节，是 Dirac (1927, 1958) 建立的范式，也是全册使用算符代数的样板。

3. **相干态演化的闭式验证**：取 $|\alpha\rangle$ 在 $t=0$，则 $|\alpha,t\rangle=e^{-i\hat Ht/\hbar}|\alpha\rangle=e^{-i\omega t/2}|\alpha e^{-i\omega t}\rangle$。其坐标概率密度

   $$|\langle x|\alpha,t\rangle|^2=\frac{1}{\sqrt{\pi}\ell}\exp\!\Big[-\frac{(x-2\ell\,\mathrm{Re}(\alpha e^{-i\omega t}))^2}{\ell^2}\Big], \tag{6.1}$$

   高斯宽度恒为 $\ell$（与 $t$ 无关）——"不扩散"得证。配套脚本用前 $N\approx 40$ 项 Hermite 基展开数值验证此宽度不变。

4. **各向同性高维谐振子**：能级 $E_{n_r,l}=\hbar\omega(2n_r+l+\tfrac32)$（$n_r$ 径向、$l$ 角动量），简并度随总量子数增长——是氢原子简并的"镜像"（第 17 篇）。

5. **简谐近似作为通用方法**：对任意势 $V(x)$，在极小点取 $V''(x_0)$ 即得有效 $\omega_\text{eff}=\sqrt{V''(x_0)/m}$，谐振子解给出零级近似，微扰论（第 19 篇）处理高阶项。

## 七、历史脉络与学术争议

- **代数法的起源**：Dirac (1927) 在《辐射的发射与吸收量子理论》（Proc. R. Soc. A 114, 243）中首次引入产生/湮灭算符，用于电磁场的二次量子化；随后在《量子力学原理》（第 IV 章 §34）用阶梯算符解出谐振子谱。这是"算符代数优先于波函数"路线的里程碑。
- **波动力学解**：Schrödinger (1926b) 第三篇论文用级数法独立解出 Hermite 多项式形式，与矩阵/代数路线殊途同归（等价性见 Schrödinger 1926 第四篇，即第 12 篇引用的 24bx）。
- **相干态的沉浮**：Schrödinger (1926a) 在《从微观力学到宏观力学的连续过渡》（Naturwiss. 14, 664）中为回应 Lorentz"波函数静止、不显示经典运动"的质疑，构造了不扩散的高斯波包（即今相干态），但文中未用"coherent"一词，长期被忽视。1963 年 Glauber 在量子光学中重建其理论；Sudarshan (1963) 同年的 P 表示为量子光学奠定严格基础。两者贡献的归属在 2005 年诺奖后引发持续争议（Sudarshan 方认为 P 表示应称 Sudarshan 表示）。
- **零点能的哲学争议**：Pauli 在 1945 年诺贝尔演讲中称"零点能无物理实在"；Casimir (1948) 给出可测的吸引力后，零点能被广泛接受为真空涨落后果。但"为什么真空零点能不表现为巨大的宇宙学常数"至今是理论物理未解问题（属第五部分前沿），本篇不展开。
- **从单粒子到场**：二次量子化将"一个粒子的振动"升格为"场的无穷多自由度，每点一个谐振子"，谐振子由此成为量子场论（第 40 篇）的基本构件。这是它超越"一维习题"、贯穿全册的根本原因。

<script>
// 在 markdown 解析前抽出公式，用占位符保护，避免被 marked 当成强调语法破坏
function protectMath(src){
  var blocks = [];
  // 先抽块级 $$...$$（可跨行）
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, function(m){
    blocks.push(m);
    return '%%MATH' + (blocks.length - 1) + '%%';
  });
  // 再抽行内 $...$（不含换行、内部不含 $）
  src = src.replace(/\$([^\$\n]+?)\$/g, function(m){
    blocks.push(m);
    return '%%MATH' + (blocks.length - 1) + '%%';
  });
  return { src: src, blocks: blocks };
}

function boot(){
  var raw = document.getElementById('src').textContent;
  // 记录标题锚点（在保护公式之前，避免影响）
  var md = raw.replace(/^(#{1,3})\s+(.+)$/gm, function(m, h, t){
    var id = 'h-' + t.replace(/[^\w一-龥]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
    return h + ' <span id="' + id + '"></span>' + t;
  });

  // 保护数学公式
  var prot = protectMath(md);
  md = prot.src;

  document.getElementById('content').innerHTML = marked.parse(md);

  // 还原数学公式占位符
  var content = document.getElementById('content');
  var html = content.innerHTML.replace(/%%MATH(\d+)%%/g, function(m, n){
    return prot.blocks[+n];
  });
  content.innerHTML = html;

  // 生成目录
  var hs = document.querySelectorAll('#content h2, #content h3');
  var toc = document.getElementById('toc'), tocHtml = '';
  hs.forEach(function(h){
    var sp = h.querySelector('span[id]');
    var id = sp ? sp.id : '';
    var cls = h.tagName === 'H3' ? 'sub' : '';
    tocHtml += '<a class="' + cls + '" href="#' + id + '">' + h.textContent.trim() + '</a>';
  });
  toc.innerHTML = tocHtml;

  // 图片路径：正文里写 figures/xxx.svg
  document.querySelectorAll('#content img').forEach(function(im){
    if(/^figures\//.test(im.getAttribute('src')||'')) return;
  });

  if (window.renderMathInElement) {
    renderMathInElement(document.getElementById('content'), {
      delimiters:[
        {left:'$$', right:'$$', display:true},
        {left:'$',  right:'$',  display:false}
      ],
      ignoredTags:['script','noscript','style','textarea','pre','code'],
      throwOnError:false
    });
  }

  // 滚动高亮
  var links = [].slice.call(toc.querySelectorAll('a'));
  window.addEventListener('scroll', function(){
    var cur = null;
    hs.forEach(function(h){
      if (h.getBoundingClientRect().top < 120) cur = h;
    });
    links.forEach(function(a){ a.classList.remove('active'); });
    if (cur){
      var sp = cur.querySelector('span[id]');
      var act = toc.querySelector('a[href="#' + (sp?sp.id:'') + '"]');
      if (act) act.classList.add('active');
    }
  }, {passive:true});
}
if (window.marked) boot();
else window.addEventListener('load', boot);
</script>
