<script type="text/plain" id="src"># 全同粒子

> **分类归属：第三部分·多体、对称与凝聚态 · 数学程度：L3 · 前置依赖：第 9 篇《量子态与叠加原理》、第 16 篇《角动量与自旋》**
> **验证依据**：Pauli (1925) Z. Phys.、Pauli (1940) Phys. Rev.、Einstein (1924/1925) Sitzber. Preuss. Akad.、Hong, Ou & Mandel (1987) PRL、Bose (1924) Z. Phys.、Fermi (1926) Z. Phys.、Dirac (1926) Proc. R. Soc. A、Sakurai & Napolitano (2011)、Feynman Lectures Vol. III Ch. 4

---

## 一、概念与定位

**全同粒子（identical particles）** 指内禀属性——质量、电荷、自旋、全部量子数——完全相等的粒子。在经典力学中即便两颗粒子属性相同，仍可凭轨迹「贴上标签」跟踪各自位置；在量子力学中，由于波函数的空间延展与海森堡不确定关系，对微观全同粒子**不可能**在任意时刻指明「哪一个是哪一个」，其标记在原则上是不可操作的。全同粒子不可区分性（indistinguishability）因此不是实验精度的局限，而是对称性约束的推论。

名称词源：英文 *identical* 源自拉丁 *identicus*（同一的）；德文 *ununterscheidbar*（不可区分）。泡利不相容原理（Pauli-Ausschließungsprinzip）由 Wolfgang Pauli 于 1925 年作为经验规则提出，最初用以解释原子壳层填充，后经自旋-统计定理升格为相对论性量子场论的必然结论。

本篇需抓住的核心特征：

1. **交换不变性**：交换任意两个全同粒子的位置（与自旋），全部可观测量（哈密顿量、概率密度、任何算符期望值）保持不变。由此波函数只能是交换对称（本征值 +1）或交换反对称（本征值 −1），不存在其他相因子。
2. **玻色子与费米子的二分**：整数自旋（0, 1, 2, …）粒子构成对称态，称玻色子（boson）；半整数自旋（1/2, 3/2, …）粒子构成反对称态，称费米子（fermion）。
3. **泡利不相容原理**：两个全同费米子不能占据同一个单粒子量子态。这是波函数反对称性的直接代数后果，而非粒子间的动力学排斥力。
4. **自旋-统计定理**：自旋与统计的对应不是独立假设。在相对论性定域量子场论中，半整数自旋必然配费米-狄拉克统计、整数自旋必然配玻色-爱因斯坦统计（Pauli 1940）。反方向（无自旋的费米子、有自旋的玻斯子）在因果性要求下被排除。
5. **宏观可观测后果**：玻色子可在低温度处凝聚到同一单粒子基态（玻色-爱因斯坦凝聚，BEC），费米子则因反对称被「撑开」，形成简并费米压——这是白矮星、中子星免于引力坍缩的微观支撑。

本主题在体系中的位置：它是多体量子理论的第一道分水岭，向下衔接第 9 篇（叠加）、第 16 篇（自旋），向上通向第 22 篇（多电子原子）、第 23 篇（分子键）、第 24 篇（能带）、第 26 篇（量子统计），是第三部分全部内容的公共前提。

## 二、数学结构

**符号约定声明**：本篇采用 SI 单位制，ħ 与 2π 显式保留；傅里叶变换采用 $f(\mathbf{k})=(2\pi)^{-3/2}\int d^3r\,e^{-i\mathbf{k}\cdot\mathbf{r}}f(\mathbf{r})$ 的对称约定；度规为 $(+,-,-,-)$。二次量子化仅在第六节作概念交代，主推导使用第一量子化（坐标表象）。

### 2.1 交换算符与本征态

对 $N$ 个全同粒子系统，第 $i,j$ 个粒子的坐标-自旋交换算符 $\hat P_{ij}$ 作用在波函数上满足 $\hat P_{ij}\psi(\dots,\mathbf{r}_i,s_i,\dots,\mathbf{r}_j,s_j,\dots)=\psi(\dots,\mathbf{r}_j,s_j,\dots,\mathbf{r}_i,s_i,\dots)$。由于交换两次回到原态，$(\hat P_{ij})^2=\hat 1$，故其本征值仅为 $\lambda=\pm 1$。物理态必须是 $\hat P_{ij}$ 的本征态（否则交换操作会把它变成另一个物理上不可区分却不同的态，与全同性矛盾）。

对两粒子情形，以空间-自旋乘积 $\psi_a(\mathbf{r}_1)\psi_b(\mathbf{r}_2)$ 为基，对称化与反对称化投影为

$$
\psi_{\pm}(\mathbf{r}_1,\mathbf{r}_2)=\frac{1}{\sqrt{2(1\pm|\langle a|b\rangle|^2)}}\,
\bigl[\psi_a(\mathbf{r}_1)\psi_b(\mathbf{r}_2)\pm \psi_a(\mathbf{r}_2)\psi_b(\mathbf{r}_1)\bigr].
\tag{1}
$$

| 符号 | 含义 | 量纲 |
|------|------|------|
| $\psi_\pm$ | 对称（+）/反对称（−）双粒子态 | 长度$^{-3}$ |
| $\psi_a,\psi_b$ | 单粒子空间-自旋波函数 | 长度$^{-3/2}$ |
| $\hat P_{ij}$ | 交换第 $i,j$ 粒子坐标与自旋的算符 | 无量纲 |
| $\langle a\|b\rangle$ | 单粒子态 $a,b$ 的重叠积分 | 无量纲 |

当 $a=b$ 且取反对称时，式 (1) 分子为 $\psi_a(\mathbf{r}_1)\psi_a(\mathbf{r}_2)-\psi_a(\mathbf{r}_2)\psi_a(\mathbf{r}_1)\equiv 0$——这正是泡利不相容原理在两体层面的直接体现：**反对称要求同一单粒子态不能容纳两个全同费米子**。

### 2.2 Slater 行列式（N 费米子）

将两体反对称推广到 $N$ 个费米子，用 $N$ 个单粒子轨道 $\{\phi_k\}$ 构造 Slater 行列式

$$
\Psi(\mathbf{r}_1,\dots,\mathbf{r}_N)=\frac{1}{\sqrt{N!}}
\begin{vmatrix}
\phi_1(\mathbf{r}_1) & \phi_2(\mathbf{r}_1) & \cdots & \phi_N(\mathbf{r}_1)\\
\phi_1(\mathbf{r}_2) & \phi_2(\mathbf{r}_2) & \cdots & \phi_N(\mathbf{r}_2)\\
\vdots & \vdots & & \vdots\\
\phi_1(\mathbf{r}_N) & \phi_2(\mathbf{r}_N) & \cdots & \phi_N(\mathbf{r}_N)
\end{vmatrix}.
\tag{2}
$$

行列式任意两行相同即为零，故任意两个费米子占据同一单粒子轨道时总态恒为零。玻色子则改为对称化积（ permanents，无负号），允许多个乃至全部占据同一轨道。

### 2.3 自旋-统计定理（陈述与证明思路）

**定理（Pauli 1940）**：在四维闵可夫夫斯基时空中，满足微观因果性（类空间隔 $[\hat\phi(x),\hat\phi^\dagger(y)]_\mp=0$）的定域相对论性量子场论，其整数自旋场必满足对易关系（玻色统计）、半整数自旋场必满足反对易关系（费米统计）。

完整证明需引入洛伦兹群的表示论与定域场的 CPT 结构，已超出本篇 L3 推导边界；其逻辑链为：场按自旋属于洛伦兹群的 $(A,B)$ 表示 → 定域性要求类空间隔的对易子为零 → 结合谱条件与能量正定性，可证若整数自旋场取反对易（或半整数取对易）会破坏因果性或产生负概率。本篇仅记结论并标注其为相对论性结构，而非非相对论量子力学的独立公理。

### 2.4 二次量子化视角（概念交代）

在二次量子化中，全同粒子的对称性由产生/湮灭算符的对易关系内禀编码：玻色子 $\bigl[\hat a_\alpha,\hat a_\beta^\dagger\bigr]=\delta_{\alpha\beta}$，费米子 $\{\hat c_\alpha,\hat c_\beta^\dagger\}=\delta_{\alpha\beta}$。反对易关系的反对易子出现，自动保证 $(\hat c_\alpha^\dagger)^2=0$——同一模式至多一个费米子，即不相容原理被算符代数吸收。这一形式在第三部分后续各篇（尤其第 26 篇量子统计）是标准语言。

## 三、物理量与特征尺度

自由电子气（三维均匀正电荷背景中的 $N$ 个无相互作用电子，密度 $n=N/V$）给出最干净的特征尺度。单粒子色散 $\varepsilon(k)=\hbar^2k^2/2m$，绝对零度下费米球填满至费米波矢 $k_F=(3\pi^2 n)^{1/3}$。

| 物理量 | 符号 | 数值/量级 | 适用条件 |
|--------|------|-----------|---------|
| 费米波矢 | $k_F=(3\pi^2 n)^{1/3}$ | 铜 $n=8.49\times10^{28}\,\mathrm{m^{-3}}$ → $k_F=1.36\times10^{10}\,\mathrm{m^{-1}}$ | 简并费米气体，T≪T_F |
| 费米能 | $E_F=\hbar^2k_F^2/2m_e$ | 铜 $E_F\approx 7.0\ \mathrm{eV}$；Al ≈ 11.7 eV；典型金属 2–11 eV | 自由电子气近似，T→0 |
| 费米速度 | $v_F=\hbar k_F/m_e$ | 铜 $v_F\approx 1.57\times10^6\ \mathrm{m/s}$ | 费米面电子 |
| 费米温度 | $T_F=E_F/k_B$ | 铜 $T_F\approx 8.2\times10^4\ \mathrm{K}$ | 简并条件 $T\ll T_F$ |
| 热德布罗意波长 | $\lambda_T=h/\sqrt{2\pi m k_B T}$ | 电子在 300 K：$\lambda_T\approx 4.3\ \mathrm{nm}$ | 量子简并判据 |
| 简并压（零温） | $P_F=(2/5)nE_F$ | 白矮星 $\sim10^{23}\ \mathrm{Pa}$ 量级 | 电子简并压支撑 |

**量子简并判据**：当热德布罗意波长 $\lambda_T$ 与平均粒子间距 $d=n^{-1/3}$ 可比拟（$\lambda_T/d\gtrsim 1$）时，波函数显著重叠，全同粒子统计效应主导。金属的 $T_F\sim10^4\!-\!10^5\ \mathrm{K}\gg 300\ \mathrm{K}$，故室温下电子气已深度简并；而光子气体因玻色子无粒子数守恒，无费米温度概念。

常数取值（CODATA 2022，不确定度括号内）：
- $m_e=9.1093837015(28)\times10^{-31}\ \mathrm{kg}$；
- $\hbar=1.054571817\times10^{-34}\ \mathrm{J\cdot s}$（精确，2019 重新定义后）；
- $k_B=1.380649\times10^{-23}\ \mathrm{J/K}$（精确）。

## 四、实验基础与观测证据

### 4.1 决定性实验：Hong–Ou–Mandel 双光子聚束（1987）

Hong、Ou、Mandel 将两个**全同**单光子分别从 50:50 分束器的两臂同时入射（时间延迟 $\tau$ 可调）。若两光子不可区分，量子振幅在两输出端发生 destructive interference，使得「两探测器各收到一个光子」的符合计数率在 $\tau=0$ 处坍陷为零——它们总是一起从同一端输出（聚束，bunching）。符合率随延迟

$$
R_c(\tau)=\frac{1}{2}\Bigl[1-|\,g^{(1)}(\tau)|^2\Bigr],\qquad g^{(1)}(\tau)=\int d\omega\,S(\omega)\,e^{-i\omega\tau},
\tag{3}
$$

其中 $S(\omega)$ 为谱包络。对理想单模全同光子 $|g^{(1)}(0)|^2=1$，故 $R_c(0)=0$，干涉可见度 $V=1$。若两个光子**不**全同（例如正交偏振或不同频率），干涉项消失，$R_c(0)=1/2$，可见度 $V=0$。该实验把「全同性」从一个哲学前提变成了可由可见度 0 与 1 直接读数的可观测量。

> **常见误读纠正**：泡利不相容原理常被通俗解释为「两个电子互相排斥所以不共处一态」。严格地说，反对称约束是波函数在交换下的几何/拓扑性质，与库仑排斥无关——即便去掉所有相互作用，两个费米子仍不能同态。简并压同样来自泡利阻塞（phase-space 填满）而非电斥力。

### 4.2 原子壳层结构：泡利原理的宏观指纹

元素周期表的周期性（稀有气体的闭壳层、碱金属的单价）无法由任何动力学排斥解释，只能由「每个单粒子轨道至多容纳一个费米子（计及自旋两态）」推出。这是泡利原理在凝聚态尺度的直接、可重复证据（见第 22 篇）。

### 4.3 费米简并压：天文尺度的验证

白矮星的质量-半径关系（钱德拉塞卡极限 $\sim1.44\,M_\odot$）由电子简并压支撑，与恒星温度几乎无关；中子星由中子简并压支撑。观测到的白矮星与中子星质量上限与简并费米气体理论吻合，间接但强有力地证实了费米子反对称性的宏观后果。

### 4.4 里程碑实验时间线

| 年份 | 人物/实验 | 体系 | 关键结果 |
|------|-----------|------|---------|
| 1927 | Davisson–Germer / 电子衍射 | 电子 | 电子的波动性，全同性成为后续必要概念 |
| 1987 | Hong, Ou & Mandel | 双光子分束器 | 全同光子可见度 $V=1$ 聚束，$V=0$ 非全同 |
| 1995 | Anderson et al. (JILA) / Davis et al. | $^{87}\mathrm{Rb}$ 蒸发冷却 | 首次观测 BEC（玻色子全同性的正向凝聚证据） |
| 2001 | 费米气体 BEC 交叉（DeMarco & Jin） | $^{40}\mathrm{K}$ | 简并费米气体直接观测，费米面与泡利阻塞 |

## 五、分类体系与物理机制

| 类别 | 自旋 | 统计 | 多体态对称 | 典型实例 | 宏观行为 |
|------|------|------|-----------|---------|---------|
| 玻色子 | 0,1,2,… | 玻色-爱因斯坦 | 对称（+） | 光子、$^4\mathrm{He}$、声子、介子 | 可凝聚（BEC）、聚束 |
| 费米子 | 1/2,3/2,… | 费米-狄拉克 | 反对称（−） | 电子、质子、中子、$^3\mathrm{He}$、夸克 | 简并压、泡利阻塞、反聚束 |

**机制链条**：交换对称性 → 双粒子概率密度多出交换干涉项 $\pm 2\operatorname{Re}[\psi_a^*(\mathbf{r}_1)\psi_b^*(\mathbf{r}_2)\psi_a(\mathbf{r}_2)\psi_b(\mathbf{r}_1)]$。玻色子取 + 号，在 $\mathbf{r}_1\approx\mathbf{r}_2$ 处概率被增强（聚束）；费米子取 − 号，在 $\mathbf{r}_1\approx\mathbf{r}_2$ 处被压零（泡利阻塞）。这解释了 §4.1 的 HOM 可见度差异，也解释了金属中电子为何不全部坍缩到最低能带。

**概念辨析**：交换对称性常被误认为一种「力」。它不改变哈密顿量（无势能项），只限制允许的 Hilbert 子空间；可观测差异（BEC、简并压）全部来自波函数对称/反对称带来的干涉项与态空间体积，而非相互作用哈密顿量。

**适用范围与失效边界**：上述分类在相对论性定域场论框架内严格成立（自旋-统计定理）。在非相对论量子力学中，对称/反对称须作为额外输入假设（玻色/费米波函数假设）；试图在非相对论单粒子理论中「推导」自旋-统计会失败，这正是 Pauli 1940 必须引入相对论性的原因。

## 六、典型系统与可解模型

### 6.1 两费米子在无限深方势阱（解析可解）

一两维或一维双费米子系统，单粒子基态 $\phi_1$、第一激发 $\phi_2$。反对称总态（忽略自旋单态细节）

$$
\Psi_A(x_1,x_2)=\frac{1}{\sqrt{2}}\bigl[\phi_1(x_1)\phi_2(x_2)-\phi_1(x_2)\phi_2(x_1)\bigr].
\tag{4}
$$

两粒子均在基态的情形（同轨道）被反对称禁止；若强令共占，能量 $\sim2E_1$，但物理上为零概率。允许的最低组态是两粒子分占 $\phi_1,\phi_2$，总能量 $E_1+E_2$，比「假设可共占」高出交换能 $\Delta E\sim E_2-E_1$——这就是§5 交换项的能量体现。

### 6.2 自由电子费米气体（数值，附脚本）

三维均匀电子气，能级密度（单位体积单位能量）

$$
D(E)=\frac{(2m_e)^{3/2}}{2\pi^2\hbar^3}\,E^{1/2}\qquad(E\ge 0),
\tag{5}
$$

与 $E^{1/2}$ 成正比；费米能由 $\int_0^{E_F}D(E)dE=n$ 定出 $E_F=\hbar^2(3\pi^2 n)^{2/3}/2m_e$。脚本 `code/全同粒子_费米气体与HOM.py` 第一段代入铜的密度 $n=8.49\times10^{28}\,\mathrm{m^{-3}}$，数值复现 $E_F\approx 7.0\ \mathrm{eV}$、$k_F\approx 1.36\times10^{10}\,\mathrm{m^{-1}}$、$T_F\approx 8.2\times10^4\ \mathrm{K}$，并绘制态密度曲线标注 $E_F$（见 `figures/全同粒子_费米气体.svg`）。

### 6.3 Hong–Ou–Mandel 可见度（数值，附脚本）

脚本同文件第二段按式 (3) 取高斯谱包络 $S(\omega)\propto\exp[-(\omega-\omega_0)^2/2\sigma_\omega^2]$ 计算符合率 $R_c(\tau)$。全同光子（同偏振、同频）得 $R_c(0)=0$、可见度 $V=1.000$；非全同光子（正交偏振，干涉项为零）得 $R_c(0)=0.5$、可见度 $V=0.000$。结果见 `figures/全同粒子_HOM干涉.svg`，与 1987 实验结论一致（Hong, Ou & Mandel 1987, *PRL* 59, 2044）。

## 七、历史脉络与学术争议

**提出动机**：1920 年代初原子光谱的壳层规律（惰性气体闭壳层、碱金属单价）无法由经典轨道或玻尔模型解释。Pauli 在 1925 年研究碱金属双线结构时，发现必须引入一个四量子数（含后来称作「自旋」的内禀二值）并规定「同一原子中不能有两个电子具有完全相同的四个量子数」，方能解释周期表与 Zeeman 反常。此为不相容原理的经验起源（Pauli 1925, *Z. Phys.* 31, 765）。

**历史节点**：

| 年份 | 人物 | 贡献 | 文献 |
|------|------|------|------|
| 1924 | Bose | 光子统计推导 Planck 律 | *Z. Phys.* 26, 178 |
| 1924/1925 | Einstein | 将 Bose 统计推广到原子，预言 BEC | Sitzber. Preuss. Akad. (1924) 261; (1925) 3 |
| 1925 | Pauli | 不相容原理（经验） | *Z. Phys.* 31, 765 |
| 1926 | Fermi | 费米子统计分布 | *Z. Phys.* 36, 902 |
| 1926 | Dirac | 相对论波动方程给出反对称统计 | *Proc. R. Soc. A* 112, 661 |
| 1940 | Pauli | 自旋-统计定理（相对论性证明） | *Phys. Rev.* 58, 716 |
| 1987 | Hong, Ou & Mandel | 全同光子不可区分性的干涉验证 | *PRL* 59, 2044 |
| 1995 | Anderson et al. | 首次实验观测 BEC | *Science* 269, 198 |

**当前争议与开放问题**：
- **自旋-统计可否由非相对论原理推出**：Burgoyne (1958) 等给出弱定域性条件下的部分结果，但公认完整证明需相对论性因果性。存在「无自旋费米子」等玩具模型在 2+1 维任意子统计中打破对应，提示自旋-统计是四维时空的特殊性质。
- **任意子（anyon）**：在二维系统中，交换相因子可取任意 $e^{i\theta}$（θ 介于 0 与 π 之间），对应分数统计。分数量子霍尔效应（第 28 篇）中的准粒子即任意子。这并不推翻自旋-统计定理，而是表明定理的「整数/半整数二分」依赖空间维数为三。
- 各方立场均属已建立物理，争议仅在定理的最弱前提与低维推广，本篇不站队。

<script>
// 在 markdown 解析前抽出公式，用占位符保护，避免被 marked 当成强调语法破坏
function protectMath(src){
  var blocks = [];
  // 先抽块级 $$...$$（可跨行）
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, function(m){
    blocks.push(m);
    return '%%MATH' + (blocks.length - 1) + '%%';
  });
  // 再抽行内 $...$（不含换行、内部不含 $）
  src = src.replace(/\$([^\$\n]+?)\$/g, function(m){
    blocks.push(m);
    return '%%MATH' + (blocks.length - 1) + '%%';
  });
  return { src: src, blocks: blocks };
}

function boot(){
  var raw = document.getElementById('src').textContent;
  // 记录标题锚点（在保护公式之前，避免影响）
  var md = raw.replace(/^(#{1,3})\s+(.+)$/gm, function(m, h, t){
    var id = 'h-' + t.replace(/[^\w一-龥]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
    return h + ' <span id="' + id + '"></span>' + t;
  });

  // 保护数学公式
  var prot = protectMath(md);
  md = prot.src;

  document.getElementById('content').innerHTML = marked.parse(md);

  // 还原数学公式占位符
  var content = document.getElementById('content');
  var html = content.innerHTML.replace(/%%MATH(\d+)%%/g, function(m, n){
    return prot.blocks[+n];
  });
  content.innerHTML = html;

  // 生成目录
  var hs = document.querySelectorAll('#content h2, #content h3');
  var toc = document.getElementById('toc'), tocHtml = '';
  hs.forEach(function(h){
    var sp = h.querySelector('span[id]');
    var id = sp ? sp.id : '';
    var cls = h.tagName === 'H3' ? 'sub' : '';
    tocHtml += '<a class="' + cls + '" href="#' + id + '">' + h.textContent.trim() + '</a>';
  });
  toc.innerHTML = tocHtml;

  // 图片路径：正文里写 figures/xxx.svg
  document.querySelectorAll('#content img').forEach(function(im){
    if(/^figures\//.test(im.getAttribute('src')||'')) return;
  });

  if (window.renderMathInElement) {
    renderMathInElement(document.getElementById('content'), {
      delimiters:[
        {left:'$$', right:'$$', display:true},
        {left:'$',  right:'$',  display:false}
      ],
      ignoredTags:['script','noscript','style','textarea','pre','code'],
      throwOnError:false
    });
  }

  // 滚动高亮
  var links = [].slice.call(toc.querySelectorAll('a'));
  window.addEventListener('scroll', function(){
    var cur = null;
    hs.forEach(function(h){
      if (h.getBoundingClientRect().top < 120) cur = h;
    });
    links.forEach(function(a){ a.classList.remove('active'); });
    if (cur){
      var sp = cur.querySelector('span[id]');
      var act = toc.querySelector('a[href="#' + (sp?sp.id:'') + '"]');
      if (act) act.classList.add('active');
    }
  }, {passive:true});
}
if (window.marked) boot();
else window.addEventListener('load', boot);
</script>
