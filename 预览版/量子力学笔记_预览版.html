<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量子力学系统笔记 · 预览版</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
/* ===== 设计令牌：1:1 取自 GemologyNotes/Theme.swift ===== */
:root{
  --bg:#f7f5ef; --bg2:#ffffff; --bg3:#f0ece0; --bg4:#e4ddc8; --border:#d4cdb8;
  --gold:#a07c28; --gold2:#8a6520; --gold-dim:#b89848;
  --text:#2c2a25; --text-dim:#6b6659; --text-bright:#1a1814;
  --accent:#2563b8; --badge-blue-bg:rgba(37,99,184,.13);
  --purple:#a080c0;
  --crystal-bg1:#e8e2d0; --crystal-bg2:#d4ccb4; --ci-bg:rgba(255,253,246,.96);
  --overlay:rgba(0,0,0,.35); --shadow:rgba(0,0,0,.12);
}
[data-theme="dark"]{
  --bg:#1a1a1a; --bg2:#222222; --bg3:#2d2d2d; --bg4:#383838; --border:#404040;
  --gold:#c9a84c; --gold2:#e8c968; --gold-dim:#8a7235;
  --text:#d8d8d8; --text-dim:#909090; --text-bright:#f0f0f0;
  --accent:#4a9eff; --badge-blue-bg:rgba(74,158,255,.15);
  --purple:#a080c0;
  --crystal-bg1:#141414; --crystal-bg2:#1e1e1e; --ci-bg:rgba(26,26,26,.92);
  --overlay:rgba(0,0,0,.55); --shadow:rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"Noto Serif SC","Songti SC","Source Han Serif SC",Georgia,serif;
  background:var(--bg); color:var(--text); line-height:1.85; font-size:16px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}

/* ===== 侧栏（对齐 SidebarView：宽 260，分类标题金暗色 + 计数徽标） ===== */
.sidebar{
  width:260px;flex-shrink:0;background:var(--bg2);
  border-right:.5px solid var(--border);
  height:100vh;position:sticky;top:0;overflow-y:auto;
  display:flex;flex-direction:column;
  font-family:"Noto Sans SC","PingFang SC",sans-serif;
  padding:14px 0 6px;
}
.sidebar-scroll{flex:1;overflow-y:auto;padding:2px 0 10px}
.cat{padding:10px 0}
.cat-title{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:0 16px 6px;
  font-size:11px;font-weight:600;color:var(--gold-dim);
  letter-spacing:2px;
}
.cat-count{
  font-size:10px;color:var(--text-dim);letter-spacing:0;
  padding:1px 6px;background:var(--bg4);border-radius:99px;
}
.nav-item{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:7px 16px;border:none;background:none;text-align:left;
  color:var(--text-dim);font-size:13px;line-height:1.5;
  position:relative;
}
.nav-item .dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  background:var(--dot,#b8e2ff);
}
.nav-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .badge{
  font-size:9px;padding:1px 5px;border-radius:3px;flex-shrink:0;
  color:var(--accent);background:var(--badge-blue-bg);
}
.nav-item .badge.lvl{color:var(--purple);background:rgba(160,128,192,.12)}
.nav-item .lock{font-size:9px;opacity:.8;flex-shrink:0}
.nav-item.open{opacity:1}
.nav-item:not(.open){opacity:.35;cursor:default}
.nav-item.current{background:var(--bg3)}
.nav-item.current::before{
  content:"";position:absolute;left:0;top:0;bottom:0;
  width:3px;background:var(--gold);
}
.side-footer{
  border-top:.5px solid var(--border);
  padding:10px 16px;display:flex;align-items:center;gap:8px;
  color:var(--text-dim);font-size:12px;background:none;border-left:none;border-right:none;border-bottom:none;
  width:100%;
}
.side-footer .chev{margin-left:auto;font-size:9px}

/* ===== 正文区 ===== */
.doc-area{flex:1;min-width:0;overflow-y:auto;height:100vh}
.doc-inner{max-width:860px;margin:0 auto;padding:36px 34px 90px}

/* 属性面板（对齐 CrystalPanelView 的 crystal-info：金标题 + 属性键值网格） */
.crystal-panel{
  background:linear-gradient(180deg,var(--crystal-bg1),var(--crystal-bg2));
  border-radius:12px;padding:18px 20px 14px;margin-bottom:30px;
}
.ci-title{
  font-size:15px;font-weight:700;color:var(--gold);letter-spacing:1px;
  padding-bottom:8px;margin-bottom:10px;
  border-bottom:1px solid var(--gold-dim);
  display:flex;align-items:baseline;gap:8px;
}
.ci-title .ci-sub{font-size:11px;font-weight:400;color:var(--text-dim);letter-spacing:0}
.ci-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 16px}
.ci-k{font-size:12px;color:var(--text-dim);white-space:nowrap;font-family:"Noto Sans SC","PingFang SC",sans-serif}
.ci-v{font-size:13px;color:var(--text);min-width:0}

/* 正文排版（金色标题体系对齐宝石学源码 index.html） */
.doc h1{font-size:24px;color:var(--gold);font-weight:700;line-height:1.5;margin:6px 0 18px}
.doc h2{
  font-size:20px;color:var(--gold2);margin:46px 0 16px;padding-bottom:9px;
  border-bottom:1.5px solid var(--gold-dim);letter-spacing:.3px;
}
.doc h3{font-size:17px;color:var(--text-bright);margin:32px 0 12px}
.doc h4{font-size:15px;color:var(--text-bright);margin:24px 0 10px}
.doc p{margin:12px 0}
.doc strong{color:var(--gold2);font-weight:700}
.doc blockquote{
  border-left:3px solid var(--gold);background:var(--bg2);
  padding:12px 18px;margin:16px 0;border-radius:0 8px 8px 0;color:var(--text);
}
.doc blockquote p{margin:6px 0}
.doc ul,.doc ol{padding-left:26px;margin:12px 0}
.doc li{margin:5px 0}
.doc code{
  font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.86em;
  color:var(--accent);background:var(--bg3);padding:2px 6px;border-radius:4px;
}
.doc pre{
  background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:14px 16px;overflow-x:auto;margin:14px 0;
}
.doc pre code{background:none;color:var(--text);padding:0}
.doc table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
.doc th{background:var(--bg3);color:var(--text-bright);font-weight:600}
.doc th,.doc td{border:1px solid var(--border);padding:7px 11px;text-align:left;line-height:1.6}
.doc tr:nth-child(even) td{background:var(--bg2)}
.doc hr{border:none;border-top:1px solid var(--border);margin:30px 0}
.doc a{color:var(--accent);text-decoration:none}
.doc img{max-width:100%;height:auto}
.fig-slot{margin:18px 0;text-align:center}
.fig-slot svg{max-width:100%;height:auto;background:#fff;border-radius:8px}
[data-theme="dark"] .fig-slot svg{background:#ffffff}

/* 空态（对齐 ArticleView 的空态布局） */
.empty-state{
  min-height:60vh;display:flex;flex-direction:column;gap:12px;
  align-items:center;justify-content:center;text-align:center;padding:40px 20px;
}
.empty-state .icon{font-size:44px;color:var(--gold);line-height:1}
.empty-state .t1{font-size:22px;color:var(--text-bright)}
.empty-state .t2{font-size:13px;color:var(--text-dim);max-width:520px;line-height:1.9}

/* 移动端抽屉（对齐 RootView：<900pt 抽屉 280 + backdrop） */
.hamburger{
  display:none;position:fixed;top:14px;left:14px;z-index:40;
  width:38px;height:38px;border-radius:9px;border:1px solid var(--border);
  background:var(--bg2);color:var(--gold);font-size:17px;line-height:1;
}
.backdrop{display:none}
@media (max-width:900px){
  .hamburger{display:block}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;height:100%;z-index:50;
    width:280px;transform:translateX(-102%);transition:transform .25s ease;
    border-radius:0 16px 16px 0;
  }
  .sidebar.show{transform:translateX(0)}
  .backdrop.show{
    display:block;position:fixed;inset:0;background:var(--overlay);z-index:45;
  }
  .doc-area{height:auto;overflow:visible}
  .doc-inner{padding:64px 18px 80px}
}
</style>
</head>

: "#c9a84c", "level": "L2", "done": false, "planned": false, "desc": "拉曼散射与极化率、红外吸收与振动模式、荧光与磷光动力学、选择定则", "part": 6}, {"file": "note-46", "name": "46 · 矿物光学性质的第一性原理计算", "color": "#c9a84c", "level": "L3", "done": false, "planned": false, "desc": "介电张量的量子表达、Kubo 线性响应、双折射的从头算、DFT 方法", "part": 6}, {"file": "note-47", "name": "47 · 宝石学中的量子误用辨析", "color": "#c9a84c", "level": "L2", "done": false, "planned": false, "desc": "线性双折射能否产生纠缠、R 线是吸收还是发射、色心归属错误等常见误判", "part": 6}], "countText": "0/6篇", "kind": "part"}, {"title": "辅助文档", "files": [{"file": "序.md", "name": "序", "done": true, "kind": "aux", "color": "#c9a84c"}, {"file": "量子力学系统笔记整理规范.md", "name": "整理规范", "done": true, "kind": "aux", "color": "#c9a84c"}, {"file": "参考文献.md", "name": "参考文献", "done": true, "kind": "aux", "color": "#c9a84c"}, {"file": "修订记录.md", "name": "修订记录", "done": true, "kind": "aux", "color": "#c9a84c"}, {"file": "README.md", "name": "README", "done": true, "kind": "aux", "color": "#c9a84c"}], "countText": "5篇", "kind": "aux"}], "articles": {"note-30": "# EPR佯谬与贝尔不等式（EPR Paradox and Bell Inequalities）系统量子力学笔记\n\n> **分类归属：第四部分 量子信息与量子光学 · 数学程度：L2（运算层）· 前置依赖：第 9 篇《量子态与叠加原理》、第 11 篇《希尔伯特空间与狄拉克符号》、第 16 篇《角动量与自旋》、第 29 篇《量子纠缠》**\n> **验证依据**：Einstein, Podolsky & Rosen (1935) *Phys. Rev.* 47, 777、Bohr (1935) *Phys. Rev.* 48, 696、Bohm & Aharonov (1957) *Phys. Rev.* 108, 1070、Bell (1964) *Physics* 1, 195、Clauser, Horne, Shimony & Holt (1969) *PRL* 23, 880、Freedman & Clauser (1972) *PRL* 28, 938、Aspect, Grangier & Roger (1982) *PRL* 49, 91、Aspect, Dalibard & Roger (1982) *PRL* 49, 1804、Cirel'son (1980) *Lett. Math. Phys.* 4, 93、Weihs et al. (1998) *PRL* 81, 5039、Rowe et al. (2001) *Nature* 409, 791、Hensen et al. (2015) *Nature* 526, 682、Giustina et al. (2015) *PRL* 115, 250401、Shalm et al. (2015) *PRL* 115, 250402、Tan, Walls & Collett (1991) *PRL* 66, 252、CODATA (2022)、Feynman Lectures Vol. III, §18-3\n\n---\n\n## 一、概念与定位\n\n### 1.1 定义\n\nEPR 佯谬与贝尔不等式是**同一个问题的两个阶段**：EPR 佯谬（1935）是一个论证，其结论为\"量子力学对物理实在的描述不完备\"；贝尔定理（1964）则把这个形而上学层面的争论，转化为一个**可用实验测量的数值不等式**——任何满足定域性与实在性假设的理论，其可测关联必须落在一个数值界限内，而量子力学预言关联会超出该界限。\n\n一句话概括其核心：\n\n> **存在这样的量子态，其两部分之间的统计关联强于任何\"定域 + 实在\"模型所能产生的关联，且这一超出已被实验反复确认。**\n\n### 1.2 名称由来\n\n- **EPR**：Einstein-Podolsky-Rosen 三人姓氏首字母。1935 年 5 月发表于《Physical Review》，题为 *Can Quantum-Mechanical Description of Physical Reality Be Considered Complete?*（*Phys. Rev.* 47, 777–780）。\n- **\"佯谬\"（paradox）**：这个译名在 Bell 之后其实已经名不副实。EPR 提出的是一个\"二难\"：要么承认量子力学不完备，要么承认存在超距作用。Bell 的贡献恰恰在于指出——**这不是二难，而是可判定的**。现代文献中 \"EPR paradox\" 一词保留，指的是历史论证本身，而非未解决的矛盾。\n- **纠缠（Verschränkung / entanglement）**：薛定谔在 1935 年回应 EPR 的文章中造出该词，用以描述 EPR 论证所暴露的那种\"两个系统无法分别描述\"的状态（卷期页详见第 29 篇《量子纠缠》）。\n- **Bell 不等式**：Bell (1964) 原文题为 *On the Einstein Podolsky Rosen Paradox*。此后凡是\"由定域实在论推出的、可被量子力学违反的关联约束\"都被泛称为 Bell 不等式，形成一个不等式家族（CHSH、CH74、Eberhard、链式不等式等）。\n- **CHSH**：Clauser、Horne、Shimony、Holt 四人姓氏首字母，是最常用的实验形式。\n\n### 1.3 核心特征\n\n1. **把哲学问题变成数值问题**。这是本主题最本质的辨识度。在 Bell 之前，\"量子力学是否完备\"是一个无法诉诸实验的争论；Bell 之后，它变成一个可以写进实验方案的数字：$S \\le 2$ 还是 $2\\sqrt{2}$。\n\n2. **一个论证 vs 一个定理 vs 一个不等式，三者不可混同**。EPR 是**论证**（推出\"不完备\"）；Bell 定理是**定理**（定域隐变量理论与量子预言不相容）；Bell/CHSH 不等式是**可检验的约束条件**。日常语言中\"EPR 佯谬\"常被用来指代全部三者，需要按上下文分辨。\n\n3. **结论是\"否定一个合取\"，不是\"肯定某一个\"**。实验违反 Bell 不等式，排除的是\"定域性 ∧ 实在性 ∧ 测量选择独立\"这个整体，而非其中某一项。放弃其中任何一项都能与实验相容——这是各种诠释的分歧所在（详见第七节）。\n\n4. **三层数值界限构成一个尺度阶梯**：\n\n   | 界限 | 数值 | 来源 |\n   |------|------|------|\n   | 定域隐变量界 | \\|S\\| ≤ 2 | 由定域性 + 实在性推出 |\n   | Tsirelson 界（量子上限） | \\|S\\| ≤ 2√2 ≈ 2.828 | 量子力学自身的形式结构 |\n   | 无信号代数上限 | \\|S\\| ≤ 4 | 仅要求不超光速传信 |\n\n   量子力学达到 2√2 而非 4，意味着**量子关联虽强于经典，却并非\"最强可能的非定域关联\"**。为什么恰好停在 2√2，至今仍是开放问题（见 7.3）。\n\n5. **违反 Bell 不等式不等于可以超光速通信**。关联的强度与信号的可控性是两个不同概念；量子力学满足无信号条件（见 2.8），Bell 违反与狭义相对论并不冲突。\n\n6. **它是量子信息科学的实验基石**。器件无关（device-independent）的量子密钥分发、随机数认证、纠缠检测，其安全性论证最终都归结到\"观测到了 Bell 违反\"这一事实。2022 年诺贝尔物理学奖授予 Aspect、Clauser、Zeilinger，理由正是\"以纠缠光子实验确立 Bell 不等式的违反，并开创量子信息科学\"。\n\n### 1.4 在本套笔记体系中的位置\n\n**前置依赖**：需要第 9 篇的叠加原理与第 11 篇的张量积空间（复合系统的态空间），第 16 篇的自旋 1/2 与泡利矩阵（构造具体的 Bell 态与测量算符），以及第 29 篇的纠缠定义（本篇只使用\"不可分态\"这一概念，纠缠的判据与度量在第 29 篇）。\n\n**后续通向**：第 31 篇《量子测量与退相干》解释为什么宏观世界看不到 Bell 违反；第 32 篇《量子密钥分发》的 E91 协议直接把 CHSH 违反作为窃听检测手段；第 34 篇《量子计算与量子算法》中 Bell 违反是验证量子比特纠缠的标准诊断。\n\n**与宝石学笔记的接口**：`宝石学正式版/` 中的《双折射后的光是否纠缠态》提出的一个结论——\"单粒子偏振-路径纠缠不直接体现 EPR 非定域性\"——其理论依据就在本篇（见 5.3 与 6.4）。\n\n---\n\n## 二、数学结构\n\n### 2.1 符号约定声明\n\n本篇统一采用以下约定，全文不再切换：\n\n- **单位制**：SI。涉及常数的数值均取自 **CODATA 2022** 推荐值。\n- **ħ 与 2π**：本篇所有关联函数与不等式均为无量纲量，不含 ħ；相干项写作 exp(−iEt/ħ)，不额外吸收 2π。\n- **度规与张量积**：采用 ⊗ 标记复合系统，左因子属于粒子 1（Alice 侧），右因子属于粒子 2（Bob 侧）。\n- **自旋算符**：$\\hat{\\boldsymbol{\\sigma}} = (\\hat\\sigma_x, \\hat\\sigma_y, \\hat\\sigma_z)$ 为泡利矩阵，自旋算符 $\\hat{\\mathbf{S}} = \\frac{\\hbar}{2}\\hat{\\boldsymbol{\\sigma}}$。\n- **测量方向**：$\\mathbf{a}, \\mathbf{a}', \\mathbf{b}, \\mathbf{b}'$ 均为三维实单位矢量；共面情形下用标量角 $\\theta$ 表示，角度均为弧度制，图上标注换算为度。\n- **关联函数符号**：$E(\\mathbf{a},\\mathbf{b}) \\in [-1, +1]$，定义为两侧测量结果乘积的期望值。注意不同文献用 $P$ 或 $E$ 表示同一量（Bell 1964 用 $P$，CHSH 及后续文献多用 $E$），本篇统一用 $E$，引述 Bell 原式时保留 $P$。\n- **傅里叶变换**：本篇不涉及。\n\n### 2.2 态空间与 Bell 基\n\n考虑两个自旋 1/2 粒子，单粒子态空间 $\\mathcal{H}_2 \\cong \\mathbb{C}^2$，复合系统态空间为\n\n$$\\mathcal{H} = \\mathcal{H}_2 \\otimes \\mathcal{H}_2 \\cong \\mathbb{C}^4 \\tag{2.1}$$\n\n| 符号 | 含义 | 量纲 |\n|------|------|------|\n| $\\mathcal{H}_2$ | 单粒子自旋态空间，维数 2 | — |\n| $\\otimes$ | 张量积 | — |\n\n最常用的两个 Bell 态是**自旋单态**与**三重态之一**：\n\n$$|\\Psi^-\\rangle = \\frac{1}{\\sqrt{2}}\\left(|\\uparrow\\downarrow\\rangle - |\\downarrow\\uparrow\\rangle\\right) \\tag{2.2}$$\n\n$$|\\Phi^+\\rangle = \\frac{1}{\\sqrt{2}}\\left(|\\uparrow\\uparrow\\rangle + |\\downarrow\\downarrow\\rangle\\right) \\tag{2.3}$$\n\n| 符号 | 含义 | 量纲 |\n|------|------|------|\n| $|\\Psi^-\\rangle$ | 自旋单态，总自旋量子数 $s=0$，$m_s=0$；在任意方向上呈现完美反关联 | — |\n| $|\\uparrow\\rangle, |\\downarrow\\rangle$ | $\\hat\\sigma_z$ 的本征态，本征值 $+1, -1$ | — |\n| $|\\uparrow\\downarrow\\rangle$ | 简写，指 $|\\uparrow\\rangle_1 \\otimes |\\downarrow\\rangle_2$ | — |\n\n$|\\Psi^-\\rangle$ 的关键性质是**旋转不变性**：它在任意共同旋转下不变，因此在任何方向 $\\mathbf{v}$ 上都可写作 $|\\Psi^-\\rangle = \\frac{1}{\\sqrt{2}}(|\\uparrow_{\\mathbf{v}}\\downarrow_{\\mathbf{v}}\\rangle - |\\downarrow_{\\mathbf{v}}\\uparrow_{\\mathbf{v}}\\rangle)$。这正是它能产生完美反关联的根源。\n\n### 2.3 算符与关联函数\n\n在 Alice 侧沿 $\\mathbf{a}$ 方向、Bob 侧沿 $\\mathbf{b}$ 方向测量自旋分量，对应的可观测量为\n\n$$\\hat{A}(\\mathbf{a}) = \\mathbf{a}\\cdot\\hat{\\boldsymbol{\\sigma}} \\otimes \\hat{I}, \\qquad \\hat{B}(\\mathbf{b}) = \\hat{I} \\otimes \\mathbf{b}\\cdot\\hat{\\boldsymbol{\\sigma}} \\tag{2.4}$$\n\n| 符号 | 含义 | 量纲 |\n|------|------|------|\n| $\\hat{A}(\\mathbf{a})$ | Alice 侧沿 $\\mathbf{a}$ 的测量算符，本征值 $\\pm 1$ | 无量纲 |\n| $\\mathbf{a}\\cdot\\hat{\\boldsymbol{\\sigma}}$ | $a_x\\hat\\sigma_x + a_y\\hat\\sigma_y + a_z\\hat\\sigma_z$ | 无量纲 |\n| $\\hat{I}$ | 二维单位算符 | — |\n\n关联函数定义为测量结果乘积的期望值：\n\n$$E(\\mathbf{a},\\mathbf{b}) = \\langle\\Psi^-| \\hat{A}(\\mathbf{a})\\hat{B}(\\mathbf{b}) |\\Psi^-\\rangle \\tag{2.5}$$\n\n**推导**（不跳步）。利用恒等式 $(\\mathbf{a}\\cdot\\hat{\\boldsymbol{\\sigma}})(\\mathbf{b}\\cdot\\hat{\\boldsymbol{\\sigma}}) = (\\mathbf{a}\\cdot\\mathbf{b})\\hat{I} + i(\\mathbf{a}\\times\\mathbf{b})\\cdot\\hat{\\boldsymbol{\\sigma}}$，有\n\n$$\\hat{A}(\\mathbf{a})\\hat{B}(\\mathbf{b}) = (\\mathbf{a}\\cdot\\hat{\\boldsymbol{\\sigma}}) \\otimes (\\mathbf{b}\\cdot\\hat{\\boldsymbol{\\sigma}}) \\tag{2.6}$$\n\n对自旋单态，需用到两条矩阵元（可由式 2.2 直接展开验证）：\n\n$$\\langle\\Psi^-| \\hat\\sigma_i \\otimes \\hat\\sigma_j |\\Psi^-\\rangle = -\\delta_{ij}, \\qquad \\langle\\Psi^-| \\hat\\sigma_i \\otimes \\hat{I} |\\Psi^-\\rangle = 0 \\tag{2.7}$$\n\n| 符号 | 含义 | 量纲 |\n|------|------|------|\n| $\\delta_{ij}$ | Kronecker delta，$i=j$ 时为 1，否则为 0 | 无量纲 |\n| $i, j$ | 取值 $x, y, z$ 的分量指标 | — |\n\n将 $\\hat{A}\\hat{B}$ 按分量展开并代入式 2.7：\n\n$$E(\\mathbf{a},\\mathbf{b}) = \\sum_{i,j} a_i b_j \\langle\\Psi^-|\\hat\\sigma_i \\otimes \\hat\\sigma_j|\\Psi^-\\rangle = \\sum_{i,j} a_i b_j (-\\delta_{ij}) = -\\sum_i a_i b_i$$\n\n$$\\boxed{E(\\mathbf{a},\\mathbf{b}) = -\\mathbf{a}\\cdot\\mathbf{b}} \\tag{2.8}$$\n\n两个特例值得记住：$\\mathbf{a} = \\mathbf{b}$ 时 $E = -1$（完美反关联）；$\\mathbf{a} \\perp \\mathbf{b}$ 时 $E = 0$（无关联）。\n\n### 2.4 定域隐变量模型的数学形式\n\nBell 问的是：**能否构造一个模型复现式 2.8？** 定域隐变量模型由三个要素构成：\n\n1. **隐变量** $\\lambda \\in \\Lambda$，按概率密度 $\\rho(\\lambda)$ 分布，满足 $\\rho(\\lambda) \\ge 0$ 且 $\\int_\\Lambda \\rho(\\lambda)\\,\\mathrm{d}\\lambda = 1$。\n2. **响应函数** $A(\\mathbf{a},\\lambda) \\in \\{-1, +1\\}$ 与 $B(\\mathbf{b},\\lambda) \\in \\{-1, +1\\}$。\n3. **定域性（因子化）条件**：\n\n$$P(A, B \\,|\\, \\mathbf{a}, \\mathbf{b}, \\lambda) = P(A \\,|\\, \\mathbf{a}, \\lambda) \\cdot P(B \\,|\\, \\mathbf{b}, \\lambda) \\tag{2.9}$$\n\n即：给定隐变量后，Alice 的结果不依赖 Bob 选了什么测量方向，反之亦然。\n\n由此得到模型预言的关联函数：\n\n$$E_{\\text{LHV}}(\\mathbf{a},\\mathbf{b}) = \\int_\\Lambda \\rho(\\lambda)\\, A(\\mathbf{a},\\lambda)\\, B(\\mathbf{b},\\lambda) \\,\\mathrm{d}\\lambda \\tag{2.10}$$\n\n| 符号 | 含义 | 量纲 |\n|------|------|------|\n| $\\lambda$ | 隐变量，携带量子态未描述的\"额外信息\" | 随模型而定 |\n| $\\Lambda$ | 隐变量取值空间 | — |\n| $\\rho(\\lambda)$ | 隐变量概率密度 | $[\\lambda]^{-1}$ |\n| $A(\\mathbf{a},\\lambda)$ | Alice 侧响应函数，取值 $\\pm 1$ | 无量纲 |\n\n**还需一个隐含假设**：测量选择独立性（自由选择 / no-conspiracy），即 $\\rho(\\lambda)$ 与实验者选择的 $\\mathbf{a}, \\mathbf{b}$ 无关。若允许二者相关（超决定论），任何关联都能被\"解释\"，Bell 检验随之失效（见 4.5）。\n\n### 2.5 Bell 1964 原始不等式\n\nBell 原文在**完美反关联**这一额外假设下推导，即假设 $A(\\mathbf{a},\\lambda) = -B(\\mathbf{a},\\lambda)$ 对一切 $\\mathbf{a}$ 成立（这正是自旋单态在 $\\mathbf{a}=\\mathbf{b}$ 时的表现）。由此得到三个方向 $\\mathbf{a}, \\mathbf{b}, \\mathbf{c}$ 之间的约束：\n\n$$|P(\\mathbf{a},\\mathbf{b}) - P(\\mathbf{a},\\mathbf{c})| \\le 1 + P(\\mathbf{b},\\mathbf{c}) \\tag{2.11}$$\n\n**推导要点**：\n\n$$\n\\begin{aligned}\n|P(\\mathbf{a},\\mathbf{b}) - P(\\mathbf{a},\\mathbf{c})|\n&= \\left|\\int \\rho(\\lambda)\\left[A(\\mathbf{a},\\lambda)B(\\mathbf{b},\\lambda) - A(\\mathbf{a},\\lambda)B(\\mathbf{c},\\lambda)\\right]\\mathrm{d}\\lambda\\right| \\\\\n&= \\left|\\int \\rho(\\lambda) A(\\mathbf{a},\\lambda)B(\\mathbf{b},\\lambda)\\left[1 - B(\\mathbf{b},\\lambda)B(\\mathbf{c},\\lambda)\\right]\\mathrm{d}\\lambda\\right| \\\\\n&\\le \\int \\rho(\\lambda)\\left|A(\\mathbf{a},\\lambda)B(\\mathbf{b},\\lambda)\\right|\\left[1 - B(\\mathbf{b},\\lambda)B(\\mathbf{c},\\lambda)\\right]\\mathrm{d}\\lambda \\\\\n&= \\int \\rho(\\lambda)\\left[1 - B(\\mathbf{b},\\lambda)B(\\mathbf{c},\\lambda)\\right]\\mathrm{d}\\lambda \\\\\n&= 1 + P(\\mathbf{b},\\mathbf{c})\n\\end{aligned}\n$$\n\n第二步用到 $B(\\mathbf{b},\\lambda)^2 = 1$ 与完美反关联 $A(\\mathbf{a},\\lambda) = -B(\\mathbf{a},\\lambda)$；第三步用到 $|A(\\mathbf{a},\\lambda)B(\\mathbf{b},\\lambda)| = 1$ 以及 $1 - B(\\mathbf{b},\\lambda)B(\\mathbf{c},\\lambda) \\ge 0$（因为 $B$ 取值 $\\pm1$）。\n\n**量子违反的具体数值**（由配套脚本 `code/EPR与Bell不等式_CHSH.py` 验证）：取 $\\mathbf{a} \\perp \\mathbf{b}$，$\\mathbf{c}$ 与两者各成 45°，代入式 2.8 得 $P(\\mathbf{a},\\mathbf{b}) = 0$，$P(\\mathbf{a},\\mathbf{c}) = P(\\mathbf{b},\\mathbf{c}) = -\\sqrt{2}/2$。于是\n\n$$|P(\\mathbf{a},\\mathbf{b}) - P(\\mathbf{a},\\mathbf{c})| = 0.7071, \\qquad 1 + P(\\mathbf{b},\\mathbf{c}) = 0.2929$$\n\n超出量约 0.4142（$= \\sqrt{2} - 1$），不等式被违反。\n\n> **式 2.11 的实验局限**：它依赖完美反关联，而任何真实实验都存在探测损耗与态不纯，反关联不可能完美。因此实验上实际检验的是下一节的 CHSH 形式——CHSH 的推导不需要完美关联假设。\n\n### 2.6 CHSH 不等式\n\nCHSH 使用**每侧两个**测量方向：Alice 选 $\\mathbf{a}$ 或 $\\mathbf{a}'$，Bob 选 $\\mathbf{b}$ 或 $\\mathbf{b}'$。定义组合量\n\n$$S = E(\\mathbf{a},\\mathbf{b}) - E(\\mathbf{a},\\mathbf{b}') + E(\\mathbf{a}',\\mathbf{b}) + E(\\mathbf{a}',\\mathbf{b}') \\tag{2.12}$$\n\n**定理**：任何满足式 2.9 的定域隐变量模型，必有\n\n$$|S| \\le 2 \\tag{2.13}$$\n\n**推导**（不跳步）。把式 2.10 代入式 2.12：\n\n$$S = \\int \\rho(\\lambda)\\Big[A(\\mathbf{a},\\lambda)B(\\mathbf{b},\\lambda) - A(\\mathbf{a},\\lambda)B(\\mathbf{b}',\\lambda) + A(\\mathbf{a}',\\lambda)B(\\mathbf{b},\\lambda) + A(\\mathbf{a}',\\lambda)B(\\mathbf{b}',\\lambda)\\Big]\\mathrm{d}\\lambda$$\n\n提取公因子：\n\n$$S = \\int \\rho(\\lambda)\\Big\\{A(\\mathbf{a},\\lambda)\\big[B(\\mathbf{b},\\lambda) - B(\\mathbf{b}',\\lambda)\\big] + A(\\mathbf{a}',\\lambda)\\big[B(\\mathbf{b},\\lambda) + B(\\mathbf{b}',\\lambda)\\big]\\Big\\}\\mathrm{d}\\lambda \\tag{2.14}$$\n\n关键观察：由于 $B(\\mathbf{b},\\lambda), B(\\mathbf{b}',\\lambda) \\in \\{-1, +1\\}$，括号中的两项**必有一个为零、另一个为 $\\pm 2$**：\n\n- 若 $B(\\mathbf{b},\\lambda) = B(\\mathbf{b}',\\lambda)$，则 $B(\\mathbf{b},\\lambda) - B(\\mathbf{b}',\\lambda) = 0$，且 $B(\\mathbf{b},\\lambda) + B(\\mathbf{b}',\\lambda) = \\pm 2$；\n- 若 $B(\\mathbf{b},\\lambda) = -B(\\mathbf{b}',\\lambda)$，则 $B(\\mathbf{b},\\lambda) - B(\\mathbf{b}',\\lambda) = \\pm 2$，且 $B(\\mathbf{b},\\lambda) + B(\\mathbf{b}',\\lambda) = 0$。\n\n因此对每一个 $\\lambda$，被积花括号的绝对值恒等于 2。于是\n\n$$|S| \\le \\int \\rho(\\lambda) \\cdot 2 \\,\\mathrm{d}\\lambda = 2$$\n\n证毕。 $\\blacksquare$\n\n> **另一种等价验证**：由于 $A(\\mathbf{a}), A(\\mathbf{a}'), B(\\mathbf{b}), B(\\mathbf{b}')$ 各只有 $\\pm1$ 两种取值，全部 $2^4 = 16$ 种组合可以穷举。配套脚本的 `[1]` 项做了这件事，得到 $\\max|S| = 2.000000$，与上界一致。\n\n### 2.7 量子违反与 Tsirelson 界\n\n将自旋单态的关联函数（式 2.8）代入 CHSH 组合量（式 2.12）：\n\n$$S_{\\text{QM}} = -\\mathbf{a}\\cdot\\mathbf{b} + \\mathbf{a}\\cdot\\mathbf{b}' - \\mathbf{a}'\\cdot\\mathbf{b} - \\mathbf{a}'\\cdot\\mathbf{b}' \\tag{2.15}$$\n\n取四个方向共面，令 $\\mathbf{a} = 0°$、$\\mathbf{b} = 45°$、$\\mathbf{a}' = 90°$、$\\mathbf{b}' = 135°$（相邻间隔均为 45°）：\n\n$$\n\\begin{aligned}\nS_{\\text{QM}} &= -\\cos 45° + \\cos 135° - \\cos 45° - \\cos(-45°) \\\\\n&= -0.7071 - 0.7071 - 0.7071 - 0.7071 = -2.828\n\\end{aligned}\n$$\n\n即 $|S| = 2\\sqrt{2} \\approx 2.828 > 2$，CHSH 不等式被违反。配套脚本的角度扫描给出最优偏移 $\\phi^* = 45.0°$、$|S| = 2.828425$（网格精度下的值，解析值为 $2\\sqrt{2} = 2.828427$）。\n\n**这个 2√2 不是巧合，而是量子力学的上限**——即 Tsirelson 界（Cirel'son 1980, *Lett. Math. Phys.* 4, 93–100）：\n\n$$|S| \\le 2\\sqrt{2} \\quad \\text{（任意量子态、任意二值测量）} \\tag{2.16}$$\n\n脚本的 `[4]` 项以 20 万次随机采样测量方向做了数值检验，无一例超出 $2\\sqrt{2}$。\n\n### 2.8 无信号条件\n\n量子态的约化密度矩阵满足：Alice 侧的任何统计量与 Bob 选择哪个测量无关。形式上，\n\n$$\\sum_B P(A, B \\,|\\, \\mathbf{a}, \\mathbf{b}) = \\sum_B P(A, B \\,|\\, \\mathbf{a}, \\mathbf{b}') \\quad \\text{对任意 } \\mathbf{a}, A \\tag{2.17}$$\n\n对自旋单态可直接验证：$\\mathrm{Tr}_2(|\\Psi^-\\rangle\\langle\\Psi^-|) = \\hat{I}/2$，是完全混合态，与 Bob 侧的操作无关。\n\n> **这条恒等式至关重要**：它说明 Bell 违反**不蕴含超光速通信**。量子关联是\"不可用于传信的关联\"——Alice 手中的结果序列单独看永远是随机的，只有当两人把各自的记录拿到一起、用经典信道比对之后，超出经典的关联才显现出来。经典信道本身不超光速，因此没有任何信息以超光速传递。\n\n---\n\n## 三、物理量与特征尺度\n\n全部常数取自 **CODATA 2022**（NIST 在线版）。\n\n| 物理量 | 符号 | 数值/量级 | 适用条件 |\n|--------|------|-----------|----------|\n| 真空光速 | $c$ | 299 792 458 m·s⁻¹（精确，SI 定义常数） | 所有 Bell 检验的定域性判据基准 |\n| 约化普朗克常数 | $\\hbar$ | 1.054 571 817… × 10⁻³⁴ J·s（精确，由 $h$ 导出） | CODATA 2022；本篇关联量无量纲，ħ 仅用于相位演化 |\n| 普朗克常数 | $h$ | 6.626 070 15 × 10⁻³⁴ J·s（精确） | CODATA 2022 |\n| 精细结构常数倒数 | $\\alpha^{-1}$ | 137.035 999 177(21) | CODATA 2022，相对标准不确定度 1.6×10⁻¹⁰ |\n| 定域隐变量界 | $\\|S\\|_{\\text{LHV}}$ | 2（精确，由枚举证明） | 任何满足式 2.9 的模型 |\n| Tsirelson 界 | $\\|S\\|_{\\text{QM}}$ | $2\\sqrt{2}$ = 2.828 427 1… | 任意量子态、二值测量 |\n| 无信号代数上限 | $\\|S\\|_{\\text{NS}}$ | 4 | 仅要求不超光速传信（如 PR 盒） |\n| 最大违反裕度 | $2\\sqrt{2} - 2$ | 0.828 | 量子与定域实在论的可区分空间 |\n| 违反 CHSH 的临界保真度 | $p^*$ | $1/\\sqrt{2}$ = 0.7071 | 退极化（Werner）态 $\\rho = p\\|\\Psi^-\\rangle\\langle\\Psi^-\\| + (1-p)\\hat{I}/4$ |\n| 闭合探测漏洞的效率阈值（CHSH） | $\\eta$ | > 82.8% | Eberhard (1993)，信噪比极高时 |\n| 闭合探测漏洞的效率阈值（Eberhard 形式） | $\\eta$ | > 2/3 ≈ 66.7% | Eberhard (1993)，态经优化后 |\n\n**实验几何的特征尺度**（用于判断定域性漏洞是否闭合）：\n\n| 实验 | 两端间距 | 光行时间 | 设置切换周期 | 是否闭合定域性漏洞 |\n|------|---------|---------|-------------|------------------|\n| Freedman & Clauser 1972 | 实验台尺度 | — | 设置预先固定 | 否 |\n| Aspect, Dalibard & Roger 1982 | 约 12 m（源到分析器各约 6 m） | 约 20 ns（单边） | 约 10 ns（声光开关，周期式） | 部分（周期性而非真随机） |\n| Weihs et al. 1998 | 400 m | 约 1.3 μs | 高速电光调制，物理随机 | 是 |\n| Hensen et al. 2015 | 1.3 km | 约 4.3 μs | 量子随机数发生器 | 是 |\n| Shalm et al. 2015 | A–B 相距 185 m | 源到站约 0.43 μs | QRNG，约每 5 ns 更新 | 是 |\n\n**关键判据**：定域性漏洞闭合的充要条件是——每一侧\"选定测量设置\"的事件，与另一侧\"完成测量\"的事件构成**类空间隔**。即若两端间距为 $L$，测量事件时刻差为 $\\Delta t$，则须满足 $c\\,\\Delta t < L$。\n\n**光谱特征**（钙原子级联源，Freedman-Clauser 1972 与 Aspect 系列实验所用）：\n\n| 跃迁 | 波长 | 说明 |\n|------|------|------|\n| 泵浦：4s² ¹S₀ → 3d4p ¹P₁ | 227.5 nm | Aspect 1981 改用双光子激发直达 4p² ¹S₀，效率更高 |\n| 级联第一光子 $\\gamma_1$ | 551.3 nm | 4p² ¹S₀ → 4s4p ¹P₁ |\n| 级联第二光子 $\\gamma_2$ | 422.7 nm | 4s4p ¹P₁ → 4s² ¹S₀ |\n\n---\n\n## 四、实验基础与观测证据\n\n### 4.1 关键实验\n\n#### 4.1.1 Freedman & Clauser (1972)——首次明确违反\n\n**装置**：钙原子束由氘弧灯经 227.5 nm 干涉滤光片激发，约 7% 的原子经 4p² ¹S₀ 态级联跃迁，依次发出 551.3 nm 与 422.7 nm 两个偏振关联光子。两侧各置\"片堆\"偏振器（十片 0.3 mm 玻璃片，近布儒斯特角），实测透过率 $\\varepsilon_{M1} = 0.97 \\pm 0.01$、$\\varepsilon_{m1} = 0.038 \\pm 0.004$。\n\n**结果**：与量子力学一致，违反 CHSH 型不等式。\n\n**局限**：测量设置在光子离开源之前即已固定，**定域性漏洞未闭合**；探测效率极低，探测漏洞亦未闭合。\n\n#### 4.1.2 Aspect 系列（1981–1982）——三连击\n\nAspect 在 1981–1982 年连续发表三项实验，逐步逼近定域性漏洞：\n\n**（一）Aspect, Grangier & Roger (1981), *PRL* 47, 460–463**\n用两台可调激光器双光子激发，大幅提升源亮度；源与偏振器相距 6.5 m。以 $\\delta \\le 0$ 形式的不等式表述，实测 $\\delta_{\\text{exp}} = 5.72\\times10^{-2} \\pm 0.2\\times10^{-2}$，量子力学预言 $\\delta_{\\text{QM}} = 5.8\\times10^{-2}$，**违反达 13 个标准差**。\n\n**（二）Aspect, Grangier & Roger (1982), *PRL* 49, 91–94**\n首次使用**双通道偏振器**，使 EPR-Bohm 思想实验得以直接对应（此前单通道方案中，探测器未响应无法区分是效率低还是偏振器挡住了）。实测\n\n$$S_{\\text{exp}} = 2.697 \\pm 0.015 \\qquad (\\text{量子力学预言 } S_{\\text{QM}} = 2.70 \\pm 0.05)$$\n\n这是当时报道的最强违反，偏离定域实在论上界 2 约 46 个标准差。\n\n**（三）Aspect, Dalibard & Roger (1982), *PRL* 49, 1804–1807——最著名的一项**\n核心创新是**时变分析器**：在光子飞行途中改变测量设置。技术上不是旋转偏振片（20 ns 尺度做不到），而是用声光开关（水中超声驻波）把入射光子导向两对不同取向的偏振器之一，切换周期约 10 ns，短于光子飞行时间约 20 ns。以 $S \\le 0$ 形式表述，实测\n\n$$S_{\\text{exp}} = 0.101 \\pm 0.020 \\qquad (\\text{量子力学预言 } 0.112)$$\n\n**违反达 5 个标准差**。\n\n> **易混点提醒**：文献中\"Aspect 实验违反 5 个标准差\"指的是**这第三项**（时变分析器，1982 年 12 月）；而 $S = 2.697$ 出自**第二项**（双通道偏振器，1982 年 7 月）。两者是不同实验、不同不等式形式、不同显著性，常被混为一谈。\n\n**（三）的残留局限**：声光开关是**周期性**切换而非真随机，两侧频率虽不可公度，理论上仍不能完全排除\"源与测量装置共谋\"的可能；且两端间距较短。严格意义上的定域性漏洞要等 1998 年 Weihs 实验。\n\n#### 4.1.3 Weihs et al. (1998)——严格 Einstein 定域性\n\n*PRL* 81, 5039–5043。因斯布鲁克小组改用**自发参量下转换（SPDC）**产生纠缠光子对（而非钙原子级联），两端相距 400 m（光行时间约 1.3 μs），由物理随机数发生器实时、快速地选择测量基。这是首次在严格 Einstein 定域性条件下确认 Bell 违反。\n\n#### 4.1.4 2015 年三项\"无漏洞\"实验\n\n2015 年，三个独立小组在三个月内先后发表同时闭合**探测漏洞**、**定域性漏洞**与**记忆漏洞**的实验：\n\n| 实验 | 体系 | 关键结果 | 文献 |\n|------|------|---------|------|\n| Hensen et al. | 金刚石 NV 色心电子自旋，相距 1.3 km，事件就绪（event-ready）方案 | $S = 2.42 \\pm 0.20$，$p = 0.039$（245 次试验） | *Nature* 526, 682–686 |\n| Giustina et al. | SPDC 纠缠光子 + 超导转变边沿传感器（TES） | $p = 3.4 \\times 10^{-31}$，约 11.5 个标准差 | *PRL* 115, 250401 |\n| Shalm et al. | SPDC 纠缠光子 + TES，A–B 相距 185 m | $p = 2.3 \\times 10^{-7}$ | *PRL* 115, 250402 |\n\nHensen 等人的实验统计显著性最低（245 次试验），但该组追加 300 次试验后得到 $S = 2.38 \\pm 0.14$，即 2.7 个标准差（Hensen et al. 2016）。三项实验共同关闭了探测、定域性与记忆三漏洞。\n\n### 4.2 里程碑实验时间线\n\n| 年份 | 实验者 | 装置/体系 | 关键结果 | 文献 |\n|------|--------|----------|---------|------|\n| 1935 | Einstein, Podolsky, Rosen | 思想实验 | 提出完备性质疑 | *Phys. Rev.* 47, 777 |\n| 1950 | Wu & Shaknov | 正负电子湮灭 γ 光子 | 早期角关联测量（非 Bell 检验） | *Phys. Rev.* 77, 136 |\n| 1957 | Bohm & Aharonov | 自旋 1/2 版 EPR（理论） | 把连续变量论证离散化 | *Phys. Rev.* 108, 1070 |\n| 1964 | Bell | 理论 | Bell 定理，不等式可检验 | *Physics* 1, 195 |\n| 1967 | Kocher & Commins | 钙级联偏振关联 | 提供实验原型 | *PRL* 18, 575 |\n| 1969 | Clauser, Horne, Shimony, Holt | 理论 | CHSH 不等式，实验可行化 | *PRL* 23, 880 |\n| 1972 | Freedman & Clauser | 钙级联 | 首次明确违反 | *PRL* 28, 938 |\n| 1981 | Aspect, Grangier, Roger | 钙级联，激光双光子激发 | 13σ | *PRL* 47, 460 |\n| 1982 | Aspect, Grangier, Roger | 双通道偏振器 | $S = 2.697 \\pm 0.015$ | *PRL* 49, 91 |\n| 1982 | Aspect, Dalibard, Roger | 时变分析器（声光开关） | 5σ | *PRL* 49, 1804 |\n| 1998 | Weihs et al. | SPDC，400 m 分离，物理随机 | 严格 Einstein 定域性 | *PRL* 81, 5039 |\n| 2001 | Rowe et al. | ⁹Be⁺ 囚禁离子，效率 > 90% | $S = 2.25 \\pm 0.03$，首次闭合探测漏洞 | *Nature* 409, 791 |\n| 2013 | Giustina et al. | SPDC + TES，效率约 75% | 闭合光子系统的公平采样漏洞 | *Nature* (2013), DOI 10.1038/nature12012 |\n| 2015 | Hensen / Giustina / Shalm | NV 色心 / 纠缠光子 | 三项\"无漏洞\"实验 | *Nature* 526, 682；*PRL* 115, 250401/250402 |\n| 2022 | — | — | 诺贝尔物理学奖：Aspect、Clauser、Zeilinger | nobelprize.org |\n\n### 4.3 被排除的替代理论\n\nBell 检验所排除的**不是**某一个具体模型，而是整个理论类：\n\n1. **定域隐变量理论（全部）**。包括冯·诺依曼意义上的、玻姆 1952 年之前的尝试等。注意：玻姆力学（de Broglie–Bohm）**不在此列**——它是显式非定域的，因此不受 Bell 定理排除，但它必须放弃定域性。\n2. **定域实在论（local realism）**。这是\"定域性 + 实在性（测量结果在测量前已确定）\"的合取。实验排除的是这个合取。\n3. **Furry 猜想**。Aspect 1981 年的实验顺带检验了\"量子非定域性会在光子飞行超过波包相干长度后消失\"这一猜想，结果不支持（相干长度约 1.5 m，而源与偏振器相距 6.5 m 时关联依旧）。\n\n**未被排除的**（须明确列出）：\n\n- 非定域隐变量理论（如玻姆力学）\n- 超决定论（superdeterminism）——放弃测量选择独立性\n- 各种诠释（多世界、GRW 自发坍缩、QBism 等）在观测上彼此等价，不受 Bell 检验区分\n\n### 4.4 常见误读纠正\n\n> **误读一：「Bell 实验证明了量子力学有超光速作用，因此推翻了相对论」。**\n> 严格表述：Bell 实验排除的是定域实在论。量子力学满足无信号条件（式 2.17），任何一方的边际统计都与对方的设置无关，因此无法实现超光速通信。所谓\"非定域性\"指的是**关联的不可分解性**，不是可操控的因果影响。至于是否应把这种关联称为\"作用\"，属于诠释分歧，不是实验判定。\n\n> **误读二：「违反了 Bell 不等式，说明隐变量不存在」。**\n> 严格表述：被排除的是**定域**隐变量。玻姆力学就是反例——它有隐变量（粒子位置），也完全复现量子预言，代价是显式非定域。Bell 本人的表述是\"EPR 佯谬以爱因斯坦最不喜欢的方式得到了解决\"。\n\n> **误读三：「Aspect 1982 实验违反 Bell 不等式达 5 个标准差，得到 S = 2.697」。**\n> 这是把两项实验混为一谈。$S = 2.697 \\pm 0.015$ 出自 Aspect-Grangier-Roger (*PRL* 49, 91) 的双通道偏振器实验；5σ 出自 Aspect-Dalibard-Roger (*PRL* 49, 1804) 的时变分析器实验，其不等式形式为 $S \\le 0$，实测 $S = 0.101 \\pm 0.020$。两者形式不同，数值不可直接比较。\n\n> **误读四：「Bell 不等式是量子力学与经典物理的分界」。**\n> 严格表述：分界线是\"定域实在论 vs 量子力学\"，不是\"经典 vs 量子\"。经典物理中的电磁波也可以有非定域的关联结构；反过来，某些量子态（如可分的混合态、Werner 态在 $p \\le 1/\\sqrt{2}$ 时）并不违反任何 Bell 不等式。\n\n> **误读五（科普简化）：「测量一个粒子会瞬间改变另一个粒子的状态」。**\n> 严格表述：在标准形式体系中，测量更新的是**观察者对复合系统的态赋值**，而对任一子系统的约化密度矩阵（从而对该子系统的全部可测预言）不产生任何变化。通俗说法赋予了\"坍缩\"以物理传播的图像，这在标准形式体系中没有对应物。\n\n### 4.5 实验局限与未闭合的漏洞\n\n| 漏洞 | 内容 | 首次闭合 | 现状 |\n|------|------|---------|------|\n| 定域性漏洞（locality / communication） | 测量设置的选择与另一侧的测量事件不构成类空间隔，理论上可通过亚光速信号\"串通\" | Weihs et al. 1998 | 已闭合 |\n| 探测漏洞（detection / fair sampling） | 只探测到部分粒子对；若被探测的子样本不具代表性，定域模型可伪造违反 | Rowe et al. 2001（离子）；Giustina et al. 2013（光子） | 已闭合 |\n| 记忆漏洞（memory） | 历史设置与结果可能影响后续轮次，使统计分析中\"独立同分布\"假设失效 | 2015 年三项实验 | 已闭合 |\n| 符合时间窗漏洞（coincidence） | 用符合时间窗配对两个探测事件，而定域模型可让设置影响事件的时刻 | Giustina et al. 2015；Shalm et al. 2015（用脉冲源） | 已闭合 |\n| 自由选择漏洞（freedom of choice） | 测量设置与隐变量可能相关 | Handsteiner et al. 2017（用银河系恒星光子选设置）；Rauch et al. 2018（用类星体光子） | 大幅压缩，但**无法彻底闭合** |\n| 超决定论（superdeterminism） | 假设隐变量与测量设置从宇宙初始就相关 | — | **原则上不可通过 Bell 检验排除**（因为它取消了检验所需的统计独立性前提） |\n\n> **必须诚实标注的一点**：所有 Bell 检验都预设了\"测量选择可以与隐变量无关\"这一前提。超决定论通过否定该前提而免疫于一切 Bell 检验，且**不能通过设计更精巧的 Bell 实验来排除**——它被排除的方式是科学方法论层面的（一个否定实验独立性的假说难以产生可检验的新预言），而非实验层面的。\n\n---\n\n## 五、分类体系与物理机制\n\n### 5.1 Bell 型不等式的分类\n\n| 类型 | 提出 | 形式要点 | 适用场景 | 典型实例 |\n|------|------|---------|---------|---------|\n| Bell 1964 原始型 | Bell (1964) | 三个方向，$\\vert P(\\mathbf{a},\\mathbf{b}) - P(\\mathbf{a},\\mathbf{c})\\vert \\le 1 + P(\\mathbf{b},\\mathbf{c})$ | 理想完美关联，仅理论意义 | 自旋单态思想实验 |\n| CHSH | Clauser, Horne, Shimony, Holt (1969) | 四个方向，$\\vert S\\vert \\le 2$ | 最通用的实验形式；光子、离子、原子、超导比特皆可用 | Freedman-Clauser 1972；Aspect 1982；Weihs 1998 |\n| CH（CH74） | Clauser & Horne (1974) | 基于计数率而非关联函数，显式处理未探测事件 | 探测效率有限的光子实验 | 早期光子 Bell 检验 |\n| Eberhard 型 | Eberhard (1993) | 针对已知探测效率优化量子态，把效率阈值降至 2/3 | 高信噪比光子实验 | Giustina et al. 2013/2015 |\n| 链式不等式 | 后续发展 | 多方链式结构，效率阈值随方数增加而下降 | 量子网络、多方场景 | — |\n| GHZ 型 | Greenberger, Horne, Zeilinger (1989) | 三体及以上，给出**确定性**（非统计性）矛盾 | 多体纠缠检验 | Pan et al. 2000 |\n\n> **说明**：本表按\"不等式族\"分类，目的是澄清各自适用条件，**不构成优劣排序**。CHSH 之所以最常用，是因为它不要求完美关联、对探测损耗的表述相对宽容，而非因为它\"更好\"。\n\n### 5.2 机制：为什么量子关联能超过 2\n\n机制的核心是**关联函数的函数形式不同**：\n\n- **定域隐变量模型**：$E_{\\text{LHV}}(\\theta) = \\int \\rho(\\lambda) A(\\theta_a,\\lambda) B(\\theta_b,\\lambda)\\,\\mathrm{d}\\lambda$。Bell 的玩具模型给出的是**分段线性**的关联——随夹角线性下降，在 $\\theta = 0$ 处有折点。\n- **量子力学**：$E_{\\text{QM}}(\\theta) = -\\cos\\theta$（自旋单态）或 $E_{\\text{QM}}(\\theta) = \\cos 2\\theta$（光子偏振纠缠），是**光滑的正弦型**。\n\n关键差异在于**远离完美关联处的下降速率**。在 $\\theta \\to 0$ 附近，余弦的下降是二阶的（$1 - \\cos\\theta \\approx \\theta^2/2$），而线性模型的下降是一阶的。因此量子关联在中间角度上\"掉得比任何定域模型都慢\"，累积到 CHSH 的四个组合项上，就超出 2。\n\n**为什么恰好是 2√2 而不是 4？** 从算符角度看得最清楚。定义 CHSH 算符\n\n$$\\hat{\\mathcal{B}} = \\hat{A}_0 \\otimes \\hat{B}_0 + \\hat{A}_0 \\otimes \\hat{B}_1 + \\hat{A}_1 \\otimes \\hat{B}_0 - \\hat{A}_1 \\otimes \\hat{B}_1 \\tag{5.1}$$\n\n利用 $\\hat{A}_i^2 = \\hat{B}_j^2 = \\hat{I}$ 与 $[\\hat{A}_i, \\hat{B}_j] = 0$（两侧算符对易，这是定域性的代数表达），可算得\n\n$$\\hat{\\mathcal{B}}^2 = 4\\hat{I} - [\\hat{A}_0, \\hat{A}_1] \\otimes [\\hat{B}_0, \\hat{B}_1] \\tag{5.2}$$\n\n| 符号 | 含义 | 量纲 |\n|------|------|------|\n| $\\hat{\\mathcal{B}}$ | CHSH 算符，其期望值即 $S$ | 无量纲 |\n| $[\\hat{X}, \\hat{Y}]$ | 对易子 $\\hat{X}\\hat{Y} - \\hat{Y}\\hat{X}$ | — |\n\n右侧第二项受对易子的范数限制，而量子力学中二值 observable 的对易子范数上界恰为 2，于是 $\\|\\hat{\\mathcal{B}}^2\\| \\le 8$，即 $\\|\\hat{\\mathcal{B}}\\| \\le 2\\sqrt{2}$。若两侧算符各自对易（经典极限），第二项为零，回到 $\\|\\hat{\\mathcal{B}}\\| \\le 2$。\n\n> **这个\"为什么量子关联停在 2√2\"的问题至今开放**。仅要求\"不超光速传信\"（无信号条件）时，代数上界是 4，存在达到 4 的假想关联（PR 盒，Popescu-Rohrlich 1992），但量子力学达不到。寻找一条能从物理原理（如信息因果性、宏观定域性）推出 2√2 而非 4 的原理，是量子基础研究的一条活跃线索。\n\n### 5.3 概念辨析\n\n**（一）纠缠 ≠ 违反 Bell 不等式**\n\n这是最容易被忽略的包含关系。以\"Bell 非定域态\"指称\"存在某条 Bell 不等式被其违反的态\"，则三者的严格包含关系为\n\n$$\\text{Bell 非定域态} \\subsetneq \\text{纠缠态} \\subsetneq \\text{全部量子态}$$\n\n- **左端包含**：可分（非纠缠）态永不违反任何 Bell 不等式——这是显然的，因为可分态本身就有定域隐变量模型的构造。\n- **左端严格**：存在**纠缠却不违反任何 Bell 不等式**的混合态——Werner 态（Werner 1989）就是标准反例。脚本 `[4c]` 项验证了退极化信道的特例：只有当保真度 $p > 1/\\sqrt{2} \\approx 0.7071$ 时才违反 CHSH，$p \\le 1/\\sqrt{2}$ 的态虽然纠缠，却不违反 CHSH。\n- **右端**：纠缠态只是全部量子态中的一部分，存在大量非纠缠（可分）的量子态。\n- **纯态情形是例外**：所有**纯**纠缠态都违反某条 Bell 不等式（Gisin 1991；Popescu & Rohrlich 1992）。因此\"纠缠但不违反\"这一现象只发生在混态中。\n\n**（二）Bell 非定域性 ≠ EPR 的非定域性论证**\n\n- EPR (1935) 的论证是：若承认定域性，则量子力学不完备。它是一个**关于理论完备性**的论证。\n- Bell (1964) 及后续实验检验的是**关联的数值界限**。它不直接谈论完备性。\n- 二者的连接点是：Bell 表明 EPR 所设想的\"用隐变量补全量子力学\"这一出路，若同时要求定域性，则必然与实验冲突。\n\n**（三）单粒子纠缠与双粒子纠缠——与宝石学笔记的接口**\n\n`宝石学正式版/` 的《双折射后的光是否纠缠态》指出：双折射在单光子、偏振叠加态、路径可区分三个条件同时满足时，可产生单光子的**偏振-路径纠缠** $|\\psi\\rangle = \\alpha|H\\rangle|\\text{o}\\rangle + \\beta|V\\rangle|\\text{e}\\rangle$，但\"这不直接体现 EPR 非定域性\"。\n\n本篇给出该结论的依据：**标准 CHSH 检验要求两个测量站点处于类空间隔，以便\"设置选择\"与\"远端测量\"互不构成因果影响。单粒子的两个内禀自由度（偏振与路径）在空间上不分离，无法实现类空间隔，因此不满足 CHSH 检验的定域性前提。**\n\n需要补充说明以免造成误解：这种纠缠在数学上等价于两个量子比特的纠缠态，因此**可以**构造形式上的 CHSH 违反——Tan, Walls & Collett (1991, *PRL* 66, 252–255) 提出过用单光子场通过相位敏感测量展示非定域性的方案。但这类方案的\"非定域性\"含义与双粒子 EPR 场景不同：它检验的是**同一个场的两个模式之间的关联**，不涉及空间分离的两个测量站点。因此宝石学笔记中\"不直接体现 EPR 非定域性\"的说法是准确的，其中的限定词\"直接\"与\"EPR\"不可省略。\n\n（此议题在第 47 篇《宝石学中的量子误用辨析》中还会展开。）\n\n### 5.4 适用范围与失效边界\n\n| 条件 | 结论 |\n|------|------|\n| 态为纯纠缠态 | 必存在某 Bell 不等式被违反 |\n| 态为混合纠缠态 | 可能不违反任何已知 Bell 不等式（Werner 态） |\n| 退极化噪声 $p \\le 1/\\sqrt{2}$ | 不违反 CHSH（脚本 `[4c]` 验证） |\n| 探测效率 $\\eta \\le 2/3$（Eberhard 形式） | 无法通过光子实验闭合探测漏洞 |\n| 测量设置与隐变量相关（超决定论） | Bell 检验失效——不等式不再可推导 |\n| 粒子数多于 2 且用 GHZ 型不等式 | 可得到确定性（非统计性）矛盾，效率阈值降至 75% |\n| 关联超过 2√2 | 超出量子力学预言范围，不属于已知物理 |\n\n---\n\n## 六、典型系统与可解模型\n\n配套脚本：`code/EPR与Bell不等式_CHSH.py`（依赖 numpy / matplotlib，可直接运行）。输出图形见下。\n\n![CHSH 组合量随角度变化：量子曲线（红/蓝）与定域实在论界 2、Tsirelson 界 2√2 的对比](figures/EPR与Bell不等式_CHSH.svg)\n\n*图 1：左为自旋单态（共面角度族 a=0, b=φ, a′=2φ, b′=3φ），右为光子偏振纠缠（a=0, a′=2φ, b=φ, b′=3φ）。灰色虚线为定域隐变量界 |S| = 2，绿色点划线为 Tsirelson 界 2√2。可见量子曲线在中间角度区穿出 2 而止于 2√2。*\n\n### 6.1 模型一：自旋单态（解析可解）\n\n**系统设定**：二自旋 1/2 粒子处于 $|\\Psi^-\\rangle$，Hamilton 量不涉及（关联是态的性质，非动力学演化的结果）。Alice 测量 $\\mathbf{a}\\cdot\\hat{\\boldsymbol{\\sigma}}$，Bob 测量 $\\mathbf{b}\\cdot\\hat{\\boldsymbol{\\sigma}}$，本征值各为 $\\pm 1$。\n\n**解法要点**：\n1. 利用式 2.7 的两条矩阵元；\n2. 代入式 2.6 得 $E(\\mathbf{a},\\mathbf{b}) = -\\mathbf{a}\\cdot\\mathbf{b}$（式 2.8）；\n3. 构造 CHSH 组合量式 2.15。\n\n**可观测量结果与物理意义**：\n\n取共面配置 $\\mathbf{a}=0°$、$\\mathbf{b}=\\phi$、$\\mathbf{a}'=2\\phi$、$\\mathbf{b}'=3\\phi$（相邻间隔均为 $\\phi$）：\n\n$$S(\\phi) = -\\cos\\phi + \\cos 3\\phi - \\cos\\phi - \\cos\\phi = -3\\cos\\phi + \\cos 3\\phi$$\n\n极值条件 $\\mathrm{d}S/\\mathrm{d}\\phi = 3\\sin\\phi - 3\\sin 3\\phi = 0$，即 $\\sin\\phi = \\sin 3\\phi$，解得（取 $\\phi \\in (0°, 90°)$ 内）$\\phi = 45°$。代入得\n\n$$S(45°) = -3\\times0.7071 + \\cos 135° = -2.1213 - 0.7071 = -2.828 = -2\\sqrt{2}$$\n\n脚本扫描给出 $\\phi^* = 44.96°$、$S = -2.828 425$（网格离散化误差）。\n\n**数量级估计**：$|S| = 2.828$，超出 LHV 界 0.828，相对超出 41.4%。若实验总计数为 $N$，则统计不确定度约 $\\sim 2/\\sqrt{N}$；要使违反达到 5σ（如 Aspect 1982 第三项），需要 $N \\gtrsim 10^4$ 量级的符合计数。\n\n### 6.2 模型二：光子偏振纠缠 $|\\Phi^+\\rangle$（解析可解）\n\n**系统设定**：SPDC 产生的偏振纠缠光子对\n\n$$|\\Phi^+\\rangle = \\frac{1}{\\sqrt{2}}\\left(|H\\rangle_1|H\\rangle_2 + |V\\rangle_1|V\\rangle_2\\right) \\tag{6.1}$$\n\n两侧各用可旋转的线偏振片测量，输出按 $\\{H, V\\}$ 编码为 $\\pm 1$。\n\n**解法要点**：对 $|\\Phi^+\\rangle$ 有矩阵元 $\\langle\\hat\\sigma_z\\otimes\\hat\\sigma_z\\rangle = +1$、$\\langle\\hat\\sigma_x\\otimes\\hat\\sigma_x\\rangle = +1$、$\\langle\\hat\\sigma_y\\otimes\\hat\\sigma_y\\rangle = -1$。线偏振方向 $\\theta$ 对应的 Bloch 矢量为 $(\\sin 2\\theta,\\, 0,\\, \\cos 2\\theta)$（**注意 2θ 因子**——这是偏振角与 Bloch 角的转换，也是光子情形最优角减半的根源）。代入得\n\n$$E(\\theta_a, \\theta_b) = \\sin 2\\theta_a \\sin 2\\theta_b + \\cos 2\\theta_a \\cos 2\\theta_b = \\cos\\big(2(\\theta_a - \\theta_b)\\big) \\tag{6.2}$$\n\n**标准 Bell 角配置**：$\\theta_a = 0°$、$\\theta_{a'} = 45°$、$\\theta_b = 22.5°$、$\\theta_{b'} = 67.5°$。代入式 2.12：\n\n$$\n\\begin{aligned}\nS &= \\cos(-45°) - \\cos(-135°) + \\cos(45°) + \\cos(-45°) \\\\\n&= 0.7071 + 0.7071 + 0.7071 + 0.7071 = 2.828 = 2\\sqrt{2}\n\\end{aligned}\n$$\n\n脚本验证：该配置给出 $S = 2.828427$；一般地取 $\\theta_a = 0$、$\\theta_{a'} = 2\\phi$、$\\theta_b = \\phi$、$\\theta_{b'} = 3\\phi$，则 $S(\\phi) = 3\\cos 2\\phi - \\cos 6\\phi$，极值在 $\\phi = 22.5°$。\n\n**物理意义**：光子情形的最优角度间隔（22.5°）是自旋情形（45°）的一半，根源就是式 6.2 中的 $2(\\theta_a - \\theta_b)$ 因子。这是实验设计中最容易出错的细节之一——**把自旋单态的 45° 直接搬到偏振实验会得到零违反**。\n\n### 6.3 模型三：退极化信道下的 CHSH（需数值求解一般情形，此处解析特例）\n\n**系统设定**：纠缠源发出的态经退极化信道\n\n$$\\rho = p\\,|\\Psi^-\\rangle\\langle\\Psi^-| + (1-p)\\frac{\\hat{I}}{4} \\tag{6.3}$$\n\n| 符号 | 含义 | 量纲 |\n|------|------|------|\n| $p$ | 单态权重，$0 \\le p \\le 1$ | 无量纲 |\n| $\\hat{I}/4$ | 四维空间上的最大混合态 | — |\n\n**解法要点**：退极化只缩放关联而不改变其形式——$E_\\rho(\\mathbf{a},\\mathbf{b}) = p\\,(-\\mathbf{a}\\cdot\\mathbf{b})$。因此\n\n$$|S|(p) = p \\cdot 2\\sqrt{2}$$\n\n**结果**：违反 CHSH 的条件为 $p \\cdot 2\\sqrt{2} > 2$，即\n\n$$p > \\frac{1}{\\sqrt{2}} = 0.7071$$\n\n脚本 `[4c]` 项数值扫描给出 $p^* = 0.7072$（网格精度 10⁻⁴），与解析值一致。\n\n**物理意义**：这是纠缠源亮度/保真度的**验收阈值**。若测得的单态保真度低于 70.7%，即使态仍然纠缠，也无法观测到 CHSH 违反。该数值与 Eberhard 效率阈值（82.8% / 66.7%）是两类不同的阈值，不可混淆：前者针对**态的纯度**，后者针对**探测器的效率**。\n\n### 6.4 模型四：正电子素湮灭（本地一手资料，费曼的讲法）\n\n**系统设定**（Feynman Lectures Vol. III, §18-3 \"The annihilation of positronium\"，页 18-7 至 18-9）：正电子素基态（总角动量 $J = 0$）湮灭为两个背向飞行的光子，其偏振态为\n\n$$|F\\rangle = \\frac{1}{\\sqrt{2}}\\left(|R\\rangle_1|R\\rangle_2 - |L\\rangle_1|L\\rangle_2\\right) \\tag{6.4}$$\n\n| 符号 | 含义 | 量纲 |\n|------|------|------|\n| $|R\\rangle, |L\\rangle$ | 右旋 / 左旋圆偏振（光子螺旋度为 $\\pm 1$） | — |\n| $|F\\rangle$ | 双光子末态，总角动量为零 | — |\n\n**解法要点**：利用 $|R\\rangle = (|x\\rangle + i|y\\rangle)/\\sqrt{2}$、$|L\\rangle = (|x\\rangle - i|y\\rangle)/\\sqrt{2}$ 展开：\n\n$$|F\\rangle = \\frac{i}{\\sqrt{2}}\\left(|x\\rangle_1|y\\rangle_2 + |y\\rangle_1|x\\rangle_2\\right) \\tag{6.5}$$\n\n（整体相位 $i$ 无物理意义。）这正是 $|\\Psi^+\\rangle$ 型的 Bell 态。费曼由此直接读出两条结论：\n\n$$\\langle x_1 y_2 | F \\rangle = i \\;\\Rightarrow\\; P(\\text{一侧 } x,\\ \\text{另一侧 } y) = 1, \\qquad \\langle x_1 x_2 | F \\rangle = 0 \\tag{6.6}$$\n\n即：一侧测得 $x$ 偏振，另一侧必为 $y$ 偏振——完美关联（注意 $|\\Psi^+\\rangle$ 是关联，而 $|\\Psi^-\\rangle$ 是反关联，符号约定不同）。\n\n**费曼对\"佯谬\"的处理**（逐字转述其论证结构，见 Vol. III 页 18-8 至 18-9）：EPR 式推理可拆成六步，其中第 (1)(2)(4)(6) 步都正确，错误出在第 (3) 步——\n\n> \"Argument (3) says that by your measurement … you can determine which of two alternative events occurs for him … and that even if you do not make your measurement you can still say that his event will occur either by one alternative or the other. But it was precisely the point of Chapter 37, Vol. I, to point out right at the beginning that this is not so in Nature.\"\n\n即：不能因为\"做了测量就能确定对方结果\"，就推出\"不做测量时对方结果也已确定\"。费曼给出的严格说法是：\n\n> \"If you could determine for each one of your photons whether it was RHC and LHC, and also whether it was x-polarized (all for the same photon) there would indeed be a paradox. But you cannot do that—it is an example of the uncertainty principle.\"\n\n![历代 Bell 检验实测值与两条界线的对比](figures/EPR与Bell不等式_实验时间线.svg)\n\n*图 2：selected experiments 报告的 CHSH / Bell 参数值。误差棒为原文给出的不确定度。全部数据点落在 2 与 2√2 之间，即超出定域实在论而未超出量子上限。（Freedman & Clauser 1972 因原文采用前身形式，未代入 S 数值。）*\n\n**与宝石学笔记的呼应**：费曼在构造这个思想实验时，用的分束元件正是**方解石**（\"something like a piece of calcite which separated the photons into x-polarized and y-polarized beams\"）——即宝石学笔记中反复出现的双折射晶体。同一块方解石，在费曼这里是制备/分析纠缠光子的偏振分束器，在宝石学笔记中是产生 o 光与 e 光的双折射介质。两者的区别不在元件，而在**入射光是否为单光子数态**（见《双折射后的光是否纠缠态》第 4.1 节）。\n\n---\n\n## 七、历史脉络与学术争议\n\n### 7.1 提出动机\n\n**EPR 当时要解决的问题**：量子力学在 1926–1927 年定型后，其预言能力无可置疑，但它对\"物理实在\"的描述方式与经典物理的根本要求之间存在张力。爱因斯坦等人关心的是：**量子力学的波函数到底是描述了单个系统的真实状态，还是只描述了系综的统计？**\n\n此前的争论（1927 年索尔维会议及之后）都是\"就诠释论诠释\"，无法诉诸实验。EPR 的推进在于：他们不再质疑量子力学的正确性，而是**构造一个逻辑论证**，从两个看起来无可辩驳的前提出发，推出\"量子力学不完备\"：\n\n1. **完备性判据**：若能在不以任何方式干扰系统的情况下，以概率 1 预言某物理量的值，则存在与该量对应的物理实在要素。\n2. **定域性**：对系统 1 的操作不能影响系统 2 的真实状态（二者空间分离）。\n\n以连续变量（位置-动量）EPR 态为例：测量粒子 1 的位置可确定粒子 2 的位置，测量粒子 1 的动量可确定粒子 2 的动量；由于二者类空间隔，粒子 2 的状态不应受影响，因此粒子 2 必须**同时**具有确定的位置与动量——而量子力学不允许。故量子力学不完备。\n\n**此前理论卡在哪里**：1932 年冯·诺依曼曾\"证明\"隐变量理论不可能，但该证明的假设过强（Bell 在 1966 年的 *RMP* 38, 447 中指出这一点）。同时，EPR 用的是连续变量（位置、动量），在实验上无从下手。\n\n### 7.2 历史节点\n\n| 年份 | 人物 | 贡献 | 文献 |\n|------|------|------|------|\n| 1935 | Einstein, Podolsky, Rosen | 提出 EPR 论证，质疑量子力学完备性 | *Phys. Rev.* 47, 777–780 |\n| 1935 | Bohr | 同年同刊回应，主张量子现象不可脱离测量装置谈论 | *Phys. Rev.* 48, 696–702 |\n| 1935 | Schrödinger | 造出\"Verschränkung\"（纠缠）一词，指出这是量子力学的特征性性质 | 见第 29 篇《量子纠缠》 |\n| 1951 / 1957 | Bohm / Bohm & Aharonov | 把 EPR 论证改写为自旋 1/2 的离散版本，使其具备实验可操作性 | *Quantum Theory* (1951)；*Phys. Rev.* 108, 1070–1076 |\n| 1952 | Bohm | 提出显式非定域的隐变量理论，证明\"隐变量不可能\"的说法不成立 | *Phys. Rev.* 85, 166 / 85, 180 |\n| 1964 | Bell | 提出 Bell 定理：定域隐变量理论与量子力学在统计预言上不相容 | *Physics* 1, 195–200 |\n| 1966 | Bell | 指出冯·诺依曼\"不可能证明\"的假设过强 | *RMP* 38, 447–452 |\n| 1969 | Clauser, Horne, Shimony, Holt | CHSH 不等式：去掉完美关联假设，使实验检验真正可行 | *PRL* 23, 880–884 |\n| 1974 | Clauser & Horne | CH 不等式，显式处理未探测事件 | *Phys. Rev. D* 10, 526（卷期页待回溯核实） |\n| 1980 | Cirel'son | 证明量子关联的 CHSH 上界为 2√2（Tsirelson 界） | *Lett. Math. Phys.* 4, 93–100 |\n| 1989 | Werner | 构造纠缠但不违反任何 Bell 不等式的混合态 | *Phys. Rev. A* 40, 4277（卷期页待回溯核实） |\n| 1991 | Gisin；Popescu & Rohrlich | 任意纯纠缠态都违反某 Bell 不等式；提出达到代数上限 4 的 PR 盒 | 卷期页待回溯核实 |\n| 1992 | Popescu & Rohrlich | 证明无信号条件只给出 4 而非 2√2，量子非定域性\"不是最大的\" | *Found. Phys.* 24, 379（卷期页待回溯核实） |\n| 1993 | Eberhard | 证明优化量子态后，闭合探测漏洞所需效率可降至 2/3 | *PRA* 47, R747–750 |\n| 2015 | Hensen；Giustina；Shalm | 三项\"无漏洞\"Bell 检验 | 见 4.1.4 |\n| 2022 | Aspect, Clauser, Zeilinger | 诺贝尔物理学奖 | nobelprize.org |\n\n> **年份标注差异说明（规范第 2.4 节要求登记）**：Bell 的奠基论文 *Physics* 1, 195 在部分文献中标注为 1964 年、在另一些文献中标注为 1965 年（期刊封面名为三语 *Physics Physique Физика*，出版年标注存在不一致）。本套笔记统一采用 **1964**，并在此注明存在 1965 的标注。同理，Rowe 等人 (2001) 的 NIST 摘要页把 Bell 工作的起始年份写作 \"1965\"，属同一差异。\n\n### 7.3 当前争议与开放问题\n\n**争议一：Bell 违反意味着放弃了什么？**\n\n各方立场（**并列呈现，不做裁判**）：\n\n| 立场 | 放弃了什么 | 代价 |\n|------|-----------|------|\n| 哥本哈根式 | 放弃\"测量结果在测量前具有确定值\"（实在性） | 需要说明\"测量\"的特殊地位；测量问题 |\n| 玻姆力学 | 放弃定域性（显式非定域的导引波） | 与相对论协变的融合困难；需优选一个 foliation |\n| 多世界诠释 | 放弃单一结果（所有结果都实现） | 概率的来源与分支的本体论地位 |\n| GRW 自发坍缩 | 放弃严格的幺正演化（加入随机坍缩） | 引入新常数，与已知实验的相容性边界 |\n| QBism / 认识论进路 | 放弃\"量子态描述客观实在\"（态是主体的信念） | 需重构科学实在论 |\n| 超决定论 | 放弃测量选择的独立性 | 难以产生可检验的新预言；科学方法论层面受质疑 |\n\n**没有任何实验能在这些立场之间做出判定**——它们对 Bell 实验给出完全相同的统计预言。\n\n**争议二：为什么是 2√2？（开放问题）**\n\n无信号条件给出的代数上限是 4，量子力学停在 2√2。已提出的解释性原理包括信息因果性（information causality）、宏观定域性、排他性原理等，但尚无一条被公认为\"推出 Tsirelson 界的那个原理\"。这是当前量子基础研究的核心开放问题之一。\n\n**争议三：量子非定域性是一种\"资源\"还是一种\"病症\"？**\n\n量子信息进路把 Bell 违反当作可量化的资源（器件无关协议的基石）；基础问题进路则视其为理论不完备的症状。两种态度在技术上完全相容，分歧只在研究取向。\n\n> 本节内容随研究进展更新。上述\"开放问题\"的编号与表述基于本笔记撰写时可获得的文献，不排除后续有进展。\n\n### 7.4 与宝石学体系的一致性\n\n本篇与 `宝石学正式版/` 的《双折射后的光是否纠缠态》在以下物理量上必须保持一致，否则须记入《修订记录》：\n\n| 物理量 | 本篇取值 | 宝石学笔记取值 | 一致性 |\n|--------|---------|--------------|--------|\n| CHSH 定域界 | $\\|S\\| \\le 2$ | $\\|S\\| \\le 2$ | 一致 |\n| CHSH 量子最大值 | $2\\sqrt{2} \\approx 2.828$ | $2\\sqrt{2} \\approx 2.828$ | 一致 |\n| 双折射能否产生双光子纠缠 | 不能（线性光学，需 SPDC 等非线性过程） | 不能 | 一致 |\n| 单光子偏振-路径纠缠 | 数学上成立，但不直接体现 EPR 非定域性 | 同 | 一致 |\n\n---\n\n## 八、参考文献\n\n**S 级（奠基原始文献与标准数据）**\n\n- Einstein A., Podolsky B., Rosen N. (1935). Can Quantum-Mechanical Description of Physical Reality Be Considered Complete? *Physical Review*, 47(10), 777–780.\n- Bell J.S. (1964). On the Einstein Podolsky Rosen Paradox. *Physics*, 1, 195–200.（期刊封面名三语 *Physics Physique Физика*；部分文献标注为 1965 年，见 7.2 节说明）\n- Clauser J.F., Horne M.A., Shimony A., Holt R.A. (1969). Proposed Experiment to Test Local Hidden-Variable Theories. *Physical Review Letters*, 23(15), 880–884.\n- Freedman S.J., Clauser J.F. (1972). Experimental Test of Local Hidden-Variable Theories. *Physical Review Letters*, 28(14), 938–941.\n- Aspect A., Grangier P., Roger G. (1981). Experimental Tests of Realistic Local Theories via Bell's Theorem. *Physical Review Letters*, 47(7), 460–463.\n- Aspect A., Grangier P., Roger G. (1982). Experimental Realization of Einstein-Podolsky-Rosen-Bohm Gedankenexperiment: A New Violation of Bell's Inequalities. *Physical Review Letters*, 49(2), 91–94.\n- Aspect A., Dalibard J., Roger G. (1982). Experimental Test of Bell's Inequalities Using Time-Varying Analyzers. *Physical Review Letters*, 49(25), 1804–1807.\n- Cirel'son B.S. (1980). Quantum Generalizations of Bell's Inequality. *Letters in Mathematical Physics*, 4(2), 93–100.（作者姓氏亦转写为 Tsirelson）\n- Weihs G., Jennewein T., Simon C., Weinfurter H., Zeilinger A. (1998). Violation of Bell's Inequality under Strict Einstein Locality Conditions. *Physical Review Letters*, 81(23), 5039–5043.\n- Rowe M.A., Kielpinski D., Meyer V., Sackett C.A., Itano W.M., Monroe C., Wineland D.J. (2001). Experimental Violation of a Bell's Inequality with Efficient Detection. *Nature*, 409(6822), 791–794.\n- Hensen B., Bernien H., Dréau A.E., Reiserer A., Kalb N., Blok M.S., Ruitenberg J., Vermeulen R.F.L., Schouten R.N., Abellán C., Amaya W., Pruneri V., Mitchell M.W., Markham M., Twitchen D.J., Elkouss D., Wehner S., Taminiau T.H., Hanson R. (2015). Loophole-free Bell Inequality Violation Using Electron Spins Separated by 1.3 Kilometres. *Nature*, 526(7575), 682–686.\n- Giustina M., Versteegh M.A.M., Wengerowsky S., Handsteiner J., Hochrainer A., Phelan K., Steinlechner F., Kofler J., Larsson J.-Å., Abellán C., Amaya W., Pruneri V., Mitchell M.W., Beyer J., Gerrits T., Lita A.E., Shalm L.K., Nam S.W., Scheidl T., Ursin R., Wittmann B., Zeilinger A. (2015). Significant-Loophole-Free Test of Bell's Theorem with Entangled Photons. *Physical Review Letters*, 115(25), 250401.\n- S ling Assumption. *Nature* (2013). DOI: 10.1038/nature12012（卷期页待回溯核实）\n- Nielsen M.A., Chuang I.L. (2010). *Quantum Computation and Quantum Information* (10th anniversary ed.). Cambridge University Press.\n- Sakurai J.J., Napolitano J. (2011). *Modern Quantum Mechanics* (2nd ed.). Addison-Wesley.\n\n**B 级（专著、教材、权威综述与预印本）**\n\n- Feynman R.P., Leighton R.B., Sands M. (2010). *The Feynman Lectures on Physics*, Vol. III (New Millennium ed.). Basic Books. §18-3 \"The Annihilation of Positronium\"，页 18-7 至 18-9 讨论 EPR。（本地藏书：`WORKS/物理/The Feynman Lectures on Physics, Vol. III.pdf`）\n- Brunner N., Cavalcanti D., Pironio S., Scarani V., Wehner S. (2014). Bell Nonlocality. *Reviews of Modern Physics*, 86, 419–478.（arXiv:1303.2849；卷期页待回溯核实）\n- Larsson J., Gill R. 关于 Bell 检验漏洞的综述（2014）。*Journal of Physics A*, 47, 424003.（卷期页待回溯核实）\n- Stanford Encyclopedia of Philosophy, \"Bell's Theorem\"（Goldstein et al. 修订版）——作为**立场并列的线索来源**，任何具体数值仍回溯原始论文。\n- 施郁 (2023). 贝尔不等式的违反是如何确立的. 中科院物理所「量子春秋」专栏。（中文二手综述，仅作线索，数值已回溯 S 级来源）\n\n**待回溯核实条目（撰写时未能确认卷期页，暂不用于数值引用）**\n\n- Clauser J.F., Horne M.A. (1974). *Physical Review D* 10, 526.\n- Werner R.F. (1989). *Physical Review A* 40, 4277.\n- Gisin N. (1991).；Popescu S., Rohrlich D. (1992).；Greenberger D.M., Horne M.A., Zeilinger A. (1989).\n- Hensen B. et al. (2016). 追加 300 次试验的结果（$S = 2.38 \\pm 0.14$，2.7σ）.\n- Handsteiner J. et al. (2017). Cosmic Bell Test.；Rauch D. et al. (2018). 类星体设置选择实验.\n\n---\n\n*本篇版本：v1.0，2026年9月1日*\n*数学程度：L2（运算层）*\n*配套脚本：`code/EPR与Bell不等式_CHSH.py`；图形：`figures/EPR与Bell不等式_CHSH.svg`、`figures/EPR与Bell不等式_实验时间线.svg`*\n*姊妹篇交叉：《宝石学正式版/双折射后的光是否纠缠态》（单粒子纠缠与 EPR 非定域性的区分）*\n", "序.md": "# 量子力学系统笔记\n\n## 序\n\n量子力学是一门其形式体系与物理直觉严重脱节的学科。它的数学框架在 1926–1927 年间就已定型，此后近百年里，实验精度从定性验证推进到 5 个标准差的统计显著性，工程应用从光谱学推进到量子计算机，但\"它究竟意味着什么\"的争论从未停歇。这种\"算得极准、说不明白\"的双重性，决定了量子力学笔记不能按普通教科书的线性顺序写——写成一个概念一章的教材，读者拿到的是别人的思路；写成条目式的工具书，读者才能按自己的需要跳跃、对照、交叉验证。\n\n本套笔记因此沿用《宝石学系统笔记》已经跑通的架构：**以单个主题为条目单元，固定八节，每节承担明确的功能分工**。宝石学笔记以 29 种矿物 + 4 篇玉石 + 3 篇有机宝石 + 10 篇仪器量子光学构成 46 篇；本套笔记以 47 个量子力学主题构成，六大部分覆盖从双缝实验到量子引力。两者的八节存在清晰映射（详见《量子力学系统笔记整理规范》2.5 节），共享同一套方法论：三步流程、S/A/B/C 四级来源分级、反编造铁律、双层引用结构、统一参考文献与修订记录。\n\n之所以能这样做，是因为这两套笔记在 WORKS 目录下本就共享同一批资产：`物理/`目录中藏有 Feynman Lectures 三卷（卷 III 即量子力学，21 章，从\"量子行为\"讲到\"超导\"）与 Lederman & Hill《Quantum Physics for Poets》（10 章 + 附录 Spin）；`宝石学正式版/`中已经存在 4 篇量子力学与宝石学的交叉专题（双折射的量子力学解释、双折射后的光是否纠缠态、宝石紫外荧光的量子力学解释、长石族光学效应的量子力学与物理光学分析）。本套笔记要做的，是把散落在宝石学笔记里的量子片段，重新接回量子力学的正统体系，并向上补齐它们所缺的上游理论——晶体场理论、色心的量子描述、光谱选择定则、介电张量的第一性原理计算。\n\n本套笔记的内容分为六大部分：\n\n**第一部分：量子行为与基础概念（10 篇）**。从 Feynman 卷 III 第 1 章的\"子弹—水波—电子\"三实验出发，建立概率幅与不可区分性的直觉，随后按历史顺序展开能量量子化、光子、物质波，再到叠加原理与测量理论。这一部分的定位是\"把直觉打碎再重建\"，适合作为通读主线。\n\n**第二部分：形式体系与数学结构（10 篇）**。希尔伯特空间、算符代数、薛定谔方程、一维问题、谐振子、角动量、氢原子、绘景与密度矩阵、微扰论、路径积分。这一部分是全套装的工具箱，其余各部分都依赖它。\n\n**第三部分：多体、对称与凝聚态（8 篇）**。从全同粒子与泡利原理出发，经分子成键、能带论、半导体，到量子统计、超导与量子霍尔效应。对应 Feynman 卷 III 第 13–15 章与第 21 章的内容主线。\n\n**第四部分：量子信息与量子光学（8 篇）**。纠缠、EPR 与 Bell 不等式、退相干、量子密钥分发、隐形传态、量子计算、光场量子化、腔 QED 与物理实现。这一部分是近三十年发展最快的领域，也是宝石学笔记中\"双折射后的光是否纠缠态\"那篇的真正归属——它的问题意识在这里才能得到完整回答。\n\n**第五部分：相对论量子理论与前沿（5 篇）**。克莱因-戈登方程、狄拉克方程、反粒子、量子场论基本图像、量子引力与全息。对应 Lederman & Hill 第 8–9 章的范围，定位为开窗口而非展开体系。\n\n**第六部分：交叉应用——量子力学与宝石学（6 篇）**。晶体场与配位场理论、过渡金属致色、色心与晶格缺陷、光谱学仪器的量子基础、矿物光学性质的第一性原理计算，以及一篇专门辨析宝石学中常见量子误用的条目。这一部分把本套笔记与宝石学笔记缝合起来。\n\n使用本套笔记时，建议读者注意以下几点：\n\n1. **数据来源**：所有基本物理常数以 CODATA 推荐值（NIST 在线版）为第一优先级，须注明版本；实验数据回溯原始论文，不转引二手数值。核心理论表述以 Feynman Lectures Vol. III、Dirac、Sakurai、Landau & Lifshitz 为权威依据。如对某一表述存疑，请优先查阅原始文献。\n2. **数学程度分层**：每篇笔记头部标注 L1/L2/L3（概念层/运算层/推导层）。读者可按自己的需要选择深度——L1 条目不要求推导即可读懂结论，L3 条目要求能跟随完整算符代数。不必因为某篇标注 L3 而绕行，也不必因为某篇标注 L1 而轻视。\n3. **诠释问题保持中立**：凡涉及量子力学诠释的分歧（哥本哈根、多世界、德布罗意-玻姆、GRW、QBism），本套笔记并列各方立场，说明各自处理了什么、代价是什么，不断言某一方为正确答案。这是有意为之——近百年的争论没有产生实验判定，笔记没有资格替读者做决定。\n4. **科普比喻须去魅**：诸如\"电子同时通过两条缝\"\"薛定谔猫半死半活\"这类通俗说法，本套笔记在保留其直观价值的同时，一律标注为通俗表述并给出严格说法。比喻是理解的脚手架，不是物理本身。\n5. **交叉一致性**：与宝石学笔记重叠的物理量（如 Cr³⁺ 能级、方解石双折射率）在本套笔记中须与宝石学笔记数值一致；出现分歧时以 S 级来源为准，并记入《修订记录》。\n\n最后需要说明的是，本套笔记的初衷与宝石学笔记一致——不是要替代教科书，而是要建立一份**可检索、可核对、可修订**的条目式参考。教科书负责循序渐进地教，笔记负责在你需要确认\"贝尔不等式到底被违反了多少个标准差\"时，给出一个带出处的数字。\n\n---\n\n## 目录\n\n### 第一部分：量子行为与基础概念（10 篇）\n\n| 序号 | 文档 | 核心内容 | 数学程度 |\n|------|------|---------|---------|\n| 1 | 量子行为 | 子弹/水波/电子三实验、概率幅、不可区分性、量子力学第一原理、看一眼就破坏干涉 | L1 |\n| 2 | 波粒二象性与德布罗意关系 | λ=h/p 与 E=ħω、戴维孙-革末实验、单电子双缝的逐点累积 | L2 |\n| 3 | 黑体辐射与能量量子化 | 紫外灾难、普朗克定律、维恩位移、h 的首次测定 | L2 |\n| 4 | 光电效应与光子 | 爱因斯坦 1905、逸出功、截止频率、瞬时发射、密立根验证 | L1 |\n| 5 | 康普顿散射 | Δλ=(h/m_ec)(1−cosθ)、康普顿波长 2.426 pm、光子动量的直接证据 | L2 |\n| 6 | 原子光谱与玻尔模型 | 里德伯公式、巴尔末系、定态跃迁、对应原理、模型的成功与崩塌处 | L2 |\n| 7 | 物质波包与波粒统一 | 相速度/群速度、波包扩散、E=ħω 与 p=ħk 的一致性 | L2 |\n| 8 | 不确定性关系 | ΔxΔp≥ħ/2、傅里叶带宽定理、制备不确定度 vs 测量扰动、能量-时间关系争议 | L2 |\n| 9 | 量子态与叠加原理 | 态矢量、线性叠加、相位与相干性、与经典叠加的本质区别 | L2 |\n| 10 | 测量理论与波函数坍缩 | 投影测量、von Neumann 测量模型、POVM、量子芝诺效应 | L3 |\n\n### 第二部分：形式体系与数学结构（10 篇）\n\n| 序号 | 文档 | 核心内容 | 数学程度 |\n|------|------|---------|---------|\n| 11 | 希尔伯特空间与狄拉克符号 | 态空间、内积与范数、完备性、 bra-ket 记号、离散谱与连续谱 | L2 |\n| 12 | 算符、对易关系与表象 | 可观测量与厄米算符、对易子、本征值谱、位置/动量表象、矩阵表示 | L3 |\n| 13 | 薛定谔方程 | 含时与定态形式、概率流连续性方程、定态的一般性质 | L2 |\n| 14 | 一维势场、势垒与量子隧穿 | 无限深势阱、有限方势阱、δ 势、隧穿系数、WKB 近似 | L3 |\n| 15 | 量子谐振子 | 升降算符解法、零点能、波函数与厄米多项式、相干态 | L3 |\n| 16 | 角动量与自旋 | [L_i, L_j]=iħε_ijk L_k、升降算符、泡利矩阵、自旋 1/2、Clebsch-Gordan 系数 | L3 |\n| 17 | 中心力场与氢原子 | 分离变量、球谐函数、径向方程、能级与简并度、塞曼分裂 | L3 |\n| 18 | 绘景变换与密度矩阵 | 薛定谔/海森堡/相互作用绘景、纯态与混合态、约化密度矩阵、冯诺依曼熵 | L3 |\n| 19 | 微扰论与变分法 | 定态非简并/简并微扰、含时微扰与跃迁概率、变分原理、氦原子基态估算 | L3 |\n| 20 | 路径积分与传播子 | 费曼 1948、作用量与相位、传播子、经典极限 ħ→0、与薛定谔方程等价性 | L3 |\n\n### 第三部分：多体、对称与凝聚态（8 篇）\n\n| 序号 | 文档 | 核心内容 | 数学程度 |\n|------|------|---------|---------|\n| 21 | 全同粒子与泡利不相容原理 | 交换对称性、玻色子与费米子、自旋统计定理、黑体辐射的玻色推导 | L3 |\n| 22 | 多电子原子与元素周期表 | 中心场近似、壳层结构、洪特规则、屏蔽与有效核电荷 | L2 |\n| 23 | 分子结构与化学键 | H₂⁺ 分子离子、H₂ 共价键、交换积分、苯分子 π 电子 | L3 |\n| 24 | 晶体中的电子与能带 | 布洛赫定理、能带与带隙、有效质量、态密度、导体/绝缘体/半导体判据 | L3 |\n| 25 | 半导体与 pn 结 | 电子与空穴、掺杂、霍尔效应、pn 结整流、晶体管原理 | L2 |\n| 26 | 量子统计 | 玻色-爱因斯坦分布、BEC、费米气体与简并压、液氦超流 | L3 |\n| 27 | 超导电性与宏观量子现象 | 库珀对、BCS 能隙、迈斯纳效应、磁通量子化、约瑟夫森结 | L3 |\n| 28 | 量子霍尔效应 | 朗道能级、整数量子霍尔、边缘态、分数量子霍尔与拓扑序 | L3 |\n\n### 第四部分：量子信息与量子光学（8 篇）\n\n| 序号 | 文档 | 核心内容 | 数学程度 |\n|------|------|---------|---------|\n| 29 | 量子纠缠 | 不可分态定义、 separable 判据、纠缠熵、PPT 判据、纠缠 Witness | L3 |\n| 30 | [EPR 佯谬与贝尔不等式](./EPR佯谬与贝尔不等式_系统笔记.md) | EPR 1935、Bell 1964、CHSH 1969、Aspect 1982（5σ）、Weihs 1998、漏洞闭合 | L2 |\n| 31 | 量子测量与退相干 | 环境诱导退相干、指针基、退相干时间尺度、量子-经典边界 | L3 |\n| 32 | 量子密钥分发 | BB84、E91、无克隆定理、安全性证明、现实系统与攻击 | L2 |\n| 33 | 量子隐形传态与密集编码 | 协议步骤、经典比特与纠缠资源消耗、实验实现 | L2 |\n| 34 | 量子计算与量子算法 | 量子比特、通用门集、Deutsch-Jozsa、Shor、Grover、量子纠错与容错阈值 | L3 |\n| 35 | 光场量子化与相干态 | 电磁场模式量子化、Fock 态、相干态、压缩态、光子统计与 g⁽²⁾ | L3 |\n| 36 | 腔量子电动力学与量子比特实现 | Jaynes-Cummings 模型、Rabi 振荡、超导量子比特、离子阱、中性原子 | L3 |\n\n### 第五部分：相对论量子理论与前沿（5 篇）\n\n| 序号 | 文档 | 核心内容 | 数学程度 |\n|------|------|---------|---------|\n| 37 | 克莱因-戈登方程 | 相对论性能量动量关系、协变化、负概率密度困难、适用范围 | L3 |\n| 38 | 狄拉克方程 | 开平方问题、γ 矩阵、自旋的自然涌现、氢原子精细结构 | L3 |\n| 39 | 反粒子与狄拉克海 | 正电子的预言与 1932 年发现、狄拉克海的困难、量子场论的处理 | L2 |\n| 40 | 量子场论的基本图像 | 场的正则量子化、粒子即场的激发、费曼图与微扰展开、真空涨落 | L3 |\n| 41 | 量子引力与全息原理 | 引力量子化障碍、霍金辐射、黑洞信息悖论、AdS/CFT、弦论与景观 | L1 |\n\n### 第六部分：交叉应用——量子力学与宝石学（6 篇）\n\n| 序号 | 文档 | 核心内容 | 数学程度 |\n|------|------|---------|---------|\n| 42 | 晶体场与配位场理论 | d 轨道在配位场中的分裂、Δ_o 与 Δ_t、Tanabe-Sugano 图、选择定则 | L3 |\n| 43 | 过渡金属离子致色的量子机制 | d-d 跃迁与 Laporte 规则、Fe²⁺→Ti⁴⁺ 电荷转移、Cr³⁺ 能级与 694 nm R 线 | L2 |\n| 44 | 色心与晶格缺陷的量子描述 | F 心、钻石 NV 中心、空穴色心、天河石 Pb⁺-O⁻、辐照致色 | L2 |\n| 45 | 光谱学仪器的量子基础 | 拉曼散射与极化率、红外吸收与振动模式、荧光与磷光动力学、选择定则 | L2 |\n| 46 | 矿物光学性质的第一性原理计算 | 介电张量的量子表达、Kubo 线性响应、双折射的从头算、DFT 方法 | L3 |\n| 47 | 宝石学中的量子误用辨析 | 线性双折射能否产生纠缠、R 线是吸收还是发射、色心归属错误等常见误判 | L2 |\n\n---\n\n## 辅助文档\n\n- **《量子力学系统笔记整理规范》**：八节结构定义、来源分级、写作禁忌、质量检查清单\n- **《参考文献》**：全部笔记引用文献的统一汇编，按 S/A/B/C 四级分级标注，去重编号\n- **《修订记录》**：交叉验证过程中发现并修正的问题记录，含原文错误、修正内容、依据来源\n- **《README》**：项目概述与文件清单\n\n## 配套资产目录\n\n```\n量子力学正式版/\n├── code/        可复现数值脚本（numpy/scipy/matplotlib）\n├── data/        常数表 JSON（对齐 CODATA 版本）\n├── figures/     图形资产（优先 SVG）\n└── （笔记 .md 文件置于本目录根）\n```\n\n---\n\n*架构版本：v1.0，2026年9月1日*\n*计划篇数：47 篇正式文档 + 4 篇辅助文档（序、规范、参考文献、修订记录）*\n*撰写进度：1 / 47（第 30 篇《EPR佯谬与贝尔不等式》v1.0，2026年9月1日）*\n*说明：目录中已加链接的条目为已完成的正文，未加链接者为待撰写*\n*一手资料：WORKS/物理/ 目录下 Feynman Lectures Vol. I–III、Lederman & Hill《Quantum Physics for Poets》*\n*姊妹篇：WORKS/宝石学正式版/（46 篇，共享方法论与部分交叉主题）*\n", "量子力学系统笔记整理规范.md": "# 量子力学系统笔记整理规范\n\n> 本规范定义《量子力学系统笔记》系列文档的写作标准，适用于所有主题/概念/系统笔记。\n>\n> 本规范是《系统宝石学笔记整理规范》的同构移植：宝石学笔记以「单矿物条目」为单元、固定八节；本套笔记以「单个量子力学主题条目」为单元，同样固定八节。两套笔记共享同一套方法论——三步流程、来源分级、反编造铁律、双层引用、统一参考文献与修订记录。\n\n---\n\n## 一、整理流程\n\n每篇笔记的产出严格遵循三步流程：\n\n1. **Research（资料调研）**\n   - 优先查阅权威来源，按可信度从高到低排列：\n     - **S级（奠基原始文献与标准数据）**：奠基性原始论文（Einstein-Podolsky-Rosen 1935、Bell 1964、Dirac 1928、Feynman 1948 等）；CODATA 基本物理常数推荐值（NIST 在线版）；Particle Data Group《Review of Particle Physics》；诺贝尔奖官方资料（nobelprize.org）；经典权威专著（Feynman Lectures、Dirac《Principles of Quantum Mechanics》、Sakurai《Modern Quantum Mechanics》、Landau & Lifshitz《Quantum Mechanics》）；权威综述（*Reviews of Modern Physics*、*Physics Reports*）\n     - **A级（同行评审研究论文与权威教材）**：PRL / PRX / PRA / Nature Physics / Science / Nature 的研究与综述论文；Nielsen & Chuang《Quantum Computation and Quantum Information》、Cohen-Tannoudji《Quantum Mechanics》、Griffiths《Introduction to Quantum Mechanics》、Shankar《Principles of Quantum Mechanics》、Scully & Zubairy《Quantum Optics》\n     - **B级（专著章节、教材与预印本）**：专题专著章节、会议论文集、中文教材与权威译著（如曾谨言《量子力学》、喀兴林《高等量子力学》）、**arXiv 预印本（必须显式标注「未经同行评审」）**\n     - **C级（科普与百科）**：Lederman & Hill《Quantum Physics for Poets》、Feynman《QED: The Strange Theory of Light and Matter》、Wikipedia、知乎与自媒体文章、AI 生成内容——**仅作线索，任何数据、年份、公式、人名归属均不可直接引用**\n   - **本地优先**：本套笔记的一手资料以 `WORKS/物理/` 目录下的文献为准——Feynman Lectures Vol. I/II/III（卷 III 为量子力学主线，21 章）、Lederman & Hill《Quantum Physics for Poets》（10 章 + 附录 Spin）。引用时须核对原书章节号与页码\n   - 涉及实验数据须查阅原始论文，不使用二手转述的数值\n\n2. **整理笔记**\n   - 按本规范的章节结构组织内容\n   - 数值须给出具体量级与不确定度，避免模糊描述\n   - **严禁编造数据**：任何常数、年份、人名归属、公式系数必须有文献来源支撑，查不到的内容宁可省略，不得臆造或推测填充\n   - **公式必须逐个符号说明**：每个公式后紧跟符号表（符号、含义、单位/量纲），不允许出现未定义的符号\n\n3. **交叉验证（Cross-verification）——严格执行**\n   - **拒绝编造内容**：所有事实性陈述（常数数值、实验年份、人名与贡献的对应、公式形式）必须有至少一个 S 级或 A 级来源支持\n   - 关键物理常数须在**至少两个独立来源**中核对一致，并注明所采用的常数版本（如「CODATA 2018」或「CODATA 2022」）；不同版本数值有差异时给出差异值\n   - 实验结果的描述须与原始论文的摘要/结论一致，包括显著性水平与误差棒\n   - **人名-年份-贡献三元组是高危区**：如「贝尔不等式」原始论文为 Bell (1964) *Physics* 1, 195–200，部分文献因期刊出版年标注差异标为 1965——此类情形须注明差异而非择一断言\n   - 若某信息仅见于 C 级来源且无法交叉验证，不予收录；若存在学术争议（如量子力学的诠释分歧），须并列各方立场并说明争议点，**不得站队**\n   - 推导过程须自洽：公式的前后步之间不得跳步，量纲须一致，极限情形须回到已知结果\n\n---\n\n## 二、文档格式\n\n### 2.1 文件命名\n- 概念/主题类：`{中文名}_系统笔记.md`（例：`量子纠缠_系统笔记.md`、`不确定性关系_系统笔记.md`）\n- 系统/模型类：`{系统名}_系统笔记.md`（例：`谐振子_系统笔记.md`、`氢原子_系统笔记.md`）\n- 交叉专题类：`{专题名}_系统笔记.md`（例：`晶体场理论_系统笔记.md`）\n\n### 2.2 标题格式\n- 文件首行：`# {中文名}（{English Name}）系统量子力学笔记`\n- 副标题（第二行）：blockquote 行，格式 `> **{分类归属} · {数学程度：L1/L2/L3} · {前置依赖：…}**`\n  - **数学程度分级**（供读者按需取用）：\n    - **L1 概念层**：不要求推导，可用比喻与图像理解，公式仅作结论呈现\n    - **L2 运算层**：要求能代入公式做计算，理解各量如何取值\n    - **L3 推导层**：要求能跟随完整推导，涉及算符代数/微分方程/群论工具\n  - 前置依赖填写本套笔记中的篇名，若是首篇则填「无」\n- 第三行：blockquote 行，`> **验证依据**：{来源1}、{来源2}、{来源3}……`\n\n### 2.3 数学程度与物理量的标注\n- 每篇笔记头部须声明所采用的**单位制**（SI / 高斯单位制 / 自然单位 ħ=c=1 / 原子单位），全文统一，中途不得切换\n- 所有数值须标注不确定度或有效数字位数；来自 CODATA 的数值须注明版本\n- ħ 与 h、2π 因子、度规号差、傅里叶变换约定——这四项是符号约定高危区，须在「数学结构」一节开头集中声明本篇约定\n\n### 2.4 Reference（参考文献）规范\n\n每篇笔记采用「头部验证依据 + 文末参考文献」双层引用结构：\n\n**（1）头部验证依据（文件第三行 blockquote）**：\n- **位置**：文件第三行（副标题之后），用 blockquote 引用块\n- **格式**：`> **验证依据**：{来源1}、{来源2}、{来源3}……`\n- **来源之间用顿号（、）分隔**，不编号\n- **来源标注格式**（简写格式，仅作者+年份+期刊/书名）：\n  - 期刊论文：第一作者 et al. (年份) *期刊名缩写*（例：`Aspect et al. (1982) PRL`）\n  - 专著/教材：作者 *书名* 版次 (年份)（例：`Sakurai & Napolitano Modern Quantum Mechanics 2nd ed. (2011)`）\n  - 原始文献：作者 (年份)（例：`Bell (1964)`）\n  - 数据标准：CODATA {版本}、PDG {年份}\n  - 本地藏书：Feynman Lectures Vol. III, Ch. {n}；Lederman & Hill, Ch. {n}\n- **可信度分级标注**：S/A 级来源优先列出，B 级标注「（教材）」或「（预印本，未经同行评审）」，C 级一般不入验证依据\n\n**（2）文末参考文献（第八节）**：\n- **位置**：第七节「历史脉络与学术争议」之后，`## 八、参考文献`\n- **格式**：按 S/A/B 级排列，每条包含：作者、(年份)、**标题/书名**、出版物信息（期刊名、卷、页码；或出版社、版次）\n- **每条参考文献单独一行**，使用无序列表 `- ` 开头\n- **示例格式**：\n  - 期刊：`- Aspect A., Dalibard J., Roger G. (1982). Experimental Test of Bell's Inequalities Using Time-Varying Analyzers. Physical Review Letters, 49(25), 1804–1807.`\n  - 专著：`- Sakurai J.J., Napolitano J. (2011). Modern Quantum Mechanics (2nd ed.). Addison-Wesley.`\n  - 原始文献：`- Einstein A., Podolsky B., Rosen N. (1935). Can Quantum-Mechanical Description of Physical Reality Be Considered Complete? Physical Review, 47(10), 777–780.`\n  - 数据标准：`- CODATA (2022). Recommended Values of the Fundamental Physical Constants. NIST. https://physics.nist.gov/cuu/Constants/`\n  - 本地藏书：`- Feynman R.P., Leighton R.B., Sands M. (2010). The Feynman Lectures on Physics, Vol. III (New Millennium ed.). Basic Books.`\n- **原则**：头部验证依据是来源清单（让读者快速看到本篇依据哪些权威来源），文末参考文献是详细列表（让读者可追溯到具体论文/著作）\n- 正文中可在关键论断处用括号标注来源（如「据 Aspect et al. (1982)，违反 Bell 不等式达 5 个标准差」），关键实验数据与常数必须标注\n\n### 2.5 章节结构（固定八节）\n\n所有笔记严格按以下八节组织，不增加「学习建议」「名人轶事」「哲学畅想」等冗余章节：\n\n```\n## 一、概念与定位\n## 二、数学结构\n## 三、物理量与特征尺度\n## 四、实验基础与观测证据\n## 五、分类体系与物理机制\n## 六、典型系统与可解模型\n## 七、历史脉络与学术争议\n## 八、参考文献\n```\n\n各节下可设子节（###），子节编号格式为 `X.Y`，不设三级以下标题。\n\n**八节与宝石学笔记的映射关系**（说明本套架构的来源与合理性）：\n\n| 宝石学八节 | 量子力学八节 | 映射逻辑 |\n|-----------|-------------|---------|\n| 一、概述 | 一、概念与定位 | 同构：定义、词源、核心特征辨识度 |\n| 二、晶体结构 | 二、数学结构 | 「对象的内部结构」→「理论的内部结构」 |\n| 三、物理性质 | 三、物理量与特征尺度 | 同构：可查表的数值参数 |\n| 四、光学性质（核心观测章节） | 四、实验基础与观测证据（核心章节） | 「可观测量如何呈现」——宝石学看光谱，物理看实验 |\n| 五、品种分类与致色机理 | 五、分类体系与物理机制 | 同构：分类 + 内在机制 |\n| 六、内含物 | 六、典型系统与可解模型 | 「具体可见之物」→「具体可解剖、可计算的样本」 |\n| 七、产地详情 | 七、历史脉络与学术争议 | 「来源与演化」→「概念的来源与演化」 |\n| 八、参考文献 | 八、参考文献 | 同构 |\n\n---\n\n## 三、各节内容规范\n\n### 3.1 概念与定位（一）\n- 一句话定义该主题（含其数学表达，如「纠缠：复合系统无法写成子系统直积态的量子态」）\n- 名称由来（中英文词源，如「量子」quantus、「纠缠」Verschränkung/Entanglement 的词义演变）\n- 用编号列表列出 **3–6 条核心特征**，突出该主题的辨识度：\n  - 最反直觉/最标志性的性质\n  - 该主题区别于相邻概念的关键判据\n  - 特征性的数学结构（如对易关系、对称性）\n  - 在理论体系或技术中的地位（如有）\n- 一段过渡文字说明其在量子力学体系中的位置：依赖哪些前置概念、通向哪些后续主题\n\n### 3.2 数学结构（二）\n子节建议结构：\n- **符号约定声明**（本篇采用的表象、单位制、傅里叶变换约定、度规号差、ħ 与 2π 的处理）\n- **态空间与态的描述**：希尔伯特空间、态矢量/波函数/密度矩阵，说明本篇采用哪种描述及理由\n- **算符与可观测量**：算符形式、对易关系、本征值谱（离散/连续）\n- **核心方程**：给出方程本身 + 逐符号说明表（符号、含义、量纲）\n- **表象与变换**：位置/动量/能量表象，表象间的变换规则，绘景（薛定谔/海森堡/相互作用）\n- **对称性与守恒量**：对应的变换群、生成元、守恒量\n- **与其他表述的等价关系**（如适用）：波动力学 ↔ 矩阵力学 ↔ 路径积分\n\n> 推导须完整可跟随，不得跳步；关键步骤旁可标注所用定理（如「由 Ehrenfest 定理」）。\n\n### 3.3 物理量与特征尺度（三）\n统一用表格呈现，列名「物理量」「符号」「数值/量级」「适用条件」，必含项：\n- 相关基本常数（注明 CODATA 版本与不确定度）\n- 该主题的特征长度/能量/时间尺度\n- **量子效应显著的判据**（如德布罗意波长与特征尺度之比、能级间距与 k_BT 之比）\n- 相关的无量纲量（如精细结构常数 α）\n- 典型体系的数值示例\n\n> 不设与主题无关的背景常数堆砌。数值必须给量级与条件，禁止孤立的数字。\n\n### 3.4 实验基础与观测证据（四）——核心章节\n本子节是笔记的重点，须从「实验如何判定」角度深挖。\n\n子节建议结构：\n- **关键实验**：装置描述、实验做法、原始结果数值、精度/显著性（如「违反 Bell 不等式达 5 个标准差」）\n- **里程碑实验时间线表格**：列年份、实验者、装置/体系、关键结果\n- **被排除的替代理论**：说明该实验排除了什么（如定域隐变量理论）\n- **常见误读纠正**（用 blockquote 突出）：\n  - 例：双缝实验中「电子同时通过两条缝」是通俗说法，严格表述为「概率幅的两个不可区分路径发生干涉，任何路径探测都会破坏干涉」\n  - 例：不确定性关系不是「测量扰动」，而是态的内禀性质（须区分制备不确定度与测量扰动）\n- **实验局限与未闭合的漏洞**（如适用）：如探测效率漏洞、定域性漏洞，以及后续实验如何闭合\n\n### 3.5 分类体系与物理机制（五）\n- 用表格列出分类（类型、特征、数学判据、典型实例）\n- 机制解释：从数学结构到物理现象的因果链条，须落到具体跃迁/耦合/对称性破缺等层面\n- **概念辨析**：澄清常见的混淆（如「态叠加」与「统计混合」、「纠缠」与「经典关联」），但**禁止做优劣比较或主观排序**\n- **适用范围与失效边界**：明确该描述在什么条件下成立、什么条件下失效\n\n> 参照宝石学规范精神：不做「XX 与 YY 的鉴别对比表」式的清单堆叠，辨析服务于澄清概念，不服务于记忆口诀。\n\n### 3.6 典型系统与可解模型（六）\n- 给出 **2–4 个具体实例**，每个含：\n  - 系统设定（哈密顿量、边界条件、参数取值）\n  - 解法要点（解析或数值方法）\n  - 可观测量结果与物理意义\n  - 数量级估计（代入具体数值）\n- 至少包含一个**解析可解**实例与一个**需数值求解**的实例\n- 数值实例须配可复现脚本（见第六节「计算与可视化资产规范」）\n\n### 3.7 历史脉络与学术争议（七）\n- 开头先用一段文字概述该概念的**提出动机**（当时要解决什么问题、此前理论卡在哪里）\n- 用表格列出历史节点：年份、人物、贡献、文献\n- **当前争议与开放问题**：并列各方立场（如哥本哈根诠释/多世界诠释/德布罗意-玻姆理论/GRW 自发坍缩/QBism），说明各自处理了什么、代价是什么，**不得断言某一方为正确答案**\n- 明确标注本节内容可能随研究进展更新\n- 时间线中人物的贡献须精确到具体文献，不写「某人晚年提出」之类的模糊表述\n\n### 3.8 参考文献（八）\n见 2.4 节「文末参考文献」规范。\n\n---\n\n## 四、写作禁忌（严格禁止）\n\n| 禁止内容 | 说明 |\n|---------|------|\n| **编造/臆造内容** | 任何常数、年份、人名归属、公式系数必须有文献来源。查不到的内容宁可省略，不得凭空编造、推测填充、或将 AI 训练中的模糊记忆当作事实写入。 |\n| **无来源的\"研究表明\"** | 禁止出现「研究表明」「实验证明」而不给出具体文献。 |\n| **未定义符号的公式** | 公式中出现的每个符号必须在本篇中有明确定义与量纲说明。 |\n| **跳步的推导** | 关键推导不得跳步，不得用「显然」「易得」掩盖实质步骤。 |\n| **诠释站队** | 涉及量子力学诠释分歧时并列各方立场，禁止断言某诠释为唯一正确（除该问题已有实验判定）。 |\n| **科普简化当严格表述** | 科普书中的比喻（如「薛定谔猫真的半死半活」）须标注为通俗说法，并给出严格表述。 |\n| **主观评价/营销语言** | 避免「最优美的方程」「颠覆认知的发现」等修辞；客观描述地位与影响。 |\n| **模糊表述** | 所有物理量给数值量级，避免「极大」「极小」而不给数据。 |\n| **学习建议/励志内容** | 不设「学习路线」「如何学好量子力学」「名人励志故事」等章节。 |\n| **未经核实的转引** | 不转引他人文献中的二手数值；须回溯原始论文。 |\n| **仿品对比式清单** | 不做「XX 与 YY 的区别（背诵版）」这类脱离物理机制的对比表堆砌。 |\n\n---\n\n## 五、Markdown 与公式格式约定\n\n- 章节间用 `---` 分隔线\n- 表格使用标准 Markdown 表格语法\n- **数学公式**：行内公式用 `$...$`，独立公式用 `$$...$$`；狄拉克符号用 `|ψ⟩`、内积 `⟨φ|ψ⟩`、算符 `Â`\n- 希腊字母与特殊符号使用 Unicode（α、β、ψ、ħ、∇、∂），矢量用粗体或箭头并在符号表中说明\n- HTML 展示时引入 **KaTeX**（本地离线引入，不依赖 CDN），与宝石学笔记的 HTML 展示模板保持一致\n- 物理量和单位之间留空格（\"5.29 × 10⁻¹¹ m\" 而非 \"5.29×10⁻¹¹m\"）\n- 数值与不确定度用括号表示法（如 6.62607015(81) × 10⁻³⁴ J·s）并注明常数版本\n- 重要论断用 blockquote（`>`）突出\n- 不使用 emoji\n- 列表使用 `-` 或编号 `1.`，不使用嵌套超过两级的列表\n- 代码与数值脚本单独成块，标注语言（```python）\n\n---\n\n## 六、计算与可视化资产规范（技术层面）\n\n量子力学笔记相比宝石学笔记的天然优势是「模型可计算」，配套资产规范如下：\n\n- 每个「典型系统与可解模型」实例须在 `code/` 中有对应可复现脚本（`.py`），命名 `{篇名}_{模型名}.py`\n  - 依赖限定：numpy / scipy / matplotlib\n  - 脚本须可直接运行并输出图形或数值结果，顶部注释写明对应的笔记篇名与公式编号\n  - 环境中已安装的 Python 虚拟环境：`~/.workbuddy/binaries/python/envs/default/bin/python`\n- 图形资产放 `figures/`，优先 SVG 矢量格式，命名 `{篇名}_{图号}.svg`\n- 常数表放 `data/`，与 CODATA 版本对齐，命名 `constants_{版本}.json`，含版本号与来源字段\n- 与宝石学笔记共享资产：`smorf_data/` 中的晶形数据、`cif/` 中的晶体结构文件仍沿用宝石学正式版目录，跨套引用时写明路径\n\n---\n\n## 七、与宝石学系统笔记的关系\n\n本套笔记与《宝石学系统笔记》为姊妹篇，共享方法论但领域不同，交叉部分的处理原则：\n\n- 宝石学笔记第四部分「鉴定仪器与量子光学」中已有的 4 篇量子专题（双折射的量子力学解释、双折射后的光是否纠缠态、宝石紫外荧光的量子力学解释、长石族光学效应的量子力学与物理光学分析）**原样保留在宝石学体系内**，不迁入本套笔记\n- 本套笔记第六部分「交叉应用：量子力学与宝石学」从**量子力学正统体系**出发重新组织这些主题，并补充宝石学笔记未展开的上游理论（晶体场/配位场理论、色心的量子描述、光谱选择定则、第一性原理计算）\n- 两套管线的同一物理量（如 Cr³⁺ 的能级、方解石双折射率）须数值一致；出现分歧时以 S 级来源为准并记入《修订记录》\n- 本套笔记的参考文献与宝石学笔记的《参考文献》合并去重时，按各自领域标注，同一文献取其在本套体系中的最高等级\n\n---\n\n## 八、质量检查清单\n\n每篇笔记完成后逐项检查：\n\n- [ ] 标题格式为「XXX（English）系统量子力学笔记」\n- [ ] 头部有分类归属 + 数学程度（L1/L2/L3）+ 前置依赖副标题行\n- [ ] 头部有「验证依据」blockquote，列出本篇所有引用来源（S/A 级优先）\n- [ ] 验证依据中的来源真实可查，无编造的文献名/作者/年份/卷期页码\n- [ ] 章节严格按一~八节排列，无多余章节（学习建议/励志故事/哲学畅想）\n- [ ] 所有公式的符号均已定义，量纲自洽；ħ/2π/度规/傅里叶约定已在第二节集中声明\n- [ ] 物理常数注明 CODATA 版本与不确定度，关键常数经至少两个独立来源交叉验证\n- [ ] 实验描述含原始结果数值与显著性/误差，且与原始论文一致\n- [ ] 人名-年份-贡献三元组已核对；存在标注差异的（如 Bell 1964/1965）已注明差异\n- [ ] 涉及诠释分歧处并列各方立场，无站队断言\n- [ ] 科普性比喻已标注为通俗说法并给出严格表述\n- [ ] 数值有具体量级与适用条件，无模糊表述（无「极大」「极小」等无数据形容词）\n- [ ] 无编造/臆造内容：查不到的信息已省略而非填充\n- [ ] 「典型系统与可解模型」含解析与数值各至少一例，且配有可运行脚本\n- [ ] 无 emoji\n- [ ] 末尾无「见附录参考文献」行，有第八节「参考文献」章节，含详细条目\n- [ ] 与宝石学笔记交叉的物理量数值一致，分歧已记入修订记录\n\n---\n\n*本规范版本：v1.0，2026年9月1日*\n*架构依据：《系统宝石学笔记整理规范》（宝石学正式版）+ Feynman Lectures Vol. III 章节结构 + Lederman & Hill《Quantum Physics for Poets》章节结构*\n", "参考文献.md": "# 参考文献（统一汇编）\n\n> 本文档为《量子力学系统笔记》的统一参考文献汇编。所有文献按可信度分为四级（S/A/B/C），同一文献在多篇笔记中出现时取其最高等级标注。\n>\n> **当前状态：架构版 v1.0（2026年9月1日）**。本清单已覆盖六大部分的核心骨架文献，其中带 `[已核实]` 标记的条目经检索确认了卷、期、页码与年份。其余条目为高置信度经典文献，将在各篇笔记撰写时逐条回溯原文核实；**凡核实不通过的条目将被移除或更正，并记入《修订记录》**。\n>\n> **来源可信度分级标准**：\n> - **S级（权威）**：奠基性原始论文、国际标准数据（CODATA/PDG）、诺贝尔奖官方资料、经典权威专著、权威综述（RMP/Physics Reports）——数据可直接引用\n> - **A级（优秀）**：同行评审研究论文与综述（PRL/PRX/PRA/Nature Physics）、权威教材——数据经交叉验证\n> - **B级（良好）**：专著章节、会议论文集、中文教材与译著、**arXiv 预印本（须显式标注未经同行评审）**——适合专题深入参考\n> - **C级（一般）**：科普读物、百科、自媒体、AI 生成内容——仅作线索，核心数据不可引用\n\n---\n\n## S级（权威来源）\n\n### 数据标准与国际数据库\n\n1. CODATA (2022). *Recommended Values of the Fundamental Physical Constants*. NIST. https://physics.nist.gov/cuu/Constants/ （本套笔记所有基本常数的第一优先级来源；引用时须注明版本）`[已核实]`\n2. Particle Data Group. *Review of Particle Physics*. Progress of Theoretical and Experimental Physics. （粒子物理标准数据）\n\n### 奠基性原始论文\n\n3. Planck, M. (1901). Ueber das Gesetz der Energieverteilung im Normalspectrum. *Annalen der Physik*, 4, 553–563. （能量量子化的起点）\n4. Einstein, A. (1905). Über einen die Erzeugung und Verwandlung des Lichtes betreffenden heuristischen Gesichtspunkt. *Annalen der Physik*, 17, 132–148. （光量子假说与光电效应）\n5. Bohr, N. (1913). On the Constitution of Atoms and Molecules. *Philosophical Magazine*, 26, 1–25. （玻尔模型）\n6. Compton, A.H. (1923). A Quantum Theory of the Scattering of X-Rays by Light Elements. *Physical Review*, 21(5), 483–502. （康普顿散射）\n7. de Broglie, L. (1924). *Recherches sur la théorie des quanta*. PhD Thesis, Université de Paris. （物质波假说）\n8. Schrödinger, E. (1926). Quantisierung als Eigenwertproblem. *Annalen der Physik*, 79, 361–376. （波动力学的建立）\n9. Heisenberg, W. (1927). Über den anschaulichen Inhalt 、Sakurai、Landau & Lifshitz、Nielsen & Chuang、Scully & Zubairy、Horodecki et al. (2009) RMP 等 S/A 级权威来源。\n>\n> **严重程度标注**（沿用宝石学笔记的四级体系）：\n> - **严重错误**：公式错误或符号错误、常数数量级错误、年份/人名/贡献归属错误、物理机制完全错误\n> - **数据偏差**：数值精度不足、条件缺失、术语不规范、描述方向错误\n> - **内容完善**：补充缺失的权威数据、推导步骤、实验细节\n> - **来源质量**：删除/替换低质量来源（百科、自媒体、AI 生成内容、虚构文献）\n\n---\n\n## 架构阶段（2026年9月1日，v1.0）\n\n本阶段仅完成架构设计，尚无正文可校验。以下为**架构设计过程中已识别的待核查项**，须在对应笔记撰写时逐一处理。\n\n| 类别 | 待核查项 | 处理要求 | 关联笔记 |\n|------|---------|---------|---------|\n| 来源质量 | Bell (1964) *Physics* 1, 195 在部分文献中引作 1965 年 | 统一采用 1964 并注明此差异，不得择一断言 | 第 30 篇 **[已处理：见 7.2 节年份标注差异说明]** |\n| 数据偏差 | Planck (1901)、Einstein (1905)、Compton (1923)、Davisson & Germer (1927)、Heisenberg (1927)、Schrödinger (1926)、Bohr (1913)、de Broglie (1924)、Dirac (1928)、Feynman (1948) 各条的卷期页码 | 撰写前回溯原文逐条核实，不通过者移除或更正 | 第 3–7、20、37–38 篇 |\n| 数据偏差 | Tonomura et al. (1989) Am. J. Phys. 57, 117 的卷期页码 | 同上 | 第 1–2 篇 |\n| 内容完善 | 各篇须声明所采用的 CODATA 版本，并注明 ℏ 与 h、2π 因子、度规号差、傅里叶变换约定 | 写入第二节「符号约定声明」 | 全部 |\n| 严重错误 | 双缝实验中「电子同时通过两条缝」为通俗说法 | 标注为通俗表述并给出严格说法（概率幅的不可区分路径干涉） | 第 1、9 篇 |\n| 严重错误 | 不确定性关系被表述为「测量扰动」 | 区分制备不确定度与测量扰动，说明其为态的内禀性质 | 第 8 篇 |\n| 数据偏差 | 与宝石学笔记重叠的物理量（Cr³⁺ ⁴A₂g→⁴T₂g 跃迁能量、694 nm R 线的吸收/发射归属、方解石 no/ne 与双折射率） | 两套笔记数值须一致，分歧以 S 级来源为准 | 第 43、46、47 篇 |\n| 来源质量 | 第六部分各篇若引用宝石学笔记中的既有结论 | 须回溯至宝石学笔记所依据的 S 级来源，不直接转引笔记本身 | 第 42–47 篇 |\n\n---\n\n## 正文校验记录\n\n### 第一部分：量子行为与基础概念\n\n（待补充）\n\n### 第二部分：形式体系与数学结构\n\n（待补充）\n\n### 第三部分：多体、对称与凝聚态\n\n（待补充）\n\n### 第四部分：量子信息与量子光学\n\n#### 第 30 篇《EPR佯谬与贝尔不等式》（v1.0，2026年9月1日）\n\n**校验方式**：关键文献逐条回溯原始出处（期刊卷期页）；所有数值经配套脚本 `code/EPR与Bell不等式_CHSH.py` 数值验证。\n\n| 严重程度 | 问题 | 修正内容 | 依据 |\n|---------|------|---------|------|\n| 严重错误 | 通行表述「Aspect 1982 违反 Bell 不等式达 5 个标准差」常与 $S = 2.697$ 混为一谈，实为两项不同实验 | 在 4.1.2 分列三项 Aspect 实验，在 4.4「误读三」专门辨析：5σ 出自时变分析器实验（*PRL* 49, 1804，形式 $S \\le 0$，实测 $0.101 \\pm 0.020$）；$S = 2.697 \\pm 0.015$ 出自双通道偏振器实验（*PRL* 49, 91） | Aspect, Dalibard & Roger (1982) *PRL* 49, 1804；Aspect, Grangier & Roger (1982) *PRL* 49, 91 |\n| 数据偏差 | 光子偏振纠缠情形的最优角度间隔常被误用自旋单态的 45° | 在 6.2 给出 $E = \\cos 2(\\theta_a - \\theta_b)$ 的推导，说明偏振角与 Bloch 角的 2 倍关系，最优间隔为 22.5°；并注明「把 45° 直接搬到偏振实验会得到零违反」 | 脚本 `[3]` 项验证：22.5° 配置给 $S = 2.828427$ |\n| 内容完善 | CHSH 上界 2 的推导在科普文献中常跳步 | 在 2.6 给出完整推导（式 2.14 的因子分解 + 逐 $\\lambda$ 论证），并辅以 16 种取值组合的穷举验证 | 脚本 `[1]` 项：枚举得 $\\max\\|S\\| = 2.000000$ |\n| 内容完善 | Tsirelson 界 2√2 常被当作\"实验值\"引用 | 在 2.7 注明其为量子力学的形式上限，脚本 `[4]` 项以 20 万次随机采样检验无一超出 | Cirel'son (1980) *Lett. Math. Phys.* 4, 93–100；脚本 `[4]` 项 |\n| 来源质量 | 参考文献汇编 C 级第 46/47 条重复（Feynman《QED》列出两遍，编号 47 出现两次） | 已删除重复条目，C 级重排为 46/47/48 | — |\n| 内容完善 | 费曼卷 III 索引中「Einstein-Podolsky-Rosen paradox」标注为 18-8，实为**页码**而非节号 | 确认对应 §18-3 \"The annihilation of positronium\"，页 18-7 至 18-9 | 本地 PDF：`WORKS/物理/The Feynman Lectures on Physics, Vol. III.pdf` |\n| 内容完善 | 宝石学笔记《双折射后的光是否纠缠态》称单粒子偏振-路径纠缠「不直接体现 EPR 非定域性」，未给出依据 | 在 5.3 给出依据（CHSH 要求类空间隔，单粒子两自由度在空间上不分离），并补充 Tan, Walls & Collett (1991) 的对照说明，指出限定词「直接」与「EPR」不可省略 | Tan, Walls & Collett (1991) *PRL* 66, 252–255 |\n\n**本轮新增待核查项**（撰写时未能确认卷期页，已在参考文献中标注，不用于数值引用）：\n\n| 条目 | 状态 |\n|------|------|\n| Clauser & Horne (1974) *Phys. Rev. D* 10, 526 | 卷期页待回溯核实 |\n| Werner (1989) *Phys. Rev. A* 40, 4277 | 卷期页待回溯核实 |\n| Gisin (1991)；Popescu & Rohrlich (1992)；GHZ (1989) | 卷期页待回溯核实 |\n| Hensen et al. (2016) 追加 300 次试验（$S = 2.38 \\pm 0.14$，2.7σ） | 卷期页待回溯核实 |\n| Handsteiner et al. (2017) Cosmic Bell Test；Rauch et al. (2018) 类星体设置 | 卷期页待回溯核实 |\n| Schrödinger (1935) *Math. Proc. Camb. Phil. Soc.* 31, 555–563 | 本套汇编第 14 条尚未标注「已核实」，第 29 篇撰写时须回溯 |\n| Brunner et al. (2014) RMP 86, 419；Larsson & Gill 综述 | 卷期页待回溯核实 |\n\n### 第五部分：相对论量子理论与前沿\n\n（待补充）\n\n### 第六部分：交叉应用——量子力学与宝石学\n\n（待补充）\n\n---\n\n*架构版 v1.0，2026年9月1日。正文校验记录随各篇撰写同步填充。*\n", "README.md": "# 量子力学系统笔记 · 架构版\n\n## 项目概述\n\n本套笔记按《系统宝石学笔记》的成熟架构组织量子力学内容：以单个主题为条目单元、固定八节、S/A/B/C 四级来源分级、统一参考文献与修订记录。计划 47 篇正式文档，分六大部分。\n\n- **架构版本**：v1.0（2026年9月1日）\n- **架构依据**：\n  - 《系统宝石学笔记整理规范》（`WORKS/宝石学正式版/`）——方法论与八节结构的来源\n  - Feynman Lectures Vol. III（21 章，`WORKS/物理/`）——第一、三部分内容主线与主题划分依据\n  - Lederman & Hill《Quantum Physics for Poets》（10 章 + 附录 Spin，`WORKS/物理/`）——第五部分章节划分的参照\n- **当前状态**：**架构已完成，正文撰写中**。撰写进度 **1 / 47**（第 30 篇《EPR佯谬与贝尔不等式》v1.0，2026年9月1日）。笔记正文按《序》中目录逐篇产出。\n\n---\n\n## 文件清单\n\n### 辅助文档（已完成）\n\n| 文件 | 说明 |\n|------|------|\n| [序.md](序.md) | 总序、使用说明（5 条）、六大部分完整目录（47 篇，含数学程度 L1/L2/L3 标注） |\n| [量子力学系统笔记整理规范.md](量子力学系统笔记整理规范.md) | 八节结构定义、三步流程、来源分级、写作禁忌、公式与 Markdown 约定、质量检查清单 |\n| [参考文献.md](参考文献.md) | 统一参考文献汇编，S/A/B/C 四级标注，含已核实条目的卷期页码 |\n| [修订记录.md](修订记录.md) | 交叉验证发现问题的记录表 |\n\n### 笔记正文\n\n| 序号 | 文件 | 部分 | 数学程度 | 状态 |\n|------|------|------|---------|------|\n| 30 | [EPR佯谬与贝尔不等式_系统笔记.md](EPR佯谬与贝尔不等式_系统笔记.md) | 第四部分 量子信息与量子光学 | L2 | v1.0（2026年9月1日） |\n\n### 配套资产\n\n| 文件 | 说明 |\n|------|------|\n| `code/EPR与Bell不等式_CHSH.py` | 第 30 篇配套脚本：LHV 界枚举、自旋单态/光子偏振的角度扫描、Tsirelson 界随机采样、Bell 1964 违反样例、Werner 态阈值、实验值对比 |\n| `figures/EPR与Bell不等式_CHSH.svg` | 关联函数随角度变化与 2 / 2√2 两条界线 |\n| `figures/EPR与Bell不等式_实验时间线.svg` | 历代实验实测值与 LHV 界、Tsirelson 界的对比 |\n\n### 目录结构\n\n```\n量子力学正式版/\n├── 序.md                              总序与完整目录\n├── 量子力学系统笔记整理规范.md          写作标准（八节 + 反编造铁律）\n├── 参考文献.md                         统一文献汇编\n├── 修订记录.md                         校验问题记录\n├── README.md                          本文件\n├── EPR佯谬与贝尔不等式_系统笔记.md      第 30 篇（第四部分）\n├── code/                              可复现数值脚本（numpy/scipy/matplotlib）\n├── data/                              常数表 JSON（对齐 CODATA 版本）\n├── figures/                           图形资产（优先 SVG）\n└── {主题}_系统笔记.md                  后续正文条目（置于根目录）\n```\n\n---\n\n## 八节结构速查\n\n| 节 | 名称 | 承担功能 |\n|----|------|---------|\n| 一 | 概念与定位 | 定义、词源、3–6 条核心特征、在体系中的位置 |\n| 二 | 数学结构 | 符号约定、态空间、算符、核心方程、对称性 |\n| 三 | 物理量与特征尺度 | 常数量级、量子效应判据、无量纲量 |\n| 四 | 实验基础与观测证据 | **核心章节**：关键实验、原始数值、显著性、误读纠正 |\n| 五 | 分类体系与物理机制 | 分类判据、机制链条、概念辨析、失效边界 |\n| 六 | 典型系统与可解模型 | 2–4 个实例，解析与数值各至少一例，配可运行脚本 |\n| 七 | 历史脉络与学术争议 | 提出动机、年份-人物-文献时间线、诠释分歧并列不站队 |\n| 八 | 参考文献 | 详细条目（头部另有简写验证依据） |\n\n---\n\n## 撰写推进建议\n\n1. **先第二部分（形式体系）**：第 11–20 篇是全套装的工具箱，其余各部分的头部「前置依赖」多指向这里\n2. **再第一部分（量子行为）**：第 1–10 篇为通读主线，可独立阅读，但第四节的实验数据须回溯原始论文\n3. **随后第三部分（多体与凝聚态）**：依赖第二部分的算符与微扰工具\n4. **第四部分（量子信息与量子光学）**：可与第三部分并行。**第 30 篇（EPR 与 Bell）已完成 v1.0**——它是宝石学笔记「双折射后的光是否纠缠态」的理论归宿，该篇 5.3 与 6.4 节给出了宝石学侧结论的依据。建议后续接着写第 29 篇（量子纠缠）与第 31 篇（退相干），三者构成一个完整的因果链\n5. **第六部分（交叉应用）**：最后写，此时宝石学与量子力学两套管线的术语已统一\n6. **第五部分（相对论与前沿）**：开窗口性质，可随时插入\n\n每篇完成后按《规范》第八节的质量检查清单逐项打勾，并把发现的问题记入《修订记录》。\n\n---\n\n## 与宝石学系统笔记的关系\n\n- 两套笔记共享方法论（三步流程、来源分级、反编造铁律、双层引用、统一参考文献与修订记录），八节存在明确映射（见《规范》2.5 节）\n- 宝石学笔记第四部分的 4 篇量子专题（双折射的量子力学解释、双折射后的光是否纠缠态、宝石紫外荧光的量子力学解释、长石族光学效应的量子力学与物理光学分析）**保留在宝石学体系内不迁移**\n- 本套第六部分从量子力学正统体系重新组织这些主题，并补齐上游理论（晶体场/配位场、色心的量子描述、光谱选择定则、第一性原理计算）\n- 两套管线重叠的物理量（Cr³⁺ 能级、方解石双折射率等）须数值一致，分歧以 S 级来源为准并记入修订记录\n\n---\n\n*架构版 v1.0，2026年9月1日*\n"}, "figures": {"EPR与Bell不等式_CHSH.svg": "<?xml version=\"1.0\" encoding=\"utf-8\" standalone=\"no\"?>\n<!DOCTYPE svg PUBLIC \"-//W3C//DTD SVG 1.1//EN\"\n  \"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\">\n<svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"798.060312pt\" height=\"296.843125pt\" viewBox=\"0 0 798.060312 296.843125\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-09-01T10:30:27.908438<\/dc:date>\n    <dc:format>image/svg+xml<\/dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.10.9, https://matplotlib.org/<\/dc:title>\n     <\/cc:Agent>\n    <\/dc:creator>\n   <\/cc:Work>\n  <\/rdf:RDF>\n <\/metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}<\/style>\n <\/defs>\n <g id=\"figure_1\">\n  <g id=\"patch_1\">\n   <path d=\"M 0 296.843125 \nL 798.060312 296.843125 \nL 798.060312 0 \nL 0 0 \nz\n\" style=\"fill: #ffffff\"/>\n  <\/g>\n  <g id=\"axes_1\">\n   <g id=\"patch_2\">\n    <path d=\"M 42.620313 259.165 \nL 392.475313 259.16 <div class="backdrop" id="backdrop"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-scroll" id="nav"></div>
    <button class="side-footer" id="themeBtn">
      <span id="themeIcon">◐</span><span id="themeLabel">切换明暗主题</span>
      <span class="chev">▸</span>
    </button>
  </aside>
  <main class="doc-area"><div class="doc-inner" id="doc"></div></main>
</div>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("content-data").textContent);

/* ===== 主题（持久化，对齐 gemThemeDark 语义） ===== */
const THEME_KEY = "qmThemeDark";
function applyTheme(dark){
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.getElementById("themeIcon").textContent = dark ? "☾" : "☀";
  try{ localStorage.setItem(THEME_KEY, dark ? "1" : "0"); }catch(e){}
}
let dark = false;
try{ dark = localStorage.getItem(THEME_KEY) === "1"; }catch(e){}
applyTheme(dark);
document.getElementById("themeBtn").onclick = () => { dark = !dark; applyTheme(dark); };

/* ===== 侧栏（对齐 SidebarView 行为：锁定行不可点、当前行金条高亮） ===== */
let currentFile = null;
const nav = document.getElementById("nav");
const sidebar = document.getElementById("sidebar");
const backdrop = document.getElementById("backdrop");

function closeDrawer(){ sidebar.classList.remove("show"); backdrop.classList.remove("show"); }
document.getElementById("hamburger").onclick = () => {
  sidebar.classList.toggle("show"); backdrop.classList.toggle("show");
};
backdrop.onclick = closeDrawer;

function renderNav(){
  let html = "";
  for(const cat of DATA.cats){
    html += `<div class="cat"><div class="cat-title"><span>${cat.title}</span><span class="cat-count">${cat.countText}</span></div>`;
    for(const f of cat.files){
      const open = !!f.done;
      const isCurrent = currentFile === f.file;
      let badge = "";
      if(f.done) badge = `<span class="badge">已撰</span>`;
      else if(f.planned) badge = `<span class="badge lvl">${f.level}</span>`;
      html += `<button class="nav-item ${open?"open":""} ${isCurrent?"current":""}"
        data-file="${f.file}" ${open?`data-open="1"`:""} style="--dot:${f.color||"#b8e2ff"}">
        <span class="dot"></span><span class="nm">${f.name}</span>
        ${badge}${open?"":`<span class="lock">🔒</span>`}</button>`;
    }
    html += `</div>`;
  }
  nav.innerHTML = html;
  nav.querySelectorAll(".nav-item[data-open]").forEach(el=>{
    el.onclick = () => { openArticle(el.dataset.file); closeDrawer(); };
  });
}

/* ===== 渲染（对齐 ContentService.mdContent + MarkdownBodyView 管线） ===== */
const doc = document.getElementById("doc");

function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

function renderProps(file){
  const p = (DATA.props||{})[file];
  if(!p) return "";
  const rows = Object.entries(p).map(([k,v])=>
    `<div class="ci-k">${esc(k)}</div><div class="ci-v">${esc(v)}</div>`).join("");
  return `<div class="crystal-panel"><div class="ci-title">关键数值与定位
    <span class="ci-sub">crystal-info 对位面板</span></div>
    <div class="ci-grid">${rows}</div></div>`;
}

function renderArticle(file){
  const md = DATA.articles[file];
  const meta = DATA.meta[file] || {};
  if(md == null){
    const desc = meta.desc ? `<div class="t2">规划内容：${esc(meta.desc)}</div>` : "";
    doc.innerHTML = `<div class="empty-state"><div class="icon">📖</div>
      <div class="t1">本篇尚未撰写</div>${desc}
      <div class="t2">条目位置：第 ${meta.part||"—"} 部分 · 第 ${meta.id||"—"} 篇 · 数学程度 ${meta.level||"—"}<br>
      撰写进度见《序》卷尾：${DATA.progress}</div></div>`;
    return;
  }
  doc.innerHTML = `<div class="doc" id="mdhost">${renderProps(file)}</div>`;
  const host = document.getElementById("mdhost");
  host.insertAdjacentHTML("beforeend", marked.parse(md));
  // 内联图形：figures/*.svg 全部嵌入（对齐 figures 资产）
  host.querySelectorAll('img[src^="figures/"]').forEach(img=>{
    const name = img.getAttribute("src").slice("figures/".length);
    const svg = DATA.figures[name];
    if(svg){
      const slot = document.createElement("div");
      slot.className = "fig-slot";
      slot.innerHTML = svg;
      img.replaceWith(slot);
    }
  });
  // 内部跳转链接（./xxx.md 形式）→ 侧栏条目
  host.querySelectorAll('a[href$=".md"]').forEach(a=>{
    const target = decodeURIComponent(a.getAttribute("href").split("/").pop());
    const hit = DATA.cats.flatMap(c=>c.files).find(f=>f.file===target);
    if(hit && hit.done){ a.onclick=(e)=>{e.preventDefault(); openArticle(hit.file);}; }
    else { a.style.opacity=".55"; a.title="该条目尚未收录"; }
  });
  // 公式渲染（KaTeX auto-render，含 \tag 与 \text{中文}）
  const boot = ()=>{
    if(window.renderMathInElement){
      renderMathInElement(host,{
        delimiters:[
          {left:"$$",right:"$$",display:true},
          {left:"$",right:"$",display:false},
          {left:"\\(",right:"\\)",display:false},
        ],
        throwOnError:false, strict:"ignore",
      });
    }
  };
  window.katex ? boot() : window.addEventListener("load", boot);
  doc.parentElement.scrollTop = 0;
}

function openArticle(file){
  currentFile = file;
  renderNav();
  renderArticle(file);
}

/* ===== 启动（对齐 RootView：默认打开第一篇已完成条目） ===== */
renderNav();
const first = DATA.cats.flatMap(c=>c.files).find(f=>f.done);
if(first) openArticle(first.file);
</script>
</body>
</html>
