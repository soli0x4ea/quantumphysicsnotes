<script type="text/plain" id="src"># 量子统计

> **分类归属：第三部分·多体、对称与凝聚态 · 数学程度：L3 · 前置依赖：第 21 篇《全同粒子与泡利不相容原理》、第 16 篇《角动量与自旋》**
> **验证依据**：Bose (1924) Z. Phys.、Einstein (1924/1925) Sitzber. Preuss. Akad.、Fermi (1926) Z. Phys.、Dirac (1926) Proc. R. Soc. A、Fowler (1926) MNRAS、London (1938) Nature、Chandrasekhar (1931) Astrophys. J.、Anderson et al. (1995) Science、Pathria & Beale (2011)

---

## 阅读指引（三层）

| 深度 | 阅读范围 | 你能带走什么 |
|------|---------|------------|
| 零门槛线 | §一 + §四 + §七 | 结论、实验数字、来龙去脉（不碰一个公式） |

## 一、概念与定位

> **一句话结论**：交换对称或反对称决定玻色与费米两套统计：玻色增强聚集、费米撑开简并压，经典统计是稀热极限。

**量子统计**研究全同粒子集体的平衡分布。第 21 篇确立了全同粒子的波函数只能是交换对称（玻色子）或反对称（费米子），这一对称性直接决定了它们占据单粒子能级的方式，从而产生两套根本不同于经典麦克斯韦-玻尔兹曼统计的分布：**玻色-爱因斯坦统计（Bose–Einstein, BE）** 与 **费米-狄拉克统计（Fermi–Dirac, FD）**。

名称词源：*statistics* 源自拉丁 *status*（状态）；「玻色-爱因斯坦」纪念 Satyendra Bose 与 Albert Einstein 1924–1925 年建立玻色气体理论；「费米-狄拉克」纪念 Enrico Fermi 与 Paul Dirac 1926 年独立给出费米气体分布。

本篇须抓住的核心特征：

1. **玻色增强与费米阻塞**：玻色子倾向聚集到同一单粒子态（BE 分布分母减号），费米子受泡利原理限制每态至多一个（FD 分布分母加号）。
2. **玻色-爱因斯坦凝聚（BEC）**：理想玻色气体在温度低于临界值 $T_c$ 时，宏观数量的粒子占据基态，形成相干的宏观量子态。
3. **费米简并压**：即使在 $T=0$，费米子因泡利阻塞被「撑开」到高能态，产生非零压强（简并压），不依赖热运动。
4. **经典极限的回归**：当 $e^{(\varepsilon-\mu)/k_BT}\gg1$（稀、热）时，BE 与 FD 都回到麦克斯韦-玻尔兹曼分布——量子统计是经典统计在低温/高密度下的修正。
5. **宏观可观测后果**：BEC 解释超流（液氦-4）与冷原子凝聚；费米简并压支撑白矮星与中子星免于引力坍缩，是天体物理的基石。

本主题在体系中的位置：它是第 21 篇（全同性、自旋-统计）向宏观多体现象的延伸，向下为第 27 篇（超导——库珀对的凝聚）提供「凝聚态」范式，向上连接第 26 篇自身的液氦超流与第 28 篇的整数量子霍尔边缘态。

---

|---------|---------|---------|
| 量子统计是经典统计的可忽略修正 | 低温/高密度下量子统计主导（BEC、简并压），是超流与中子星基石 | 低估量子统计地位 |
| 费米子因「互相排斥」才撑开 | 是泡利阻塞（每态至多一个）的几何后果，非动力学排斥 | 把统计阻塞当排斥力 |
| 玻色子喜欢聚集是吸引力导致 | 是对称波函数的统计增强，非粒子间吸引；理想玻色气体也会 BEC | 把统计增强当吸引 |

## 二、数学结构

**符号约定声明**：SI 单位制，ħ 与 $2\pi$ 显式；采用巨正则系综，化学势 $\mu$；分布以单粒子能量 $\varepsilon$ 为自变量；自旋简并度 $g$ 在求和时显式计入；度规 $(+,-,-,-)$。

### 2.1 玻色-爱因斯坦 与 费米-狄拉克 分布

在热平衡下，单粒子能级 $\varepsilon$ 的平均占据数为

$$
n_{\mathrm{BE}}(\varepsilon)=\frac{1}{e^{(\varepsilon-\mu)/k_BT}-1},
\qquad
n_{\mathrm{FD}}(\varepsilon)=\frac{1}{e^{(\varepsilon-\mu)/k_BT}+1}.
\tag{1}
$$

玻色子要求 $\mu\le\varepsilon_0$（基态能量，取 0 时 $\mu\le0$），费米子 $\mu$ 可正。当 $(\varepsilon-\mu)/k_BT\gg1$ 时两式均趋于 $e^{-(\varepsilon-\mu)/k_BT}$（经典麦克斯韦分布）。

### 2.2 玻色-爱因斯坦凝聚临界温度

三维理想玻色气体（自旋简并 $g=1$），总粒子数守恒要求

$$
n=\frac{N}{V}=\frac{1}{\lambda_T^3}\,g_{3/2}(z)+\frac{1}{V}\frac{1}{e^{-\mu/k_BT}-1},
\qquad \lambda_T=\sqrt{\frac{2\pi\hbar^2}{mk_BT}},
\tag{2}
$$

其中 $z=e^{\mu/k_BT}$，$g_{3/2}(z)=\sum_{l=1}^\infty z^l/l^{3/2}$。当 $z\to1$（$\mu\to0^-$）激发态达到最大占据，对应临界温度

$$
k_BT_c=\frac{2\pi\hbar^2}{m}\left(\frac{n}{\zeta(3/2)}\right)^{2/3},
\qquad \zeta(3/2)\approx2.612.
\tag{3}
$$

$T<T_c$ 时，超出激发态容量的粒子全部落入基态，凝聚分数

$$
\frac{N_0}{N}=1-\left(\frac{T}{T_c}\right)^{3/2}.
\tag{4}
$$

### 2.3 费米气体与费米能

$T=0$ 时 FD 分布为阶跃函数：$n_{\mathrm{FD}}=1\ (\varepsilon<\mu_0)$，$0\ (\varepsilon>\mu_0)$。费米能 $\varepsilon_F=\mu_0$ 由填满动量球 $|\mathbf{p}|\le p_F$ 决定：

$$
\varepsilon_F=\frac{\hbar^2}{2m}(3\pi^2n)^{2/3},
\qquad p_F=\hbar(3\pi^2n)^{1/3}.
\tag{5}
$$

零温压强（非相对论简并压）

$$
P_0=\frac{2}{5}n\varepsilon_F
=\frac{\hbar^2}{5m}(3\pi^2)^{2/3}n^{5/3}.
\tag{6}
$$

费米温度 $T_F=\varepsilon_F/k_B$，金属中 $T_F\sim10^4\!-\!10^5\ \mathrm{K}\gg300\ \mathrm{K}$，故电子气高度简并。

## 三、物理量与特征尺度

- **BEC 临界温度**：碱金属原子气（$^{87}\mathrm{Rb}$，$m\approx1.44\times10^{-25}\ \mathrm{kg}$，密度 $n\sim10^{19}\ \mathrm{m}^{-3}$）的 $T_c\sim100\ \mathrm{nK}$ 量级，1995 年实验首次实现。
- **费米能（金属）**：铜 $E_F\approx7.0\ \mathrm{eV}$（见第 21 篇），对应 $T_F\approx8\times10^4\ \mathrm{K}$，电子气极简并。
- **白矮星简并压**：典型密度 $\rho\sim10^9\ \mathrm{kg/m^3}$，电子简并压支撑引力；钱德拉塞卡极限 $M_{\mathrm{Ch}}\approx1.44\,M_\odot$ 是白矮星最大质量 [24es]。
- **液氦 λ 点**：⁴He 在 $T_\lambda=2.17\ \mathrm{K}$ 进入超流相，London 解释为 BEC 的相互作用版本 [24eu]。
- **经典回归判据**：$n\lambda_T^3\ll1$（稀热）时量子统计退化为经典；凝聚与简并发生于 $n\lambda_T^3\sim1$ 或更大。

---

## 四、实验基础与观测证据

1. **BEC 的直接观测（1995）**：Anderson 等人用磁阱与蒸发冷却将 $^{87}\mathrm{Rb}$ 原子气降到约 170 nK，观测到速度分布出现窄的相干峰——宏观占据基态的直接证据，获 2001 年诺贝尔物理学奖 [24er]。
2. **白矮星**：天狼星伴星 Sirius B 等白矮星半径极小、密度极高，其支撑压强只能由电子简并压解释（与式 (6) 一致），且质量存在上限（钱德拉塞卡极限）[24es]。
3. **液氦超流**：⁴He 在 2.17 K 以下黏度消失、可无摩擦流过毛细管，热容出现 λ 型反常；London 将其联系于 BEC [24eu]。³He 因是费米子，需配对（库珀对，见第 27 篇）后才在 mK 温度超流。
4. **电子比热**：金属电子比热 $\propto T$（而非经典 $\propto T$ 的 Dulong-Petit 全激活），正是费米面附近仅有薄层电子可被热激发的 FD 证据。
5. **费米面的 ARPES / 德哈斯-范阿尔芬效应**：直接测得 $p_F$ 与式 (5) 一致，是费米气体的实验基石（与第 24 篇衔接）。

**误读纠正**：BEC 不是「玻色子被冷却到同一位置」，而是占据同一**单粒子量子态**（基态），空间上仍可延展；「简并压」不是粒子间的排斥力，而是泡利阻塞迫使费米子占据高能态的动能压强。

---

## 五、分类体系与物理机制

### 5.1 BE vs FD

| 性质 | 玻色-爱因斯坦 | 费米-狄拉克 |
|------|--------------|------------|
| 适用粒子 | 整数自旋（玻色子） | 半整数自旋（费米子） |
| 占据 | 无上限，可凝聚 | 每态每自旋 1 个 |
| 低温行为 | 低于 $T_c$ 出现 BEC | $T=0$ 仍有简并压 |
| 经典极限 | $n\lambda_T^3\ll1$ 回归 MB | 同左 |

### 5.2 简并 vs 非简并

气体是否「量子简并」由 $n\lambda_T^3$ 判据决定：普通气体 $n\lambda_T^3\ll1$（经典）；金属电子、白矮星、冷原子气 $n\lambda_T^3\gtrsim1$（简并）。简并气体中热力学主要由量子占据结构决定，而非经典动能。

### 5.3 理想 vs 相互作用

理想玻色气给出精确 BEC；真实液氦-4 强相互作用使凝聚分数仅约 10%，且存在元激发（声子/旋子），但 London 的 BEC 框架仍是其超流的始源解释。理想费米气给出简并压；白矮星中相对论修正（高密度时 $P\propto n^{4/3}$）最终导致钱德拉塞卡极限。

## 六、典型系统与可解模型

### 6.1 BEC 临界温度与凝聚分数（脚本数值例）

由式 (3) 计算 $^{87}\mathrm{Rb}$ 气（$n=10^{19}\ \mathrm{m}^{-3}$）的 $T_c$，并对 $T<T_c$ 由式 (4) 给出凝聚分数（见脚本段 1 与图 1）。结果 $T_c$ 在百 nK 量级，与 1995 年实验同量级。

### 6.2 费米简并压（脚本数值例）

由式 (5)(6) 计算铜电子气的 $E_F$ 与简并压 $P_0$ 随密度变化；在金属密度 $n=8.49\times10^{28}\ \mathrm{m}^{-3}$ 处复现 $E_F\approx7.0\ \mathrm{eV}$（与第 21 篇一致），并展示 $P_0\propto n^{5/3}$（见脚本段 2 与图 2）。白矮星密度下该压强达 $10^{22}\ \mathrm{Pa}$ 量级，足以平衡引力。

## 七、历史脉络与学术争议

- **1924 Bose**：Bose 重新推导普朗克定律，将光子视为不可区分的量子，寄给 Einstein。
- **1924–1925 Einstein**：Einstein 将 Bose 方法推广到物质粒子，预言 BEC [24dq][24dr]。
- **1926 Fermi / Dirac**：Fermi 与 Dirac 各自给出费米气体分布 [24dt][24du]。
- **1926 Fowler**：用简并电子气解释白矮星密度 [24et]。
- **1931 Chandrasekhar**：得出白矮星质量上限（钱德拉塞卡极限）[24es]。
- **1938 London**：提出液氦超流源于 BEC [24eu]。
- **1995 Anderson et al.**：首次在稀碱金属气中实现 BEC [24er]。
- **学术争议**：理想 BEC 的「非相互作用」假设与实际凝聚体的强关联差距；相互作用玻色气（Bogoliubov 理论）与费米超流的 BCS 配对（第 27 篇）是理想模型的必要延伸；BEC 与超流是否为同一现象至今仍有概念辨析。

  // 先抽块级 $$...$$（可跨行）
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, function(m){
    blocks.push(m);
    return '%%MATH' + (blocks.length - 1) + '%%';
  });
  // 再抽行内 $...$（不含换行、内部不含 $）
  src = src.replace(/\$([^\$\n]+?)\$/g, function(m){
    blocks.push(m);
    return '%%MATH' + (blocks.length - 1) + '%%';
  });
  return { src: src, blocks: blocks };
}

function boot(){
  var raw = document.getElementById('src').textContent;
  // 记录标题锚点（在保护公式之前，避免影响）
  var md = raw.replace(/^(#{1,3})\s+(.+)$/gm, function(m, h, t){
    var id = 'h-' + t.replace(/[^\w一-龥]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
    return h + ' <span id="' + id + '"></span>' + t;
  });

  // 保护数学公式
  var prot = protectMath(md);
  md = prot.src;

  document.getElementById('content').innerHTML = marked.parse(md);

  // 还原数学公式占位符
  var content = document.getElementById('content');
  var html = content.innerHTML.replace(/%%MATH(\d+)%%/g, function(m, n){
    return prot.blocks[+n];
  });
  content.innerHTML = html;

  // 生成目录
  var hs = document.querySelectorAll('#content h2, #content h3');
  var toc = document.getElementById('toc'), tocHtml = '';
  hs.forEach(function(h){
    var sp = h.querySelector('span[id]');
    var id = sp ? sp.id : '';
    var cls = h.tagName === 'H3' ? 'sub' : '';
    tocHtml += '<a class="' + cls + '" href="#' + id + '">' + h.textContent.trim() + '</a>';
  });
  toc.innerHTML = tocHtml;

  // 图片路径：正文里写 figures/xxx.svg
  document.querySelectorAll('#content img').forEach(function(im){
    if(/^figures\//.test(im.getAttribute('src')||'')) return;
  });

  if (window.renderMathInElement) {
    renderMathInElement(document.getElementById('content'), {
      delimiters:[
        {left:'$$', right:'$$', display:true},
        {left:'$',  right:'$',  display:false}
      ],
      ignoredTags:['script','noscript','style','textarea','pre','code'],
      throwOnError:false
    });
  }

  // 滚动高亮
  var links = [].slice.call(toc.querySelectorAll('a'));
  window.addEventListener('scroll', function(){
    var cur = null;
    hs.forEach(function(h){
      if (h.getBoundingClientRect().top < 120) cur = h;
    });
    links.forEach(function(a){ a.classList.remove('active'); });
    if (cur){
      var sp = cur.querySelector('span[id]');
      var act = toc.querySelector('a[href="#' + (sp?sp.id:'') + '"]');
      if (act) act.classList.add('active');
    }
  }, {passive:true});
}
if (window.marked) boot();
else window.addEventListener('load', boot);
</script>
</body>
</html>
