<script type="text/plain" id="src"># 多电子原子

> **分类归属：第三部分·多体、对称与凝聚态 · 数学程度：L2 · 前置依赖：第 6 篇《原子光谱与玻尔模型》、第 17 篇《中心力场与氢原子》、第 21 篇《全同粒子与泡利不相容原理》**
> **验证依据**：Moseley (1913) *Philos. Mag.*、Slater (1930) *Phys. Rev.*、Hund (1925) *Z. Phys.*、Hartree (1928) *Proc. Camb. Phil. Soc.*、Bohr (1913) *Philos. Mag.*、Pauli (1925) Z. Phys.、Sakurai & Napolitano (2011)、NIST Atomic Spectra Database

---

## 一、概念与定位

**多电子原子** 指核电荷 $+Ze$ 外有 $N=Z$ 个电子（中性原子）或 $N\neq Z$（离子）的体系。其哈密顿量除核-电子库仑吸引与各电子动能外，还含 $\binom{N}{2}$ 对电子-电子库仑排斥，使精确求解在 $N>1$ 时不可解析。解决思路是**中心场近似**：把其余电子对某一电子的排斥平均成一个只依赖径向距离 $r$ 的球对称有效势 $V_{\rm eff}(r)$，使每个电子仍近似在球对称场中运动（单电子轨道），再用第 21 篇的泡利不相容原理把单电子轨道逐个填满，得到壳层结构，进而解释元素周期表。

名称词源：周期表（periodic table）源自元素化学性质随原子量/原子序数的「周期性」（periodicity）；壳层（shell）借自玻尔模型的同心轨道图像。

本篇核心特征：

1. **中心场近似**：多体排斥被平均为球对称有效势，单电子轨道近似为类氢轨道，但能级顺序由有效核电荷 $Z_{\rm eff}$ 决定而非裸核电荷 $Z$。
2. **四个量子数定态**：每个电子由 $(n,\ell,m_\ell,m_s)$ 标记；泡利原理限制同一原子中四元组不可全同，故每个空间轨道 $(n,\ell,m_\ell)$ 至多容纳两个自旋相反的电子。
3. **壳层与亚壳层**：主量子数 $n$ 定壳层（K,L,M,…），角量子数 $\ell=0,1,\dots,n-1$ 定亚壳层（s,p,d,f）；能级随 $Z$ 出现 $n+\ell$ 规则的交错（Madelung 规则）。
4. **洪特规则**：给定亚壳层，电子先以平行自旋分占不同 $m_\ell$（最大化总自旋 $S$），以降低库仑排斥能。
5. **周期表即壳层填充的映射**：稀有气体对应闭壳层、碱金属对应新壳层单电子、过渡金属对应 d 壳层填充、稀土对应 f 壳层填充——全部由 $(n,\ell)$ 容量与 $Z_{\rm eff}$ 的协同决定。

本篇在体系中的位置：承接第 21 篇（全同性）与第 17 篇（中心力场单电子），是原子、分子（第 23 篇）、固体（第 24 篇）的微观起点；其结论（电离能、电负性、价电子构型）是化学与材料科学的量子基础。

---

## 二、数学结构

**符号约定声明**：SI 单位制，能量以 eV 表示；单电子轨道采用类氢表象 $(n,\ell,m_\ell)$，自洽场（SCF）在 Hartree 单位下表述。电子间排斥用平均场近似，不展开全 CI 展开。

### 2.1 中心场近似与有效势

多电子原子哈密顿量

$$
\hat H=\sum_{i=1}^N\left[-\frac{\hbar^2}{2m_e}\nabla_i^2-\frac{Ze^2}{4\pi\varepsilon_0 r_i}\right]
+\sum_{i<j}\frac{e^2}{4\pi\varepsilon_0|\mathbf r_i-\mathbf r_j|}.
\tag{1}
$$

中心场近似把电子-电子项替换为对电子 $i$ 的平均球对称势 $V_{\rm eff}(r_i)$，使单电子方程为

$$
\left[-\frac{\hbar^2}{2m_e}\nabla^2+V_{\rm eff}(r)\right]\phi_a(\mathbf r)=\varepsilon_a\phi_a(\mathbf r),
\tag{2}
$$

$V_{\rm eff}(r)$ 含核吸引与「其余电子在半径 $r$ 以内/以外」的屏蔽贡献。自洽求解（Hartree 1928；Hartree–Fock 加交换项）给出单电子轨道 $\phi_a$ 与轨道能 $\varepsilon_a$。

### 2.2 单电子轨道与容量

类氢轨道仍由 $(n,\ell,m_\ell)$ 标记，空间部分容量递推：给定 $n$，有 $\ell=0,\dots,n-1$；给定 $\ell$，有 $m_\ell=-\ell,\dots,\ell$（共 $2\ell+1$ 个）；计及自旋 $m_s=\pm1/2$，每个亚壳层容量 $2(2\ell+1)$：

| 亚壳层 | $\ell$ | $m_\ell$ 数 | 容量（计自旋） |
|--------|--------|------------|----------------|
| s | 0 | 1 | 2 |
| p | 1 | 3 | 6 |
| d | 2 | 5 | 10 |
| f | 3 | 7 | 14 |

主壳层 $n$ 总容量 $\sum_{\ell=0}^{n-1}2(2\ell+1)=2n^2$。

### 2.3 有效核电荷与屏蔽（Slater 规则）

最外层电子感受到的核电荷被内层电子屏蔽，有效核电荷

$$
Z_{\rm eff}=Z-\sigma,
\tag{3}
$$

其中屏蔽常数 $\sigma$ 由 Slater 经验规则（Slater 1930）给出：按 $(1s)(2s,2p)(3s,3p)(3d)(4s,4p)\dots$ 分组，对目标电子：
- 同组每个其他电子贡献 0.35（1s 组为 0.30）；
- $(n-1)$ 层每个电子贡献 0.85；
- $(n-2)$ 及更内层每个电子贡献 1.00；
- 对 d/f 目标电子，左侧所有电子各贡献 1.00。

### 2.4 填充顺序与洪特规则

**Madelung（n+ℓ）规则**：轨道按 $n+\ell$ 升序填充；同 $n+\ell$ 时按 $n$ 升序。即 1s<2s<2p<3s<3p<4s<3d<4p<5s<4d<…。

**洪特第一规则**：等价电子（同 $n,\ell$）先以平行自旋分占不同 $m_\ell$，直至半满再配对——因为这使交换积分取最大正贡献，降低总能量。

## 四、实验基础与观测证据

### 4.1 Moseley 定律：原子序数的确立

Moseley (1913) 测量多种元素的 Kα X 射线频率，发现 $\sqrt{\nu}\propto (Z-b)$，即

$$
\sqrt{\nu}=A(Z-\sigma_K),
\tag{4}
$$

其中 $b\approx1$ 为屏蔽常数。这把元素按**原子序数 $Z$** 而非原子量排序，纠正了门捷列夫表中数处颠倒（如 Ar/K、Co/Ni），并预言了当时空缺的 $Z=43,61,72,75$ 等位置。Moseley 定律是「核电荷决定元素身份」的决定性实验证据。

### 4.2 第一电离能的周期性

第一电离能 $I_1(Z)$ 随原子序数呈现清晰周期振荡：稀有气体（He, Ne, Ar, Kr, Xe, Rn）为峰、碱金属（Li, Na, K, Rb, Cs）为谷、Be/Mg 因闭 s 亚壳层略高于相邻 B/Al、N/P 因半满 p 亚壳层略高于相邻 O/S。脚本 `code/多电子原子_Zeff与电离能.py` 第二段用前 20 号元素的 NIST 实验第一电离能绘制此周期（见 `figures/多电子原子_电离能周期.svg`），峰谷位置与壳层结构一一对应。

> **常见误读纠正**：周期表「周期性」常被说成「每 8 个重复」。严格地说，重复周期是壳层容量 $2n^2$ 与 $n+\ell$ 填充顺序的共同结果：s 区跨 2 列、p 区跨 6 列、d 区跨 10 列、f 区跨 14 列，故短周期长为 2 与 8、第四周期起因 d 填充延长为 18。8 列规律仅在 $n\le3$ 的 p 区近似成立。

### 4.3 原子光谱项与 LS 耦合

多电子原子的总角动量由 $\mathbf L=\sum\mathbf l_i$、$\mathbf S=\sum\mathbf s_i$ 耦合（LS 耦合，轻原子），光谱项记为 $^{2S+1}L_J$。洪特规则在此给出项能序：最大 $S$ 最低、同 $S$ 下最大 $L$ 最低。这是 §2.4 洪特规则的光谱学验证。

### 4.4 里程碑实验时间线

| 年份 | 人物 | 体系 | 关键结果 |
|------|------|------|---------|
| 1913 | Bohr | 氢原子 | 定态/跃迁模型（第 6 篇） |
| 1913 | Moseley | X 射线 | $\sqrt{\nu}\propto Z$，确立原子序数 |
| 1925 | Pauli | 原子谱 | 不相容原理（四量子数） |
| 1925 | Hund | 原子谱项 | 洪特规则（最大多重度最低能） |
| 1928 | Hartree | 数值方法 | 自洽场近似（$V_{\rm eff}$） |
| 1930 | Slater | 经验规则 | 屏蔽常数与填充顺序 |

## 五、分类体系与物理机制

| 分类 | 判定（量子数） | 特征 | 周期表区块 |
|------|---------------|------|-----------|
| s 区 | 价电子在 ns | 1–2 列，活泼金属 | 第 1–2 族 |
| p 区 | 价电子在 np | 13–18 列，含非金属/类金属 | 第 13–18 族 |
| d 区 | 价电子在 (n-1)d | 3–12 列，过渡金属 | 第 3–12 族 |
| f 区 | 价电子在 (n-2)f | 镧系/锕系，内过渡 | 独立两行 |

**机制链条**：核电荷 $Z$ 增大 → 若不计屏蔽，所有轨道能按 $Z^2$ 下降、原子收缩；但电子-电子排斥引入屏蔽 $\sigma$，使外层 $Z_{\rm eff}$ 增长缓慢（§3 的 Na 例 $Z_{\rm eff}=2.2\ll Z=11$），故同周期从左到右原子半径缓慢缩小、电离能总体上升但有亚壳层结构的局部起伏。d/f 区因 $(n+\ell)$ 交错出现「先填外层 s、再填内层 d」的能级倒置，使过渡金属化学性质相近。

**概念辨析**：
- 「价电子」是参与成键的最外层电子，不等于「最外层所有电子」——d 区元素的 (n-1)d 电子也参与成键，故过渡金属有可变氧化态。
- 洪特规则是**能量**规则（降总能），不是「电子喜欢平行自旋」的动力学偏好；其来源是交换积分的符号，已在 §2.4 说明。

**适用范围与失效边界**：中心场 + Slater 规则是半定量工具；重原子（大 $Z$）的相对论效应（直接质量-速度项、达尔文项、自旋-轨道耦合）显著改变能级顺序（如金的颜色、汞的低熔点源于相对论性 6s 收缩），需 Dirac–Hartree–Fock 或 DFT，超出本篇 L2 边界。

## 六、典型系统与可解模型

### 6.1 Slater 有效核电荷（数值，附脚本）

以 Na（$1s^22s^22p^63s^1$）的 3s 电子为靶：同组无其他 3s；$(n-1)=2$ 层共 8 个电子各贡献 0.85；$(n-2)=1$ 层共 2 个电子各贡献 1.00。屏蔽 $\sigma=8\times0.85+2\times1.00=8.80$，得 $Z_{\rm eff}=11-8.80=2.20$。脚本 `code/多电子原子_Zeff与电离能.py` 第一段对 Na、K、F 等同法计算并打印，呈现「同族自上而下 $Z_{\rm eff}$ 增长缓慢、同周期从左到右渐增」的趋势（见 `figures/多电子原子_Zeff趋势.svg`）。

### 6.2 第一电离能的周期振荡（数值，附脚本）

脚本第二段取前 20 号元素的实验第一电离能（NIST Atomic Spectra Database），绘制 $I_1$ vs $Z$。结果：He(24.59 eV) 峰、Li(5.39 eV) 谷、Ne(21.56 eV) 峰、Na(5.14 eV) 谷、Ar(15.76 eV) 峰——峰谷严格对应闭壳层（稀有气体）与新壳层开启（碱金属），与 §4.2 叙述一致。

### 6.3 类氢单电子能（解析参考）

在纯类氢近似（忽略屏蔽相关）下单电子能 $\varepsilon_n=-Z^2\cdot13.6\ \mathrm{eV}/n^2$。对 Na 的 3s 用 $Z_{\rm eff}=2.20$ 代入得 $\approx-7.3\ \mathrm{eV}$（结合能），与实验电离能 5.14 eV 同量级但高估——说明屏蔽与电子相关不可忽略，中心场近似是定性正确、定量需修正的工具。

## 七、历史脉络与学术争议

**提出动机**：门捷列夫 (1869) 依原子量排表并预言未知元素，但存在 Ar/K、Co/Ni 等颠倒且无法解释「为何每 8 个重复」。Bohr (1913) 的量子化原子给出能级但仅适用单电子；多电子原子的能级序与周期律直到把电子当作全同费米子、按 $(n,\ell)$ 填充才被理解。

**历史节点**：

| 年份 | 人物 | 贡献 | 文献 |
|------|------|------|------|
| 1913 | Bohr | 单电子量子化原子模型 | *Philos. Mag.* 26, 1/476/857 |
| 1913 | Moseley | X 射线定原子序数 | *Philos. Mag.* 26, 1024 |
| 1925 | Pauli | 不相容原理 | *Z. Phys.* 31, 765（第 21 篇 24dp） |
| 1925 | Hund | 光谱项多重度规则 | *Z. Phys.* 33, 345 |
| 1928 | Hartree | 自洽场方法 | *Proc. Camb. Phil. Soc.* 24, 89 |
| 1930 | Slater | 屏蔽规则与填充序 | *Phys. Rev.* 36, 57 |

**当前争议与开放问题**：
- **周期表「最优布局」**：现行 18 列长式、32 列超长式、左阶/右阶等仍在教学与可视化层面争论；物理内容（壳层容量与 $n+\ell$ 序）无争议。
- **超重元素（Z>103）的化学性质**：相对论效应与核不稳定性使 d/f 区行为预测困难，属前沿实验（冷熔合合成）而非概念争议。
- 各方立场均属已建立物理，本篇不站队。

<script>
// 在 markdown 解析前抽出公式，用占位符保护，避免被 marked 当成强调语法破坏
function protectMath(src){
  var blocks = [];
  // 先抽块级 $$...$$（可跨行）
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, function(m){
    blocks.push(m);
    return '%%MATH' + (blocks.length - 1) + '%%';
  });
  // 再抽行内 $...$（不含换行、内部不含 $）
  src = src.replace(/\$([^\$\n]+?)\$/g, function(m){
    blocks.push(m);
    return '%%MATH' + (blocks.length - 1) + '%%';
  });
  return { src: src, blocks: blocks };
}

function boot(){
  var raw = document.getElementById('src').textContent;
  // 记录标题锚点（在保护公式之前，避免影响）
  var md = raw.replace(/^(#{1,3})\s+(.+)$/gm, function(m, h, t){
    var id = 'h-' + t.replace(/[^\w一-龥]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
    return h + ' <span id="' + id + '"></span>' + t;
  });

  // 保护数学公式
  var prot = protectMath(md);
  md = prot.src;

  document.getElementById('content').innerHTML = marked.parse(md);

  // 还原数学公式占位符
  var content = document.getElementById('content');
  var html = content.innerHTML.replace(/%%MATH(\d+)%%/g, function(m, n){
    return prot.blocks[+n];
  });
  content.innerHTML = html;

  // 生成目录
  var hs = document.querySelectorAll('#content h2, #content h3');
  var toc = document.getElementById('toc'), tocHtml = '';
  hs.forEach(function(h){
    var sp = h.querySelector('span[id]');
    var id = sp ? sp.id : '';
    var cls = h.tagName === 'H3' ? 'sub' : '';
    tocHtml += '<a class="' + cls + '" href="#' + id + '">' + h.textContent.trim() + '</a>';
  });
  toc.innerHTML = tocHtml;

  // 图片路径：正文里写 figures/xxx.svg
  document.querySelectorAll('#content img').forEach(function(im){
    if(/^figures\//.test(im.getAttribute('src')||'')) return;
  });

  if (window.renderMathInElement) {
    renderMathInElement(document.getElementById('content'), {
      delimiters:[
        {left:'$$', right:'$$', display:true},
        {left:'$',  right:'$',  display:false}
      ],
      ignoredTags:['script','noscript','style','textarea','pre','code'],
      throwOnError:false
    });
  }

  // 滚动高亮
  var links = [].slice.call(toc.querySelectorAll('a'));
  window.addEventListener('scroll', function(){
    var cur = null;
    hs.forEach(function(h){
      if (h.getBoundingClientRect().top < 120) cur = h;
    });
    links.forEach(function(a){ a.classList.remove('active'); });
    if (cur){
      var sp = cur.querySelector('span[id]');
      var act = toc.querySelector('a[href="#' + (sp?sp.id:'') + '"]');
      if (act) act.classList.add('active');
    }
  }, {passive:true});
}
if (window.marked) boot();
else window.addEventListener('load', boot);
</script>
