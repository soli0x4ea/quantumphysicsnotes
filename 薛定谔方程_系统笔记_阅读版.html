<script type="text/plain" id="src"># 薛定谔方程

> **分类归属：第二部分 形式体系与数学结构 · 数学程度：L2（运算层）· 前置依赖：第 9 篇《量子态与叠加原理》、第 11 篇《希尔伯特空间与狄拉克符号》、第 12 篇《算符、对易关系与表象》**

> **验证依据**：Schrödinger (1926) *Ann. Phys.* 79, 361 / 489 / 80, 437 / 81, 109（波动力学四篇）、Schrödinger (1926) *Ann. Phys.* 79, 734（与矩阵力学等价）、Dirac (1930) *The Principles of Quantum Mechanics*、Feynman Lectures Vol. III（第 16 章"经典语境中的薛定谔方程"）、Sakurai & Napolitano (2011)、CODATA (2022)

---

## 一、概念与定位

第 12 篇确立了"物理量 = 厄米算符、态 = 希尔伯特空间矢量"。仍缺一条动力学法则：**态如何随时间演化，以及能量本征值（即定态能级）从何而来**。薛定谔方程（Schrödinger, 1926）填补这条法则，是量子力学非相对论情形的基本运动方程，地位相当于经典力学的牛顿第二定律或哈密顿正则方程。

两条核心定位：

1. **含时薛定谔方程（TDSE）是演化律**。它给出态矢量随时间的幺正演化，是线性齐次方程，保证概率守恒与叠加原理（第 9 篇）不被破坏。
2. **不含时薛定谔方程（定态方程）是本征值问题**。当哈密顿量不显含时间，分离变量得到 $\hat H\psi=E\psi$——这正是第 12 篇"可观测量本征值 = 可测能量"的具体实现：能级 $E_n$ 即哈密顿算符的本征值，定态波函数即其本征矢。所有原子、分子、凝聚态的能级谱都由此方程解出。

本篇是第二部分的枢纽：第 14 篇一维势场、第 15 篇谐振子、第 17 篇氢原子都是求解特定 $\hat H$ 下不含时方程的实例；第 18 篇的绘景变换与密度矩阵演化以 TDSE 为起点；第五部分（第 37/38 篇）的 Klein–Gordon 与狄拉克方程则是 TDSE 在相对论协变要求下的替代。

---

## 二、数学结构

### 2.1 含时薛定谔方程

在坐标表象下，含时薛定谔方程为
$$i\hbar\frac{\partial}{\partial t}\psi(\mathbf r,t)=\hat H\psi(\mathbf r,t),\qquad \hat H=-\frac{\hbar^2}{2m}\nabla^2+V(\mathbf r,t). \tag{2.1}$$
对不显含时的 $\hat H$，用分离变量 $\psi(\mathbf r,t)=\phi(\mathbf r)T(t)$ 代入：
$$i\hbar\,\phi(\mathbf r)\,\frac{dT}{dt}=T(t)\,\hat H\phi(\mathbf r).$$
两边同除以 $\phi T$，左边仅依赖 $t$、右边仅依赖 $\mathbf r$，故各等于常数，记为 $E$：
$$i\hbar\frac{dT}{dt}=E T \quad\Rightarrow\quad T(t)=e^{-iEt/\hbar};$$
$$\hat H\phi(\mathbf r)=E\phi(\mathbf r)\quad\Rightarrow\quad \text{不含时薛定谔方程（定态方程）}. \tag{2.2}$$

### 2.2 概率流连续性方程（推导不跳步）

定义概率密度 $\rho=\psi^*\psi$、概率流密度 $\mathbf j$。由 TDSE 与其复共轭：
$$i\hbar\frac{\partial\psi}{\partial t}=-\frac{\hbar^2}{2m}\nabla^2\psi+V\psi,\qquad -i\hbar\frac{\partial\psi^*}{\partial t}=-\frac{\hbar^2}{2m}\nabla^2\psi^*+V\psi^*.$$
第一式乘 $\psi^*$、第二式乘 $\psi$ 后相减：
$$i\hbar\left(\psi^*\frac{\partial\psi}{\partial t}+\frac{\partial\psi^*}{\partial t}\psi\right)=-\frac{\hbar^2}{2m}\left(\psi^*\nabla^2\psi-\psi\nabla^2\psi^*\right).$$
左端为 $i\hbar\frac{\partial}{\partial t}(\psi^*\psi)=i\hbar\frac{\partial\rho}{\partial t}$。右端括号用 $\psi^*\nabla^2\psi-\psi\nabla^2\psi^*=\nabla\cdot(\psi^*\nabla\psi-\psi\nabla\psi^*)$，故
$$i\hbar\frac{\partial\rho}{\partial t}=-\frac{\hbar^2}{2m}\nabla\cdot(\psi^*\nabla\psi-\psi\nabla\psi^*). \tag{2.3}$$
除以 $i\hbar$ 并定义
$$\mathbf j=\frac{\hbar}{2mi}\left(\psi^*\nabla\psi-\psi\nabla\psi^*\right), \tag{2.4}$$
即得连续性方程
$$\frac{\partial\rho}{\partial t}+\nabla\cdot\mathbf j=0. \tag{2.5}$$
**物理含义**：概率守恒表现为概率的"局域流动"，而非概率凭空产生或消失。单粒子归一化 $\int\rho\,d^3r=1$ 对全部时间保持不变（由连续性方程对全空间积分、边界无流入流出即得 $\frac{d}{dt}\int\rho\,d^3r=0$）。

### 2.3 定态的一般性质

由 $\hat H$ 厄米（第 12 篇），定态解有：
- **能级实数**：$E_n\in\mathbb R$。
- **正交性**：不同能级本征函数 $\phi_m,\phi_n$ 正交（$\int\phi_m^*\phi_n\,d^3r=\delta_{mn}$）。
- **概率密度时间无关**：定态下 $|\psi(\mathbf r,t)|^2=|\phi(\mathbf r)|^2$，且概率流为稳恒流（如散射态有常流，束缚态 $\mathbf j=0$）。
- **一般解可展开**：$\psi(\mathbf r,t)=\sum_n c_n\phi_n(\mathbf r)e^{-iE_nt/\hbar}+\int c_E\phi_E e^{-iEt/\hbar}dE$（离散+连续谱）。

## 四、实验基础与观测证据

### 4.1 不含时方程本征值预言与原子/分子光谱精确吻合

解定态方程得到的能级直接对应可测谱线。氢原子（第 17 篇）由库仑势 $\hat H$ 解出 $E_n=-R_\infty hc/n^2$，预言与里德伯公式及现代激光光谱比对精度达 $10^{-11}$（里德伯常量见上表）。分子振动/转动能级（谐振子/转子，第 15 篇）给出的红外/微波谱线与实验一致。这是"定态方程 = 能量本征值问题"这一设定的最硬支撑：若 TDSE 形式错误，本征值谱将偏离实验谱线。

### 4.2 含时方程幺正演化与相位：中子干涉引力相位

含时方程的幺正演化预言态获得可被干涉测量的动力学/几何相位。Colella, Overhauser & Werner (1975, #24bc) 用中子干涉仪测得地球引力场导致的量子相位 $\Delta\phi = mg\lambda L^2/(2\hbar v) \sim 2\pi\times(几)\times10^{-1}$，与含时薛定谔方程在引力势 $V=mgh$ 下的预言一致。该实验直接验证"态随时间的相干演化由 TDSE 给出、且相位可观测"——而非仅本征值（能级）可测。

### 4.3 Ramsey 干涉：两态系统的含时演化

Feynman Lectures Vol. III 第 9 章以氨分子（两定态叠加）微波激射器为例，展示含时方程对两态系统给出的 Rabi 型振荡与 Ramsey 干涉条纹，被分子束磁共振实验精确验证。这是含时方程在少自由度系统上最干净的检验，亦为第 18 篇两能级 Rabi 演化与第 34 篇量子比特门操作的理论源头。

## 五、分类体系与物理机制

### 5.1 方程形式的分类

| 形式 | 方程 | 适用 |
|------|------|------|
| 含时（一般） | $i\hbar\partial_t\psi=\hat H\psi$ | 任意演化、散射、含时势 |
| 不含时（定态） | $\hat H\phi=E\phi$ | $\hat H$ 不显含时，求能级与定态 |
| 自由粒子 | $i\hbar\partial_t\psi=-\frac{\hbar^2}{2m}\nabla^2\psi$ | $V=0$，平面波解 $\psi\propto e^{i(\mathbf k\cdot\mathbf r-\omega t)}$ |

### 5.2 边界条件机制

解定态方程必须配边界条件，物理上要求：
- **波函数连续**：$\psi$ 在全空间连续（势有限处）。
- **导数连续**：势无 $\delta$/无限跳跃处 $\psi'$ 连续（第 14 篇 $\delta$ 势与硬壁为特例）。
- **平方可积**：束缚态要求 $\int|\psi|^2<\infty$（离散谱）；散射态归一化为 $\delta$ 函数（连续谱，见第 11 篇连续谱）。
- **单值有限**：多连通空间（如 AB 效应）需计入拓扑相位。

### 5.3 概念辨析

- **TDSE 是一阶时间导数**：这保证概率守恒（第 2.2 节），但破坏相对论协变性（时间空间不对称）。第 37/38 篇的 KG/狄拉克方程为恢复协变改为二阶/一阶矩阵形式，代价是引入负频或自旋结构。
- **定态 ≠ 静止**：定态概率密度不随时间变，但概率流可非零（散射态），且相位仍按 $e^{-iEt/\hbar}$ 转动——相位转动是干涉与演化的根源（4.2、4.3 节）。
- **"能量"的含义**：定态能量即哈密顿算符本征值，与经典"动能+势能"在算符意义下对应（对应原理）。

## 六、典型系统与可解模型

### 6.1 解析例：自由粒子平面波

$V=0$ 时，一维含时方程解为平面波 $\psi(x,t)=A e^{i(kx-\omega t)}$，色散关系 $\omega=\hbar k^2/(2m)$、$E=\hbar\omega=\hbar^2k^2/(2m)$。平面波不平方可积（连续谱），以波包叠加获得物理态（第 9 篇双缝、第 12 篇高斯波包均基于此）。

### 6.2 数值例：有限差分解一维势阱验证能级

以一维无限深势阱 $V(x)=0\ (0<x<L)$、$V=\infty$ 其余为例，定态方程离散为三对角矩阵本征值问题（有限差分法）。脚本 `code/薛定谔方程_有限差分势阱.py` 对此数值对角化，验证：
- 能级 $E_n^{\text{(num)}}\approx n^2\pi^2\hbar^2/(2mL^2)$（相对误差随网格加密趋于 0）；
- 第 $n$ 个本征函数恰有 $n-1$ 个节点（节点定理）。
输出 `figures/薛定谔方程_有限差分势阱.svg`。该数值例与第 12 篇 6.1 节解析结果互为印证，同时满足规范"解析与数值各至少一例"的要求。

## 七、历史脉络与学术争议

### 7.1 年份—人物—文献时间线

| 年份 | 人物 | 贡献 | 文献 |
|------|------|------|------|
| 1926 | Schrödinger | 波动力学第一篇：定态方程与氢原子解 | Ann. Phys. 79, 361–376 (#24bt) |
| 1926 | Schrödinger | 第二篇：微扰与含时问题 | Ann. Phys. 79, 489–527 (#24bu) |
| 1926 | Schrödinger | 第三篇：本征值问题的进一步展开 | Ann. Phys. 80, 437–490 (#24bv) |
| 1926 | Schrödinger | 第四篇：含时方程与散射（首次引入复数） | Ann. Phys. 81, 109–139 (#24bw) |
| 1926 | Schrödinger | 与矩阵力学等价性证明 | Ann. Phys. 79, 734–756 (#24bx) |
| 1925–26 | Heisenberg/Born/Jordan | 矩阵力学（竞争表述） | 见第 12 篇 #24br/#24bs |

### 7.2 争议与并列

- **波 vs 矩阵的形式之争（1926）**：薛定谔起初用连续"波"语言，海森堡用离散矩阵；等价性证明（#24bx）后统一。但"波函数是实体波还是概率幅"的诠释之争（第 10、31 篇）至今未决，本篇不介入。
- **非相对论性**：TDSE 一阶时间导数使其非相对论（第 5.3 节）。薛定谔本人先得到相对论性版本（即 Klein–Gordon 方程前身），但因给出的精细结构与实验不符而先发表非相对论版（第 38 篇详述）。
- **对应原理**：当 $\hbar\to0$（或作用量 $\gg\hbar$）时，TDSE 的程函近似回归经典哈密顿–雅可比方程——这是量子回归经典的严格通道，也是第 20 篇路径积分经典极限的源头。

  var blocks = [];
  // 先抽块级 $$...$$（可跨行）
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, function(m){
    blocks.push(m);
    return '%%MATH' + (blocks.length - 1) + '%%';
  });
  // 再抽行内 $...$（不含换行、内部不含 $）
  src = src.replace(/\$([^\$\n]+?)\$/g, function(m){
    blocks.push(m);
    return '%%MATH' + (blocks.length - 1) + '%%';
  });
  return { src: src, blocks: blocks };
}

function boot(){
  var raw = document.getElementById('src').textContent;
  // 记录标题锚点（在保护公式之前，避免影响）
  var md = raw.replace(/^(#{1,3})\s+(.+)$/gm, function(m, h, t){
    var id = 'h-' + t.replace(/[^\w一-龥]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
    return h + ' <span id="' + id + '"></span>' + t;
  });

  // 保护数学公式
  var prot = protectMath(md);
  md = prot.src;

  document.getElementById('content').innerHTML = marked.parse(md);

  // 还原数学公式占位符
  var content = document.getElementById('content');
  var html = content.innerHTML.replace(/%%MATH(\d+)%%/g, function(m, n){
    return prot.blocks[+n];
  });
  content.innerHTML = html;

  // 生成目录
  var hs = document.querySelectorAll('#content h2, #content h3');
  var toc = document.getElementById('toc'), tocHtml = '';
  hs.forEach(function(h){
    var sp = h.querySelector('span[id]');
    var id = sp ? sp.id : '';
    var cls = h.tagName === 'H3' ? 'sub' : '';
    tocHtml += '<a class="' + cls + '" href="#' + id + '">' + h.textContent.trim() + '</a>';
  });
  toc.innerHTML = tocHtml;

  // 图片路径：正文里写 figures/xxx.svg
  document.querySelectorAll('#content img').forEach(function(im){
    if(/^figures\//.test(im.getAttribute('src')||'')) return;
  });

  if (window.renderMathInElement) {
    renderMathInElement(document.getElementById('content'), {
      delimiters:[
        {left:'$$', right:'$$', display:true},
        {left:'$',  right:'$',  display:false}
      ],
      ignoredTags:['script','noscript','style','textarea','pre','code'],
      throwOnError:false
    });
  }

  // 滚动高亮
  var links = [].slice.call(toc.querySelectorAll('a'));
  window.addEventListener('scroll', function(){
    var cur = null;
    hs.forEach(function(h){
      if (h.getBoundingClientRect().top < 120) cur = h;
    });
    links.forEach(function(a){ a.classList.remove('active'); });
    if (cur){
      var sp = cur.querySelector('span[id]');
      var act = toc.querySelector('a[href="#' + (sp?sp.id:'') + '"]');
      if (act) act.classList.add('active');
    }
  }, {passive:true});
}
if (window.marked) boot();
else window.addEventListener('load', boot);
</script>
</body>
</html>
