<script type="text/plain" id="src"># 晶体中的电子与能带

> **分类归属：第三部分·多体、对称与凝聚态 · 数学程度：L3 · 前置依赖：第 16 篇《角动量与自旋》、第 17 篇《中心力场与氢原子》、第 21 篇《全同粒子与泡利不相容原理》**
> **验证依据**：Bloch (1928) Z. Phys.、Brillouin (1930) J. Phys. Radium、Kronig & Penney (1931) Proc. R. Soc. A、Wigner & Seitz (1933) Phys. Rev.、Wilson (1931) Proc. R. Soc. A、Sommerfeld & Bethe (1933) Handbuch der Physik、Ashcroft & Mermin (1976)

---

## 阅读指引（三层）

| 深度 | 阅读范围 | 你能带走什么 |
|------|---------|------------|
| 零门槛线 | §一 + §四 + §七 | 结论、实验数字、来龙去脉（不碰一个公式） |
| 进阶线 | 加 §三 + §五 | 量级感、物理机制 |
| 完整线 | 全部八节 | 完整推导与可解模型 |

## 一、概念与定位

> **一句话结论**：周期势中电子能谱分裂成被禁带隔开的允许带；导电性取决于费米能级落在带内还是带隙中。

**能带论（band theory）** 回答一个看似朴素却长期困惑早期物理学家的问题：为什么有的固体是良导体（铜、银）、有的是绝缘体（金刚石、食盐）、有的介于二者之间（硅、锗）？经典德鲁德（Drude）自由电子模型只能解释金属导电，却无法说明绝缘体为何在同样存在电子的情况下完全不导电。能带论的核心洞见是：**周期势场中的电子本征能量不是连续的，而是分裂成一段段被「禁带（band gap）」隔开的允许带（allowed band）**；固体是否导电，取决于费米能级是否落在允许带内部（金属）还是落在带隙之中（绝缘体 / 半导体）。

名称词源：英文 *band* 直译「带」，源自布里渊（Brillouin）将能量–波矢关系画成一条条分立的「带」；德文 *Energieband* 同义。能带论成形于 1928–1933 年间：Bloch 提出周期性势场中单电子波函数的普遍形式（布洛赫定理），Kronig 与 Penney 给出第一个可解模型，Wigner 与 Seitz 提出原胞（Wigner–Seitz 胞）方法，Wilson 用此框架首次解释了半导体与绝缘体的区别。

本篇须抓住的核心特征：

1. **周期性导致带结构**：晶格的周期势 $V(\mathbf{r}+\mathbf{R})=V(\mathbf{r})$（$\mathbf{R}$ 为任意格矢）使单电子本征态必取布洛赫形式，能量 $E_n(\mathbf{k})$ 成为倒空间（动量空间）中的周期函数，出现能带指标 $n$。
2. **禁带出现在布里渊区边界**：当电子波矢满足布拉格条件 $2\mathbf{k}\cdot\mathbf{G}=G^2$（$\mathbf{G}$ 为倒格矢）时，正向与反向行波相长，开放出能量禁带。这是衍射与能带共同的根源。
3. **导体 / 绝缘体 / 半导体的判据**：价带（最高填满的带）若被部分占据 → 金属；价带全满、与空的导带间带隙 $E_g\gg k_B T$ → 绝缘体；带隙较小（$E_g\sim 0.1\!-\!1.5\ \mathrm{eV}$）→ 半导体。该判据是带填充的结果，而非「电子与电子是否相互作用」。
4. **有效质量近似**：在带内部远离边界处，晶格周期势的复杂作用可整体吸收进一个「有效质量」$m^*$，使电子在弱外场下近似表现为自由粒子，只是惯性被重整化。
5. **自旋-统计的叠加**：每个能带态仍受泡利原理约束——每 $(\mathbf{k},n)$ 态容纳两个自旋相反的电子，因此一个能带最多容纳 $2N$（$N$ 为原胞数）个电子。

本主题在体系中的位置：它是第二部分（单电子薛定谔方程、角动量、中心场）向凝聚态的直接延伸，是第 25 篇（半导体与 pn 结）、第 26 篇（量子统计）、第 27 篇（超导）的共同基础，并把第 21 篇的全同性、第 17 篇的氢原子径向结构与周期势统一起来。

## 二、数学结构

**符号约定声明**：本篇采用 SI 单位制，ħ 与 $2\pi$ 显式保留；晶格常数记为 $a$（一维情形）或立方边长；倒格矢 $\mathbf{G}$ 由 $\mathbf{a}_i\cdot\mathbf{G}_j=2\pi\delta_{ij}$ 定义；傅里叶变换采用对称约定；度规 $(+,-,-,-)$。主推导为单电子近似（第一量子化坐标表象），多体效应仅在第七节作概念交代。

### 2.1 布洛赫定理

考虑周期势 $V(\mathbf{r}+\mathbf{R})=V(\mathbf{r})$。平移算符 $\hat T_{\mathbf{R}}$ 满足 $\hat T_{\mathbf{R}}V=V\hat T_{\mathbf{R}}$，且不同平移算符彼此对易，$[\hat T_{\mathbf{R}},\hat T_{\mathbf{R}'}]=0$，故可与哈密顿量 $\hat H$ 同时对角化。平移算符的本征值受周期性约束：平移一个原胞的整周期后态只能相差幺相位，即 $\hat T_{\mathbf{R}}\psi=e^{i\mathbf{k}\cdot\mathbf{R}}\psi$。由此导出布洛赫定理：

$$
\psi_{n\mathbf{k}}(\mathbf{r})=e^{i\mathbf{k}\cdot\mathbf{r}}\,u_{n\mathbf{k}}(\mathbf{r}),
\qquad u_{n\mathbf{k}}(\mathbf{r}+\mathbf{R})=u_{n\mathbf{k}}(\mathbf{r}).
\tag{1}
$$

即任意本征态可写为平面波因子 $e^{i\mathbf{k}\cdot\mathbf{r}}$ 乘一个与晶格同周期的函数 $u$。代入定态薛定谔方程得周期函数 $u$ 满足

$$
\left[-\frac{\hbar^2}{2m}(\nabla+i\mathbf{k})^2+V(\mathbf{r})\right]u_{n\mathbf{k}}(\mathbf{r})=E_n(\mathbf{k})\,u_{n\mathbf{k}}(\mathbf{r}).
\tag{2}
$$

由周期性，$\mathbf{k}$ 与 $\mathbf{k}+\mathbf{G}$ 等价，故只需取第一布里渊区（倒空间中的维格纳–赛兹原胞）内的 $\mathbf{k}$；能量 $E_n(\mathbf{k})$ 对 $\mathbf{k}$ 周期，且每个带指标 $n=1,2,\dots$ 对应一整条能带。

### 2.2 倒格矢与布里渊区

设正格基矢 $\mathbf{a}_1,\mathbf{a}_2,\mathbf{a}_3$，倒格基矢定义为 $\mathbf{b}_1=2\pi\,\frac{\mathbf{a}_2\times\mathbf{a}_3}{\mathbf{a}_1\cdot(\mathbf{a}_2\times\mathbf{a}_3)}$ 及其循环。倒格矢 $\mathbf{G}=h\mathbf{b}_1+k\mathbf{b}_2+l\mathbf{b}_3$（$h,k,l\in\mathbb Z$）。第一布里渊区由所有满足 $|\mathbf{k}|\le|\mathbf{k}-\mathbf{G}|$（对任意非零 $\mathbf{G}$）的 $\mathbf{k}$ 构成——即倒空间中以原点为中心、到各倒格点中垂面围成的多面体。一维情形布里渊区边界在 $k=\pm\pi/a$。

### 2.3 近自由电子与带隙

将弱周期势作微扰。自由电子 $E^{(0)}(\mathbf{k})=\hbar^2k^2/2m$ 在布里渊区边界 $\mathbf{k}=\mathbf{G}/2$ 处与反向态 $\mathbf{k}-\mathbf{G}$ 简并，两态耦合打开能隙。二阶简并微扰给出边界处带隙

$$
E_g=2|V_{\mathbf{G}}|,
\tag{3}
$$

其中 $V_{\mathbf{G}}$ 是周期势的第 $\mathbf{G}$ 个傅里叶分量。这正是 X 射线衍射布拉格条件在能谱上的回声。

### 2.4 紧束缚近似

当电子强烈局域于原子时，晶体波函数由原子轨道 $\phi(\mathbf{r}-\mathbf{R}_j)$ 线性组合（LCAO）给出，带能量

$$
E_n(\mathbf{k})=E_n^{\mathrm{at}}-\gamma_n-\sum_{\boldsymbol{\delta}}t_{n\boldsymbol{\delta}}\,e^{i\mathbf{k}\cdot\boldsymbol{\delta}},
\tag{4}
$$

其中 $t_{n\boldsymbol{\delta}}$ 是相邻原胞间跃迁积分，$\boldsymbol{\delta}$ 取近邻。对简单立方 s 带近邻跃迁 $t$，有 $E(\mathbf{k})=E_0-2t(\cos k_x a+\cos k_y a+\cos k_z a)$，带宽正比于 $t$。

### 2.5 有效质量

在带内部取 $\mathbf{k}$ 幂级数展开 $E_n(\mathbf{k})\approx E_n(\mathbf{k}_0)+\frac{1}{2}\sum_{ij}\frac{\partial^2E_n}{\partial k_i\partial k_j}\big|_0(k_i-k_{0i})(k_j-k_{0j})$，定义有效质量张量

$$
\left(\frac{1}{m^*}\right)_{ij}=\frac{1}{\hbar^2}\frac{\partial^2 E_n}{\partial k_i\partial k_j}.
\tag{5}
$$

带顶处 $m^*<0$（曲率向下），带底处 $m^*>0$。在外场 $\mathbf{F}$ 下运动方程形式上与牛顿第二定律相同：$\hbar\dot{\mathbf{k}}=\mathbf{F}$。

### 2.6 态密度

三维态密度（单位体积、单位能量间隔的能态数）为

$$
g(E)=\frac{1}{(2\pi)^3}\sum_n\int_{\mathrm{BZ}}\!d^3k\,\delta\bigl(E-E_n(\mathbf{k})\bigr)
=\sum_n\int_{\mathrm{FS}}\frac{dS}{(2\pi)^3}\frac{1}{|\nabla_{\mathbf{k}}E_n|}.
\tag{6}
$$

一维情形因能带边缘 $\nabla_kE\to0$ 出现 $\propto(E-E_{\mathrm{edge}})^{-1/2}$ 的范霍夫奇点（van Hove singularity）。

## 三、物理量与特征尺度

- **晶格常数 $a$**：典型固体 $a\sim 2\!-\!6\ \text{\AA}$（硅 5.43 Å、铜 3.61 Å、金刚石 3.57 Å）。布里渊区边界尺度 $k\sim\pi/a\sim 1\ \text{\AA}^{-1}$。
- **带隙 $E_g$**：绝缘体金刚石 $E_g\approx 5.5\ \mathrm{eV}$；半导体硅 $1.12\ \mathrm{eV}$（300 K）、锗 $0.66\ \mathrm{eV}$；金属无完整带隙。室温热激发尺度 $k_B T\approx 0.026\ \mathrm{eV}$，故 $E_g\gg k_B T$ 者绝缘，$E_g\sim k_B T$ 量级者本征载流子显著。
- **费米能级 $E_F$**：金属中 $E_F$ 落在允许带内，典型 $E_F\sim 5\!-\!10\ \mathrm{eV}$（铜约 $7\ \mathrm{eV}$，见第 21 篇）；半导体本征费米能级位于带隙中线附近。
- **有效质量 $m^*$**：自由电子质量量级附近，但可被重整化（硅导带电子纵向 $m_l^*=0.98m_e$、横向 $m_t^*=0.19m_e$；砷化镓 $\Gamma$ 谷 $m^*=0.067m_e$）。
- **布里渊区折叠**：一维周期势把自由电子抛物线 $E^{(0)}(k)$ 在每一布里渊区边界处折叠并打开能隙，原连续谱变成并排的带。
- **德鲁德电导率 $\sigma$**：金属 $\sigma=ne^2\tau/m^*$，其中 $\tau$ 为弛豫时间；绝缘体因价带满、无空态可跃迁（泡利阻塞）而不导电。

---

## 四、实验基础与观测证据

1. **X 射线衍射与布里渊区边界的一致性**：劳厄（Laue 1912）与布拉格（Bragg 1913）衍射条件 $2d\sin\theta=n\lambda$ 与能带论在 $\mathbf{k}=\mathbf{G}/2$ 打开禁带是同一回事——晶体衍射直接测得倒格矢，验证了周期势的布拉格结构。本篇不重复第 6 篇的原子光谱，但强调：衍射测得的布拉格平面正是能带图上的带隙位置。
2. **角分辨光电子能谱（ARPES）**：自 1990 年代起，ARPES 直接测量 $E_n(\mathbf{k})$ 的色散关系，对铜、硅、石墨等给出与第一性原理计算高度一致的能带图，是最直接的带结构实验证据。例如铜的 $d$ 带与 $sp$ 带、石墨的狄拉克锥（Dirac cone，带隙为零的线性色散）均被 ARPES 直接成像。
3. **光学吸收带隙**：本征半导体在光子能量 $h\nu<E_g$ 时透明、超过时吸收骤增，吸收边直接给出 $E_g$。硅 $E_g=1.12\ \mathrm{eV}$ 对应吸收边 ~1100 nm，与实验吻合。
4. **电导率随温度的行为**：金属 $\sigma$ 随 $T$ 升高而下降（声子散射增强 $\tau$），绝缘体/半导体 $\sigma$ 随 $T$ 指数上升（$\propto e^{-E_g/2k_BT}$），两类的根本差异正在于费米能级是否落在带隙中，而非「有没有电子」。
5. **霍尔效应关联（见第 25 篇）**：载流子符号与浓度的测量验证了导带电子与价带空穴的并存，是带理论预言的价带顶「空态=空穴」概念的直接证据。

**误读纠正**：带隙不是「电子被墙挡住」，而是周期势中布洛赫态本征值谱的拓扑间隙；电子在满带中「无法被加速」是因为所有 $\mathbf{k}$ 态已被占据，外加电场只能整体平移占据分布（回到原状），并非存在动力学壁垒。

## 五、分类体系与物理机制

### 5.1 导体 / 绝缘体 / 半导体

- **金属**：最高占据带（价带）部分填充，费米面穿过允许带，存在未被占据的邻近 $\mathbf{k}$ 态，电场可驱动电流。典型如碱金属（每个原子贡献一个 $s$ 电子，半满带）。
- **绝缘体**：价带全满、导带全空，二者间带隙大（$E_g\gg k_B T$）。典型如金刚石（sp³ 杂化形成满的 $\sigma$ 带与空的 $\sigma^*$ 带，$E_g\approx5.5\ \mathrm{eV}$）。
- **半导体**：结构类似绝缘体但带隙小。本征半导体在 $T>0$ 时有少量热激发电子跨过带隙，价带留下空穴，二者共同导电。典型如硅、锗。

### 5.2 直接带隙 vs 间接带隙

若导带底与价带顶位于同一 $\mathbf{k}$（如 GaAs），光子吸收/发射不需改变晶体动量，发光效率高；若二者位于不同 $\mathbf{k}$（如 Si、Ge），跃迁须伴随声子以守恒动量，光学跃迁概率低。这是 LED/激光器材料选择的根本判据。

### 5.3 满带不导电的机制

对满带，占据分布 $f(\mathbf{k})=1$ 对所有 $\mathbf{k}$ 对称。外加均匀电场使 $\hbar\dot{\mathbf{k}}=e\mathbf{E}$，整个费米海在 $\mathbf{k}$ 空间整体平移；由于 $E_n(\mathbf{k})$ 对 $\mathbf{k}$ 周期，平移一个布里渊区后分布复原，净电流 $\mathbf{j}\propto\sum_{\mathrm{filled}}\mathbf{v}(\mathbf{k})=0$。只有部分填充带才有持久电流。

### 5.4 失效边界

- **强关联体系**：近自由电子/紧束缚单电子近似在强关联材料（如 Mott 绝缘体）失效——即便能带论预言金属，电子间强排斥也可使系统绝缘。这是能带论的单电子框架无法涵盖的，须用多体方法（第 26 篇、第 27 篇）。
- **无序与局域化**：强无序导致安德森局域化，电子态虽在能量上允许却被钉在实空间，导电性消失，超出周期势假定。

## 六、典型系统与可解模型

### 6.1 Kronig–Penney 一维 δ 势梳模型

周期 δ 势 $V(x)=\frac{\hbar^2}{ma}P\sum_n\delta(x-na)$。由两侧波函数连续性及导数跳变条件，得本征值方程

$$
\cos(k a)=\cos(\alpha a)+\frac{P}{\alpha a}\sin(\alpha a),
\qquad \alpha=\frac{\sqrt{2mE}}{\hbar}.
\tag{7}
$$

能量允许的充要条件是右端落在 $[-1,1]$。当 $|\cos(ka)|>1$ 时无解，对应禁带。在布里渊区边界 $ka=\pi$ 处 $\cos(ka)=-1$，禁带宽度为

$$
\Delta E= \frac{\hbar^2}{2ma^2}\left[(\alpha_+ a)^2-(\alpha_- a)^2\right],
\tag{8}
$$

其中 $\alpha_\pm$ 由式 (7) 在 $\cos(ka)=-1$ 处解出。该模型首次解析展示了「允许带—禁带交替」的结构（见脚本段 1 与图 1）。

### 6.2 近自由电子带折叠（概念模型）

取一维自由电子抛物线 $E^{(0)}(k)=\hbar^2k^2/2m$，在每道布里渊区边界 $k=\pm\pi/a,\pm2\pi/a,\dots$ 处「折叠并打开能隙 $2|V_G|$」。折叠后的各段即对应不同带指标 $n$。自由电子的连续谱因此被切割成并排的带，直观说明带结构如何由周期势产生。

### 6.3 一维态密度（脚本数值例）

由 Kronig–Penney 能带数值计算一维态密度 $g(E)\propto\sum_{\mathrm{bands}}|\partial E/\partial k|^{-1}$，在每带边缘出现 $(E-E_{\mathrm{edge}})^{-1/2}$ 发散（范霍夫奇点），禁带内 $g(E)=0$（见脚本段 2 与图 2）。

## 七、历史脉络与学术争议

- **1929 Bloch**：Felix Bloch 在博士论文中提出布洛赫定理，给出周期势中单电子波函数的普遍形式，奠定能带论数学基础 [24ee]。
- **1930 Brillouin**：Léon Brillouin 系统引入倒空间与布里渊区概念，将衍射条件与带隙位置统一 [24ef]。
- **1931 Kronig & Penney**：Ralph Kronig 与 William Penney 发表 δ 势梳模型，首次给出可解析求解的带结构，直观展示禁带 [24eg]。
- **1931 Wilson**：Alan Herries Wilson 用带理论首次区分金属、半导体与绝缘体，并解释半导体的温度激活电导 [24ei]。
- **1933 Wigner & Seitz**：提出原胞方法（Wigner–Seitz 胞）与元胞近似，使实际晶体的能带可近似计算 [24ej]。
- **1933 Sommerfeld & Bethe**：在《物理手册》撰写金属电子论长篇综述，系统总结并推进能带与输运理论 [24eh]。
- **学术争议**：早期「金属电子理论是否自洽」的争论（是否需考虑电子-电子相互作用）延续至今——现代密度泛函理论（Hohenberg–Kohn 1964，属第 46 篇范围）才在单粒子有效势框架内基本解决；而强关联导致的 Mott 绝缘体则始终超出单电子能带论，是凝聚态物理的活跃前沿。

// 在 markdown 解析前抽出公式，用占位符保护，避免被 marked 当成强调语法破坏
function protectMath(src){
  var blocks = [];
  // 先抽块级 $$...$$（可跨行）
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, function(m){
    blocks.push(m);
    return '%%MATH' + (blocks.length - 1) + '%%';
  });
  // 再抽行内 $...$（不含换行、内部不含 $）
  src = src.replace(/\$([^\$\n]+?)\$/g, function(m){
    blocks.push(m);
    return '%%MATH' + (blocks.length - 1) + '%%';
  });
  return { src: src, blocks: blocks };
}

function boot(){
  var raw = document.getElementById('src').textContent;
  // 记录标题锚点（在保护公式之前，避免影响）
  var md = raw.replace(/^(#{1,3})\s+(.+)$/gm, function(m, h, t){
    var id = 'h-' + t.replace(/[^\w一-龥]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
    return h + ' <span id="' + id + '"></span>' + t;
  });

  // 保护数学公式
  var prot = protectMath(md);
  md = prot.src;

  document.getElementById('content').innerHTML = marked.parse(md);

  // 还原数学公式占位符
  var content = document.getElementById('content');
  var html = content.innerHTML.replace(/%%MATH(\d+)%%/g, function(m, n){
    return prot.blocks[+n];
  });
  content.innerHTML = html;

  // 生成目录
  var hs = document.querySelectorAll('#content h2, #content h3');
  var toc = document.getElementById('toc'), tocHtml = '';
  hs.forEach(function(h){
    var sp = h.querySelector('span[id]');
    var id = sp ? sp.id : '';
    var cls = h.tagName === 'H3' ? 'sub' : '';
    tocHtml += '<a class="' + cls + '" href="#' + id + '">' + h.textContent.trim() + '</a>';
  });
  toc.innerHTML = tocHtml;

  // 图片路径：正文里写 figures/xxx.svg
  document.querySelectorAll('#content img').forEach(function(im){
    if(/^figures\//.test(im.getAttribute('src')||'')) return;
  });

  if (window.renderMathInElement) {
    renderMathInElement(document.getElementById('content'), {
      delimiters:[
        {left:'$$', right:'$$', display:true},
        {left:'$',  right:'$',  display:false}
      ],
      ignoredTags:['script','noscript','style','textarea','pre','code'],
      throwOnError:false
    });
  }

  // 滚动高亮
  var links = [].slice.call(toc.querySelectorAll('a'));
  window.addEventListener('scroll', function(){
    var cur = null;
    hs.forEach(function(h){
      if (h.getBoundingClientRect().top < 120) cur = h;
    });
    links.forEach(function(a){ a.classList.remove('active'); });
    if (cur){
      var sp = cur.querySelector('span[id]');
      var act = toc.querySelector('a[href="#' + (sp?sp.id:'') + '"]');
      if (act) act.classList.add('active');
    }
  }, {passive:true});
}
if (window.marked) boot();
else window.addEventListener('load', boot);
</script>
