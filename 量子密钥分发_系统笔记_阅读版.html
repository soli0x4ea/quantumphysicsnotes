# 量子密钥分发

> **分类归属：第四部分 量子信息与量子光学 · 数学程度：L2（运算层）· 前置依赖：第 11 篇《希尔伯特空间与狄拉克符号》、第 16 篇《角动量与自旋》、第 29 篇《量子纠缠》、第 30 篇《EPR 佯谬与贝尔不等式》、第 31 篇《量子测量与退相干》**
> **验证依据**：Bennett & Brassard (1984) *Proc. IEEE Int. Conf. Computers, Systems & Signal Processing* (Bangalore), 175；Ekert (1991) *PRL* 67, 661；Wootters & Zurek (1982) *Nature* 299, 802；Shor & Preskill (2000) *PRL* 85, 441；Bennett, Bessette, Brassard, Salvail & Smolin (1992) *J. Cryptol.* 5, 3；Brassard, Lütkenhaus, Mor & Sanders (2000) *PRL* 85, 1330；Hwang (2003) *PRL* 91, 057901；Lo, Ma & Chen (2005) *PRL* 94, 230504；Lo, Curty & Qi (2012) *PRL* 108, 130503；Gisin, Ribordy, Tittel & Zbinden (2002) *Rev. Mod. Phys.* 74, 145；Scarani et al. (2009) *Rev. Mod. Phys.* 81, 1301；Bennett, Brassard & Mermin (1992) *PRL* 68, 557；Yin et al. (2017) *Science* 356, 1140；Chen et al. (2021) *Nature* 589, 214

---

## 一、概念与定位

### 1.1 定义

量子密钥分发（QKD）是在一条**量子信道**（可被窃听者完全控制）加一条**已认证的经典公开信道**（可被窃听但内容不可篡改）上，让通信双方 Alice 与 Bob 协商出一段**只有他们知道、且可被证明（在协议假设下）对窃听者 Eve 保密**的随机比特串（密钥）的一族协议。

必须立刻划清三个边界，否则整篇都会错位：

1. **QKD 分发的是"密钥"，不是"消息"**。密文仍由经典信道传输，用一次性密码本（one-time pad, OTP）加密；QKD 只解决"如何让双方安全地共享那把密钥"。
2. **QKD 解决的是"密钥分发"，不是"认证"**。Alice 与 Bob 仍需预先共享少量认证信息（或借助其他手段）来防止中间人攻击；这是经典密码学的职责，QKD 不免除它。
3. **QKD 的安全性基于物理定律，而非计算困难性**。这与 RSA / ECC 等公钥密码（其安全性建立在"大数分解 / 离散对数在计算上困难"的假设上）有根本区别：即使 Eve 拥有无限算力——包括一台成熟的通用量子计算机——也无法在协议假设内攻破 QKD。

### 1.2 名称由来

- **QKD / 量子密钥分发**：本领域通用缩写。协议名多以提出者姓氏或年份命名。
- **BB84**：Bennett 与 Brassard 于 1984 年提出，是第一个 QKD 协议，也是至今部署最广的协议。
- **BBM92**：Bennett、Brassard 与 Mermin（1992）提出的基于纠缠的协议，只用两个非正交态（而非 BB84 的四个），故亦称 BB92。
- **E91**：Ekert（1991）提出的基于 Bell 定理的协议，用纠缠对 + CHSH 违反作为窃听检测（详见第 30 篇）。
- **六态协议（six-state）**：BB84 的推广，在三个互不正交的基（X/Y/Z）上编码，对误码更鲁棒。
- **诱饵态（decoy state）**：Hwang（2003）提出、Lo–Ma–Chen（2005）严格化的工程修正，使不完美的弱相干态光源也能达到单光子级安全（见 §5 与 §4.5）。
- **MDI-QKD**：Measurement-Device-Independent QKD，Lo–Curty–Qi（2012）提出，把最脆弱的单光子探测器"外包"给不可信第三方，从而免疫一切针对探测器的攻击。
- **PNS 攻击**：Photon-Number-Splitting，光子数分离攻击，弱相干态光源的头号现实漏洞（见 §4.5）。

### 1.3 核心特征

1. **安全性锚定在物理定律而非计算假设**。这是 QKD 与一切经典公钥密码最本质的区别：RSA/ECC 的可证安全性依赖于"P ≠ NP 且整数分解无多项式算法"这一类未证明的复杂性假设；BB84/E91 的可证安全性只依赖量子力学的线性性（无克隆定理）与测量公设（测量扰动），不依赖 Eve 的算力上限。正因如此，Shor 算法能攻破 RSA，却**完全不影响** QKD。

2. **无克隆定理是安全根基之一，但不是唯一根基**。未知量子态不可被完美复制（§2.3），因此 Eve 若想"偷看再转发"，必然要在某个基上测量，从而以有限概率扰动被传态、被 Alice/Bob 的误码检测发现。但无克隆只说明"Eve 不能零扰动地完整偷走"，并不说明"Eve 得不到任何信息"——Eve 仍能获得部分信息（受 Holevo 界约束，§2.6），这部分信息要靠**纠错 + 保密放大**压缩掉。

3. **信息论安全（而非计算安全）是可证的目标**。Shor–Preskill（2000）把 BB84 的安全性归约为 CSS 量子纠错码，给出第一个简洁的信息论安全性证明（§2.5）。"无条件安全（unconditional security）"在此指：对 Eve 的算力、甚至对 Eve 拥有量子计算机，都不设限；但**仍对器件与信道模型设限**——这正是与"绝对安全"易被混淆之处（见 §4.4 误读三）。

4. **三层数值界限构成一个尺度阶梯**（类比第 30 篇 §1.3 的 LHV 界 / Tsirelson 界 / 无信号界）：

   | 界限 | 数值 | 来源 |
   |------|------|------|
   | 无克隆（单未知量子态的精确拷贝数） | 0 份 | 量子演化的线性性 |
   | Holevo 界（单 qubit 上 Eve 最大可提取信息） | χ ≤ 1 bit | 量子信息论 |
   | BB84 安全 QBER 阈值 | $Q \le 11.0\%$（单向）/ $\approx 12.6\%$（双向） | 信息论安全性（Shor–Preskill 2000） |

   量子力学并未消除窃听，而是把窃听"量化"并"可检测"：误码率超过阈值即判定信道已被不可容忍地窃听，协议中止。

5. **现实安全性取决于器件，而非只取决于协议**。理想 BB84 假设完美单光子源、完美探测器、无侧信道。真实器件有 PNS 漏洞、探测器致盲、时移、波长攻击等（§4.5）。于是出现两类部署路线：**可信器件（trusted-device）** QKD，安全性依赖对器件行为的建模；**器件无关（device-independent, DI）** QKD，安全性只依赖 Bell 违反的观测，连器件都可不信任。二者安全强度不同，不应混为一谈。

6. **它是量子信息科学最早落地的技术**。2022 年诺贝尔物理学奖授予 Aspect、Clauser、Zeilinger 的理由之一正是"开创量子信息科学"；而 QKD 是该科学方向第一个走出实验室、形成商用网络（京沪干线、墨子号）的分支。这一位置与第 30 篇所述"Bell 违反是 QKD-E91 的安全根基"首尾呼应。

### 1.4 在本套笔记体系中的位置

**前置依赖**：需要第 11 篇的狄拉克符号（bra-ket、张量积）来描述量子比特编码；第 16 篇的自旋 1/2 与泡利矩阵（BB84 的 Z/X 两个共轭基即泡利 $\hat\sigma_z$/$\hat\sigma_x$ 的本征基，E91 用 Bell 基）；第 29 篇的纠缠定义（E91、BBM92、MDI 都建立在纠缠分发上）；第 30 篇的 Bell 不等式（E91 把 CHSH 违反当作窃听检测，器件无关 QKD 的安全证明直接建立在 Bell 违反之上）；第 31 篇的测量公设与退相干（无克隆定理源于演化算符的线性性，而现实器件的侧信道泄露本质上是退相干/测量不完美在器件层面的表现）。

**后续通向**：第 33 篇《量子隐形传态与密集编码》与 QKD 共享纠缠资源与 Bell 测量技术；第 34 篇《量子计算与量子算法》中 Shor 算法从"对手"角度凸显 QKD 抗量子计算的价值；第 41 篇《量子引力与全息》不依赖本篇，但量子密码的"信息是否可生于引力"是开放话题（本文不展开）。

**与宝石学笔记的接口**：`宝石学正式版/` 中《双折射后的光是否纠缠态》《矿物光学性质的第一性原理计算》《宝石紫外荧光的量子力学解释》都涉及光子偏振的代数描述。BB84 用四个线偏振态（H/V/±45°），其编码完全落在宝石学中二向色性、双折射偏振测量的同一套泡利基框架内。第 30 篇已确立的"单粒子偏振–路径纠缠不直接体现 EPR 非定域性"结论，正是理解"为何 BB84 靠单光子非正交态而非靠纠缠分发来获得安全"的边界（见 §7.4）。

## 二、数学结构

### 2.1 符号约定声明

本篇统一采用以下约定，全文不再切换：

- **信息单位**：熵以 **bit** 为单位，对数取以 2 为底（香农熵 $H(p)=-p\log_2 p-(1-p)\log_2 p$）；冯·诺依曼熵 $S(\rho)=-\mathrm{Tr}(\rho\log_2\rho)$。涉及信道容量的 $\chi$ 界也以 bit 计。
- **数学程度**：L2。本篇不展开 CSS 码与熵 uncertain 关系的完整算符代数，但所有安全界限给出可算的闭式（无需跳步）。
- **量子比特态**：采用第 16 篇的泡利基。计算基 Z：$\lvert 0\rangle_Z=\lvert H\rangle$（水平偏振）、$\lvert 1\rangle_Z=\lvert V\rangle$（垂直偏振）；对角基 X：$\lvert +\rangle=(\lvert H\rangle+\lvert V\rangle)/\sqrt2$（45°）、$\lvert -\rangle=(\lvert H\rangle-\lvert V\rangle)/\sqrt2$（135°）。Y 基用于六态协议：$\lvert R\rangle=(\lvert H\rangle+i\lvert V\rangle)/\sqrt2$（右旋）、$\lvert L\rangle=(\lvert H\rangle-i\lvert V\rangle)/\sqrt2$（左旋）。
- **概率与熵符号**：$Q$ 表示量子比特误码率（QBER），$e$ 为通用误码变量；$H(\cdot)$ 香农熵；$I(A;E)$ 为香农互信息；$\chi(A;E)$ 为 Holevo 量（见 §2.6）。
- **密钥率**：$R$ 表示每发送一个信号脉冲所生成的安全密钥比特数（bit/脉冲），取渐近极限（无限长密钥、无限次统计）下的表达式；有限长修正（有限密钥效应）只在 §5.4 提及，不展开公式。
- **张量积**：Alice 与 Bob 的复合系统用 $\otimes$；纠缠态写在两侧张量空间（见 E91 §2.2）。
- **傅里叶变换**：本篇不涉及。

### 2.2 态空间与 BB84 / E91 编码

BB84 的码空间是单量子比特 $\mathcal H_2\cong\mathbb C^2$，编码态取自四个非正交态：

$$\lvert H\rangle,\ \lvert V\rangle,\ \lvert +\rangle,\ \lvert -\rangle \tag{2.1}$$

这四个态位于 Bloch 球赤道上，两两夹角 45°（H 与 V 正交、H 与 + 夹角 45°）。Alice 随机在 Z 基或 X 基制备其中一个并发出；Bob 随机用 Z 或 X 基测量。

**关键事实**：同一基内的两个态正交（可完美区分），不同基之间的态重叠 $\lvert\langle H\rvert+\rangle\rvert^2=1/2$（不可完美区分）。这正是非正交态不可被无扰动区分的来源（§2.3）。

E91 的码空间是双量子比特 $\mathcal H_2\otimes\mathcal H_2\cong\mathbb C^4$，源分发 Bell 态（常用 $\lvert\Phi^+\rangle$）：

$$\lvert\Phi^+\rangle=\frac{1}{\sqrt2}\bigl(\lvert H\rangle_A\lvert H\rangle_B+\lvert V\rangle_A\lvert V\rangle_B\bigr) \tag{2.2}$$

双方在本地随机选 Z 或 X 基测量自己的那一半；当两基一致时结果完全关联（CHSH 关联），不一致时结果不关联。具体关联函数与第 30 篇 §2.2–§2.7 完全一致，本篇不再重推，只引用结论：$E_{\text{QM}}(\mathbf a,\mathbf b)=2\sqrt2$ 可达的 $S$ 值（CHSH 形式）给出 Bell 违反。

### 2.3 无克隆定理（线性性证明）

> 这是第 31 篇测量公设"量子演化由幺正算符描述"的直接推论，也是 QKD 安全的第一块基石。

**定理**：不存在物理过程能对任意未知单量子比特态 $\lvert\psi\rangle$ 产生两份精确拷贝。

**证明（不跳步）**。设存在一复制机，由一个幺正算符 $U$ 与一初始空白态 $\lvert\Sigma\rangle$ 实现，且对任意两个已知正交态满足

$$U\lvert 0\rangle\lvert\Sigma\rangle=\lvert 0\rangle\lvert 0\rangle,\qquad U\lvert 1\rangle\lvert\Sigma\rangle=\lvert 1\rangle\lvert 1\rangle \tag{2.3}$$

其中 $\lvert 0\rangle,\lvert 1\rangle$ 是某计算基（如 $\lvert H\rangle,\lvert V\rangle$）。由量子力学演化是线性的，$U$ 对叠加态的作用等于分别对分量作用后再叠加：

$$U\frac{\lvert 0\rangle+\lvert 1\rangle}{\sqrt2}\lvert\Sigma\rangle
=\frac{U\lvert 0\rangle\lvert\Sigma\rangle+U\lvert 1\rangle\lvert\Sigma\rangle}{\sqrt2}
=\frac{\lvert 0\rangle\lvert 0\rangle+\lvert 1\rangle\lvert 1\rangle}{\sqrt2} \tag{2.4}$$

而"完美克隆"要求该输入被映为

$$\frac{\lvert 0\rangle+\lvert 1\rangle}{\sqrt2}\otimes\frac{\lvert 0\rangle+\lvert 1\rangle}{\sqrt2}
=\frac{\lvert 0\rangle\lvert 0\rangle+\lvert 0\rangle\lvert 1\rangle+\lvert 1\rangle\lvert 0\rangle+\lvert 1\rangle\lvert 1\rangle}{2} \tag{2.5}$$

比较 (2.4) 与 (2.5)：前者是纠缠态（Bell 态 $\lvert\Phi^+\rangle$），后者是两独立副本的直积态，二者不等。矛盾。

**推广**：对任意两个非正交态 $\lvert\psi\rangle,\lvert\phi\rangle$（$\langle\psi\rvert\phi\rangle\neq 0,1$），同样的线性性论证给出矛盾（否则可通过克隆机区分本不可区分的非正交态，从而违背量子力学的不可区分性）。因此结论对**所有未知单量子比特态**成立。多量子比特与连续变量情形由同样的线性性推出（Wootters & Zurek 1982；Dieks 1982 独立给出）。

**注**：已知态可以自由复制（你只需知道制备配方，重跑一次即可），无克隆禁止的只是"未知态的精确复制"。测量也不能绕过它——测量会塌缩到某个基矢，只给出 1 bit 信息而非完整态，且原态已被破坏（见 §4.4 误读四）。

### 2.4 测量扰动与截获重发

以 BB84 为例，设 Eve 对每个脉冲都做"截获–重发"：她随机选一基测量，再把测得结果按自己测得的态重新发给 Bob。

- 当 Eve 的基恰与 Alice 的制备基相同（概率 1/2），她得到正确结果并转发正确态，不引入误码。
- 当 Eve 的基与 Alice 不同（概率 1/2），她以 1/2 概率测得与 Alice 实际态正交的结果，从而转发出**错误**态；Bob 用正确基测时，有 1/2 概率得到与 Alice 相反的结果。

综合：对每一比特，Eve 选错基的概率为 1/2，此情况下 Bob 误判概率为 1/2，故整体引入的 QBER 为

$$Q_{\text{intercept-resend}}=\frac12\times\frac12=\frac14=25\% \tag{2.6}$$

这远超 §2.6 的安全阈值（11%），于是 Alice/Bob 在公开比对一小部分密钥的误码率时即可发现窃听并中止。这是 BB84 抗一般个体攻击的直观图景；相干攻击的分析见 §2.5。

### 2.5 信息论安全性框架

**BB84 的渐近密钥率**。在单向后处理（Alice 把纠错信息发给 Bob，随后双方做单向保密放大）下，BB84 的渐近安全密钥率为

$$R = 1 - 2\,h(Q) \tag{2.7}$$

其中 $Q$ 为实测 QBER，$h$ 为二元熵。第一项 1 是原始比特率（每脉冲 1 bit 原始密钥），第一项减号来自**纠错泄露** $h(Q)$（Bob 需从 Alice 处获知 $\sim h(Q)$ bit 才能校正自己的串），第二项减号来自**保密放大** $h(Q)$（压缩掉 Eve 关于最终密钥的信息，GLLP 框架下对一般相干攻击也成立）。安全当且仅当 $R>0$。

把 (2.7) 与 $h(0.11)\approx 0.4995$ 代入：$R(0.11)\approx 1-0.999\approx 0$，故**单向安全阈值为 $Q\approx 11.0\%$**。若采用双向后处理（如 Chernoff 界 / 双向保密放大，先做"优势蒸馏"再纠错），阈值可升至约 $12.4\%$–$12.6\%$（不同方案取值，本文不对具体方案给单一数字，以免越界）。

**Shor–Preskill (2000) 证明路线**。把 BB84 的纠错 + 保密放大映射到 CSS 量子纠错码：信道等价于一个量子比特翻转 + 相位翻转信道，其容量由 $h(Q)$ 给出；BB84 的"对基"等价于在 Z 与 X 两个 CSS 子码上同时做纠错。他们证明只要 $1-2h(Q)>0$，就存在协议达到该正密钥率，且对**一切**攻击（含相干攻击）安全。这是 BB84 的第一个简洁信息论安全性证明，Lo–Chau（1999）与 Mayers（2001）是此前的两条独立证明路线。

**弱相干态下的实用密钥率（诱饵态）**。真实光源是弱相干态（WCP），含多光子分量（§3）。诱饵态协议（Hwang 2003；Lo–Ma–Chen 2005；Wang 2005；Ma–Qi–Zhao–Lo 2005）通过发送不同平均光子数的脉冲估计单光子分量的产额 $Q_1$ 与误码 $e_1$，给出实用安全率

$$R = Q_1\bigl[1-2\,h(e_1)\bigr] - \text{（有限长修正项）} \tag{2.8}$$

其中 $Q_1$ 是单光子脉冲被探测到的条件概率，$e_1$ 是单光子分量的 QBER。只要单光子分量本身满足 $e_1<11\%$，即使整体脉冲含多光子，仍可提取安全密钥。这正是 §4.5 抗 PNS 攻击的数学核心。

### 2.6 三层数值界限

| 界限 | 数值 | 来源 | 含义 |
|------|------|------|------|
| 无克隆（单未知态精确拷贝） | 0 份 | §2.3 线性性 | Eve 不能零扰动地完整复制未知态 |
| Holevo 界 | $\chi(A;E)\le 1$ bit | 量子信息论 | Eve 持单 qubit 时，关于 Alice 比特的最大可提取信息 ≤ 1 bit |
| BB84 安全 QBER 阈值 | $Q\le 11.0\%$（单向）/ $\approx 12.6\%$（双向） | §2.7 由 (2.7) 推出 | 超过则 $R\le0$，协议中止 |

Holevo 界说明：即便 Eve 把每个脉冲的单光子分量完整保留、做最优量子测量，她对 Alice 单个比特所能获得的信息也至多 1 bit——而因为她面对的是随机基编码，实际可提取量远小于此；剩余的由 (2.7) 的保密放大项压缩。三层界限共同刻画了"量子力学不是禁止窃听，而是量化并暴露窃听"。

## 四、实验基础与观测证据

### 4.1 关键实验

#### 4.1.1 Bennett 等（1992）——首个 QKD 实验实现

首个端到端 QKD 实验由 Bennett、Bessette、Brassard、Salvail、Smolin 完成（*Journal of Cryptology* 5, 3–28）。虽然硬件远未成熟，但它验证了"BB84 可以在真实光学系统上跑通并提取密钥"这一核心可行性，是后续一切部署的起点。

#### 4.1.2 诱饵态实验——把"理想单光子安全"变成"真实光源安全"

在 Lo–Ma–Chen（2005）、Wang（2005）、Ma–Qi–Zhao–Lo（2005）给出严格诱饵态理论后，2006 年前后多个小组（含潘建伟组、LANL–NIST 联合组）在实验上把光纤 QKD 安全通信距离首次突破 100 km，证明不完美弱相干态光源在诱饵态方法下可获得接近理想单光子源的安全性。这是 QKD 从"原理演示"走向"实用"的转折点。

#### 4.1.3 京沪干线（2017）与天地一体化网络（2021）

- **京沪干线**：2017 年 9 月 29 日开通，全长 $>2000$ km（约 2032 km），贯穿北京–济南–合肥–上海，含 32 个可信中继节点，全线路密钥率 $>20$ kbps，可服务上万用户（交通银行、工商银行等）。
- **墨子号卫星**（Yin et al. 2017, *Science* 356, 1140）：2016 年发射，在 1200 km 距离上实现星地纠缠分发，Bell 违反观测值 $S=2.37\pm 0.09$；
- **集成网络**（Chen et al. 2021, *Nature* 589, 214）：把京沪干线（>700 条光纤链路）与两颗卫星对地自由空间链路整合，覆盖超 4600 km，任意两用户可互通；卫星过境平均密钥率 47.8 kbps。这是迄今规模最大的运营级 QKD 网络。

> **易混点提醒**：京沪干线与墨子号都**不是**端到端量子安全——它们依赖"可信中继"（每段中继节点能看到明文密钥，再以 QKD 重新加密给下一段）。端到端量子安全需要量子中继或器件无关协议，当前尚未实用（见 §5.4、§7.3）。因此"覆盖 4600 km"指的是网络拓扑跨度，不是单条密钥链路全程抗量子。

### 4.3 安全性所依赖 / 排除的假设

QKD 的"无条件安全"是对**计算能力**无条件，但对以下假设设限；明确列出被排除与未被排除的，避免夸大：

- **被排除（协议假设内已处理）**：对 Eve 的算力（含量子计算机）不设限；Eve 可完全控制量子信道与公开信道内容（只要不篡改认证部分）。
- **仍依赖（现实系统必须满足，否则安全降级）**：
  1. **源是单光子或经诱饵态表征的弱相干态**（否则 PNS 攻击得手，§4.5）。
  2. **探测器按标称模型响应**（否则探测器致盲 / 时移攻击得手，§4.5）。
  3. **公开信道经过认证**（否则中间人攻击；需用预共享少量密钥或经典 PKI）。
  4. **器件无未建模侧信道**（DI-QKD 可放宽此条至仅依赖 Bell 违反）。

### 4.4 常见误读纠正

> **误读一：「QKD 让通信内容无法被窃听」。**
> 严格表述：QKD 只分发密钥；消息仍要用一次性密码本（OTP）经经典信道发送，且 OTP 要求密钥长度等于明文长度。QKD 解决的是"如何安全地拿到那把密钥"，不是"如何直接传密文"。

> **误读二：「量子计算机能破解 QKD，所以 QKD 没用」。**
> 严格表述：QKD 的安全性不基于任何计算困难性假设，因此 Shor 算法对 RSA 的威胁**完全不适用于** QKD。QKD 恰恰是"后量子时代"仍能站住的密钥分发手段之一；它与后量子密码（PQC）是互补关系，不是被取代关系（见 §5.3、§7.3）。

> **误读三：「无条件安全 = 绝对安全，任何攻击都不怕」。**
> 严格表述："无条件（unconditional）"仅指对 Eve 算力不设限。QKD 仍依赖 §4.3 列出的器件与信道假设。只有**器件无关 QKD（DI-QKD）**才把安全性建立在对 Bell 违反的观测上、从而不信任器件；但 DI-QKD 当前距离与密钥率远不及可信器件方案。把"无条件"等同于"对一切现实攻击免疫"是常见的科普夸大。

> **误读四：「无克隆定理说明 Eve 完全得不到任何信息，所以安全」。**
> 严格表述：无克隆只说明"未知态不能被零扰动地精确复制"。Eve 仍可截取并测量，获得部分信息（受 Holevo 界约束，最多 1 bit/单 qubit，见 §2.6）；QKD 的真正安全来自"测量扰动 + 纠错 + 保密放大"把 Eve 的那部分信息压缩到可忽略——无克隆是前提，不是全部。

> **误读五：「E91 靠 Bell 违反把密钥传给对方 / 能超光速通信」。**
> 严格表述：E91 中 Bell 违反只是**窃听检测手段**——若 CHSH 关联跌到定域界内附近，说明信道被窃听。密钥本身由双方本地测量结果经公开比对（sifting）与后处理生成，不借助 Bell 违反传递任何信息；与第 30 篇 §1.3 第 5 条一致，Bell 违反≠超光速通信。

> **误读六：「QKD 可以取代 RSA / 公钥密码」。**
> 严格表述：QKD 只做"密钥分发"，且需要预认证，部署成本远高于软件公钥密码；它适合高安全、点对点骨干等特定场景，不是通用替代。大规模互联网的认证、签名仍离不开经典公钥原语（或 PQC）。

### 4.5 现实漏洞与攻击表

| 攻击 | 机制 | 首次提出 / 实验 | 防御 |
|------|------|----------------|------|
| PNS 光子数分离 | 弱相干态含多光子脉冲，Eve 留存一份、转发其余，零扰动 | Brassard et al. 2000（理论） | 诱饵态（Hwang 2003；Lo–Ma–Chen 2005 等） |
| 探测器致盲（detector blinding） | 强光使 APD 失敏并被控制响应 | Makarov et al. 2008（实验） | 监控探测器电流、MDI-QKD、DI-QKD |
| 时移攻击（time-shift） | 调相位使 Bob 不同基探测器响应时间不同，借以推断基 | Zhao et al. 2008 | 随机化测量基、严格建模 |
| 木马 / 波长攻击（Trojan horse） | 反向注入光探测 Alice 内部状态（如相位调制器） | Vakhitov et al. 2001；Sajeed et al. 2015 | 光隔离器（~100 dB）、波长滤波 |
| 侧信道泄光 | 源/调制器电源噪声、时序泄露基选择 | 早期实验即察觉（Bennett 自嘲"除非 Eve 是聋子"） | 侧信道安全协议（如"发送/不发送"双场） |
| 可信中继内部泄露 | 中继节点为明文，遭内部或物理攻破 | 架构性（非攻击） | 量子中继（未实用）、分段独立安全域 |

> **必须诚实标注的一点**：上述攻击中没有一个能否定 QKD 的**协议层**安全性——它们攻击的是"理想模型"与"真实器件"之间的差距。QKD 社区的标准应答是：每发现一类攻击，就给出对应的建模与防御（诱饵态、MDI、DI、侧信道安全协议），因此现实系统的安全性是**持续收敛**的，而非一次性证明。这也正是 Scarani et al. (2009) 把"实际 QKD 安全性"单列为一个综述方向的原因。

## 五、分类体系与物理机制

### 5.1 协议分类

| 类别 | 代表协议 | 编码/资源 | 安全性根基 |
|------|---------|-----------|-----------|
| 制备–测量（单光子） | BB84、六态、B92/BBM92 | 单光子非正交态 | 无克隆 + 测不准 |
| 纠缠基 | E91、BBM92 | 纠缠对 + 本地测量 | Bell 关联 / 无克隆 |
| 连续变量（CV-QKD） | 高斯调制相干态 | 连续正交分量 | 测不准 + 信息论 |
| 测量设备无关（MDI-QKD） | Lo–Curty–Qi 2012 | 纠缠交换 + 不可信中继测量 | Bell 态测量 + 不信任探测器 |
| 双场（twin-field, TF-QKD） | Lucamarini et al. 2018 | 远程干涉 | 相位相干 + 诱饵态 |

### 5.2 安全性的物理机制（链条）

QKD 安全不是单一原理，而是一条可被分解的机制链：

1. **无克隆（线性性）**：未知态不可精确复制（§2.3）→ Eve 不能"看一眼再原样转发"。
2. **测不准（共轭基不可同时精确测）**：Z 与 X 基互不对易 → 在错误基测量必扰动。
3. **测量扰动 → 可观测误码**：Eve 的个体攻击引入 $\ge 25\%$ QBER（§2.4）→ 被抽检发现。
4. **纠错 + 保密放大（信息论）**：即便 Eve 获得部分信息，也通过公开后处理压缩到可忽略（§2.5）→ 最终密钥对 Eve 条件熵趋零。
5. **（纠缠类）Bell 违反作证**：E91/MDI 中，若 CHSH 关联达标，则任何定域窃听模型都被排除（第 30 篇 §1.3）。

第 1–3 步是"暴露窃听"，第 4 步是"即使暴露不完全也能保证最终安全"，第 5 步把"暴露"升级为"协议层可证"。

### 5.3 概念辨析

- **信息论安全 vs 计算安全**：前者安全性由信息论（熵）保证，不依赖算力假设；后者由复杂性假设保证。QKD 属前者（在协议假设内）。
- **QKD vs 后量子密码（PQC）**：PQC 是"假设量子计算机也难解"的经典密码（如格密码），可跑在现有网络、无需量子信道；QKD 需要量子信道与单光子器件，但安全性不依赖任何未证明假设。二者**互补**：PQC 解决大规模软件的密钥协商，QKD 解决高安全点对点骨干。把它们说成"谁取代谁"是误读（见 §4.4 误读二、六）。
- **量子安全（quantum-safe）vs 量子密钥分发**："quantum-safe"是形容词，指"在量子计算机面前仍安全"，PQC 与 QKD 都可 quantum-safe；QKD 是其中一种具体技术。
- **一次一密（OTP）与 QKD 的关系**：OTP 是"用等长随机密钥异或明文"的加密方式，其安全性是信息论绝对的——但前提是**密钥真的随机且只用一次**，这正是 QKD 要提供的东西。QKD + OTP = 信息论安全的保密通信。

### 5.4 失效边界

1. **可信中继不是端到端量子安全**。京沪干线 / 墨子号的每一段中继节点都掌握该段明文密钥，若该节点被攻破，整段失密。端到端量子安全需要**量子中继**（克服光纤指数损耗）或 **DI-QKD**（不信任任何节点器件），二者当前均未实用化。
2. **无量子中继时距离受光纤损耗指数限制**。即便理想单光子源，成码率也随距离指数衰减；中继器（基于量子纠错/纠缠交换）是关键瓶颈，实验多在百公里级。
3. **侧信道使现实系统偏离理想模型**。任何未建模的泄露（§4.5）都会把安全性从"协议层"拉到"器件建模层"。DI-QKD 与侧信道安全协议是应对，但代价是距离/密钥率大幅下降。
4. **有限长密钥效应**。§2.5 的 $R=1-2h(Q)$ 是渐近极限；真实系统密钥有限，统计涨落会给安全率一个负修正（有限密钥界限），短密钥下尤为显著。

## 六、典型系统与可解模型

### 6.1 BB84（制备–测量）

**步骤**：① Alice 对每个比特随机选基（Z/X）与随机比特，制备并发送 (2.1) 中四态之一；② Bob 随机选基测量；③ 双方公开基选择，丢弃基不一致的比特（sifting），得到原始密钥；④ 抽样比对一小部分求 QBER，若 $Q>11\%$ 则中止；⑤ 纠错 + 保密放大得到安全密钥。

**可解性**：个体攻击密钥率由 (2.6)(2.7) 直接给出；相干攻击由 Shor–Preskill 归约到 CSS 码容量，闭式即 (2.7)。本篇配套脚本 `code/量子密钥分发_BB84密钥率.py` 画出 $R(Q)=1-2h(Q)$ 曲线并标出 11% 阈值（见图 `figures/量子密钥分发_密钥率vs误码率.svg`）。

### 6.2 E91（纠缠 + Bell 违反）

**步骤**：① 源分发 Bell 态 $\lvert\Phi^+\rangle$（2.2）；② 双方本地随机选 Z/X 基测自己那半；③ 公开基选择，基一致部分既用于生成密钥，又用于估算 CHSH 关联 $S$；④ 若 $S$ 接近量子上限 $2\sqrt2$（违反定域界 2），则判定无可容忍的定域窃听，进行后处理。

**与第 30 篇接口**：E91 的 $S$ 计算、Tsirelson 界 $2\sqrt2$、定域界 2 全部来自第 30 篇 §2.6–§2.7；本篇不复推。器件无关 QKD 把"观测到 Bell 违反"作为**唯一**安全判据，连 Alice/Bob 的器件都可不信任。

### 6.3 BBM92（两态纠缠）

Bennett–Brassard–Mermin（1992）用纠缠源的**两个**非正交态（如 $\lvert H\rangle$、$\lvert+\rangle$ 对应的 Bell 关联），而非 BB84 的四个。其安全性不依赖 Bell 定理本身（见原文摘要"without invoking Bell's theorem"），但等效于 BB84——因为单粒子两非正交态与 BB84 在信息论上同构。BBM92 的重要性在于证明：纠缠基协议可以退化为与单粒子协议等价的简单形式，不必显式测 Bell 违反。

### 6.4 MDI-QKD（测量设备无关）

Lo–Curty–Qi（2012）：Alice 与 Bob 各自独立制备态发给不可信第三方 Charlie，Charlie 做 Bell 态测量（BSM）并公布结果；仅当双方制备态满足特定关联时，BSM 成功事件才产生关联。由于 Charlie 的探测器"在最坏情况下就是 Eve 本人"，把探测器漏洞（§4.5）整个外包出去——只要 Charlie 不能操纵向 Alice/Bob 的源，安全性不依赖 Charlie 的器件行为。密钥率公式类似 (2.8)，但对探测器侧信道免疫。这是当前兼顾"现实部署"与"去探测器信任"的主流路线。

> **协议示意图**见 `figures/量子密钥分发_协议示意图.svg`：左为 BB84 四态在两共轭基的编码，右为 E91/MDI 的纠缠分发 + 不可信测量节点结构。

## 七、历史脉络与学术争议

### 7.1 提出动机

**QKD 要解决的问题**：经典密码学自 1970 年代起依赖"计算困难性"——一旦算法被攻破或算力跃升，整条链路失守。量子力学提供了另一条路：用物理定律本身保证"窃听必留痕"。其概念前身是 Wiesner（1960 年代未发表笔记，1983 年刊出）的"共轭编码"——他想用不可克隆的量子态做不可伪造的银行票据；BB84 把它改造为密钥分发。

**此前理论卡在哪里**：① 理想单光子源长期不存在，弱相干态多光子漏洞使早期"BB84 安全"证明悬空，直到 PNS 攻击被 Brassard et al. (2000) 点明、诱饵态 (Hwang 2003; Lo–Ma–Chen 2005) 修补；② 安全性证明从"针对个体攻击"到"针对一切相干攻击"走了十余年（Mayers 1996/2001、Lo–Chau 1999、Shor–Preskill 2000）。

### 7.3 当前争议与开放问题

**争议一：量子中继何时实用？**

各方立场（**并列呈现，不做裁判**）：

| 立场 | 主张 | 代价 |
|------|------|------|
| 光纤直连 + 可信中继派 | 用现有光纤 + 可信中继即可建运营网络（京沪干线已验证） | 中继节点为明文，非端到端量子安全 |
| 卫星 + 自由空间派 | 自由空间损耗低，单跳可上千公里（墨子号） | 需过境窗口，密钥率受限于过境时间 |
| 量子中继派 | 只有基于纠缠交换的中继才达端到端量子安全 | 受控纠缠分发/存储未实用，距离仍短 |
| 双场（TF-QKD）派 | 用远程干涉在线性损耗下突破平方损耗极限 | 对相位稳定与源要求极高，工程难 |

**争议二：QKD 与后量子密码（PQC）是互补还是竞争？**

- 互补派（主流密码学界与多数 QKD 团队）：PQC 解决软件的密钥协商（无需量子硬件），QKD 解决高安全骨干；二者叠用优于任一。
- 质疑派（部分经典密码学者）：QKD 部署成本/距离限制使其性价比不如 PQC，且仍依赖认证（认证本身要用经典或 PQC 原语），"量子安全"卖点被夸大。
- **没有任何实验能在两种技术路线间做"对错"判定**——它们是不同约束下的工程选择，分歧只在部署哲学与成本收益。

**争议三：可信中继网络能否叫"量子安全"？**

京沪干线/墨子号用可信中继，每段节点掌握明文。严格说"端到端"在该网络上并非量子安全；但"段间"是量子安全的，且中继节点物理隔离、分散受控。DI-QKD 与量子中继是去除该假设的两个方向，当前均不成熟。此争议本质是"安全模型边界"的界定，非物理事实之争。

**开放问题**：① 实用化量子中继（高保真纠缠存储 + 分布式纠缠）；② DI-QKD 在光纤上的距离突破（当前 ~100–200 km 量级，远低于可信器件方案）；③ 侧信道安全的统一形式化（把一切现实漏洞纳入一个可证模型）；④ 与"测量问题"（第 31 篇 §7.3）的理论牵连——若测量结果在测量前已确定（超决定论等），QKD 的"窃听必扰动"前提是否被侵蚀？该问题属于诠释层，不在实验可判定范围。

### 7.4 与宝石学体系的一致性

本篇与 `宝石学正式版/` 的以下物理量须保持一致，否则记入《修订记录》：

      ],
      ignoredTags:['script','noscript','style','textarea','pre','code'],
      throwOnError:false
    });
  }

  // 滚动高亮
  var links = [].slice.call(toc.querySelectorAll('a'));
  window.addEventListener('scroll', function(){
    var cur = null;
    hs.forEach(function(h){
      if (h.getBoundingClientRect().top < 120) cur = h;
    });
    links.forEach(function(a){ a.classList.remove('active'); });
    if (cur){
      var sp = cur.querySelector('span[id]');
      var act = toc.querySelector('a[href="#' + (sp?sp.id:'') + '"]');
      if (act) act.classList.add('active');
    }
  }, {passive:true});
}
if (window.marked) boot();
else window.addEventListener('load', boot);
</script>
</body>
</html>
