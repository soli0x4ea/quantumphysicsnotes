## 一、概念与定位

> **一句话结论**：路径积分把演化振幅视为所有路径以 e^{iS/ℏ} 相干叠加，经典轨迹是其稳相近似。

量子力学在 1925–1927 年间已出现三种等价表述：海森堡的矩阵力学、薛定谔的波动力学、以及二者统一的狄拉克变换理论。1948 年费曼提出**第四种表述**——路径积分（path integral），也叫"对历史求和"（sum over histories）[24cr]。它的核心思想与另三种表述在出发点上有本质差别：

- 矩阵/波动力学把概率幅挂在**某一个时刻的态**上（态矢量 $|\psi(t)\rangle$ 或波函数 $\psi(x,t)$），时间演化由算符 $U(t,t_0)$ 推动；
- 路径积分把概率幅直接挂到**整条时空轨迹** $x(t)$ 上：粒子从 $(x_i,t_i)$ 到 $(x_f,t_f)$ 的总振幅，是所有可能路径贡献的相干叠加，每条路径的权重是一个相位因子 $\exp(i S[x]/\hbar)$，$S[x]$ 是该路径的经典作用量。

"所有路径都贡献、且以相位相干叠加"是路径积分最反直觉也最有力的一点。它不是比喻：在 $S/\hbar\gg 1$ 的宏观尺度，相邻路径的相位剧烈振荡、互相抵消，只有使作用量取驻值（经典运动方程 $\delta S=0$）的那条路径附近幸存——这正是经典力学从量子力学中浮现的机制（§5）。这种"经典极限即稳相近似"的直观，是其他三种表述都不具备的。

本篇定位为第二部分工具箱的收尾：它把"算符/薛定谔方程"视角与"作用量/拉格朗日"视角桥接起来。前置第 12 篇的算符代数、第 13 篇的薛定谔方程、第 19 篇的微扰与半经典近似，在这里汇成统一的几何图像。

| 通俗说法 | 严谨表述 | 误区根源 |
|---------|---------|---------|
| 路径积分是比喻或图像 | 它是与薛定谔/矩阵力学完全等价的严格表述，非修辞，给出相同可观测预言 | 把等价表述当直观比喻 |

## 二、数学结构

### 2.1 传播子的定义

在薛定谔绘景中，时间演化算符 $U(t_f,t_i)=\exp[-i\hat H(t_f-t_i)/\hbar]$。从初态 $|x_i\rangle$ 到末态 $|x_f\rangle$ 的振幅叫做**传播子**（propagator）：

$$ K(x_f,t_f;x_i,t_i) \equiv \langle x_f|U(t_f,t_i)|x_i\rangle \tag{1} $$

它满足群性质（Chapman–Kolmogorov 方程）：

$$ K(x_f,t_f;x_i,t_i) = \int dx\, K(x_f,t_f;x,t)\,K(x,t;x_i,t_i) \quad (t_i<t<t_f) \tag{2} $$

由 (1) 立刻有波函数的演化公式：

$$ \psi(x_f,t_f) = \int dx_i\, K(x_f,t_f;x_i,t_i)\,\psi(x_i,t_i) \tag{3} $$

即末态是初态经传播子"卷积"得到。路径积分给出的正是 (1) 的另一种（等价的）表达。

### 2.2 路径积分表述

将时间间隔 $T=t_f-t_i$ 切成 $N$ 片，每片 $\varepsilon=T/N$，插入 $N-1$ 组完备基 $\int dx_k\,|x_k\rangle\langle x_k|=1$。由 (2)：

$$ K(x_f,t_f;x_i,t_i)=\lim_{N\to\infty}\int\prod_{k=1}^{N-1}dx_k\prod_{k=0}^{N-1}K(x_{k+1},t_i+(k+1)\varepsilon;x_k,t_i+k\varepsilon) \tag{4} $$

其中 $x_0\equiv x_i,\ x_N\equiv x_f$。对**一般势** $V(x)$，短时段（infinitesimal）传播子为

$$ K_0(x_{k+1},x_k;\varepsilon)=\sqrt{\frac{m}{2\pi i\hbar\varepsilon}}\,
\exp\!\left\{\frac{i}{\hbar}\left[\frac{m}{2}\left(\frac{x_{k+1}-x_k}{\varepsilon}\right)^2
- V\!\left(\frac{x_{k+1}+x_k}{2}\right)\right]\varepsilon\right\} \tag{5} $$

方括号第一项是动能项 $\frac12 m\dot x^2$，第二项是势能项 $V(x)$（取两端中点值，对称化以保精度）。代入 (4) 并将指数中的求和写成 $\varepsilon\sum_{k}\to\int dt$：

$$ K(x_f,t_f;x_i,t_i)=\int_{x(t_i)=x_i}^{x(t_f)=x_f}\!\mathcal D x(t)\,
\exp\!\left\{\frac{i}{\hbar}S[x]\right\},\qquad
S[x]=\int_{t_i}^{t_f}\!dt\,L(x,\dot x) \tag{6} $$

这里 $\mathcal D x(t)$ 表示对所有满足端点条件的路径的"测度"（形式上的泛函积分），路径积分写作 $\int\!\mathcal D x\,e^{iS/\hbar}$。需要注意：实时间路径积分**不是**一个通常的勒贝格积分——被积函数模长为 1、强烈振荡，严格意义下的"测度"并不存在；它的定义正是 (4) 的极限（时间片离散化），或经 Wick 转动到虚时间后才有严格概率测度（§5.1、§7）。

### 2.3 自由粒子的逐级高斯积分（不跳步推导）

取 $V=0$，短时分核变为纯高斯：

$$ K_0(x',x;\varepsilon)=\sqrt{\frac{m}{2\pi i\hbar\varepsilon}}\,
\exp\!\left\{\frac{i m (x'-x)^2}{2\hbar\varepsilon}\right\} \tag{7} $$

先算两片 ($N=2,\ T=2\varepsilon$)。按 (4) 对中间点 $x_1$ 积分：

$$ K_2(x_f,x_i;2\varepsilon)=\int_{-\infty}^{\infty}\!dx_1\,
K_0(x_f,x_1;\varepsilon)\,K_0(x_1,x_i;\varepsilon) \tag{8} $$

代入 (7)，指数部分为

$$ \frac{i m}{2\hbar\varepsilon}\Big[(x_f-x_1)^2+(x_1-x_i)^2\Big] \tag{9} $$

配方：令 $u=x_1-(x_f+x_i)/2$，则

$$ (x_f-x_1)^2+(x_1-x_i)^2 = 2u^2+\frac{(x_f-x_i)^2}{2} \tag{10} $$

于是

$$ K_2=\frac{m}{2\pi i\hbar\varepsilon}\,e^{\frac{i m (x_f-x_i)^2}{4\hbar\varepsilon}}
\int_{-\infty}^{\infty}\!du\,\exp\!\left(\frac{i m}{\hbar\varepsilon}u^2\right) \tag{11} $$

对纯虚系数的高斯积分，采用解析延拓 $\int_{-\infty}^\infty e^{-A u^2}du=\sqrt{\pi/A}$（$\Re A>0$）到 $A=-i m/(\hbar\varepsilon)$：

$$ \int_{-\infty}^{\infty}\!du\,\exp\!\left(\frac{i m}{\hbar\varepsilon}u^2\right)
=\sqrt{\frac{\pi\hbar\varepsilon}{i m}}
=\sqrt{\frac{\pi\hbar\varepsilon}{m}}\,e^{-i\pi/4} \tag{12} $$

代回 (11)：

$$ K_2=\frac{m}{2\pi i\hbar\varepsilon}\,e^{\frac{i m (x_f-x_i)^2}{4\hbar\varepsilon}}
\sqrt{\frac{\pi\hbar\varepsilon}{i m}}
=\sqrt{\frac{m}{4\pi i\hbar\varepsilon}}\,
\exp\!\left\{\frac{i m (x_f-x_i)^2}{2\hbar\,(2\varepsilon)}\right\} \tag{13} $$

这正是自由粒子总传播子在"总时间 $=2\varepsilon$"时的形式（见下 (15)）。推广 $N$ 片，每对相邻片的高斯积分依次把"有效时间"累加，归纳得到

$$ K_{\text{free}}(x_f,t_f;x_i,t_i)=
\sqrt{\frac{m}{2\pi i\hbar T}}\,
\exp\!\left\{\frac{i m (x_f-x_i)^2}{2\hbar T}\right\},\qquad T=t_f-t_i \tag{14} $$

这就是自由粒子传播子的解析表达（复平方根取主支，相位约定见 §3）。

### 2.4 与薛定谔方程的等价性（导出不跳步）

下面直接由路径积分导出含时薛定谔方程，证明二者等价。将传播子写成一步演化（时间增量 $\varepsilon$）：

$$ \psi(x,t+\varepsilon)=\int dy\,K_0(x,y;\varepsilon)\,\psi(y,t) \tag{15} $$

把 $K_0$ 的 (5) 式展开（对一般势，取中点 $V((x+y)/2)\approx V(x)$ 到一阶已够）：

$$ K_0(x,y;\varepsilon)=\sqrt{\frac{m}{2\pi i\hbar\varepsilon}}
\exp\!\left\{\frac{i m(x-y)^2}{2\hbar\varepsilon}-\frac{i\varepsilon}{\hbar}V(x)\right\} \tag{16} $$

令 $y=x+\eta$，对小 $\varepsilon$ 只有 $|\eta|\lesssim\sqrt{\hbar\varepsilon/m}$ 有贡献，将 $\psi(y,t)=\psi(x+\eta,t)$ 在 $\eta$ 上展开到二阶：

$$ \psi(x+\eta,t)=\psi(x,t)+\eta\,\partial_x\psi+\frac{\eta^2}{2}\partial_x^2\psi+\cdots \tag{17} $$

对 $\eta$ 的积分，利用高斯矩：

$$ \int d\eta\,\eta\,e^{i m\eta^2/(2\hbar\varepsilon)}=0,\qquad
\int d\eta\,\eta^2\,e^{i m\eta^2/(2\hbar\varepsilon)}
=\frac{i\hbar\varepsilon}{m}\sqrt{\frac{2\pi i\hbar\varepsilon}{m}} \tag{18} $$

（第二个式子由对 $A=i m/(2\hbar\varepsilon)$ 求导 $\partial(-A)/\partial A$ 并取解析延拓得到）。代入 (15) 并约去公共因子 $\sqrt{m/(2\pi i\hbar\varepsilon)}$，保留到 $\mathcal O(\varepsilon)$：

$$ \psi(x,t+\varepsilon)=\left[1-\frac{i\varepsilon}{\hbar}V(x)
-\frac{\hbar\varepsilon}{2 i m}\partial_x^2\right]\psi(x,t) \tag{19} $$

移项 $\psi(x,t+\varepsilon)-\psi(x,t)=\varepsilon\,\partial_t\psi+\mathcal O(\varepsilon^2)$，得

$$ i\hbar\,\partial_t\psi=\left[-\frac{\hbar^2}{2m}\partial_x^2+V(x)\right]\psi
\equiv \hat H\psi \tag{20} $$

即含时薛定谔方程。因此路径积分表述与波动力学在数学上完全等价 [24cr]。

## 三、物理量与特征尺度

| 物理量 | 符号 | 量级 / 表达式 | 说明 |
|--------|------|--------------|------|
| 约化普朗克常数 | $\hbar$ | $1.054\,571\,817(74)\times10^{-34}\ \text{J·s}$（CODATA 2018 推荐值） | 相位的"作用量量子"，路径积分中决定干涉剧烈程度 |
| 单条路径的相位 | $S[x]/\hbar$ | 无量纲 | 相邻路径相位差 $\Delta S/\hbar$ 决定相消/相长 |
| 经典作用量尺度 | $S_{\text{cl}}$ | 电子穿行 $1\ \text{nm}$、动量 $p\sim\hbar k\ (k\sim10^{10}\,\text{m}^{-1})$：$S_{\text{cl}}\sim pL\sim10^{-24}\ \text{J·s}$，$S_{\text{cl}}/\hbar\sim 10$ | $S/\hbar\gg1$ 时多路径互相抵消，经典极限成立 |
| 传播子量纲 | $[K]$ | $[\text{长度}]^{-1}$（一维） | 由 (14) 根号项 $m^{1/2}/(T^{1/2}\hbar^{1/2})$ 决定，与 $\psi$ 量纲一致 |
| 量子涨落路径尺度 | $\Delta x_{\text{qu}}$ | $\sqrt{\hbar\varepsilon/m}$（短时段离散步宽） | 决定 (5) 中"有效路径带宽"，也是数值离散化的网格尺度下限 |
| 驻相附近幸存路径宽度 | $\delta x_{\text{sp}}$ | $\sim\sqrt{\hbar T/(m)}$ | 经典极限下围绕经典轨道的量子弥散宽度 |

**关键尺度判据**：路径积分中"所有路径都重要"还是"只有经典路径重要"，由无量纲数 $S/\hbar$ 决定。宏观抛体 $S/\hbar\sim10^{30}$，振荡完全相消，只剩经典轨；原子尺度 $S/\hbar\sim\mathcal O(1)$–$\mathcal O(10)$，多路径干涉显著，量子效应突出。这正是第 14 篇隧穿（势垒中经典禁戒路径仍有非零贡献）与第 15 篇相干态（经典轨道附近高斯波包不扩散）的统一解释框架。

## 四、实验基础与观测证据

1. **双缝干涉的路径积分解释**：从缝 $A$ 与缝 $B$ 到达屏上点 $P$ 是两条"代表性路径"，总振幅 $\psi(P)\propto e^{iS_A/\hbar}+e^{iS_B/\hbar}$，强度 $|\psi|^2$ 出现条纹。路径积分的真正含义是：不仅两条主路，而是从源到屏的**所有连续路径**都参与求和；双缝仅是几何上约束了"主路径族"。这是第 1 篇（量子行为）三实验与第 47 篇（宝石学量子误用辨析）中"线性双折射能否产生纠缠"问题的统一语言——o/e 两偏振分量是两条独立的"路径"，其求和给出可观察的偏振干涉，但**不**自动产生纠缠（纠缠要求路径处于不可分的两体态，见第 29 篇）。

2. **中子引力干涉仪（Colella–Overhauser–Werner，1975）**：中子在地球引力场中沿两条高度不同的路径干涉，观测到相位差 $\Delta\phi = m g A/(\hbar v)$（$A$ 为干涉环面积，$v$ 为中子速度）[第 13 篇已引]。路径积分下，引力势能直接写入作用量 $S=\int(m\dot x^2/2+mgz)dt$，高度差即对应不同 $S$，相位差可测——这是"路径依赖的相位"最直接的实验证据。

3. **Aharonov–Bohm（AB）效应（1959）**：矢量势 $\mathbf A$ 进入作用量 $S=\int dt\,[\tfrac12 m\dot{\mathbf x}^2+q\mathbf A\!\cdot\!\dot{\mathbf x}-q\phi]$。即使电子运动的区域 $\mathbf B=\nabla\times\mathbf A=0$，只要环路包围非零磁通 $\Phi$，两条绕行路径的相位差 $\Delta\phi=q\Phi/\hbar$ 仍可被观测。AB 效应在路径积分框架中**最自然**——矢量势直接加在每条路径的相位上，无需局域场强，是路径积分优于"力/场"语言的典型例证。

## 五、分类体系与物理机制

### 5.1 实时间与虚时间（欧几里得）路径积分

将时间做 Wick 转动 $t\to -i\tau$（$\tau$ 为虚时间），作用量变号：

$$ K_E(x_f,\tau;x_i,0)=\langle x_f|e^{-\hat H\tau/\hbar}|x_i\rangle
=\int\!\mathcal D x\,e^{-S_E[x]/\hbar},\qquad
S_E=\int_0^\tau d\tau\left[\tfrac12 m(\partial_\tau x)^2+V(x)\right] \tag{21} $$

虚时间传播子是**正实数核**，对应严格的维纳（Wiener）概率测度（Feynman–Kac 公式）；其 $\tau\to\infty$ 极限投影到基态：

$$ \psi_0(x)\propto\lim_{\tau\to\infty}K_E(x,\tau;x_i,0),\qquad
E_0=-\lim_{\tau\to\infty}\frac{\hbar}{\tau}\ln\mathrm{Tr}\,e^{-\hat H\tau/\hbar} \tag{22} $$

这是 §6 数值例（谐振子基态）的理论基础，也是量子统计（配分函数 $Z=\mathrm{Tr}\,e^{-\beta\hat H}$）与量子场论严格化的标准工具。

### 5.2 相空间路径积分

在 $x$ 路径积分之外，也可对每个时刻引入动量 $p$ 并插入 $\int dp\,|p\rangle\langle p|$：

$$ K=\int\!\mathcal D x\,\mathcal D p\,
\exp\!\left\{\frac{i}{\hbar}\int dt\,[p\dot x-H(x,p)]\right\} \tag{23} $$

相空间形式便于处理含矢量势（最小耦合 $H=(\mathbf p-q\mathbf A)^2/2m$）、正则变换与半经典近似。

### 5.3 半经典近似（稳相法）与 Maslov 指数

当 $\hbar\to0$，指数 $e^{iS/\hbar}$ 剧烈振荡，积分由作用量驻点（满足欧拉–拉格朗日方程、即经典轨道）附近贡献。单条经典路径 $x_{\text{cl}}(t)$ 的邻域展开给出

$$ K(x_f,t_f;x_i,t_i)\approx\sum_{\text{cl paths}}
\frac{1}{\sqrt{|\det(\partial^2 S_{\text{cl}}/\partial x_f\partial x_i)|}}\,
\exp\!\left\{\frac{i}{\hbar}S_{\text{cl}}+\frac{i\pi}{2}\nu\right\} \tag{24} $$

其中 $\nu$ 为 **Maslov 指数**（穿越焦散/转折点的次数，每遇一次贡献相位 $\pi/2$）。当只有一条经典路径（无转折点）时，(24) 退化为标准 WKB 连接公式（第 14 篇已详述；那里用 $\exp(\pm\int p\,dx/\hbar)$ 表述，与此等价，仅相位约定不同）。稳相近似与微扰论（第 19 篇）的关系：微扰论在哈密顿量层面展开，半经典近似在路径层面展开，二者是描述同一物理的不同坐标。

### 5.4 拓扑与共形约束

当构型空间非单连通（如存在磁通、或环面/莫比乌斯空间），不同同伦类的路径互不连续相连，路径积分需对每条"不可缩"路径族分别求和再叠加——这是 Aharonov–Bohm 效应与几何相（Berry 相位）的推广。本篇不展开，留待第五部分（量子场论）与第六部分（晶体场中的群论约束）对接。

## 六、典型系统与可解模型

### 6.1 自由粒子（解析求和，已证）

见 §2.3，结果 (14)。其在格点上的时间片离散化（4) 是数值验证的对象（§6.3 数值例 1）。

### 6.2 谐振子（Mehler 公式）

对 $L=\tfrac12 m\dot x^2-\tfrac12 m\omega^2 x^2$，路径积分可解析求和（利用 §2.3 的高斯积分技巧推广到含 $x^2$ 项，或连续时间片递推），得

$$ K_{\text{ho}}(x_f,T;x_i,0)=\sqrt{\frac{m\omega}{2\pi i\hbar\sin\omega T}}\,
\exp\!\left\{\frac{i m\omega}{2\hbar\sin\omega T}
\Big[(x_f^2+x_i^2)\cos\omega T-2x_f x_i\Big]\right\} \tag{25} $$

周期 $T\to n\pi/\omega$ 时分母为零（经典回转点），对应 Maslov 指数相位跳变——与 (24) 一致。基态能量由虚时间版 (21) 的 $\tau\to\infty$ 极限得 $E_0=\hbar\omega/2$（零点能），与第 15 篇升降算符法结果完全一致。

### 6.3 数值例（确定性验证，配套脚本 `code/路径积分_传播子与谐振子基态.py`）

**数值例 1 · 自由粒子传播子的时间片收敛**。在坐标格点 $\{x_j\}$ 上构造含 measure 的短时分核矩阵 $P_{jk}=K_0(x_j,x_k;\varepsilon)\,dx$（自由粒子欧几里得核，对应 §5.1 的 Wick 转动版 (7)），用矩阵连乘求 $N$ 片离散演化 $\psi_N=P^N\psi_0$（总时长 $T=N\varepsilon$，$\psi_0$ 为窄高斯初态），与"单步解析核卷积" $\psi_{\text{ref}}=P_T\psi_0$（$P_T$ 用总时长 $T$ 的解析核）比较。取 $N=4,8,16,32,64$，计算相对误差 $\delta_N=\|\psi_N-\psi_{\text{ref}}\|_2/\|\psi_{\text{ref}}\|_2$。结果（自然单位 $m=\hbar=1$，$T=4$）：

| $N$ | 相对误差 $\delta_N$ |
|-----|----------------------|
| 4   | $7.0\times10^{-15}$ |
| 8   | $4.3\times10^{-14}$ |
| 16  | $2.5\times10^{-13}$ |
| 32  | $6.6\times10^{-13}$ |
| 64  | $1.2\times10^{-12}$ |

误差处于机器精度级（$10^{-12}\sim10^{-15}$），仅随 $N$ 缓慢上升（粗网格上短时段核矩阵连乘的微小离散化累积），明确验证"路径积分离散化 (4) 收敛到解析传播子 (14)"——自由粒子传播子核为高斯，时间片离散化在细网格上近乎精确。脚本输出图 `figures/路径积分_自由粒子传播子收敛.svg`。

**数值例 2 · 谐振子基态的虚时间投影**。用对称 Trotter 拆分构造虚时间短时段核

$$ (K_E)_{jk}\approx e^{-\varepsilon V(x_j)/2\hbar}\,
\left(\sqrt{\frac{m}{2\pi\hbar\varepsilon}}e^{-m(x_j-x_k)^2/(2\hbar\varepsilon)}\right)
e^{-\varepsilon V(x_k)/2\hbar} \tag{26} $$

取任意窄高斯初态 $v_0(x)$，用未归一化轨道迭代 $w\leftarrow K_E w$（即 (22) 的投影，每步仅对绘图副本归一化），能量由未归一化范数比的对数给出

$$ E_0=-\frac{\hbar}{\varepsilon}\ln\frac{\|K_E w_M\|}{\|w_M\|} \tag{27} $$

结果（自然单位 $m=\omega=\hbar=1$，$\varepsilon=0.02$）：

| 迭代步 $M$ | 投影能量 $E_0^{(M)}$ |
|-----------|----------------------|
| 20        | $0.5819$ |
| 40        | $0.5155$ |
| 60        | $0.5031$ |
| 80        | $0.5006$ |
| 100       | $0.5001$ |
| 120       | $0.5000$ |

收敛到解析值 $E_0=\hbar\omega/2=0.5000$，$M\geq120$ 时相对误差 $<2\times10^{-4}$；同时基态波函数与高斯 $\exp(-x^2/2)$ 的逐点偏差 $<10^{-4}$。脚本输出图 `figures/路径积分_谐振子虚时间基态.svg`。

### 6.4 与宝石学的接口（指向第六部分）

路径积分不是仅抽象形式——它是处理**强耦合多体**问题的标准工具，与宝石学交叉密切：

- **电子–声子耦合（Holstein 极化子）**：晶体中电子与晶格振动（声子，第 15 篇）耦合，用 Feynman 路径积分对声子自由度做"累赘平均"（Feynman 1955），可求得极化子有效质量与能谱——这是第 43 篇《过渡金属离子致色的量子机制》中"晶格弛豫导致 Stokes 位移"的微观基础。
- **晶体场（第 42 篇）作为路径积分中的有效势**：d 电子在配位场中的运动，其势 $V(\mathbf r)$ 即晶体场势；路径积分给出的跃迁振幅与选择定则，可从"路径对称性"而非"群表示"的角度重新导出，二者等价。
- **双折射与两路径求和**：第 47 篇讨论的"线性双折射能否产生纠缠"，在路径积分语言下即"o 偏振路径与 e 偏振路径的求和"——它们是同一光子态的两条路径（相干叠加），而非两个不可分粒子，故不自动产生纠缠（细节见第 29、47 篇）。

## 七、历史脉络与学术争议

1. **概念源头（Dirac 1933）**：狄拉克在 1933 年论文《The Lagrangian in Quantum Mechanics》[24cq] 中已指出，经典作用量对应量子变换函数的相位 $\exp(2\pi i S/h)$——这是"作用量进入量子振幅"的最早陈述。费曼在 1948 年论文中明确说其思想"受 Dirac 关于作用量与量子力学关系的remarks 启发"[24cr]。

2. **费曼 1948 的成体系表述与发表波折**：费曼 1947 年经友人敦促动笔，初稿投 *Physical Review* 被拒；在贝特（Hans Bethe）帮助下改写为"哪些是新、哪些是旧"的回顾式结构，转投 *Reviews of Modern Physics*，1948 年 4 月以 *Space-Time Approach to Non-Relativistic Quantum Mechanics* 发表（Rev. Mod. Phys. 20, 367–387）[24cr]。该文与 1965 年诺贝尔物理学奖（与朝永振一郎、施温格共享 QED 工作）同属费曼对量子理论的革命性贡献。

3. **数学严格性的长期争议（核心争议）**：路径积分在 (6) 的形式下**不是**通常的勒贝格积分——被积函数 $|e^{iS/\hbar}|=1$ 对振荡，泛函测度 $\mathcal D x$ 无法定义为通常测度。这一"测度缺失"使路径积分长期被视为物理学家的形式工具。严格化路线有两条：(a) 经 Wick 转动到虚时间 (21)，此时核为正、对应维纳测度，Feynman–Kac 公式给出严格定义；(b) 白噪声/广义函数空间上的形式测度（Albeverio–Høegh-Krohn 等）。**本笔记立场**：路径积分的物理预言与算符表述完全等价（§2.4 已证），其"不严格"仅在数学定义层面；在可解模型与数值（§6）中所有预言均可独立由薛定谔方程验证，故不影响结论可靠性。这与本套笔记"诠释问题保持中立、计算方法以可验证性为准"的总体原则一致。

4. **路径积分 vs 算符表述的实用性分工**：路径积分在含矢量势（AB 效应）、拓扑约束、半经典近似、量子场论与统计力学中更自然；算符/狄拉克符号（第 11、12 篇）在束缚态能级、角动量（第 16 篇）、微扰展开（第 19 篇）中更直接。二者是同一理论的不同坐标，选择取决于问题结构。

function protectMath(src){

  });
  return { src: src, blocks: blocks };
}
