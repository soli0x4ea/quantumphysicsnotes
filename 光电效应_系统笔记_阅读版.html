# 光电效应

> **分类归属：第一部分 量子行为与基础概念 · 数学程度：L1（概念层）· 前置依赖：第 1 篇《量子行为》、第 3 篇《黑体辐射与能量量子化》**
> **验证依据**：Hertz (1887)、Lenard (1902)、Einstein (1905)、Millikan (1916)、CODATA (2022)

# 第 4 篇 · 光电效应与光子

## 一、概念与定位

**光电效应**：光照金属表面时，若光频率高于某阈值，会打出电子（光电子）；低于阈值则不打出，无论光强多大。这是继黑体辐射之后，第二个用「光的粒子性（光子）」才能解释清楚的现象——也是爱因斯坦 1905 提出**光量子假说**的直接动机。

本篇定位：第 3 篇证明了「电磁能量以 $h\nu$ 为单元被振子吸收/发射」，本篇证明「光在传播与碰撞中也以能量为 $h\nu$ 的粒子（光子）形式存在」。二者合起来钉死了 $h\nu$ 不仅是统计平均，而是单次相互作用的不可分割单元。光子概念的彻底确立要等到第 5 篇（康普顿散射证实光子携带动量 $h/\lambda$）。

## 二、数学结构

### 2.1 爱因斯坦光电方程

爱因斯坦 1905 假定：一束频率为 $\nu$ 的光由能量为

$$ E_\gamma = h\nu \tag{1} $$

的粒子（光子）组成。每个光子被一个电子整体吸收，能量分配为

$$ h\nu = W + K_{\max} \tag{2} $$

其中 $W$ 是金属的**逸出功**（电子脱离表面所需最小能量），$K_{\max}$ 是光电子最大动能。

### 2.2 截止频率、截止电压与波长阈值

光电子最大动能可用反向**截止电压** $V_0$ 阻断：$K_{\max}=eV_0$。于是

$$ eV_0 = h\nu - W \quad\Longrightarrow\quad V_0 = \frac{h}{e}\,\nu - \frac{W}{e} \tag{3} $$

这是 $V_0$ 对 $\nu$ 的**直线关系**，斜率 $h/e$ 是普适常数，截距 $-W/e$ 由材料决定。

- **截止频率** $\nu_0 = W/h$：低于它 $K_{\max}<0$，无光电子。
- **截止波长** $\lambda_0 = c/\nu_0 = hc/W$：对应阈值的波长，红端极限。

用电子伏特记号更直观：$h\nu\ [\text{eV}] = \frac{1240\ \text{eV·nm}}{\lambda\ [\text{nm}]}$，故

$$ \lambda_0 = \frac{1240\ \text{eV·nm}}{W\ [\text{eV}]} \tag{4} $$

## 三、物理量与特征尺度

| 量 | 符号 | 量级（CODATA / 标准值） | 意义 |
|----|------|------------------------|------|
| 普朗克常数/元电荷 | $h/e$ | $4.135\,667\times10^{-15}\ \text{V·s}$ | (3) 直线斜率 |
| 光子能量（可见光 500 nm） | $h\nu$ | $\approx 2.48\ \text{eV}$ | 单光子能量量级 |
| 金属逸出功 | $W$ | $2\sim5\ \text{eV}$（典型） | Na 2.28、K 2.30、Cs 2.10、W 4.50 eV |
| 钠截止波长 | $\lambda_0$ | $\approx 544\ \text{nm}$（绿） | 绿光以上（蓝紫）可打出 |
| 钨截止波长 | $\lambda_0$ | $\approx 276\ \text{nm}$（紫外） | 仅紫外可打出 |

**尺度判据**：能否打出光电子由**频率/波长**决定，不由光强决定——这是与经典波动图像（能量连续沉积、应随光强积累）的根本冲突。光强只决定打出电子的**数目**（光子数密度），不改变单个电子的最大动能。

## 四、实验基础与观测证据

1. **Hertz 1887（前奏）**：发现紫外光照下电火花更容易跳过间隙，但未理解机制。
2. **Lenard 1902（定量事实）**：系统测阴极射线（光电子），确立两条反直觉事实——(a) 光电子最大动能**与光强无关**；(b) 动能随光频率增大而增大，随光强不变。这直接否定经典波动说。
3. **Einstein 1905**：提出 (2)，预言 $V_0$–$\nu$ 直线。
4. **Millikan 1916（精密验证）**：用极高纯度金属表面测 $V_0(\nu)$，在多种金属上确认斜率为普适 $h/e$，并由截距得 $W$；他给出的 $h=6.57\times10^{-27}\ \text{erg·s}$（现代值 $6.626\times10^{-27}$）与普朗克黑体拟合一致，**独立交叉验证了普朗克常数**。Millikan 起初反对光量子说，但其数据反而成为它最干净的证实——这是物理学史上「实验家证伪自己理论预设」的范例。
5. **瞬时性**：现代测量表明，光电子发射延迟 $<10^{-9}\ \text{s}$（受电子学限制），与经典「能量需时间积累」的预期不符。

## 五、分类体系与物理机制

| 现象 | 经典波动说预言 | 实验事实 | 光子说 (2) |
|------|----------------|----------|------------|
| 阈值频率 | 无（只要光强够大终会打出） | 有，低于 $\nu_0$ 无论多强都不打出 | 单光子 $h\nu<W$ 不足以逸出 |
| $K_{\max}$ vs 光强 | 随光强增大 | 与光强无关 | 由 $h\nu-W$ 决定 |
| $K_{\max}$ vs 频率 | 无关 | 线性随 $\nu$ 增大 | (3) 直线 |
| 发射延迟 | 强光快、弱光慢 | 瞬时（< ns） | 单光子一次性吸收 |

**机制**：光子是能量 $h\nu$ 的离散包，一次只能被一个电子吸收（受不确定性限制，吸收时间尺度 $\sim10^{-18}\ \text{s}$ 量级的「虚过程」）。光强提高 = 单位时间到达的光子数增多 = 打出更多电子，但不改变每个光子的能量 $h\nu$。

## 六、典型系统与可解模型

**(a) 光电管 / 光电倍增管**：利用 (3) 把光强转成电流，是弱光探测与单光子计数的基础（第 35 篇量子光学亦用）。
**(b) 光伏效应**：半导体中光子激发电子-空穴对，$h\nu$ 大于带隙 $E_g$ 才产生光电流，是太阳能电池原理（带隙即半导体「逸出功」的对应物）。
**(c) 截止电压线性关系**：配套脚本按 (3) 对 Na/K/Cs 三种标准逸出功绘制 $V_0(\nu)$ 直线，并计算各自的截止波长 $\lambda_0=hc/W$；数据为**理论关系**（基于标准逸出函数值），非原始测量点，避免编造实验数据。

## 七、历史脉络与学术争议

- **Hertz (1887) → Lenard (1902)**：实验发现反直觉现象，经典理论无法解释。
- **Einstein (1905)**：在「光量子」论文中同时给出光电方程、固体比热量子论，光量子说在当年极具争议（无动量证据，第 5 篇补）。
- **Millikan (1916)**：本为反驳光量子说而做精密实验，结果以 $10^{-3}$ 精度确认 $h/e$ 普适，反而坐实。Einstein 1921 诺奖表彰光电效应解释；Millikan 1923 诺奖表彰基本电荷与油滴实验（他始终对光量子持保留）。
- **当代定论**：光电效应是「光子真实存在」的首个决定性证据链（频率阈值 + 动能线性 + 瞬时性），与第 3 篇黑体辐射、第 5 篇康普顿散射构成早期量子论三支柱。

## 八、参考文献

- Hertz, H. (1887). *Sitzungsberichte Preuss. Akad. Wiss. Berlin*, 583–590 [24cz，已核实；紫外致电火花].
- Lenard, P. (1902). *Annalen der Physik*, 8, 149–198 [24da，已核实；阴极射线定量].
- Einstein, A. (1905). *Annalen der Physik*, 17, 132–148 [主序列 #4，已核实；光量子与光电方程].
- Millikan, R.A. (1916). *Physical Review*, 7, 355–388 [24cy，已核实；精密验证 h/e].
- CODATA (2022). *Fundamental Physical Constants* [主序列复用；e, h, c 精确定义值].

<script>
// 在 markdown 解析前抽出公式，用占位符保护，避免被 marked 当成强调语法破坏
function protectMath(src){
  var blocks = [];
  // 先抽块级 $$...$$（可跨行）
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, function(m){
    blocks.push(m);
    return '%%MATH' + (blocks.length - 1) + '%%';
  });
  // 再抽行内 $...$（不含换行、内部不含 $）
  src = src.replace(/\$([^\$\n]+?)\$/g, function(m){
    blocks.push(m);
    return '%%MATH' + (blocks.length - 1) + '%%';
  });
  return { src: src, blocks: blocks };
}

function boot(){
  var raw = document.getElementById('src').textContent;
  // 记录标题锚点（在保护公式之前，避免影响）
  var md = raw.replace(/^(#{1,3})\s+(.+)$/gm, function(m, h, t){
    var id = 'h-' + t.replace(/[^\w一-龥]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
    return h + ' <span id="' + id + '"></span>' + t;
  });

  // 保护数学公式
  var prot = protectMath(md);
  md = prot.src;

  document.getElementById('content').innerHTML = marked.parse(md);

  // 还原数学公式占位符
  var content = document.getElementById('content');
  var html = content.innerHTML.replace(/%%MATH(\d+)%%/g, function(m, n){
    return prot.blocks[+n];
  });
  content.innerHTML = html;

  // 生成目录
  var hs = document.querySelectorAll('#content h2, #content h3');
  var toc = document.getElementById('toc'), tocHtml = '';
  hs.forEach(function(h){
    var sp = h.querySelector('span[id]');
    var id = sp ? sp.id : '';
    var cls = h.tagName === 'H3' ? 'sub' : '';
    tocHtml += '<a class="' + cls + '" href="#' + id + '">' + h.textContent.trim() + '</a>';
  });
  toc.innerHTML = tocHtml;

  // 图片路径：正文里写 figures/xxx.svg
  document.querySelectorAll('#content img').forEach(function(im){
    if(/^figures\//.test(im.getAttribute('src')||'')) return;
  });

  if (window.renderMathInElement) {
    renderMathInElement(document.getElementById('content'), {
      delimiters:[
        {left:'$$', right:'$$', display:true},
        {left:'$',  right:'$',  display:false}
      ],
      ignoredTags:['script','noscript','style','textarea','pre','code'],
      throwOnError:false
    });
  }

  // 滚动高亮
  var links = [].slice.call(toc.querySelectorAll('a'));
  window.addEventListener('scroll', function(){
    var cur = null;
    hs.forEach(function(h){
      if (h.getBoundingClientRect().top < 120) cur = h;
    });
    links.forEach(function(a){ a.classList.remove('active'); });
    if (cur){
      var sp = cur.querySelector('span[id]');
      var act = toc.querySelector('a[href="#' + (sp?sp.id:'') + '"]');
      if (act) act.classList.add('active');
    }
  }, {passive:true});
}
if (window.marked) boot();
else window.addEventListener('load', boot);
</script>
