# 测量理论

> **分类归属：第一部分 量子行为与基础概念 · 数学程度：L3（推导层）· 前置依赖：第 9 篇《量子态与叠加原理》、第 11 篇《希尔伯特空间与狄拉克符号》、第 12 篇《算符、对易关系与表象》、第 18 篇《绘景变换与密度矩阵》**
> **验证依据**：Born (1926)、von Neumann (1932)、Lüders (1951)、Misra & Sudarshan (1977)、Itano et al. (1990)、Robertson (1929)、CODATA (2022)

# 第 10 篇 · 测量理论与波函数坍缩

## 一、概念与定位

测量是量子力学与经典世界之间的接口，也是「波函数坍缩」发生的环节。它要回答三个问题：**测得什么值**（概率）、**测后态是什么**（投影/坍缩）、**量子叠加如何变成经典可读指针**（纠缠放大 + 退相干，第 31 篇）。本篇把第 9 篇的叠加与第 11 篇的密度矩阵提升到「测量公理」，并给出 von Neumann 耦合模型与量子芝诺效应两个可解范例。

## 二、数学结构

### 2.1 投影测量（PVM）与 Born 规则

可观测量 $\hat A$（厄米）谱分解为

$$ \hat A = \sum_a a\,\hat P_a \tag{1} $$

其中 $\hat P_a$ 是投影到本征值 $a$ 子空间的投影算符（相容子集的并）。对归一化态 $|\psi\rangle$，测得 $a$ 的概率为

$$ \Pr(a) = \langle\psi|\hat P_a|\psi\rangle \tag{2} $$

测后（若结果 $a$）态为

$$ |\psi\rangle \xrightarrow{\text{测 }a} \frac{\hat P_a|\psi\rangle}{\sqrt{\Pr(a)}} \tag{3} $$

非简并时 $\hat P_a=|a\rangle\langle a|$，即坍缩到本征态 $|a\rangle$。(2) 即 Born 1926 概率规则（$|\psi|^2$ 为概率密度）。

### 2.2 Lüders 坍缩规则（简并情形）

当本征值 $a$ 简并时，von Neumann 1932 建议先「细化」可观测量再投影；Lüders 1951 给出更自然的规则：测后态直接投影到**整个简并子空间**

$$ \rho \xrightarrow{\text{测 }a} \frac{\hat P_a\,\rho\,\hat P_a}{\mathrm{Tr}(\hat P_a\rho)} \tag{4} $$

对纯态即 (3) 的子空间投影，避免在非简并子空间内随意挑选基（第 16 篇角动量简并即此类）。

### 2.3 von Neumann 测量模型（推导不跳步）

设系统 S 与指针（仪器）I 初始不纠缠 $|\psi\rangle_S\otimes|\phi_0\rangle_I$。取被测可观测量为 $\hat A_S$、指针坐标为 $\hat Q_I$，相互作用哈密顿量

$$ \hat H_{\text{int}} = g(t)\,\hat A_S\otimes\hat Q_I \tag{5} $$

在脉冲近似（作用时间极短，$I=\int g(t)dt=\lambda$）下，演化算符

$$ \hat U = \exp\!\left(-\frac{i}{\hbar}\,\lambda\,\hat A_S\otimes\hat Q_I\right) \tag{6} $$

因 $[\hat A_S,\hat Q_I]=0$（不同系统），且 $\hat A_S=\sum_a a\,\hat P_a$，有

$$ \hat U = \sum_a e^{-i\lambda a\hat Q_I/\hbar}\,\hat P_a \tag{7} $$

作用于初态 $\sum_a c_a|a\rangle_S|\phi_0\rangle_I$ 得

$$ |\Psi\rangle = \sum_a c_a\,|a\rangle_S\,\bigl(e^{-i\lambda a\hat Q_I/\hbar}|\phi_0\rangle_I\bigr)
= \sum_a c_a\,|a\rangle_S\,|\phi_a\rangle_I \tag{8} $$

其中指针态 $|\phi_a\rangle_I$ 是 $|\phi_0\rangle_I$ 在位置表象平移 $\lambda a$（指针读数集中在 $a$ 附近）。当 $\lambda$ 大于指针波包宽时，不同 $a$ 的指针态近似正交，系统–指针**纠缠**形成。对系统取偏迹得约化密度矩阵

$$ \rho_S = \sum_a |c_a|^2|a\rangle\langle a|
+ \sum_{a\neq b} c_a^*c_b\,\langle\phi_b|\phi_a\rangle\,|a\rangle\langle b| \tag{9} $$

非对角元含重叠积分 $\langle\phi_b|\phi_a\rangle$。对高斯指针 $\phi_0(x)\propto e^{-x^2/(2\sigma^2)}$，相邻本征值差 $\Delta a=1$ 时

$$ \langle\phi_b|\phi_a\rangle = \exp\!\left(-\frac{(\Delta a\,\lambda)^2}{\sigma^2}\right) \tag{10} $$

即 $\lambda\gg\sigma$ 时非对角元 $\to 0$，系统退相干为经典混合（第 31 篇）——这就是「测量完成」的数学判据，而非神秘坍缩。

### 2.4 POVM（广义测量）

更一般的测量由正算子值测度（POVM）描述：一组正算子 $\{\hat E_\mu\}$（满足 $\sum_\mu\hat E_\mu=\hat I$），测得结果 $\mu$ 的概率

$$ \Pr(\mu)=\langle\psi|\hat E_\mu|\psi\rangle \tag{11} $$

POVM **不指定**测后态（允许非破坏/联合测量，如信息补全）。由 Naimark 扩张定理，任何 POVM 都可在更大希尔伯特空间实现为某个 PVM（第 11 篇）。

### 2.5 量子芝诺效应（Misra–Sudarshan 1977）

对自由演化 $\hat U(t)=e^{-i\hat H t/\hbar}$，若在时长 $t$ 内每隔 $\tau=t/N$ 投影回初态 $|\psi_0\rangle$，则 $N$ 次后存活概率为

$$ P_N = \bigl|\langle\psi_0|\hat U(\tau)|\psi_0\rangle\bigr|^{2N} \tag{12} $$

对光滑演化，设能量展宽 $\Delta H=\sqrt{\langle\hat H^2\rangle-\langle\hat H\rangle^2}$，则

$$ \langle\psi_0|\hat U(\tau)|\psi_0\rangle = 1 - \frac{(\Delta H)^2\tau^2}{2\hbar^2} + \mathcal O(\tau^3) \tag{13} $$

代入 (12) 且 $N=t/\tau$：

$$ P_N = \left[1 - \frac{(\Delta H)^2\tau^2}{2\hbar^2}\right]^{2N}
\;\xrightarrow{N\to\infty}\; \exp\!\left(-\frac{(\Delta H)^2\,t\,\tau}{\hbar^2}\right) \to 1 \tag{14} $$

即测量越频繁，演化越被冻结（得名于 Zeno 悖论）。Itano 1990 用囚禁 $^9\text{Be}^+$ 离子观测到该效应。

## 三、物理量与特征尺度

| 量 | 含义 | 量级例 |
|----|------|--------|
| 指针位移 $\lambda$ | 可读分辨所需 | $\lambda\gg\sigma$（指针宽）才能分辨本征值 |
| 重叠 $\langle\phi_b|\phi_a\rangle$ | 退相干判据 | $\lambda=4\sigma$ 时 $\sim e^{-16}\approx 10^{-7}$（数值验证见 §6） |
| 芝诺时间 | 测量间隔阈值 | $\tau\ll \hbar/\Delta H$ 才显著冻结 |

**尺度判据**：测量是否「完成」由 (10) 给出——不是瞬时事件，而是随指针–系统纠缠放大、环境退相干（第 31 篇）逐渐实现的连续过程。

## 四、实验基础与观测证据

1. **Stern–Gerlach 实验**（第 16 篇）：自旋投影测量的标准实例，银原子束按 $S_z$ 本征值分裂。
2. **量子芝诺**：Itano 1990 囚禁离子在光学泵浦下频繁测量抑制跃迁，直接验证 (14)。
3. **弱测量**（Aharonov–Vaidman 1988 等）：绕过单步强扰动读取「弱值」，与 Ozawa 2003（第 8 篇）的误差–反作用分离一致。

## 五、分类体系与物理机制

| 类型 | 特征 | 坍缩后态 |
|------|------|----------|
| 投影测量 PVM | 正交投影、破坏叠加 | 纯态 $|a\rangle$ 或子空间投影（Lüders） |
| 广义测量 POVM | 正算子、可非破坏 | 不指定（Naimark 扩张为 PVM） |
| 强测量 / 弱测量 | 扰动大 / 小 | 坍缩 / 近似不坍缩 |

**机制**：(3) 的「坍缩」在 von Neumann 模型里被还原为 (9) 的非对角元消失——即纠缠 + 退相干，而非独立的基本过程（第 31 篇详述）。

## 六、典型系统与可解模型

**(a) von Neumann 指针耦合**（本篇脚本）：两能级系统 + 高斯指针，验证 (10)。数值结果：

| 位移 $\lambda/\sigma$ | 0 | 1 | 2 | 4 |
|------------------------|---|------|------|------|
| 重叠 $\langle\phi_b|\phi_a\rangle$ | 1.0000 | 0.3679 | 0.0183 | $\sim 0$ |

与解析 $e^{-\lambda^2/\sigma^2}$ 吻合至 $10^{-4}$；$\lambda=4\sigma$ 时非对角元 $\sim 10^{-7}$，系统实质退相干。

**(b) 量子芝诺**（本篇脚本）：两能级 Rabi 驱动，半周期 $t=\pi/\Omega$。$N=1$ 时存活概率 $P=0$（单步已翻转到 $|1\rangle$）；$N=512$ 时 $P=0.995\to 1$，验证 (14) 的冻结极限。

**(c) 两能级 Rabi 振荡**（第 18 篇）：测量可观测的动力学载体。

## 七、历史脉络与学术争议

- **Born 1926**（24dm）：在散射论文脚注提出 $|\psi|^2$ 为概率密度——概率诠释诞生。
- **von Neumann 1932**（主序列 #24be）：系统给出测量公理（投影 + (5)–(8) 的纠缠放大模型）。
- **Lüders 1951**（24dn）：修正简并情形坍缩规则为子空间投影 (4)。
- **Misra & Sudarshan 1977**（24df）：给出芝诺效应的严格量子表述 (12)–(14)。
- **Itano 1990**（24dg）：实验验证。
- **争议（测量问题）**：坍缩是基本公理（Copenhagen）、还是退相干 + 环境引发的表观现象（第 31 篇）、亦或多世界（Everett）下「所有分支都发生」？至今无公认解，是量子基础核心开放问题。

// 在 markdown 解析前抽出公式，用占位符保护，避免被 marked 当成强调语法破坏
function protectMath(src){
  var blocks = [];
  // 先抽块级 $$...$$（可跨行）
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, function(m){
    blocks.push(m);
    return '%%MATH' + (blocks.length - 1) + '%%';
  });
  // 再抽行内 $...$（不含换行、内部不含 $）
  src = src.replace(/\$([^\$\n]+?)\$/g, function(m){
    blocks.push(m);
    return '%%MATH' + (blocks.length - 1) + '%%';
  });
  return { src: src, blocks: blocks };
}

function boot(){
  var raw = document.getElementById('src').textContent;
  // 记录标题锚点（在保护公式之前，避免影响）
  var md = raw.replace(/^(#{1,3})\s+(.+)$/gm, function(m, h, t){
    var id = 'h-' + t.replace(/[^\w一-龥]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
    return h + ' <span id="' + id + '"></span>' + t;
  });

  // 保护数学公式
  var prot = protectMath(md);
  md = prot.src;

  document.getElementById('content').innerHTML = marked.parse(md);

  // 还原数学公式占位符
  var content = document.getElementById('content');
  var html = content.innerHTML.replace(/%%MATH(\d+)%%/g, function(m, n){
    return prot.blocks[+n];
  });
  content.innerHTML = html;

  // 生成目录
  var hs = document.querySelectorAll('#content h2, #content h3');
  var toc = document.getElementById('toc'), tocHtml = '';
  hs.forEach(function(h){
    var sp = h.querySelector('span[id]');
    var id = sp ? sp.id : '';
    var cls = h.tagName === 'H3' ? 'sub' : '';
    tocHtml += '<a class="' + cls + '" href="#' + id + '">' + h.textContent.trim() + '</a>';
  });
  toc.innerHTML = tocHtml;

  // 图片路径：正文里写 figures/xxx.svg
  document.querySelectorAll('#content img').forEach(function(im){
    if(/^figures\//.test(im.getAttribute('src')||'')) return;
  });

  if (window.renderMathInElement) {
    renderMathInElement(document.getElementById('content'), {
      delimiters:[
        {left:'$$', right:'$$', display:true},
        {left:'$',  right:'$',  display:false}
      ],
      ignoredTags:['script','noscript','style','textarea','pre','code'],
      throwOnError:false
    });
  }

  // 滚动高亮
  var links = [].slice.call(toc.querySelectorAll('a'));
  window.addEventListener('scroll', function(){
    var cur = null;
    hs.forEach(function(h){
      if (h.getBoundingClientRect().top < 120) cur = h;
    });
    links.forEach(function(a){ a.classList.remove('active'); });
    if (cur){
      var sp = cur.querySelector('span[id]');
      var act = toc.querySelector('a[href="#' + (sp?sp.id:'') + '"]');
      if (act) act.classList.add('active');
    }
  }, {passive:true});
}
if (window.marked) boot();
else window.addEventListener('load', boot);
</script>
