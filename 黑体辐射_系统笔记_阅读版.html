# 第 3 篇 · 黑体辐射与能量量子化

## 阅读指引（三层）

| 深度 | 阅读范围 | 你能带走什么 |
|------|---------|------------|
| 零门槛线 | §一 + §四 + §七 | 结论、实验数字、来龙去脉（不碰一个公式） |
| 进阶线 | 加 §三 + §五 | 量级感、物理机制 |
| 完整线 | 全部八节 | 完整推导与可解模型 |

## 一、概念与定位

> **一句话结论**：经典理论预言高频辐射能量发散（紫外灾难），普朗克以能量按 hν 整数倍交换化解，首次引入量子化。

**黑体**指对任何入射电磁波完全吸收、无反射的理想辐射体。处于热平衡时，黑体发出的辐射只取决于温度 $T$，与材料无关，称为**黑体辐射**或**空腔辐射**。它是人类第一次被迫引入「能量量子化」这一反直觉概念的物理学问题：经典统计物理在高频端的失败（**紫外灾难**），直接催生了量子论。

本篇的定位：黑体辐射是量子化的**历史入口**——它不依赖波函数或算符（那些要到第 9 篇之后才出现），但已经把最关键的常数 $h$（普朗克常数）钉进了物理。后续第 4 篇（光电效应）、第 5 篇（康普顿散射）从不同角度反复确认「电磁能量以 $h\nu$ 为单元交换」这一事实。

### 通俗说法辨析

| 通俗说法 | 严谨表述 | 误区根源 |
|---------|---------|---------|
| 普朗克一开始就提出了量子论 | 普朗克是被迫假设能量离散以拟合数据，本人长期试图回归连续，称是「绝望之举」 | 把「首次引入」误读为「主动设计」 |
| 量子化是空间或物质变成一颗颗 | 此处量子化的是谐振子**能量取值** ε_n=nhν，连续空间与连续物质都不变 | 把能量量子化泛化为一切离散 |
| 紫外灾难是太阳变紫 | 指经典瑞利–金斯公式在高频端谱密度 u→∞ 的数学发散，与太阳颜色无关 | 望文生义 |

## 二、数学结构

### 2.1 谱能量密度与模密度

单位体积、频率 $[\nu,\nu+d\nu]$ 内的辐射能（**谱能量密度**）由两部分相乘：

$$ u(\nu,T)\,d\nu = g(\nu)\,\bar\varepsilon(\nu,T)\,d\nu \tag{1} $$

其中 $g(\nu)$ 是单位体积、单位频率间隔内的电磁**模密度**，$\bar\varepsilon$ 是每个模的平均能量。

模密度（在体积 $V$ 内对两个偏振求和）的标准结果为

$$ g(\nu)\,d\nu = \frac{8\pi\nu^2}{c^3}\,d\nu \tag{2} $$

其推导属经典电动力学：波矢空间中半径为 $\nu/c$ 的球壳体积 $4\pi(\nu/c)^2 d(\nu/c)$，乘 $V/(2\pi)^3$ 的态密度、再乘 2（两个横偏振），除体积 $V$ 得单位体积数。

### 2.2 普朗克的平均能量（推导不跳步）

普朗克的突破在于假设频率为 $\nu$ 的谐振子**能量只能取离散值**

$$ \varepsilon_n = n h\nu,\qquad n=0,1,2,\dots \tag{3} $$

在温度 $T$ 下按玻尔兹曼权重 $e^{-\varepsilon_n/k_BT}$ 取平均：

$$ \bar\varepsilon = \frac{\sum_{n=0}^{\infty}\varepsilon_n e^{-\varepsilon_n/k_BT}}{\sum_{n=0}^{\infty}e^{-\varepsilon_n/k_BT}}
= \frac{\sum_{n=0}^{\infty} n h\nu\, e^{-n h\nu/k_BT}}{\sum_{n=0}^{\infty}e^{-n h\nu/k_BT}} \tag{4} $$

令 $q\equiv e^{-h\nu/k_BT}$（$0<q<1$），则分母为等比级数 $\sum_{n=0}^\infty q^n = \frac{1}{1-q}$；分子利用 $\sum_{n=0}^\infty n q^n = q\frac{d}{dq}\sum_{n=0}^\infty q^n = q\frac{d}{dq}\frac{1}{1-q} = \frac{q}{(1-q)^2}$。代入得

$$ \bar\varepsilon = h\nu\,\frac{q/(1-q)^2}{1/(1-q)} = h\nu\,\frac{q}{1-q}
= \frac{h\nu}{e^{h\nu/k_BT}-1} \tag{5} $$

这正是普朗克平均能量。当 $k_BT\gg h\nu$（低频、高温）时 $e^{h\nu/k_BT}-1\approx h\nu/k_BT$，退回经典均分 $\bar\varepsilon\approx k_BT$。

### 2.3 普朗克定律

把 (2)(5) 代入 (1)：

$$ u(\nu,T) = \frac{8\pi h\nu^3}{c^3}\,\frac{1}{e^{h\nu/k_BT}-1} \tag{6} $$

用波长表示（$u_\lambda\,d\lambda = u_\nu\,d\nu$，$|\partial\nu/\partial\lambda|=\nu/\lambda=c/\lambda^2$）：

$$ u(\lambda,T) = \frac{8\pi h c}{\lambda^5}\,\frac{1}{e^{hc/(\lambda k_BT)}-1} \tag{7} $$

### 2.4 两个积分推论

**(a) 斯特藩–玻尔兹曼定律**。对全频率积分 $U(T)=\int_0^\infty u(\nu,T)\,d\nu$。令 $y=h\nu/k_BT$：

$$ U(T) = \frac{8\pi(k_BT)^4}{h^3c^3}\int_0^\infty \frac{y^3}{e^y-1}\,dy \tag{8} $$

积分 $\int_0^\infty \frac{y^3}{e^y-1}dy = \frac{\pi^4}{15}$（用 $\frac{1}{e^y-1}=\sum_{m=1}^\infty e^{-my}$ 后逐项积分得 $\Gamma(4)\zeta(4)=6\cdot\pi^4/90$）。于是

$$ U(T) = a\,T^4,\qquad a=\frac{8\pi^5k_B^4}{15h^3c^3} \tag{9} $$

辐射出射度（单位面积功率）$j^\ast=\frac{c}{4}U$（各向同性辐射的球面积分），故

$$ j^\ast = \sigma T^4,\qquad \sigma=\frac{2\pi^5k_B^4}{15h^3c^2} \tag{10} $$

CODATA 值 $\sigma=5.670\,374\,419(13)\times10^{-8}\ \text{W·m}^{-2}\text{·K}^{-4}$（相对不确定度 $1.9\times10^{-6}$）。

**(b) 维恩位移定律**。对 (7) 求 $\partial u_\lambda/\partial\lambda=0$，令 $x\equiv hc/(\lambda k_BT)$ 得极值方程

$$ 5(1-e^{-x}) = x \quad\Longrightarrow\quad e^{-x} = 1-\frac{x}{5} \tag{11} $$

数值解 $x\approx 4.965\,114$，故

$$ \lambda_{\max}T = \frac{hc}{4.965\,114\,k_B} \equiv b \tag{12} $$

CODATA 值 $b=2.897\,771\,955(11)\times10^{-3}\ \text{m·K}$（相对不确定度 $1.9\times10^{-6}$）。注意这是**波长谱** $u_\lambda$ 的峰值；若用频率谱 $u_\nu$ 求 $\nu_{\max}$，极值条件为 $3(1-e^{-y})=y$（$y=h\nu/k_BT$），得 $y\approx2.821\,439$，对应 $\lambda_{\max}^{(\nu\text{-峰值})}=hc/(2.821\,439\,k_BT)\approx1.76\,b$——两种峰值位置不同，是谱变量非线性变换的固有结果，非矛盾。

### 2.5 经典近似与紫外灾难

低频（或高温）$h\nu\ll k_BT$ 时 (6) 展开 $e^{h\nu/k_BT}-1\approx h\nu/k_BT$：

$$ u_{\text{RJ}}(\nu,T) = \frac{8\pi\nu^2}{c^3}\,k_BT \tag{13} $$

即**瑞利–金斯定律**。它在低频与实验吻合，但在高频 $\nu\to\infty$ 时 $u\sim\nu^2$ 发散，$\int_0^\infty u_{\text{RJ}}\,d\nu\to\infty$——这就是**紫外灾难**：经典物理预言黑体在紫外有无穷大辐射能量，与事实（且与实际灯具不自燃）相悖。瑞利 1900 给出两页短文初形，正确系数由 Jeans 1905 补齐；它的失败正是普朗克量子化的动机。

高频（$h\nu\gg k_BT$）时 (6) 中 $e^{h\nu/k_BT}\gg1$，得**维恩近似** $u\approx\frac{8\pi h\nu^3}{c^3}e^{-h\nu/k_BT}$，在全频段被普朗克定律统一。

## 三、物理量与特征尺度

| 量 | 符号 | 数值（CODATA 2022 精确定义/测量） | 意义 |
|----|------|----------------------------------|------|
| 普朗克常数 | $h$ | $6.626\,070\,15\times10^{-34}\ \text{J·s}$ | 量子化标尺（精确定义值） |
| 约化普朗克常数 | $\hbar$ | $1.054\,571\,817\times10^{-34}\ \text{J·s}$ | $h/2\pi$ |
| 玻尔兹曼常数 | $k_B$ | $1.380\,649\times10^{-23}\ \text{J/K}$ | 温度↔能量（精确定义值） |
| 光速 | $c$ | $299\,792\,458\ \text{m/s}$ | 精确定义值 |
| 斯特藩–玻尔兹曼常数 | $\sigma$ | $5.670\,374\,419(13)\times10^{-8}\ \text{W·m}^{-2}\text{K}^{-4}$ | 总辐射功率 |
| 维恩位移常数 | $b$ | $2.897\,771\,955(11)\times10^{-3}\ \text{m·K}$ | 峰值波长标尺 |

**特征光子能量**：可见光中心 $\nu\approx 5\times10^{14}\ \text{Hz}$，$h\nu\approx 3.3\times10^{-19}\ \text{J}\approx 2.1\ \text{eV}$。这意味着「能量量子化是否可观测」的判据是一个无量纲数 $\Theta\equiv h\nu/k_BT$：当 $\Theta\ll1$ 时量子效应被热涨落掩盖（经典连续近似可用），当 $\Theta\sim1$ 时量子化显著。室温 $T=300\ \text{K}$ 对应 $k_BT\approx 0.026\ \text{eV}$，故可见光（$\sim$ eV）在室温下 $\Theta\gg1$，量子化显著；而微波（$h\nu\sim10^{-5}\ \text{eV}$）在室温下 $\Theta\ll1$，可经典处理——这与日常经验一致。

## 四、实验基础与观测证据

1. **空腔辐射谱**：在控温空腔上开小孔实测 $u(\lambda,T)$，全频段与 (6)(7) 吻合至测量精度（相对误差 $\sim10^{-3}$ 量级）。这是 $h$ 最干净的测定途径之一。
2. **宇宙微波背景（CMB）**：宇宙学标准模型预言的残余黑体辐射，COBE/FIRAS 测得 $T=2.725\,48(57)\ \text{K}$，其能谱与普朗克定律偏离小于 $5\times10^{-5}$（这是天文观测中精度最高的黑体拟合），峰值波长 $\lambda_{\max}\approx1.063\ \text{mm}$（毫米波）。
3. **太阳与恒星有效温度**：太阳表面有效温度 $T_\odot\approx5772\ \text{K}$，维恩位移给出峰值 $\lambda_{\max}\approx502\ \text{nm}$（可见光绿区），与太阳光谱实测一致；恒星颜色直接对应其有效温度的维恩位移（蓝星热、红星冷）。
4. **人体热辐射**：体温 $T\approx310\ \text{K}$，$\lambda_{\max}\approx9.35\ \mu\text{m}$（远红外），这正是夜视仪与热成像的工作波段。

## 五、分类体系与物理机制

| 定律 | 适用频段 | 形式 | 地位 |
|------|----------|------|------|
| 瑞利–金斯 (1900) | 低频 $h\nu\ll k_BT$ | $u=\frac{8\pi\nu^2}{c^3}k_BT$ | 经典极限，高频发散（紫外灾难） |
| 维恩近似 (1896) | 高频 $h\nu\gg k_BT$ | $u\propto\nu^3e^{-h\nu/k_BT}$ | 经验插值，后被普朗克统一 |
| 普朗克 (1901) | 全频段 | (6)(7) | 严格正确，含量子化假设 |

**机制分野**：经典理论赋予每个模平均能量 $k_BT$（均分定理），与模数 $\nu^2$ 相乘即得紫外发散。普朗克用**离散能级 $nh\nu$** 压制高频模的激发——高频模「充不起一个 $h\nu$ 的量子」，平均能量被指数压低，从而治愈发散。这是「离散化」对「连续谱发散」的第一次胜利，机制与第 5 篇康普顿散射（光子动量）、第 15 篇谐振子零点能（$h\nu/2$ 的量子修正）同源。

## 六、典型系统与可解模型

**(a) 光子气体（空腔）**。黑体腔内的平衡辐射等价于一化学势为零的光子理想气体，态密度 (2) 即光子态密度（自旋 1、两横偏振）。压强 $P=\frac13U$，绝热指数 $\gamma=4/3$（由光子无静质量决定），与第 14/15 篇的声子/谐波链对应。

**(b) 灰体与发射率**。真实表面辐射 $j=\varepsilon\sigma T^4$，$\varepsilon\in(0,1)$ 为发射率；黑体对应 $\varepsilon=1$。这把普朗克定律从理想体推广到工程热辐射。

**(c) 数值验证模型**。配套脚本对 (6) 在全频段数值积分得 $aT^4$，与解析 (9) 比对（相对误差 $\sim10^{-4}$ 量级，受网格截断限制）；对 (7) 数值找峰得 $\lambda_{\max}=b/T$（相对误差 $\sim10^{-3}$）；并叠加瑞利–金斯曲线展示紫外端发散。

## 七、历史脉络与学术争议

- **经典绝境（1890s–1900）**：维恩（1896）给出高频经验位移律，瑞利–金斯（1900/1905）给出低频律，二者中间地带长期无统一理论，且 RJ 高频发散。
- **普朗克 1901**：为拟合实验曲线，普朗克假设谐振子能量 $E=nh\nu$，于 1900 年 12 月 14 日（常被称作「量子论诞生日」）在德意志物理学会报告，1901 年正式发表 (3)。他最初视 $h\nu$ 为「数学技巧」，而非自然界真实离散性；真正承认其物理实在性的是爱因斯坦 1905（光量子）。
- **爱因斯坦 1905**：把量子化从「振子能量」推进到「辐射本身由能量为 $h\nu$ 的光子组成」，并用它解释光电效应（第 4 篇）。
- **争议与接受**：普朗克本人长期试图回归连续理论；玻尔 1913 旧量子论、玻色–爱因斯坦 1924 光子统计、泡利等逐步确立量子化的根本地位。回望看，黑体辐射是「自然界在微观尺度非连续」的第一个不可逆证据。
- **当代意义**：普朗克常数 $h$ 现为国际单位制基本常数的定义锚点之一（与 $c$、$k_B$、$e$ 共同精确定义千克、开尔文、安培），其「精确值」本身即宣告量子效应是计量学的底层结构。

<script>
// 在 markdown 解析前抽出公式，用占位符保护，避免被 marked 当成强调语法破坏
function protectMath(src){
  var blocks = [];
  // 先抽块级 $$...$$（可跨行）
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, function(m){
    blocks.push(m);
    return '%%MATH' + (blocks.length - 1) + '%%';
  });
  // 再抽行内 $...$（不含换行、内部不含 $）
  src = src.replace(/\$([^\$\n]+?)\$/g, function(m){
    blocks.push(m);
    return '%%MATH' + (blocks.length - 1) + '%%';
  });
  return { src: src, blocks: blocks };
}

function boot(){
  var raw = document.getElementById('src').textContent;
  // 记录标题锚点（在保护公式之前，避免影响）
  var md = raw.replace(/^(#{1,3})\s+(.+)$/gm, function(m, h, t){
    var id = 'h-' + t.replace(/[^\w一-龥]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
    return h + ' <span id="' + id + '"></span>' + t;
  });

  // 保护数学公式
  var prot = protectMath(md);
  md = prot.src;

  document.getElementById('content').innerHTML = marked.parse(md);

  // 还原数学公式占位符
  var content = document.getElementById('content');
  var html = content.innerHTML.replace(/%%MATH(\d+)%%/g, function(m, n){
    return prot.blocks[+n];
  });
  content.innerHTML = html;

  // 生成目录
  var hs = document.querySelectorAll('#content h2, #content h3');
  var toc = document.getElementById('toc'), tocHtml = '';
  hs.forEach(function(h){
    var sp = h.querySelector('span[id]');
    var id = sp ? sp.id : '';
    var cls = h.tagName === 'H3' ? 'sub' : '';
    tocHtml += '<a class="' + cls + '" href="#' + id + '">' + h.textContent.trim() + '</a>';
  });
  toc.innerHTML = tocHtml;

  // 图片路径：正文里写 figures/xxx.svg
  document.querySelectorAll('#content img').forEach(function(im){
    if(/^figures\//.test(im.getAttribute('src')||'')) return;
  });

  if (window.renderMathInElement) {
    renderMathInElement(document.getElementById('content'), {
      delimiters:[
        {left:'$$', right:'$$', display:true},
        {left:'$',  right:'$',  display:false}
      ],
      ignoredTags:['script','noscript','style','textarea','pre','code'],
      throwOnError:false
    });
  }

  // 滚动高亮
  var links = [].slice.call(toc.querySelectorAll('a'));
  window.addEventListener('scroll', function(){
    var cur = null;
    hs.forEach(function(h){
      if (h.getBoundingClientRect().top < 120) cur = h;
    });
    links.forEach(function(a){ a.classList.remove('active'); });
    if (cur){
      var sp = cur.querySelector('span[id]');
      var act = toc.querySelector('a[href="#' + (sp?sp.id:'') + '"]');
      if (act) act.classList.add('active');
    }
  }, {passive:true});
}
if (window.marked) boot();
else window.addEventListener('load', boot);
</script>
